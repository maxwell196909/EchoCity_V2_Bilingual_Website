<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2747">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./images/echocity-app-icon-192.png">
  <title>EchoCity｜智能服务入口</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#f6bd60;--cyan:#67e8d0;--white:#fff;--soft:rgba(255,255,255,.82);--glass:rgba(5,15,35,.62);--line:rgba(255,255,255,.22)}
    body{min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--white);background:radial-gradient(circle at 72% 18%,rgba(43,209,180,.20),transparent 32%),radial-gradient(circle at 18% 76%,rgba(246,189,96,.17),transparent 31%),linear-gradient(180deg,rgba(2,10,28,.30),rgba(2,10,28,.86)),url("images/echocity-home-bg.png") center/cover fixed no-repeat;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(103,232,208,.08) 48%,transparent 72%);animation:scan 9s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
    button,input{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 28px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:25px;font-weight:900}
    .mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#16845b,#0a5a91);border:1px solid rgba(255,255,255,.42);box-shadow:0 0 28px rgba(103,232,208,.28)}
    .lang{min-height:42px;padding:0 17px;border:1px solid var(--line);border-radius:999px;background:rgba(5,20,43,.52);color:#fff;font-weight:800}
    .main{flex:1;display:grid;place-items:center;padding:42px 0 20px}
    .assistant{width:min(900px,100%);text-align:center}
    h1{font-size:clamp(46px,10vw,104px);line-height:1;letter-spacing:-4px;background:linear-gradient(110deg,#fff 20%,#b9fff2 48%,#ffd990 78%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 40px rgba(0,0,0,.22)}
    .lead{margin:22px auto 0;color:var(--soft);font-size:clamp(18px,3vw,25px)}
    .chat{position:relative;margin:34px auto 0;padding:14px;border:1px solid rgba(255,255,255,.48);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 22px 70px rgba(0,0,0,.38),0 0 42px rgba(103,232,208,.14);backdrop-filter:blur(24px)}
    .chat::before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:linear-gradient(90deg,var(--cyan),transparent 38%,var(--gold));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;pointer-events:none}
    .input-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px}
    .echo-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e9f5f1;color:#176b5b;font-size:22px}
    #question{width:100%;min-height:52px;border:0;outline:0;background:transparent;color:#172033;font-size:18px}
    .voice{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:#eaf5f2;color:#176b5b;font-size:21px;transition:.2s transform,.2s background,.2s color}
    .voice:hover{transform:scale(1.06)}
    .voice.listening{color:#fff;background:#e05454;animation:pulse 1.15s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,84,84,.36)}50%{box-shadow:0 0 0 12px rgba(224,84,84,0)}}
    .send{width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(145deg,#f7c66f,#d99b34);color:#fff;font-size:22px;font-weight:900;box-shadow:0 8px 22px rgba(217,155,52,.38);transition:.2s transform}
    .send:hover{transform:scale(1.06) rotate(-5deg)}
    .conversation{display:none;margin:18px auto 0;max-height:330px;overflow:auto;padding:5px;text-align:left}
    .conversation.show{display:block}
    .message{max-width:86%;margin:10px 0;padding:13px 16px;border-radius:18px;line-height:1.6;white-space:pre-wrap}
    .message.user{margin-left:auto;background:rgba(255,255,255,.94);color:#172033;border-bottom-right-radius:5px}
    .message.echo{background:rgba(8,43,56,.84);color:#fff;border:1px solid rgba(103,232,208,.35);border-bottom-left-radius:5px}
    .recommendation{margin:10px 0 4px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(16,87,82,.9),rgba(11,47,77,.9));border:1px solid rgba(246,189,96,.42);color:#fff}
    .recommendation strong{display:block;margin-bottom:5px;color:#ffd990}
    .recommendation button{margin-top:12px;padding:10px 15px;border:0;border-radius:999px;background:linear-gradient(145deg,#f7c66f,#d99b34);color:#fff;font-weight:800}
    .thinking{opacity:.76}
    .quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
    .quick button{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(135deg,rgba(6,24,48,.78),rgba(18,67,72,.56));color:#fff;font-weight:700;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.18);transition:.2s transform,.2s border-color,.2s background}
    .quick button:hover{transform:translateY(-3px);border-color:var(--cyan);background:rgba(16,87,82,.72)}
    .hint{margin-top:17px;color:rgba(255,255,255,.7);font-size:13px}
    .request-card{margin:16px 5px 4px;padding:16px;border-radius:20px;background:rgba(255,255,255,.97);color:#172033;border:1px solid rgba(103,232,208,.58);box-shadow:0 16px 38px rgba(0,0,0,.22)}
    .request-card h3{margin-bottom:8px;color:#145f54}
    .request-card p{margin:6px 0;line-height:1.55}
    .request-card label{display:block;margin:12px 0 5px;font-weight:800}
    .request-card input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #bcc8d2;border-radius:12px;color:#172033;background:#fff}
    .request-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .request-actions button,.request-link{padding:11px 16px;border:0;border-radius:999px;font-weight:800;text-decoration:none}
    .request-confirm{background:#16845b;color:#fff}
    .request-cancel{background:#e8edf1;color:#263447}
    .request-status{margin-top:10px;color:#526071}
    .request-status.error{color:#b42318}
    @media(max-width:640px){.page{padding-left:14px;padding-right:14px}.main{align-items:end}.chat{border-radius:22px}.quick{justify-content:flex-start}.quick button{flex:1 1 46%}h1{font-size:54px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="mark">E</span><span>EchoCity</span></a>
      <button id="languageButton" class="lang" type="button">EN</button>
    </header>
    <section class="main">
      <div class="assistant">
        <h1>EchoCity</h1>
        <p id="lead" class="lead">您好，您需要什么服务？</p>
        <form id="echoForm" class="chat">
          <div class="input-row">
            <span class="echo-icon">💬</span>
            <input id="question" autocomplete="off" placeholder="请描述您的需求、任务或管理工作" aria-label="请输入问题">
            <button id="voiceButton" class="voice" type="button" aria-label="语音输入" title="语音输入">🎙</button>
            <button class="send" type="submit" aria-label="发送">➤</button>
          </div>
        </form>
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <div class="quick">
          <button type="button" data-route="customer">申请住宅专项维修资金</button>
          <button type="button" data-route="customer">查看全部专业服务</button>
          <button type="button" data-route="worker">查询我的工作任务</button>
          <button type="button" data-route="admin">平台审核、报价与派工</button>
        </div>
        <p id="hint" class="hint">您也可以直接输入问题，Echo 将自动识别并带您进入相应页面。</p>
      </div>
    </section>
  </main>
  <script>
    const AI_ENABLED=true;
    const AI_ENDPOINT="https://dpljvspwcfglxfesxdmf.supabase.co/functions/v1/echo-assistant";
    const SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbGp2c3B3Y2ZnbHhmZXN4ZG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjM0MDAsImV4cCI6MjEwMDUzOTQwMH0.Ps4PCsS3ALZhdWPTEgTumDYzLNNLrMWEcpirafmAY4E";
    const copy={zh:{lead:"您好，您需要什么服务？",placeholder:"请说出或写下您的问题和需求",hint:"Echo 会继续语音回答并推荐原有模块；需要服务时，可选择把对话整理成需求单。",listening:"正在聆听，请开始说话……",voiceError:"没有听清，请再点击麦克风重试。",voiceUnsupported:"当前浏览器不支持网页语音识别，请使用iPad键盘上的麦克风听写。",thinking:"Echo 正在理解您的问题……",enter:"进入推荐模块",create:"整理并提交需求",draftTitle:"需求确认",draftIntro:"Echo 根据本轮对话整理为",phone:"客户手机号",phonePlaceholder:"请输入接收和查询订单的手机号",confirm:"确认并提交需求",cancel:"继续对话",submitting:"正在提交……",success:"提交成功，平台已收到需求。订单号：",failure:"提交失败，请检查网络后重试。",myRequests:"查看我的需求",quick:["申请住宅专项维修资金","查看全部专业服务","查询我的工作任务","平台审核、报价与派工"]},en:{lead:"Hello, what service do you need?",placeholder:"Speak or type your question or service need",hint:"Echo keeps answering and recommending existing modules. When service is needed, you may turn the conversation into a request.",listening:"Listening… start speaking.",voiceError:"I could not hear that. Tap the microphone and try again.",voiceUnsupported:"Voice recognition is unavailable. Use your keyboard microphone for dictation.",thinking:"Echo is understanding your request…",enter:"Open recommended module",create:"Create service request",draftTitle:"Confirm request",draftIntro:"Echo summarized this conversation as",phone:"Customer phone",phonePlaceholder:"Phone used to receive and find this request",confirm:"Confirm and submit",cancel:"Keep talking",submitting:"Submitting…",success:"Submitted. The platform has received request: ",failure:"Submission failed. Check the connection and try again.",myRequests:"View my requests",quick:["Housing repair fund application","View professional services","Find my work tasks","Platform review, quote and dispatch"]}};
    let language=localStorage.getItem("echocity-language")||"zh",busy=false;
    const history=[];
    const destinations={customer:"assets/customer-service-catalog.html",worker:"assets/worker-dashboard.html",admin:"assets/admin-dashboard.html"};
    function applyLanguage(){document.documentElement.lang=language==="zh"?"zh-CN":"en";lead.textContent=copy[language].lead;question.placeholder=copy[language].placeholder;hint.textContent=copy[language].hint;languageButton.textContent=language==="zh"?"EN":"中文";document.querySelectorAll(".quick button").forEach((button,index)=>button.textContent=copy[language].quick[index]);}
    function addMessage(text,role,extra=""){conversation.classList.add("show");const item=document.createElement("div");item.className=`message ${role} ${extra}`;item.textContent=text;conversation.appendChild(item);conversation.scrollTop=conversation.scrollHeight;return item}
    function speak(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=language==="zh"?"zh-CN":"en-US";utterance.rate=.96;utterance.pitch=1;speechSynthesis.speak(utterance)}
    function conversationSummary(){return history.filter(item=>item.role==="user").slice(-8).map(item=>item.content).join("；")}
    function requestButton(){const button=document.createElement("button");button.type="button";button.textContent=copy[language].create;button.addEventListener("click",()=>showRequestDraft(conversationSummary()));return button}
    function recommend(result,original){if(!result.module||result.module==="none"||!destinations[result.module])return;const card=document.createElement("div");card.className="recommendation";const title=document.createElement("strong");title.textContent=result.moduleLabel||({customer:"客户服务",worker:"服务人员工作台",admin:"平台监管"})[result.module];const action=document.createElement("div");action.textContent=result.nextAction||"请进入模块继续办理。";const button=document.createElement("button");button.type="button";button.textContent=copy[language].enter;button.addEventListener("click",()=>{const url=new URL(destinations[result.module],window.location.href);url.searchParams.set("q",original);window.location.href=url.toString()});card.append(title,action,button);if(result.module==="customer")card.append(requestButton());conversation.appendChild(card);conversation.scrollTop=conversation.scrollHeight}
    const SUPABASE_REQUEST_RPC="https://dpljvspwcfglxfesxdmf.supabase.co/rest/v1/rpc/submit_customer_service_request";
    function inferServiceType(text){const value=text.toLowerCase();if(/维修基金|专项维修|住宅专项|房屋维修/.test(value))return"housing_repair_fund";if(/保洁|清洁|打扫|擦玻璃/.test(value))return"cleaning";if(/维修|修理|漏水|水管|电路|门窗|家电/.test(value))return"repair";if(/投标|标书|技术方案|咨询/.test(value))return"consulting";if(/搬家|搬运/.test(value))return"moving";return"general_service"}
    function serviceLabel(type){const labels={zh:{housing_repair_fund:"住宅专项维修资金服务",cleaning:"保洁清洁",repair:"维修服务",consulting:"工程咨询",moving:"搬运服务",general_service:"综合服务"},en:{housing_repair_fund:"Housing repair fund",cleaning:"Cleaning",repair:"Repair",consulting:"Consulting",moving:"Moving",general_service:"General service"}};return labels[language][type]||type}
    function shouldOfferRequest(text,result){return result.module==="none"&&/(我想|我要|需要|请帮|帮我|维修|清洁|保洁|漏水|坏了|咨询|申报|搬运|施工)/.test(text)&&!/(平台|管理|监管|审核|报价|派工|工人|师傅|服务人员|接单|工作任务|查订单|查询)/.test(text)}
    function offerRequestAction(){const card=document.createElement("div");card.className="recommendation";const title=document.createElement("strong");title.textContent=language==="zh"?"需要平台提供服务？":"Need platform service?";const action=document.createElement("div");action.textContent=language==="zh"?"您可以继续和 Echo 对话，也可以把目前内容整理成需求单。":"Keep talking with Echo, or turn the conversation into a service request.";card.append(title,action,requestButton());conversation.appendChild(card);conversation.scrollTop=conversation.scrollHeight}
    function showRequestDraft(text){document.querySelectorAll(".request-card").forEach(node=>node.remove());const type=inferServiceType(text);const card=document.createElement("section");card.className="request-card";const savedPhone=localStorage.getItem("echocity-customer-phone")||"";card.innerHTML=`<h3>${copy[language].draftTitle}</h3><p>${copy[language].draftIntro}：<strong>${serviceLabel(type)}</strong></p><p>${escapeHtml(text)}</p><label for="draftPhone">${copy[language].phone}</label><input id="draftPhone" inputmode="tel" autocomplete="tel" placeholder="${copy[language].phonePlaceholder}" value="${escapeHtml(savedPhone)}"><div class="request-actions"><button class="request-confirm" type="button">${copy[language].confirm}</button><button class="request-cancel" type="button">${copy[language].cancel}</button></div><p class="request-status" aria-live="polite"></p>`;conversation.appendChild(card);conversation.scrollTop=conversation.scrollHeight;card.querySelector(".request-cancel").onclick=()=>card.remove();card.querySelector(".request-confirm").onclick=()=>submitVoiceRequest(card,text,type)}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]))}
    async function submitVoiceRequest(card,description,serviceType){const phone=card.querySelector("#draftPhone").value.trim().replace(/\s+/g,"");const status=card.querySelector(".request-status");const button=card.querySelector(".request-confirm");if(!/^\+?[0-9-]{7,20}$/.test(phone)){status.textContent=language==="zh"?"请输入正确的手机号。":"Enter a valid phone number.";status.className="request-status error";return}button.disabled=true;status.textContent=copy[language].submitting;try{const response=await fetch(SUPABASE_REQUEST_RPC,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":`Bearer ${SUPABASE_PUBLISHABLE_KEY}`},body:JSON.stringify({p_service_type:serviceType,p_description:description,p_service_date:null,p_start_time:null,p_workers:1,p_duration:"",p_postal_code:"",p_address:"",p_customer_name:language==="zh"?"语音客户":"Voice customer",p_customer_phone:phone})});const result=await response.json().catch(()=>null);if(!response.ok||!result?.request_no)throw new Error(result?.message||`HTTP ${response.status}`);const requestNo=result.request_no;localStorage.setItem("echocity-customer-phone",phone);localStorage.setItem("echocity-customer-request-no",requestNo);status.className="request-status";status.textContent=copy[language].success+requestNo;card.querySelector(".request-actions").innerHTML=`<a class="request-link request-confirm" href="assets/customer-my-requests.html?request_no=${encodeURIComponent(requestNo)}">${copy[language].myRequests}</a>`;speak(copy[language].success+requestNo)}catch(error){console.error("EchoCity request submit failed:",error);button.disabled=false;status.className="request-status error";status.textContent=copy[language].failure}}
    function freeAnswer(text){const value=text.toLowerCase();if(/维修基金|专项维修|住宅专项|房屋维修/.test(value))return{answer:"住宅专项维修资金通常用于共用部位和共用设施设备保修期满后的维修、更新与改造。EchoCity 可以协助完成现场查勘、影像资料、业主表决、预算与方案编制、申报材料整理以及过程跟踪。您可以先告诉我所在城市、维修部位和目前是否已经过业主讨论，我再提示所需材料。",module:"customer",moduleLabel:"住宅专项维修资金申报",nextAction:"进入客户服务，选择维修基金专项方案并填写项目基本情况。"};if(/投标|标书|技术方案|答辩/.test(value))return{answer:"我们可以提供招标文件分析、技术标编制、实施方案、进度与资源计划、风险响应以及技术答辩模拟。建议先准备招标文件、评分办法、项目概况和提交截止时间。",module:"customer",moduleLabel:"投标与技术咨询服务",nextAction:"进入专业服务目录，选择标书制作或技术方案服务。"};if(/海外|境外|国际工程/.test(value))return{answer:"EchoCity 可匹配海外工程策划、项目管理、风险评估、进度成本控制和属地资源协调服务。请补充国家、项目类型、规模和目前阶段，我们可以进一步判断需要的专家与成果文件。",module:"customer",moduleLabel:"海外工程管理咨询",nextAction:"进入客户服务并提交项目国家、阶段和咨询目标。"};if(/工人|师傅|服务人员|接单|到达|开工|工作任务|照片|视频|里程碑|完工/.test(value))return{answer:"这属于服务人员任务流程。您可以查询平台派工，查看客户需求、服务地址、质量标准和完成时间；开工前还要核对客户批准、施工方案审批和现场条件，施工中上传照片或视频，完成后提交节点成果。",module:"worker",moduleLabel:"服务人员工作台",nextAction:"进入工作台，用派工手机号码查询任务并按状态逐步操作。"};if(/平台|管理|监管|审核|报价|派工|验收/.test(value))return{answer:"这属于平台管理流程。平台需要核验客户需求，形成标准和报价，审核施工方案，选择并派遣合适的服务人员，同时监督到达、开工、工作记录、节点成果和最终验收。",module:"admin",moduleLabel:"平台审核、报价与监管",nextAction:"进入平台管理页面，选择需求审核、报价或派工。"};if(/你好|您好|能做什么|哪些服务/.test(value))return{answer:"您好，我是 Echo。您可以告诉我需要解决的问题，例如住宅维修基金申报、工程咨询、投标技术方案、海外工程管理、查询工人任务，或者平台报价派工。我会先回答问题，再推荐合适的办理模块。",module:"none",moduleLabel:"",nextAction:""};return{answer:"我已经记录您的问题。为了给出更准确的办理建议，请再补充三项信息：您是需要服务的客户、提供服务的人员，还是平台管理人员；事情发生在哪里；希望什么时间完成。",module:"none",moduleLabel:"需要进一步确认",nextAction:"请继续补充信息。"}}
    async function aiAnswer(text){const response=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({message:text,language,history:history.slice(-8)})});if(!response.ok)throw new Error("AI unavailable");return response.json()}
    async function respond(text){if(busy||!text)return;busy=true;addMessage(text,"user");history.push({role:"user",content:text});question.value="";const thinking=addMessage(copy[language].thinking,"echo","thinking");try{let result;if(AI_ENABLED){try{result=await aiAnswer(text)}catch(error){result=freeAnswer(text)}}else result=freeAnswer(text);thinking.remove();addMessage(result.answer,"echo");history.push({role:"assistant",content:result.answer});recommend(result,text);if(shouldOfferRequest(text,result))offerRequestAction();speak(result.answer)}finally{busy=false;question.focus()}}
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    let recognition=null;
    if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{voiceButton.classList.add("listening");voiceButton.textContent="■";question.placeholder=copy[language].listening};recognition.onresult=event=>{let transcript="",isFinal=false;for(let i=event.resultIndex;i<event.results.length;i++){transcript+=event.results[i][0].transcript;if(event.results[i].isFinal)isFinal=true}question.value=transcript;if(isFinal&&transcript.trim())respond(transcript.trim())};recognition.onerror=()=>{addMessage(copy[language].voiceError,"echo")};recognition.onend=()=>{voiceButton.classList.remove("listening");voiceButton.textContent="🎙";question.placeholder=copy[language].placeholder}};
    voiceButton.addEventListener("click",()=>{if(!recognition){addMessage(copy[language].voiceUnsupported,"echo");return}recognition.lang=language==="zh"?"zh-CN":"en-US";if(voiceButton.classList.contains("listening"))recognition.stop();else recognition.start()});
    echoForm.addEventListener("submit",event=>{event.preventDefault();respond(question.value.trim())});
    document.querySelectorAll("[data-route]").forEach(button=>button.addEventListener("click",()=>respond(button.textContent.trim())));
    languageButton.addEventListener("click",()=>{language=language==="zh"?"en":"zh";localStorage.setItem("echocity-language",language);applyLanguage()});
    applyLanguage();
    if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
  </script>
</body>
</html>
