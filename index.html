<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2747">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./images/echocity-app-icon-192.png">
  <title>EchoCity｜智能服务入口</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#f6bd60;--cyan:#67e8d0;--white:#fff;--soft:rgba(255,255,255,.82);--glass:rgba(5,15,35,.62);--line:rgba(255,255,255,.22)}
    body{min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--white);background:radial-gradient(circle at 72% 18%,rgba(43,209,180,.20),transparent 32%),radial-gradient(circle at 18% 76%,rgba(246,189,96,.17),transparent 31%),linear-gradient(180deg,rgba(2,10,28,.30),rgba(2,10,28,.86)),url("images/echocity-home-bg.png") center/cover fixed no-repeat;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(103,232,208,.08) 48%,transparent 72%);animation:scan 9s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
    button,input{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 28px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:25px;font-weight:900}
    .mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#16845b,#0a5a91);border:1px solid rgba(255,255,255,.42);box-shadow:0 0 28px rgba(103,232,208,.28)}
    .lang{min-height:42px;padding:0 17px;border:1px solid var(--line);border-radius:999px;background:rgba(5,20,43,.52);color:#fff;font-weight:800}
    .main{flex:1;display:grid;place-items:center;padding:42px 0 20px}
    .assistant{width:min(900px,100%);text-align:center}
    h1{font-size:clamp(46px,10vw,104px);line-height:1;letter-spacing:-4px;background:linear-gradient(110deg,#fff 20%,#b9fff2 48%,#ffd990 78%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 40px rgba(0,0,0,.22)}
    .lead{margin:22px auto 0;color:var(--soft);font-size:clamp(18px,3vw,25px)}
    .chat{position:relative;margin:34px auto 0;padding:14px;border:1px solid rgba(255,255,255,.48);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 22px 70px rgba(0,0,0,.38),0 0 42px rgba(103,232,208,.14);backdrop-filter:blur(24px)}
    .chat::before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:linear-gradient(90deg,var(--cyan),transparent 38%,var(--gold));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;pointer-events:none}
    .input-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
    .echo-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e9f5f1;color:#176b5b;font-size:22px}
    #question{width:100%;min-height:52px;border:0;outline:0;background:transparent;color:#172033;font-size:18px}
    .send{width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(145deg,#f7c66f,#d99b34);color:#fff;font-size:22px;font-weight:900;box-shadow:0 8px 22px rgba(217,155,52,.38);transition:.2s transform}
    .send:hover{transform:scale(1.06) rotate(-5deg)}
    .answer{display:none;margin-top:12px;padding:14px 16px;border-radius:16px;background:#edf7f3;color:#155c47;text-align:left;line-height:1.65}
    .answer.show{display:block}
    .quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
    .quick button{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(135deg,rgba(6,24,48,.78),rgba(18,67,72,.56));color:#fff;font-weight:700;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.18);transition:.2s transform,.2s border-color,.2s background}
    .quick button:hover{transform:translateY(-3px);border-color:var(--cyan);background:rgba(16,87,82,.72)}
    .hint{margin-top:17px;color:rgba(255,255,255,.7);font-size:13px}
    @media(max-width:640px){.page{padding-left:14px;padding-right:14px}.main{align-items:end}.chat{border-radius:22px}.quick{justify-content:flex-start}.quick button{flex:1 1 46%}h1{font-size:54px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="mark">E</span><span>EchoCity</span></a>
      <button id="languageButton" class="lang" type="button">EN</button>
    </header>
    <section class="main">
      <div class="assistant">
        <h1>EchoCity</h1>
        <p id="lead" class="lead">您好，您需要什么服务？</p>
        <form id="echoForm" class="chat">
          <div class="input-row">
            <span class="echo-icon">💬</span>
            <input id="question" autocomplete="off" placeholder="请描述您的需求、任务或管理工作" aria-label="请输入问题">
            <button class="send" type="submit" aria-label="发送">➤</button>
          </div>
          <div id="answer" class="answer"></div>
        </form>
        <div class="quick">
          <button type="button" data-route="customer">申请住宅专项维修资金</button>
          <button type="button" data-route="customer">查看全部专业服务</button>
          <button type="button" data-route="worker">查询我的工作任务</button>
          <button type="button" data-route="admin">平台审核、报价与派工</button>
        </div>
        <p id="hint" class="hint">您也可以直接输入问题，Echo 将自动识别并带您进入相应页面。</p>
      </div>
    </section>
  </main>
  <script>
    const copy={zh:{lead:"您好，您需要什么服务？",placeholder:"请描述您的需求、任务或管理工作",hint:"您也可以直接输入问题，Echo 将自动识别并带您进入相应页面。",routing:"Echo 已理解您的需要，正在为您打开相应服务页面……",quick:["申请住宅专项维修资金","查看全部专业服务","查询我的工作任务","平台审核、报价与派工"]},en:{lead:"Hello, what service do you need?",placeholder:"Describe your service, work task, or management request",hint:"Ask directly and Echo will guide you to the correct workspace.",routing:"Echo understands your request and is opening the right service page…",quick:["Housing repair fund application","View professional services","Find my work tasks","Platform review, quote and dispatch"]}};
    let language=localStorage.getItem("echocity-language")||"zh";
    const destinations={customer:"assets/customer-service-catalog.html",worker:"assets/worker-dashboard.html",admin:"assets/admin-dashboard.html"};
    function applyLanguage(){document.documentElement.lang=language==="zh"?"zh-CN":"en";lead.textContent=copy[language].lead;question.placeholder=copy[language].placeholder;hint.textContent=copy[language].hint;languageButton.textContent=language==="zh"?"EN":"中文";document.querySelectorAll(".quick button").forEach((button,index)=>button.textContent=copy[language].quick[index]);}
    function detectRoute(text){const value=text.toLowerCase();if(/工人|师傅|服务人员|接单|到达|开工|工作任务|worker|task/.test(value))return"worker";if(/平台|管理|监管|审核|报价|派工|验收|admin|quote|dispatch/.test(value))return"admin";return"customer";}
    function routeTo(role,text){answer.textContent=copy[language].routing;answer.classList.add("show");const url=new URL(destinations[role],window.location.href);if(text)url.searchParams.set("q",text);setTimeout(()=>window.location.href=url.toString(),650);}
    echoForm.addEventListener("submit",event=>{event.preventDefault();const text=question.value.trim();if(!text){question.focus();return}routeTo(detectRoute(text),text)});
    document.querySelectorAll("[data-route]").forEach(button=>button.addEventListener("click",()=>routeTo(button.dataset.route,button.textContent.trim())));
    languageButton.addEventListener("click",()=>{language=language==="zh"?"en":"zh";localStorage.setItem("echocity-language",language);applyLanguage()});
    applyLanguage();
    if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
  </script>
</body>
</html>
