<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f2747"
  >

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./images/echocity-app-icon-192.png">

  <title>EchoCity｜可信社区服务</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --white: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.86);
      --glass: rgba(8, 24, 48, 0.62);
      --glass-light: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.27);
      --shadow: 0 22px 55px rgba(0, 0, 0, 0.30);
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

      color: var(--white);

      background:
        linear-gradient(
          180deg,
          rgba(5, 20, 43, 0.18) 0%,
          rgba(5, 20, 43, 0.46) 48%,
          rgba(5, 20, 43, 0.83) 100%
        ),
        url("images/echocity-home-bg.png")
        center center / cover
        no-repeat;

      background-attachment: fixed;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: calc(100% - 24px);
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 12px;
      padding:
        max(20px, env(safe-area-inset-top))
        0
        max(28px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      color: var(--white);
      text-decoration: none;

      font-size: 23px;
      font-weight: 900;
    }

    .brand-mark {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 13px;

      background: var(--primary);

      box-shadow:
        0 10px 25px
        rgba(37, 99, 235, 0.35);
    }

    .language-button {
      min-height: 40px;
      padding: 0 16px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--white);
      background: rgba(5, 20, 43, 0.48);

      font-weight: 900;
      backdrop-filter: blur(12px);
    }

    .main-content {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding-top: 44px;
    }

    .hero {
      max-width: 760px;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;

      min-height: 34px;
      padding: 5px 12px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(5, 20, 43, 0.42);

      color: var(--text-soft);

      font-size: 14px;
      font-weight: 800;

      backdrop-filter: blur(12px);
    }

    .hero-title {
      margin-top: 16px;

      font-size:
        clamp(
          39px,
          8vw,
          72px
        );

      line-height: 1.03;
      letter-spacing: -2px;

      text-shadow:
        0 6px 24px
        rgba(0, 0, 0, 0.48);
    }

    .hero-description {
      max-width: 700px;
      margin-top: 16px;

      color: var(--text-soft);

      font-size:
        clamp(
          17px,
          2.8vw,
          21px
        );

      line-height: 1.75;

      text-shadow:
        0 3px 14px
        rgba(0, 0, 0, 0.45);
    }

    .main-panel {
      width: min(100%, 390px);
      margin-left: 0;
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: var(--glass);
      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
    }

    @media (max-width: 1220px) {
      .main-panel {
        margin-left: 0;
      }
    }

    .panel-title {
      font-size: 22px;
      font-weight: 900;
    }

    .panel-description {
      margin-top: 7px;

      color: var(--text-soft);

      line-height: 1.65;
    }

    .entry-grid {
      display: grid;
      grid-template-columns: 1fr;

      gap: 12px;
      margin-top: 16px;
    }

    .entry-card {
      min-height: 108px;
      padding: 17px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      border: 1px solid var(--border);
      border-radius: 17px;

      color: var(--white);
      background: var(--glass-light);

      text-decoration: none;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .entry-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.52);
      background: rgba(255, 255, 255, 0.21);
    }

    .entry-icon {
      font-size: 28px;
    }

    .entry-title {
      margin-top: 16px;

      font-size: 19px;
      font-weight: 900;
    }

    .entry-description {
      margin-top: 6px;

      color: var(--text-soft);

      font-size: 14px;
      line-height: 1.55;
    }

    .assisted-panel {
      margin-top: 14px;
      padding: 16px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(5, 20, 43, 0.48);

      backdrop-filter: blur(15px);
    }

    .assisted-title {
      font-size: 18px;
      font-weight: 900;
    }

    .assisted-description {
      margin-top: 6px;

      color: var(--text-soft);

      line-height: 1.55;
    }

    .assisted-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;
      margin-top: 13px;
    }

    .assisted-button {
      min-height: 50px;
      padding: 9px 10px;

      border: 1px solid var(--border);
      border-radius: 13px;

      color: var(--white);
      background: rgba(255, 255, 255, 0.11);

      text-decoration: none;
      text-align: center;

      display: grid;
      place-items: center;

      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
    }

    .trust-row {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 8px;
      margin-top: 14px;
    }

    .trust-item {
      min-height: 58px;
      padding: 9px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.09);
      color: var(--text-soft);

      text-align: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .footer-note {
      margin-top: 18px;

      color: rgba(255, 255, 255, 0.72);

      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      body {
        background-attachment: scroll;
        background-position: 58% center;
      }

      .page {
        width: min(100% - 18px, 980px);
      }

      .main-content {
        padding-top: 52px;
      }

      .hero-title {
        letter-spacing: -1px;
      }

      .entry-grid {
        grid-template-columns: 1fr;
      }

      .entry-card {
        min-height: 112px;
      }

      .assisted-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .trust-row {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .trust-item:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 400px) {
      .assisted-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">

      <a
        class="brand"
        href="index.html"
      >
        <span class="brand-mark">E</span>
        <span>EchoCity</span>
      </a>

      <button
        id="languageButton"
        class="language-button"
        type="button"
      >
        EN
      </button>

    </header>

    <section class="main-content">

      <section class="main-panel">

        <h2
          id="panelTitle"
          class="panel-title"
        >
          请选择你的入口
        </h2>

        <div class="entry-grid">

          <a
            class="entry-card"
            href="assets/service-request.html"
          >
            <div class="entry-icon">🏠</div>

            <div>
              <div
                id="customerTitle"
                class="entry-title"
              >
                我需要服务
              </div>

              <div
                id="customerDescription"
                class="entry-description"
              >
                维修、清洁、生活帮助和社区支持
              </div>
            </div>
          </a>

          <a
            class="entry-card"
            href="assets/worker-tasks.html"
          >
            <div class="entry-icon">🧰</div>

            <div>
              <div
                id="workerTitle"
                class="entry-title"
              >
                我愿意提供服务
              </div>

              <div
                id="workerDescription"
                class="entry-description"
              >
                查询任务、到达、记录工作和提交成果
              </div>
            </div>
          </a>

          <a
            class="entry-card"
            href="assets/admin-dashboard.html"
          >
            <div class="entry-icon">📋</div>

            <div>
              <div
                id="adminTitle"
                class="entry-title"
              >
                平台服务管理
              </div>

              <div
                id="adminDescription"
                class="entry-description"
              >
                审核需求、报价、派工和全过程监管
              </div>
            </div>
          </a>

        </div>

        <section class="assisted-panel">

          <h3
            id="assistedTitle"
            class="assisted-title"
          >
            使用手机有困难？
          </h3>

          <div class="assisted-grid">

            <a
              id="voiceButton"
              class="assisted-button"
              href="assets/service-request.html?intake=voice"
            >
              说出我的需要
            </a>

            <a
              id="callbackButton"
              class="assisted-button"
              href="assets/service-request.html?intake=callback"
            >
              请求电话帮助
            </a>

            <a
              id="representativeButton"
              class="assisted-button"
              href="assets/service-request.html?intake=representative"
            >
              请他人代我提交
            </a>

            <a
              id="inPersonButton"
              class="assisted-button"
              href="assets/service-request.html?intake=in_person"
            >
              申请上门协助
            </a>

          </div>

        </section>

      </section>

      <footer
        id="footerNote"
        class="footer-note"
      >
        EchoCity · 使命驱动型社区服务平台
      </footer>

    </section>

  </main>

  <script>
    const translations = {
      zh: {
        panelTitle:
          "请选择你的入口",

        customerTitle:
          "我需要服务",

        customerDescription:
          "维修、清洁、生活帮助和社区支持",

        workerTitle:
          "我愿意提供服务",

        workerDescription:
          "查询任务、到达、记录工作和提交成果",

        adminTitle:
          "平台服务管理",

        adminDescription:
          "审核需求、报价、派工和全过程监管",

        assistedTitle:
          "使用手机有困难？",

        voiceButton:
          "说出我的需要",

        callbackButton:
          "请求电话帮助",

        representativeButton:
          "请他人代我提交",

        inPersonButton:
          "申请上门协助",

        footerNote:
          "EchoCity · 使命驱动型社区服务平台"
      },

      en: {
        panelTitle:
          "Choose your service area",

        customerTitle:
          "I Need Help",

        customerDescription:
          "Repairs, cleaning, daily assistance, and community support",

        workerTitle:
          "I Want to Work",

        workerDescription:
          "View tasks, arrive on site, record work, and submit results",

        adminTitle:
          "Manage Services",

        adminDescription:
          "Review requests, prepare proposals, assign workers, and supervise service delivery",

        assistedTitle:
          "Need help using this app?",

        voiceButton:
          "Describe My Need by Voice",

        callbackButton:
          "Request a Phone Call",

        representativeButton:
          "Let Someone Submit for Me",

        inPersonButton:
          "Request In-Person Help",

        footerNote:
          "EchoCity · Mission-Driven Community Service Platform"
      }
    };

    let currentLanguage =
      localStorage.getItem(
        "echocity-language"
      ) || "zh";

    const textIds = [
      "panelTitle",
      "customerTitle",
      "customerDescription",
      "workerTitle",
      "workerDescription",
      "adminTitle",
      "adminDescription",
      "assistedTitle",
      "voiceButton",
      "callbackButton",
      "representativeButton",
      "inPersonButton",
      "footerNote"
    ];

    function translate(key) {
      return (
        translations[currentLanguage]?.[key] ||
        translations.zh[key] ||
        key
      );
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh"
          ? "zh-CN"
          : "en";

      textIds.forEach((id) => {
        const element =
          document.getElementById(id);

        if (element) {
          element.textContent =
            translate(id);
        }
      });

      document
        .getElementById(
          "languageButton"
        )
        .textContent =
          currentLanguage === "zh"
            ? "EN"
            : "中文";

      document.title =
        currentLanguage === "zh"
          ? "EchoCity｜可信社区服务"
          : "EchoCity | Trusted Community Service";
    }

    document
      .getElementById(
        "languageButton"
      )
      .addEventListener(
        "click",
        () => {
          currentLanguage =
            currentLanguage === "zh"
              ? "en"
              : "zh";

          localStorage.setItem(
            "echocity-language",
            currentLanguage
          );

          applyLanguage();
        }
      );

    applyLanguage();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
