<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>消息 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 30px}h1{font-size:26px;margin:0 0 16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.q{background:#fff;border-radius:14px;padding:13px 6px;text-align:center}.q b{display:block;font-size:21px}.q span{font-size:12px;color:#64748b}.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px}.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:800}.tab.active{background:#111827;color:#fff}.list{display:grid;gap:8px}.item{background:#fff;border-radius:14px;padding:13px;display:flex;gap:11px}.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eff6ff;font-size:21px}.body{flex:1}.title{font-weight:900}.text{font-size:13px;color:#64748b;line-height:1.45;margin-top:4px}.time{font-size:11px;color:#94a3b8;margin-top:6px}.empty{text-align:center;padding:50px 16px;color:#94a3b8}</style></head><body><main class="wrap"><h1>消息</h1><div class="quick"><div class="q"><b>♥</b><span>赞和收藏</span></div><div class="q"><b>👤</b><span>新关注</span></div><div class="q"><b>💬</b><span>评论</span></div><div class="q"><b>🔔</b><span>系统消息</span></div></div><div class="tabs"><div class="tab active">通知</div><div class="tab">私信</div></div><section id="list" class="list"><div class="empty">正在读取消息……</div></section></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');async function load(){const {data:u}=await db.auth.getUser();const me=u?.user;if(!me){list.innerHTML='<div class="empty">登录后查看消息</div>';return}const {data:n,error}=await db.from('notifications').select('id,event_type,title,body,priority,status,action_url,created_at,read_at').eq('recipient_user_id',me.id).order('created_at',{ascending:false}).limit(100);if(error){list.innerHTML='<div class="empty">消息读取失败</div>';return}list.innerHTML=(n||[]).length?(n||[]).map(x=>`<article class="item" onclick="${x.action_url?`location.href='${String(x.action_url).replace(/'/g,'')}'`:''}"><div class="icon">${x.event_type?.includes('comment')?'💬':x.event_type?.includes('follow')?'👤':x.event_type?.includes('like')?'♥':'🔔'}</div><div class="body"><div class="title">${esc(x.title)}</div><div class="text">${esc(x.body)}</div><div class="time">${new Date(x.created_at).toLocaleString()} ${x.read_at?'':'· 未读'}</div></div></article>`).join(''):'<div class="empty">暂时没有新消息</div>'}function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
