<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工人收款确认 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>body{margin:0;background:#f2f6f3;font-family:Arial,"Microsoft YaHei";color:#183128}.page{width:min(620px,calc(100% - 24px));margin:auto;padding:24px 0}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 25px #17304c12}.amount{font-size:34px;font-weight:900;color:#13704d;margin:18px 0}.row{padding:12px 0;border-bottom:1px solid #e5eae7}button{width:100%;border:0;border-radius:12px;padding:15px;background:#13704d;color:#fff;font-weight:800;margin-top:18px}button:disabled{opacity:.45}.message{margin-top:14px;line-height:1.6}</style></head><body><main class="page"><section class="card"><h1>工人收款确认</h1><div class="row">订单号：<strong id="no">—</strong></div><div>本次应收</div><div id="amount" class="amount">—</div><div class="row">状态：<strong id="status">—</strong></div><button id="confirm" onclick="confirmReceipt()">我已收到款项</button><div id="message" class="message"></div></section></main><script>let requestNo='',token='';const $=id=>document.getElementById(id);async function read(){const {data,error}=await window.echoCitySupabase.rpc('get_order_settlement_with_token',{p_request_no:requestNo,p_role:'worker',p_token:token});if(error){$('message').textContent='链接无效或已过期。';return null}$('no').textContent=data.request_no;$('amount').textContent=`${data.currency} ${Number(data.worker_amount||0).toFixed(2)}`;$('status').textContent=data.status==='payment_confirmed'?'平台已确认付款':data.status==='receipt_confirmed'?'收款已确认':data.status==='archived'?'订单已归档':'等待平台确认付款';$('confirm').disabled=data.status!=='payment_confirmed';return data}async function confirmReceipt(){$('confirm').disabled=true;$('message').textContent='正在确认……';const {data,error}=await window.echoCitySupabase.rpc('advance_order_settlement_with_token',{p_request_no:requestNo,p_role:'worker',p_token:token,p_action:'confirm_receipt'});if(error){$('message').textContent='确认失败，请检查网络后重试。';await read();return}$('message').textContent='收款确认成功，等待平台归档。';await read()}async function load(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));requestNo=q.get('request')||'';token=h.get('token')||'';if(!requestNo||!token){$('message').textContent='链接缺少必要信息。';$('confirm').disabled=true;return}await read()}load();</script></body></html>
