<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务与派工中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1140px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:20px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#132743,#0369a1)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.metric,.task{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:28px;font-weight:900;color:#0369a1}.label,.muted{color:#64748b}.warning{margin:14px 0;padding:14px;border:1px solid #fbbf24;border-radius:14px;background:#fffbeb;color:#92400e}.warning a{color:#92400e;font-weight:900}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filter{border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;background:#fff;font-weight:800;cursor:pointer}.filter.active{background:#0369a1;color:#fff;border-color:#0369a1}.list{display:grid;gap:11px}.task{display:grid;grid-template-columns:1.3fr 1.2fr 1fr auto;gap:14px;align-items:center}.order{font-weight:900;color:#1d4ed8}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.ready_to_assign{background:#fef3c7;color:#92400e}.awaiting_worker{background:#dbeafe;color:#1e40af}.active-task{background:#dcfce7;color:#166534}.overdue{color:#b91c1c;font-weight:900}.btn{display:inline-block;border-radius:10px;padding:10px 12px;background:#0369a1;color:#fff;text-decoration:none;font-weight:900}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>任务与派工中心</h1><p>统一查看待派工、待接单、执行中任务和可派服务人员</p></header><div id="message" class="message">正在读取调度数据……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div id="qualification-warning"></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="ready_to_assign">待派工</button><button class="filter" data-filter="awaiting_worker">待接单</button><button class="filter" data-filter="active">执行中</button><button class="filter" data-filter="follow_up">其他待办</button></div><div id="tasks" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let allTasks=[];
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const queueText={ready_to_assign:'待派工',awaiting_worker:'待工人接单',active:'执行中',follow_up:'其他待办'};
function render(filter='all'){const rows=filter==='all'?allTasks:allTasks.filter(x=>x.queue===filter);$('tasks').innerHTML=rows.length?rows.map(x=>{const action=x.queue==='ready_to_assign'||x.queue==='awaiting_worker'?`<a class="btn" href="admin-service-assignment.html?request_no=${encodeURIComponent(x.request_no)}">${x.queue==='ready_to_assign'?'进入派工':'查看/改派'}</a>`:`<a class="btn" href="admin-order-360.html?request_no=${encodeURIComponent(x.request_no)}">查看订单</a>`;return `<article class="task"><div><div class="order">${esc(x.request_no)}</div><div class="muted">${esc(x.service_type)}</div></div><div><span class="tag ${esc(x.queue)}">${esc(queueText[x.queue]||x.queue)}</span><div class="muted">状态：${esc(x.status)} · 下一步：${esc(x.next_action)}</div></div><div><strong>${esc(x.assigned_worker||'尚未派工')}</strong><div class="${Number(x.hours_waiting)>24?'overdue':'muted'}">已等待 ${esc(x.hours_waiting)} 小时</div></div><div>${action}</div></article>`}).join(''):'<div class="message">该队列暂无任务。</div>'}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));
async function load(){try{const platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_dispatch_center_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['待派工',s.ready_to_assign],['待工人接单',s.awaiting_worker],['执行中',s.active_tasks],['待方案审核',s.plan_review],['合格可派人员',s.qualified_workers],['待资格核验',s.worker_verification_pending]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');$('qualification-warning').innerHTML=Number(s.qualified_workers)===0?`<div class="warning">当前没有同时满足“已认证、在岗、可接单、信用≥60”的人员。请先进入 <a href="admin-worker-management.html">人员与信用管理</a> 完成资格核验，系统不会推荐未核验人员。</div>`:'';allTasks=d.tasks||[];render();$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`调度数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
