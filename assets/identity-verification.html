<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>实名认证 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:650px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 36px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900;margin-bottom:14px}.card{background:#fff;border-radius:18px;padding:18px}.notice{background:#fff7ed;color:#9a3412;border-radius:12px;padding:12px;line-height:1.55;margin-bottom:14px}.field{margin:14px 0}.field label{display:block;font-weight:900;margin-bottom:7px}.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px}.submit{width:100%;height:46px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900}.item{border-top:1px solid #eef2f7;padding:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.muted{font-size:12px;color:#64748b;margin-top:5px}</style></head><body><main class="wrap"><button class="back" onclick="history.back()">← 返回</button><section class="card"><h1>实名认证 / 专业认证</h1><div class="notice">当前版本只建立认证申请与审核状态。网页端不直接保存身份证号码或证件照片；正式上线中国大陆后，应接入合规的实名核验服务商，再回写认证结果。</div><div class="field"><label>认证类型</label><select id="type"><option value="personal">个人实名认证</option><option value="professional">专业人员认证</option><option value="business">企业/机构认证</option></select></div><button id="submit" class="submit">提交认证申请</button><h3>我的认证记录</h3><div id="history">正在读取……</div></section></main><script>const db=window.echoCitySupabase;let me=null;function statusText(s){return({submitted:'已提交',reviewing:'审核中',verified:'已认证',rejected:'未通过',expired:'已过期'})[s]||s}async function load(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!me){history.innerHTML='请先登录';submit.disabled=true;return}const {data,error}=await db.from('identity_verification_requests').select('id,verification_type,status,display_badge,submitted_at,reviewed_at').eq('user_id',me.id).order('submitted_at',{ascending:false});if(error){history.textContent='读取失败：'+error.message;return}history.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="item"><b>${x.verification_type==='personal'?'个人实名认证':x.verification_type==='professional'?'专业人员认证':'企业/机构认证'}</b> <span class="badge">${statusText(x.status)}</span>${x.display_badge?`<div class="muted">认证标识：${x.display_badge}</div>`:''}<div class="muted">提交时间：${new Date(x.submitted_at).toLocaleString()}</div></div>`).join(''):'暂无认证申请'}submit.onclick=async()=>{if(!me)return;const {error}=await db.from('identity_verification_requests').insert({user_id:me.id,verification_type:type.value,status:'submitted'});if(error){alert('提交失败：'+error.message);return}alert('认证申请已提交');load()};load();</script></body></html>
