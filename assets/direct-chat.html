<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>私信 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:720px;margin:auto;height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}.top button{border:0;background:#f3f4f6;border-radius:999px;padding:9px 12px}.top b{font-size:18px}.messages{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:10px 12px;border-radius:15px;background:#fff;box-shadow:0 2px 8px #0f172a0a}.msg.me{align-self:flex-end;background:#2563eb;color:#fff}.name{font-size:11px;color:#94a3b8;margin-bottom:4px}.me .name{color:#dbeafe}.time{font-size:10px;opacity:.65;margin-top:5px}.composer{background:#fff;border-top:1px solid #e5e7eb;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px}.composer input{flex:1;border:1px solid #d1d5db;border-radius:999px;padding:12px 15px;font:inherit}.composer button{border:0;border-radius:999px;background:#2563eb;color:#fff;font-weight:900;padding:0 18px}.empty{text-align:center;color:#94a3b8;padding:40px}</style></head><body><main class="wrap"><header class="top"><button onclick="history.back()">←</button><b id="title">私信</b></header><section id="messages" class="messages"><div class="empty">正在读取……</div></section><div class="composer"><input id="input" maxlength="2000" placeholder="发送消息"><button id="send">发送</button></div></main><script>const db=window.echoCitySupabase,p=new URLSearchParams(location.search);let thread=p.get('thread'),other=p.get('user'),me=null;const box=document.getElementById('messages'),input=document.getElementById('input');function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function init(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!me){box.innerHTML='<div class="empty">请先登录</div>';return}if(!thread&&other){const {data,error}=await db.rpc('start_direct_thread',{p_other_user:other});if(error){box.innerHTML='<div class="empty">无法建立私信：'+esc(error.message)+'</div>';return}thread=data}if(!thread){box.innerHTML='<div class="empty">缺少会话编号</div>';return}await load()}async function load(){const {data,error}=await db.rpc('get_direct_messages',{p_thread_id:thread});if(error){box.innerHTML='<div class="empty">读取失败</div>';return}const rows=Array.isArray(data)?data:[];box.innerHTML=rows.length?rows.map(x=>`<div class="msg ${x.sender_id===me.id?'me':''}"><div class="name">${esc(x.display_name||'EchoCity 用户')}</div><div>${esc(x.content)}</div><div class="time">${new Date(x.created_at).toLocaleString()}</div></div>`).join(''):'<div class="empty">开始你们的第一条私信吧。</div>';box.scrollTop=box.scrollHeight}document.getElementById('send').onclick=async()=>{const t=input.value.trim();if(!t||!thread)return;const {error}=await db.rpc('send_direct_message',{p_thread_id:thread,p_content:t});if(error){alert('发送失败：'+error.message);return}input.value='';load()};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('send').click()}});init();</script></body></html>
