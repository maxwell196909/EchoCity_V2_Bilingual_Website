<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单360°全景 | EchoCity</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1180px,calc(100% - 22px));margin:auto;padding:14px 0 42px}.hero,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#111827,#2563eb)}.hero a{color:#fff}.state{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:800}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.nav a{padding:12px;border-radius:12px;background:#fff;border:1px solid #bfdbfe;color:#1d4ed8;text-decoration:none;font-weight:900;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:16px}.card h2{margin-top:0}.item{padding:8px 0;border-top:1px solid #e5e7eb}.item:first-of-type{border-top:0}.label,.muted,small{color:#64748b}.value{font-weight:800}.timeline{border-left:3px solid #93c5fd;padding-left:18px}.event{padding:0 0 18px}.error{background:#fee2e2;color:#991b1b}.wide{grid-column:1/-1}@media(max-width:820px){.nav{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>订单360°全景</h1><div id="title">统一订单、统一状态、统一事实源</div><div id="state" class="state"></div></header><nav id="nav" class="nav"></nav><div id="message" class="card">正在横向读取各业务模块……</div><section id="content" class="grid" hidden><div id="modules" class="grid wide"></div><div class="card wide"><h2>跨模块事件时间线</h2><div id="timeline" class="timeline"></div></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN'):'—';const URL='https://dpljvspwcfglxfesxdmf.supabase.co',KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';async function rpc(n,b){const r=await fetch(`${URL}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(b)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||`API ${r.status}`);return p}function creds(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),request_no=q.get('request_no')||h.get('request_no'),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return{request_no,token:x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}}function rows(a){return a.map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}function card(t,a){return `<div class="card"><h2>${t}</h2>${rows(a)}</div>`}
async function load(){try{const a=creds();if(!a.request_no||!a.token)throw new Error('链接缺少订单号或平台访问凭证');const d=await rpc('get_platform_order_360_with_token',{p_request_no:a.request_no,p_token:a.token}),r=d.request||{},w=d.worker||{},p=d.plan||{},x=d.work||{},q=d.quality||{},s=d.settlement||{},wa=d.warranty||{},af=d.after_sales||{},ins=d.incidents||[];$('title').textContent=`${r.request_no} · ${r.service_type}`;$('state').innerHTML=[r.status,`责任人：${r.current_actor||'—'}`,`下一步：${r.next_action||'—'}`,`风险：${r.risk_level||'—'}`].map(v=>`<span class="tag">${esc(v)}</span>`).join('');const nav=[['订单处理','admin-service-requests.html'],['派工','admin-dispatch-center.html'],['方案','admin-plan-center.html'],['开工','admin-prestart-center.html'],['质量','admin-quality-center.html'],['人员','admin-worker-management.html'],['结算','admin-settlement-ledger.html'],['保修','admin-warranty-center.html'],['异常','admin-incident-center.html'],['归档','admin-order-archive.html']];$('nav').innerHTML=nav.map(n=>`<a href="${n[1]}?request_no=${encodeURIComponent(r.request_no)}">${n[0]}</a>`).join('');$('modules').innerHTML=card('订单主状态',[['需求',r.description],['客户',r.customer_name||r.customer_phone],['地址',r.address],['报价',r.quote_amount],['更新时间',dt(r.updated_at)]])+card('人员与信用',[['服务人员',w.name||r.assigned_worker],['资格',w.verification],['可用状态',w.availability],['信用分',w.credit_score],['完成/返工/争议',`${w.completed_orders||0}/${w.rework_count||0}/${w.dispute_count||0}`]])+card('方案与开工',[['版本',p.version?`V${p.version}`:'—'],['状态',p.status],['平台审批',p.platform_approval],['客户确认',dt(p.customer_confirmed_at)],['开工条件',p.prestart_ready?'已齐备':'未齐备']])+card('施工与证据',[['记录',x.record_count],['工时',x.hours],['照片/视频',`${x.photo_count||0}/${x.video_count||0}`],['最新进展',x.latest?.progress],['发现问题',x.latest?.issues]])+card('质量与验收',[['最终验收',q.final_status],['客户评分',q.final_data?.final_rating],['验收意见',q.final_data?.final_comments],['遗留问题',q.outstanding_issues]])+card('支付与结算',[['状态',s.status],['总额',s.total_amount==null?'—':`${s.currency} ${s.total_amount}`],['服务人员/平台',`${s.worker_amount??'—'}/${s.platform_fee??'—'}`],['客户付款',dt(s.customer_paid_at)],['归档',dt(s.archived_at)]])+card('保修档案',[['状态',wa.status],['期间',`${dt(wa.start_at)} → ${dt(wa.end_at)}`],['范围',wa.scope],['排除项',wa.exclusions],['响应时限',wa.response_hours?`${wa.response_hours}小时`:'—']])+card('售后整改',[['未结案',af.open_count],['证据',af.evidence_count],['工单',af.cases?.map(c=>`${c.case_no}·${c.status}`).join('；')]])+card('异常与争议',[['关联异常',ins.length],['详情',ins.map(i=>`${i.title}·${i.status}`).join('；')]]);$('timeline').innerHTML=(d.timeline||[]).map(e=>`<div class="event"><strong>${esc(e.title)} · ${esc(e.status)}</strong><br><small>${esc(dt(e.time))} · ${esc(e.source)} · ${esc(e.actor)}</small><div>${esc(e.note)}</div></div>`).join('')||'<div class="muted">暂无事件</div>';$('message').hidden=true;$('content').hidden=false}catch(e){$('message').textContent=`订单全景读取失败：${e.message}`;$('message').className='card error'}}load();
</script></body></html>
