<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>供需监测 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f6f8;color:#111827}.wrap{max-width:980px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 38px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.title{font-size:23px;font-weight:900}.sub{font-size:12px;color:#64748b;margin-top:4px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:0;background:#fff;padding:9px 13px;border-radius:999px;font-weight:800}.filters button.on{background:#111827;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 18px #0f172a0b}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:#64748b}.alert{margin:12px 0;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px;font-size:13px;line-height:1.5}.rows{display:grid;gap:10px}.row{background:#fff;border-radius:16px;padding:14px}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;font-size:17px}.city{font-size:12px;color:#64748b}.pill{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;height:max-content}.critical{background:#fee2e2;color:#991b1b}.high{background:#ffedd5;color:#9a3412}.medium{background:#fef3c7;color:#92400e}.watch{background:#dbeafe;color:#1d4ed8}.normal{background:#dcfce7;color:#166534}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.m{background:#f8fafc;border-radius:10px;padding:9px;text-align:center}.m b{display:block;font-size:16px}.m span{font-size:10px;color:#64748b}.empty{background:#fff;padding:30px;border-radius:16px;text-align:center;color:#64748b}.foot{font-size:11px;color:#94a3b8;margin-top:14px}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><button class="back" onclick="history.back()">← 返回</button><div class="title">城市服务供需监测</div><div class="sub">内容热度 → 服务需求 → 人员供给缺口</div></div><button class="back" onclick="load()">刷新</button></div><div class="filters"><button data-d="7">7天</button><button data-d="30" class="on">30天</button><button data-d="90">90天</button></div><section class="stats"><div class="stat"><b id="requests">0</b><span>需求总数</span></div><div class="stat"><b id="active">0</b><span>活跃需求</span></div><div class="stat"><b id="workers">0</b><span>可用人员</span></div><div class="stat"><b id="critical">0</b><span>严重缺口</span></div></section><div id="alert" class="alert">正在读取供需数据...</div><section id="rows" class="rows"></section><div id="foot" class="foot"></div></main><script>const db=window.echoCitySupabase;let days=30;function token(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const q=new URLSearchParams(location.search);const t=h.get('platform_token')||q.get('platform_token')||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}return t}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(x){return({critical:'严重',high:'高',medium:'中',watch:'观察',normal:'正常'})[x]||x}async function load(){const t=token();if(!t){alert.textContent='缺少平台访问凭证，请从平台后台进入。';rows.innerHTML='';return}const {data,error}=await db.rpc('get_platform_demand_supply_v1',{p_token:t,p_days:days,p_limit:100});if(error){alert.textContent='读取失败：'+error.message;rows.innerHTML='';return}const o=data?.overview||{};requests.textContent=o.requests||0;active.textContent=o.active_requests||0;workers.textContent=o.available_workers||0;critical.textContent=o.critical_gaps||0;const list=data?.rows||[];if((o.available_workers||0)===0&&(o.active_requests||0)>0)alert.textContent='当前已有 '+o.active_requests+' 个活跃服务需求，但系统内没有可用服务人员档案。建议优先完善服务人员入驻、技能、城市与在线状态数据。';else alert.textContent='系统按城市、服务类型、需求、内容点击和可用人员计算供需压力。严重/高等级应优先补充供给。';rows.innerHTML=list.length?list.map(r=>`<article class="row"><div class="head"><div><div class="name">${esc(r.service_type)}</div><div class="city">📍 ${esc(r.city)}</div></div><span class="pill ${esc(r.alert_level)}">${label(r.alert_level)}</span></div><div class="metrics"><div class="m"><b>${r.active_requests||0}</b><span>活跃需求</span></div><div class="m"><b>${r.available_workers||0}</b><span>可用人员</span></div><div class="m"><b>${r.worker_gap||0}</b><span>人员缺口</span></div><div class="m"><b>${r.service_clicks||0}</b><span>内容服务点击</span></div><div class="m"><b>${Number(r.pressure_score||0).toFixed(0)}</b><span>压力分</span></div></div></article>`).join(''):'<div class="empty">当前周期暂无供需数据。</div>';foot.textContent='更新时间：'+new Date(data.generated_at||Date.now()).toLocaleString()+' · 周期 '+days+' 天';}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));load()});load();</script></body></html>
