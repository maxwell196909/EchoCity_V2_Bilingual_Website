<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开工条件检查中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1120px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#172554,#0e7490)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.metric,.order{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:28px;font-weight:900;color:#0e7490}.label,.muted{color:#64748b}.notice{padding:14px;border-radius:14px;background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;margin:14px 0}.list{display:grid;gap:12px}.order{display:grid;grid-template-columns:1.1fr 2fr auto;gap:15px;align-items:center}.order-no{font-weight:900;color:#1d4ed8}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.check{padding:8px;border-radius:9px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:800}.check.ok{background:#dcfce7;color:#166534}.legacy{margin-top:8px;padding:8px;border-radius:9px;background:#fef3c7;color:#92400e;font-weight:800}.btn{display:inline-block;padding:10px 12px;border-radius:10px;background:#0e7490;color:#fff;text-decoration:none;font-weight:900}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}@media(max-width:760px){.order{grid-template-columns:1fr}.checks{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>开工条件检查中心</h1><p>方案批准只是第一步，全部开工证据齐备后才能施工</p></header><div class="notice">平台必须核对：方案、客户确认、人员资格、工人接单、到场、现场条件、范围质量工期、开工照片和七项方案章节。AI仅检查完整性，不能批准开工。</div><div id="message" class="message">正在核对开工条件……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div id="orders" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const fields=[['plan_approved','平台批准方案'],['customer_confirmed','客户确认影响'],['worker_qualified','人员资格合格'],['worker_accepted','工人已接单'],['arrival_confirmed','已确认到场'],['prework_confirmed','开工检查提交'],['site_conditions','现场条件确认'],['scope_quality_time','范围质量工期确认'],['photo_evidence','开工照片证据'],['sections_complete','七项章节完整']];
async function load(){try{const platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_prestart_center_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['条件齐备',s.ready],['待补开工条件',s.blocked],['历史闸门异常',s.legacy_started_without_gate]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const rows=d.orders||[];$('orders').innerHTML=rows.length?rows.map(o=>`<article class="order"><div><div class="order-no">${esc(o.request_no)}</div><div>${esc(o.service_type)} · V${esc(o.plan_version)}</div><div class="muted">状态：${esc(o.order_status)} · ${esc(o.worker||'未派工')}</div>${o.legacy_gate_violation?'<div class="legacy">历史流程已开工，但当前闸门标记未齐；保留异常记录，不倒退订单。</div>':''}</div><div class="checks">${fields.map(([k,n])=>`<div class="check ${o[k]?'ok':''}">${o[k]?'✓':'✕'} ${esc(n)}</div>`).join('')}</div><div><a class="btn" href="admin-service-requests.html?request_no=${encodeURIComponent(o.request_no)}">进入订单处理</a></div></article>`).join(''):'<div class="message">暂无需要检查的订单。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`开工条件读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
