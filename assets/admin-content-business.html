<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>内容经营数据中心 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f6fa;color:#111827}.wrap{max-width:1180px;margin:auto;padding:20px 14px 50px}.hero{background:linear-gradient(135deg,#111827,#1d4ed8);color:#fff;border-radius:22px;padding:22px}.hero h1{margin:5px 0 8px;font-size:30px}.hero p{margin:0;color:#dbeafe;line-height:1.6}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tools select,.tools button{height:42px;border-radius:11px;border:0;padding:0 13px;font-weight:800}.tools button{background:#fff;color:#1d4ed8}.status{margin-top:12px;font-size:13px;color:#dbeafe}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 5px 18px #0f172a0c}.card span{font-size:12px;color:#64748b}.card b{display:block;font-size:24px;margin-top:7px}.section{margin-top:22px}.section h2{margin:0 0 10px}.tableWrap{overflow:auto;background:#fff;border-radius:16px;box-shadow:0 5px 18px #0f172a0c}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px 10px;border-bottom:1px solid #eef2f7;font-size:13px;text-align:right;white-space:nowrap}th{background:#f8fafc;color:#475569;position:sticky;top:0}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.type{font-size:11px;padding:3px 7px;border-radius:999px;background:#e0e7ff;color:#3730a3}.money{font-weight:900}.empty{padding:30px;text-align:center;color:#94a3b8}.back{display:inline-block;color:#fff;text-decoration:none;font-weight:800;margin-bottom:5px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}</style></head><body><main class="wrap"><section class="hero"><a class="back" href="me.html">← 返回</a><h1>内容经营数据中心</h1><p>把视频、直播和服务订单放在同一张经营漏斗里，看清内容是否真正带来需求、订单和成交。</p><div class="tools"><select id="days"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option><option value="365">近 365 天</option></select><button id="refresh">刷新数据</button></div><div class="status" id="status">准备读取平台经营数据</div></section><section class="cards" id="cards"></section><section class="section"><h2>内容转化排行</h2><div class="tableWrap" id="contentTable"></div></section><section class="section"><h2>创作者经营排行</h2><div class="tableWrap" id="creatorTable"></div></section></main><script>const db=window.echoCitySupabase;function token(){const t=localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||new URLSearchParams(location.hash.replace(/^#/,'')).get('platform_token')||new URLSearchParams(location.search).get('platform_token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}return t}function n(v){return Number(v||0).toLocaleString('zh-CN')}function m(v){return '¥'+Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}function pct(v){return Number(v||0).toFixed(2)+'%'}function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function renderOverview(o){const items=[['视频播放',o.video_views],['直播进入',o.live_views],['AI 咨询',o.ai_consults],['服务点击',o.service_clicks],['需求数',o.requests_created],['报价数',o.quotes_created],['确认订单',o.orders_confirmed],['完成订单',o.completed_orders],['确认订单金额',m(o.confirmed_amount),1],['完成订单金额',m(o.completed_amount),1]];cards.innerHTML=items.map(x=>'<div class="card"><span>'+x[0]+'</span><b class="'+(x[2]?'money':'')+'">'+(x[2]?x[1]:n(x[1]))+'</b></div>').join('')}function renderContent(rows){if(!rows?.length){contentTable.innerHTML='<div class="empty">暂无可统计的内容数据</div>';return}contentTable.innerHTML='<table><thead><tr><th>类型</th><th>内容 / 创作者</th><th>播放/进入</th><th>AI咨询</th><th>服务点击</th><th>需求</th><th>报价</th><th>确认</th><th>完成</th><th>完成金额</th><th>需求转化率</th><th>订单转化率</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><span class="type">'+(r.content_type==='live'?'直播':'视频')+'</span></td><td><b>'+esc(r.title||'未命名内容')+'</b><br><small>'+esc(r.creator_name||'')+'</small></td><td>'+n(r.views)+'</td><td>'+n(r.ai_consults)+'</td><td>'+n(r.service_clicks)+'</td><td>'+n(r.requests_created)+'</td><td>'+n(r.quotes_created)+'</td><td>'+n(r.orders_confirmed)+'</td><td>'+n(r.completed_orders)+'</td><td class="money">'+m(r.completed_amount)+'</td><td>'+pct(r.request_conversion_rate)+'</td><td>'+pct(r.order_conversion_rate)+'</td></tr>').join('')+'</tbody></table>'}function renderCreators(rows){if(!rows?.length){creatorTable.innerHTML='<div class="empty">暂无创作者经营数据</div>';return}creatorTable.innerHTML='<table><thead><tr><th>创作者</th><th>视频播放</th><th>直播进入</th><th>需求</th><th>报价</th><th>确认订单</th><th>完成订单</th><th>确认金额</th><th>完成金额</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.creator_name||'未命名创作者')+'</b></td><td>'+n(r.video_views)+'</td><td>'+n(r.live_views)+'</td><td>'+n(r.requests_created)+'</td><td>'+n(r.quotes_created)+'</td><td>'+n(r.orders_confirmed)+'</td><td>'+n(r.completed_orders)+'</td><td class="money">'+m(r.confirmed_amount)+'</td><td class="money">'+m(r.completed_amount)+'</td></tr>').join('')+'</tbody></table>'}async function load(){const t=token();if(!t){status.textContent='缺少平台访问凭证，请从平台后台进入。';return}status.textContent='正在读取……';const {data,error}=await db.rpc('get_platform_content_business_dashboard_v1',{p_token:t,p_days:Number(days.value),p_limit:100});if(error){console.error(error);status.textContent='读取失败：'+(error.message||'请检查平台凭证');return}renderOverview(data?.overview||{});renderContent(data?.content||[]);renderCreators(data?.creators||[]);status.textContent='已更新 · '+new Date(data?.generated_at||Date.now()).toLocaleString()}refresh.onclick=load;days.onchange=load;load();</script></body></html>
