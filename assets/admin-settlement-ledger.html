<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结算台账 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1120px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:20px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#243b65,#7c3aed)}.hero a{color:#fff}.notice{margin-top:14px;padding:13px 16px;border-radius:14px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.metric{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:25px;font-weight:900;color:#6d28d9}.label,.muted{color:#64748b}.card{padding:16px;margin-top:12px}.entry{display:grid;grid-template-columns:1.25fr 1.4fr 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #e5e7eb}.entry:last-child{border:0}.order{font-weight:900;color:#1d4ed8}.money{font-size:19px;font-weight:900}.split{font-size:13px;color:#64748b;margin-top:5px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-weight:800;font-size:12px}.tag.archived{background:#dcfce7;color:#166534}.tag.awaiting_payment{background:#fef3c7;color:#92400e}.tag.payment_confirmed{background:#dbeafe;color:#1e40af}.tag.receipt_confirmed{background:#ede9fe;color:#5b21b6}.btn{border:0;border-radius:10px;padding:10px 12px;background:#6d28d9;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.45}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}.zero{color:#b45309;font-weight:800}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>平台结算台账</h1><p>客户付款、工人结算、平台服务费、退款和发票统一对账</p></header><div class="notice">资金动作必须由平台人员依据真实到账凭证确认；系统不会自动批准付款或替代支付机构。</div><div id="message" class="message">正在读取结算台账……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div class="card"><h2>订单结算明细</h2><div id="entries"></div></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let platformToken='';
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const statusText={awaiting_payment:'待确认客户付款',payment_confirmed:'客户已付款·待工人确认',receipt_confirmed:'工人已确认收款',archived:'已结算归档',disputed:'结算争议'};
function money(v,c){return `${c==='CNY'?'¥':'$'}${Number(v||0).toFixed(2)}`}
function actionButton(x){if(x.status==='awaiting_payment'&&Number(x.total_amount)>0)return `<button class="btn" onclick="advance('${esc(x.request_no)}','confirm_payment',this)">确认客户已付款</button>`;if(x.status==='receipt_confirmed')return `<button class="btn" onclick="advance('${esc(x.request_no)}','archive',this)">确认归档</button>`;if(x.status==='awaiting_payment'&&Number(x.total_amount)===0)return '<span class="zero">0 元订单待人工核查</span>';return '<span class="muted">当前无平台操作</span>'}
async function advance(requestNo,action,button){const wording=action==='confirm_payment'?'已核对银行/支付凭证，确认客户款项真实到账':'已核对工人收款记录，确认结算归档';if(!confirm(`${wording}？\n\n订单：${requestNo}`))return;button.disabled=true;button.textContent='正在保存…';try{await rpc('advance_order_settlement_with_token',{p_request_no:requestNo,p_role:'platform',p_token:platformToken,p_action:action});await load()}catch(e){alert(`操作失败：${e.message}`);button.disabled=false}}
async function load(){try{platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_settlement_ledger_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['客户已收款',money(s.customer_collected,'USD')],['客户待付款',money(s.customer_outstanding,'USD')],['工人待结算',money(s.worker_pending,'USD')],['平台已实现',money(s.platform_realized,'USD')],['工人已结算',money(s.worker_settled,'USD')],['累计退款',money(s.refunded,'USD')],['台账订单',s.ledger_count],['待开票/票据',d.settlements.filter(x=>!x.invoice_status).length]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const rows=d.settlements||[];$('entries').innerHTML=rows.length?rows.map(x=>`<div class="entry"><div><div class="order">${esc(x.request_no)}</div><div class="muted">${esc(x.service_type)}</div></div><div><div class="money">客户 ${money(x.total_amount,x.currency)}</div><div class="split">工人 ${money(x.worker_amount,x.currency)} · 平台 ${money(x.platform_fee,x.currency)} · 退款 ${money(x.refunded_amount,x.currency)}</div></div><div><span class="tag ${esc(x.status)}">${esc(statusText[x.status]||x.status)}</span><div class="split">发票：${esc(x.invoice_status||'未申请')}</div></div><div>${actionButton(x)}</div></div>`).join(''):'<div class="muted">暂无结算记录。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`结算数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
