<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>客户最终验收 | EchoCity</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --success: #15803d;
      --success-soft: #ecfdf3;

      --danger: #b91c1c;
      --danger-soft: #fef2f2;

      --info: #1e40af;
      --info-soft: #eff6ff;

      --text: #172033;
      --muted: #667085;

      --border: #d8dee9;
      --background: #f3f6fb;
      --card: #ffffff;

      --shadow:
        0 14px 36px rgba(
          31,
          41,
          55,
          0.08
        );
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #edf5ff,
          var(--background)
        );
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width:
        min(
          960px,
          calc(100% - 24px)
        );

      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 800;
    }

    .logo {
      display: grid;
      place-items: center;

      width: 38px;
      height: 38px;

      border-radius: 12px;

      background: var(--primary);
      color: #ffffff;

      font-weight: 900;
    }

    .language-button {
      padding: 8px 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: #ffffff;
      color: var(--text);

      font-weight: 700;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size:
        clamp(
          30px,
          6vw,
          44px
        );

      line-height: 1.2;
    }

    .hero p {
      margin-top: 10px;

      color: var(--muted);

      line-height: 1.7;
    }

    .card {
      margin-top: 16px;
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 21px;
      line-height: 1.4;
    }

    .card-description {
      margin-top: 7px;

      color: var(--muted);

      line-height: 1.6;
    }

    .search-row {
      display: grid;
      grid-template-columns:
        1fr auto;
      gap: 10px;

      margin-top: 16px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      outline: none;
    }

    .input,
    .select {
      min-height: 46px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 100px;
      padding: 12px;

      resize: vertical;
      line-height: 1.65;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(
          37,
          99,
          235,
          0.12
        );
    }

    .primary-button,
    .secondary-button {
      min-height: 46px;
      padding: 0 18px;

      border-radius: 11px;

      font-weight: 800;
    }

    .primary-button {
      border: 0;

      background: var(--primary);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      border: 1px solid var(--border);

      background: #ffffff;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 14px;
      padding: 12px 14px;

      border-radius: 11px;

      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: var(--info-soft);
      color: var(--info);
    }

    .message.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
      gap: 12px;

      margin-top: 16px;
    }

    .summary-item {
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #f8fafc;
    }

    .summary-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 6px;

      font-size: 19px;
      font-weight: 900;
    }

    .records {
      display: grid;
      gap: 12px;

      margin-top: 16px;
    }

    .record {
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: #ffffff;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 10px;

      font-weight: 800;
    }

    .record-hours {
      color: var(--primary);
    }

    .record-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 9px;
    }

    .detail {
      padding: 10px;

      border-radius: 10px;

      background: #f8fafc;
    }

    .detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;
    }

    .detail-value {
      margin-top: 5px;

      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 13px;

      margin-top: 16px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 13px;
      font-weight: 800;
    }

    .rating-row {
      display: grid;
      grid-template-columns:
        repeat(
          5,
          minmax(0, 1fr)
        );
      gap: 8px;
    }

    .rating-option input {
      display: none;
    }

    .rating-option span {
      display: grid;
      place-items: center;

      min-height: 44px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: #ffffff;

      font-weight: 800;
    }

    .rating-option
    input:checked + span {
      border-color: var(--success);

      background: var(--success-soft);
      color: var(--success);
    }

    .checks {
      display: grid;
      gap: 10px;

      margin-top: 16px;
    }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .check input {
      width: 18px;
      height: 18px;

      margin-top: 2px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 18px;
    }

    @media (
      max-width: 700px
    ) {
      .search-row,
      .summary-grid,
      .record-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .detail.full,
      .form-group.full {
        grid-column: 1;
      }

      .actions {
        flex-direction:
          column-reverse;
      }

      .actions button,
      .search-row button {
        width: 100%;
      }
    }
  </style>
</head>

        <div class="form-group full">

          id="submitButton"

          提交最终验收

      </div>

    </section>

      );

      document.getElementById(
        "customerPhoneInput"
      ).placeholder =
        translate(
          "phonePlaceholder"
        );

      document.getElementById(
        "finalComments"
      ).placeholder =
        translate(
          "commentsPlaceholder"
        );

      document.getElementById(
        "outstandingDetails"
      ).placeholder =
        translate(
          "issuesPlaceholder"
        );

      document.getElementById(
        "languageButton"
      ).textContent =
        currentLanguage === "zh"
          ? "EN"
          : "中文";

      const resultOptions =
        document.getElementById(
          "finalResult"
        ).options;

      resultOptions[0].text =
        translate("select");

      resultOptions[1].text =
        translate("accepted");

      resultOptions[2].text =
        translate("conditional");

      resultOptions[3].text =
        translate("rework");

      resultOptions[4].text =
        translate("disputed");

      const completedOptions =
        document.getElementById(
          "serviceCompleted"
        ).options;

      completedOptions[0].text =
        translate("select");

      completedOptions[1].text =
        translate("yes");

      completedOptions[2].text =
        translate("no");

      if (currentRequest) {
        renderAllResults();
      }
    }

    function normalizePhone(value) {
      return String(
        value || ""
      )
        .trim()
        .replace(
          /[^\d+]/g,
          ""
        );
    }

    function showMessage(
      text,
      type = "info"
    ) {
      const messageBox =
        document.getElementById(
          "message"
        );

      messageBox.textContent =
        text;

      messageBox.className =
        `message show ${type}`;
    }

    function escapeHTML(value) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    function createDetail(
      label,
      value,
      fullWidth = false
    ) {
      const displayValue =
        value === null ||
        value === undefined ||
        value === ""
          ? translate(
              "notProvided"
            )
          : value;

      return `
        <div class="detail ${
          fullWidth
            ? "full"
            : ""
        }">
          <div class="detail-label">
            ${escapeHTML(label)}
          </div>

          <div class="detail-value">
            ${escapeHTML(
              displayValue
            )}
          </div>
        </div>
      `;
    }

    async function loadCurrentOrder(
      customerPhone
    ) {
      const client =
        window.echoCitySupabase;

      if (
        !client ||
        typeof client.from !==
          "function"
      ) {
        throw new Error(
          "Supabase client unavailable."
        );
      }

      const {
        data: requestData,
        error: requestError
      } = await client
        .from(
          "service_requests"
        )
        .select("*")
        .eq(
          "customer_phone",
          customerPhone
        )
        .in(
          "status",
          [
            "completed",
            "conditionally_completed",
            "final_rework",
            "disputed"
          ]
        )
        .order(
          "updated_at",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();

      if (requestError) {
        throw requestError;
      }

      currentRequest =
        requestData || null;

      workRecords = [];

      if (
        currentRequest?.request_no
      ) {
        const {
          data: recordData,
          error: recordError
        } = await client
          .from(
            "work_records"
          )
          .select("*")
          .eq(
            "request_no",
            currentRequest.request_no
          )
          .order(
            "work_date",
            {
              ascending: true
            }
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

        if (recordError) {
          throw recordError;
        }

        workRecords =
          Array.isArray(
            recordData
          )
            ? recordData
            : [];
      }
    }

    function renderWorkRecords() {
      const list =
        document.getElementById(
          "workRecordList"
        );

      if (
        workRecords.length === 0
      ) {
        list.innerHTML = `
          <div class="record">
            ${escapeHTML(
              translate(
                "noRecords"
              )
            )}
          </div>
        `;

        return;
      }

      list.innerHTML =
        workRecords
          .map(
            (record) => {
              const workTime =
                `${
                  record.start_time ||
                  "—"
                } - ${
                  record.end_time ||
                  "—"
                }`;

              return `
                <article class="record">

                  <div class="record-header">

                    <span>
                      ${escapeHTML(
                        record.work_date ||
                        translate(
                          "notProvided"
                        )
                      )}
                    </span>

                    <span class="record-hours">
                      ${escapeHTML(
                        record.work_hours ||
                        0
                      )}
                      ${escapeHTML(
                        translate(
                          "hours"
                        )
                      )}
                    </span>

                  </div>

                  <div class="record-grid">

                    ${createDetail(
                      translate(
                        "workTime"
                      ),
                      workTime
                    )}

                    ${createDetail(
                      translate(
                        "materials"
                      ),
                      record.materials_used
                    )}

                    ${createDetail(
                      translate(
                        "workProgress"
                      ),
                      record.work_progress,
                      true
                    )}

                    ${createDetail(
                      translate(
                        "issues"
                      ),
                      record.issues_found,
                      true
                    )}

                    ${createDetail(
                      translate(
                        "photos"
                      ),
                      record.photo_record,
                      true
                    )}

                    ${createDetail(
                      translate(
                        "videos"
                      ),
                      record.video_record,
                      true
                    )}

                    ${createDetail(
                      translate(
                        "customerComment"
                      ),
                      record.customer_site_comment,
                      true
                    )}

                  </div>

                </article>
              `;
            }
          )
          .join("");
    }

    function renderFinalInformation() {
      const finalInformation =
        document.getElementById(
          "finalInfo"
        );

      finalInformation.innerHTML = `
        <div class="record">

          <div class="record-grid">

            ${createDetail(
              translate(
                "completionSummary"
              ),
              currentRequest
                ?.completion_summary,
              true
            )}

            ${createDetail(
              translate(
                "completionEvidence"
              ),
              currentRequest
                ?.completion_evidence,
              true
            )}

            ${createDetail(
              translate(
                "outstandingIssues"
              ),
              currentRequest
                ?.outstanding_issues,
              true
            )}

            ${createDetail(
              translate(
                "acceptanceItems"
              ),
              currentRequest
                ?.customer_acceptance_items,
              true
            )}

          </div>

        </div>
      `;
    }

    function renderAllResults() {
      document.getElementById(
        "resultCard"
      ).classList.remove(
        "hidden"
      );

      document.getElementById(
        "requestValue"
      ).textContent =
        currentRequest
          ?.request_no ||
        translate(
          "notProvided"
        );

      document.getElementById(
        "recordCountValue"
      ).textContent =
        String(
          workRecords.length
        );

      const totalHours =
        workRecords.reduce(
          (
            total,
            record
          ) => {
            const hours =
              Number(
                record.work_hours ||
                0
              );

            return Number.isNaN(
              hours
            )
              ? total
              : total + hours;
          },
          0
        );

      document.getElementById(
        "totalHoursValue"
      ).textContent =
        `${totalHours} ${translate(
          "hours"
        )}`;

      renderWorkRecords();
      renderFinalInformation();
    }

    async function searchFinalAcceptance() {
      const phone =
        normalizePhone(
          document.getElementById(
            "customerPhoneInput"
          ).value
        );

      if (!phone) {
        showMessage(
          translate(
            "phonePlaceholder"
          ),
          "error"
        );

        return;
      }

      showMessage(
        translate(
          "loading"
        ),
        "info"
      );

      document.getElementById(
        "searchButton"
      ).disabled = true;

      try {
        await loadCurrentOrder(
          phone
        );

        if (!currentRequest) {
          document.getElementById(
            "resultCard"
          ).classList.add(
            "hidden"
          );

          showMessage(
            translate(
              "notFound"
            ),
            "error"
          );

          return;
        }

        renderAllResults();

        showMessage(
          translate(
            "orderLoaded"
          ),
          "success"
        );
      } catch (error) {
        console.error(
          "Final acceptance load failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "loadFailed"
          ),
          "error"
        );
      } finally {
        document.getElementById(
          "searchButton"
        ).disabled = false;
      }
    }    function getSelectedRating() {
      const selected =
        document.querySelector(
          'input[name="rating"]:checked'
        );

      return selected
        ? Number(selected.value)
        : null;
    }

    function clearAcceptanceForm() {
      document.getElementById(
        "finalResult"
      ).value = "";

      document.getElementById(
        "serviceCompleted"
      ).value = "";

      document
        .querySelectorAll(
          'input[name="rating"]'
        )
        .forEach(
          (input) => {
            input.checked = false;
          }
        );

      document.getElementById(
        "finalComments"
      ).value = "";

      document.getElementById(
        "outstandingDetails"
      ).value = "";

      document.getElementById(
        "confirmRecords"
      ).checked = false;

      document.getElementById(
        "confirmSite"
      ).checked = false;

      document.getElementById(
        "confirmTruth"
      ).checked = false;

      showMessage(
        "",
        "info"
      );

      document.getElementById(
        "message"
      ).className =
        "message";
    }

    function validateAcceptance() {
      const finalResult =
        document.getElementById(
          "finalResult"
        ).value;

      const serviceCompleted =
        document.getElementById(
          "serviceCompleted"
        ).value;

      const finalRating =
        getSelectedRating();

      const finalComments =
        document.getElementById(
          "finalComments"
        ).value.trim();

      const confirmRecords =
        document.getElementById(
          "confirmRecords"
        ).checked;

      const confirmSite =
        document.getElementById(
          "confirmSite"
        ).checked;

      const confirmTruth =
        document.getElementById(
          "confirmTruth"
        ).checked;

      if (
        !finalResult ||
        !serviceCompleted ||
        !finalRating ||
        !finalComments ||
        !confirmRecords ||
        !confirmSite ||
        !confirmTruth
      ) {
        showMessage(
          translate(
            "required"
          ),
          "error"
        );

        return false;
      }

      if (
        finalResult ===
          "accepted" &&
        serviceCompleted !==
          "yes"
      ) {
        showMessage(
          translate(
            "acceptedConflict"
          ),
          "error"
        );

        return false;
      }

      return true;
    }

    function getFinalStatus(
      finalResult
    ) {
      const statusMap = {
        accepted:
          "completed",

        conditional:
          "conditionally_completed",

        rework:
          "final_rework",

        disputed:
          "disputed"
      };

      return (
        statusMap[
          finalResult
        ] ||
        "completed"
      );
    }

    async function submitFinalAcceptance() {
      if (!currentRequest) {
        showMessage(
          translate(
            "notFound"
          ),
          "error"
        );

        return;
      }

      if (
        !validateAcceptance()
      ) {
        return;
      }

      const client =
        window.echoCitySupabase;

      if (
        !client ||
        typeof client.from !==
          "function"
      ) {
        showMessage(
          "Supabase client unavailable.",
          "error"
        );

        return;
      }

      const finalResult =
        document.getElementById(
          "finalResult"
        ).value;

      const serviceCompleted =
        document.getElementById(
          "serviceCompleted"
        ).value;

      const finalRating =
        getSelectedRating();

      const finalComments =
        document.getElementById(
          "finalComments"
        ).value.trim();

      const outstandingDetails =
        document.getElementById(
          "outstandingDetails"
        ).value.trim();

      const submittedAt =
        new Date().toISOString();

      const finalStatus =
        getFinalStatus(
          finalResult
        );

      const acceptanceData = {
        request_no:
          currentRequest.request_no,

        customer_phone:
          normalizePhone(
            document.getElementById(
              "customerPhoneInput"
            ).value
          ),

        submitted_at:
          submittedAt,

        final_result:
          finalResult,

        service_completed:
          serviceCompleted ===
          "yes",

        final_rating:
          finalRating,

        final_comments:
          finalComments,

        outstanding_details:
          outstandingDetails ||
          null,

        reviewed_all_records:
          true,

        confirmed_final_site:
          true,

        truth_confirmed:
          true,

        work_record_count:
          workRecords.length,

        total_work_hours:
          workRecords.reduce(
            (
              total,
              record
            ) => {
              const hours =
                Number(
                  record.work_hours ||
                  0
                );

              return Number.isNaN(
                hours
              )
                ? total
                : total + hours;
            },
            0
          )
      };

      const submitButton =
        document.getElementById(
          "submitButton"
        );

      submitButton.disabled =
        true;

      submitButton.textContent =
        currentLanguage === "zh"
          ? "正在提交……"
          : "Submitting...";

      showMessage(
        currentLanguage === "zh"
          ? "正在提交最终验收……"
          : "Submitting final acceptance...",
        "info"
      );

      try {
        const { error } =
          await client
            .from(
              "service_requests"
            )
            .update({
              status:
                finalStatus,

              final_acceptance_status:
                finalResult,

              final_acceptance_data:
                acceptanceData,

              updated_at:
                submittedAt
            })
            .eq(
              "request_no",
              currentRequest
                .request_no
            );

        if (error) {
          throw error;
        }

        currentRequest.status =
          finalStatus;

        currentRequest
          .final_acceptance_status =
          finalResult;

        currentRequest
          .final_acceptance_data =
          acceptanceData;

        showMessage(
          translate(
            "saveSuccess"
          ),
          "success"
        );

        submitButton.textContent =
          translate(
            "submitButton"
          );
      } catch (error) {
        console.error(
          "Final acceptance save failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "saveFailed"
          ),
          "error"
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          translate(
            "submitButton"
          );
      }
    }

    function changeLanguage() {
      currentLanguage =
        currentLanguage ===
          "zh"
          ? "en"
          : "zh";

      localStorage.setItem(
        "echocity-language",
        currentLanguage
      );

      applyLanguage();
    }

    document
      .getElementById(
        "languageButton"
      )
      .addEventListener(
        "click",
        changeLanguage
      );

    document
      .getElementById(
        "searchButton"
      )
      .addEventListener(
        "click",
        searchFinalAcceptance
      );

    document
      .getElementById(
        "clearButton"
      )
      .addEventListener(
        "click",
        clearAcceptanceForm
      );

    document
      .getElementById(
        "submitButton"
      )
      .addEventListener(
        "click",
        submitFinalAcceptance
      );

    document
      .getElementById(
        "customerPhoneInput"
      )
      .addEventListener(
        "keydown",
        (event) => {
          if (
            event.key ===
            "Enter"
          ) {
            searchFinalAcceptance();
          }
        }
      );

    applyLanguage();
  </script>
</body>
</html>
