<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布视频 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:680px;margin:auto;padding:18px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 3px 12px #0f172a12}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #0f172a12}.card h1{margin:0 0 8px;font-size:24px}.muted{color:#64748b;line-height:1.55;margin-bottom:16px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.hint{font-size:12px;color:#94a3b8;margin-top:5px}.upload{border:2px dashed #94a3b8;border-radius:16px;padding:18px;text-align:center;background:#f8fafc}.preview{margin-top:12px;width:100%;max-height:440px;border-radius:14px;background:#000}.coverRow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}.cover{width:120px;aspect-ratio:9/16;border-radius:12px;background:#e2e8f0;object-fit:cover}.smallBtns{display:flex;gap:8px;flex-wrap:wrap}.smallBtns button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:#e2e8f0}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;min-height:46px;border:0;border-radius:12px;font-weight:900}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#172033}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:none}.status.show{display:block}.danger{background:#fff1f2;color:#be123c}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='video-feed-v3.html'">← 返回视频</button><strong>EchoCity Video</strong></div><section class="card"><h1>发布短视频</h1><div class="muted">支持 MP4 / MOV / WebM。可从当前视频画面生成封面，或上传 JPG/PNG/WebP。音乐只展示原声和已标记为授权/自有版权的音轨。</div><div class="field"><label>选择视频</label><div class="upload"><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm,video/*" capture="environment"><video id="preview" class="preview" controls playsinline hidden></video></div></div><div class="field"><label>视频封面</label><div class="coverRow"><img id="coverPreview" class="cover" alt="封面预览"><div><div class="smallBtns"><button id="captureCover" type="button">用当前画面</button><button id="chooseCover" type="button">上传封面</button></div><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="hint">如果不选择封面，视频仍可发布，但列表展示效果会较弱。</div></div></div></div><div class="field"><label>原声 / 音乐</label><select id="audioTrack"><option value="original">使用视频原声</option></select><div class="hint">这里只显示平台已授权或创作者自有版权音轨；不自动抓取第三方音乐。</div></div><div class="field"><label>标题</label><input id="title" maxlength="80" placeholder="例如：广州老旧小区外墙渗漏维修全过程"></div><div class="field"><label>视频说明</label><textarea id="description" maxlength="1000" placeholder="介绍现场情况、施工方法、服务经验等"></textarea></div><div class="field"><label>城市</label><input id="city" maxlength="50" placeholder="广州"></div><div class="field"><label>具体位置</label><input id="locationText" maxlength="120" placeholder="例如：广州市天河区某小区"><div class="hint">第一版只保存文字位置，不公开精确坐标。</div></div><div class="field"><label># 话题</label><input id="topics" maxlength="240" placeholder="#广州维修 #社区更新 #工程现场"></div><div class="field"><label>@ 用户</label><input id="mentions" maxlength="240" placeholder="@张三 @李四"></div><div class="field"><label>挂载服务类型（可选）</label><input id="serviceType" maxlength="80" placeholder="例如：外墙维修"></div><div class="field"><label>按钮名称（可选）</label><input id="serviceName" maxlength="40" placeholder="例如：外墙维修"></div><div class="actions"><button id="saveDraft" class="btn secondary">保存草稿</button><button id="submitReview" class="btn primary">提交审核</button></div><div id="status" class="status"></div></section></main><canvas id="coverCanvas" hidden></canvas><script>const db=window.echoCitySupabase,fileInput=document.getElementById('videoFile'),preview=document.getElementById('preview'),statusBox=document.getElementById('status'),coverFile=document.getElementById('coverFile'),coverPreview=document.getElementById('coverPreview'),audioTrack=document.getElementById('audioTrack');let generatedCoverBlob=null;function showStatus(t,e=false){statusBox.textContent=t;statusBox.className='status show'+(e?' danger':'')}fileInput.onchange=()=>{const f=fileInput.files?.[0];if(!f){preview.hidden=true;return}preview.src=URL.createObjectURL(f);preview.hidden=false};document.getElementById('chooseCover').onclick=()=>coverFile.click();coverFile.onchange=()=>{generatedCoverBlob=null;const f=coverFile.files?.[0];if(f)coverPreview.src=URL.createObjectURL(f)};document.getElementById('captureCover').onclick=()=>{if(!preview.src||preview.readyState<2)return showStatus('请先选择视频，并把视频停在想作为封面的画面。',true);const c=document.getElementById('coverCanvas'),w=preview.videoWidth||720,h=preview.videoHeight||1280;c.width=w;c.height=h;c.getContext('2d').drawImage(preview,0,0,w,h);c.toBlob(b=>{if(!b)return;generatedCoverBlob=b;coverFile.value='';coverPreview.src=URL.createObjectURL(b);showStatus('已生成封面，可继续发布。')},'image/jpeg',.88)};async function ensureUser(){const {data,error}=await db.auth.getUser();if(error||!data?.user){showStatus('当前还没有登录。发布视频必须使用登录账号。',true);return null}return data.user}async function ensureProfile(user){const {data,error}=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();if(error)throw error;if(data)return;const {error:e}=await db.from('profiles').insert({id:user.id,display_name:user.email?.split('@')[0]||'EchoCity 用户',primary_role:'resident',status:'active',is_public:true});if(e)throw e}function ext(name,type){const x=(name.split('.').pop()||'mp4').toLowerCase();if(['mp4','mov','webm'].includes(x))return x;if(type==='video/quicktime')return'mov';if(type==='video/webm')return'webm';return'mp4'}function parseTags(v,prefix){return [...new Set(v.split(/[，,\s]+/).map(x=>x.trim().replace(prefix,'')).filter(Boolean))].slice(0,10)}async function loadAudio(){const {data}=await db.from('audio_tracks').select('id,title,artist_name,source_type').eq('status','active').in('rights_status',['licensed','owned']).order('created_at',{ascending:false}).limit(50);(data||[]).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=(x.title||'音轨')+(x.artist_name?' · '+x.artist_name:'');audioTrack.appendChild(o)})}async function uploadCover(user){const f=generatedCoverBlob||coverFile.files?.[0];if(!f)return null;if(f.size>10*1024*1024)throw new Error('封面超过10MB');const type=f.type||'image/jpeg',suffix=type.includes('png')?'png':type.includes('webp')?'webp':'jpg',path=`${user.id}/${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}.${suffix}`;const {data,error}=await db.storage.from('echocity-video-covers').upload(path,f,{contentType:type,cacheControl:'3600',upsert:false});if(error)throw error;return db.storage.from('echocity-video-covers').getPublicUrl(data.path).data.publicUrl}async function publish(targetStatus){const user=await ensureUser();if(!user)return;const file=fileInput.files?.[0];if(!file)return showStatus('请选择视频文件。',true);if(file.size>200*1024*1024)return showStatus('视频超过 200MB，请先压缩。',true);const title=document.getElementById('title').value.trim();if(!title)return showStatus('请填写视频标题。',true);try{showStatus('正在上传视频和封面……');await ensureProfile(user);const coverUrl=await uploadCover(user);const path=`${user.id}/${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}.${ext(file.name,file.type)}`;const {data:up,error:ue}=await db.storage.from('echocity-videos').upload(path,file,{contentType:file.type||'video/mp4',cacheControl:'3600',upsert:false});if(ue)throw ue;const videoUrl=db.storage.from('echocity-videos').getPublicUrl(up.path).data.publicUrl;const payload={author_id:user.id,title,description:document.getElementById('description').value.trim()||null,video_url:videoUrl,cover_url:coverUrl,city:document.getElementById('city').value.trim()||null,location_text:document.getElementById('locationText').value.trim()||null,status:targetStatus,visibility:'public'};const {data:video,error:ve}=await db.from('videos').insert(payload).select('id').single();if(ve)throw ve;const topicList=parseTags(document.getElementById('topics').value,/^#/),mentionList=parseTags(document.getElementById('mentions').value,/^@/);const {error:me}=await db.rpc('set_video_topics_and_mentions',{p_video_id:video.id,p_topics:topicList,p_mentions:mentionList,p_location_text:payload.location_text});if(me)console.warn('metadata',me);const chosen=audioTrack.value;const {error:ae}=await db.from('video_audio_links').insert({video_id:video.id,audio_track_id:chosen==='original'?null:chosen,use_original_audio:chosen==='original'});if(ae)console.warn('audio',ae);const serviceType=document.getElementById('serviceType').value.trim();if(serviceType){const serviceName=document.getElementById('serviceName').value.trim()||serviceType;const {error:le}=await db.from('video_service_links').insert({video_id:video.id,service_type:serviceType,service_name:serviceName,action_type:'create_service_request',created_by:user.id});if(le)console.warn(le)}showStatus(targetStatus==='reviewing'?'提交成功：视频已进入审核队列。':'草稿保存成功。');setTimeout(()=>location.href='video-feed-v3.html',900)}catch(err){console.error(err);showStatus('提交失败：'+(err?.message||'未知错误'),true)}}document.getElementById('saveDraft').onclick=()=>publish('draft');document.getElementById('submitReview').onclick=()=>publish('reviewing');ensureUser();loadAudio();</script></body></html>
