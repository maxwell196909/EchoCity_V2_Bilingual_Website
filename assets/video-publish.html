<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>发布视频 | EchoCity</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:680px;margin:auto;padding:18px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 3px 12px #0f172a12}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #0f172a12}.card h1{margin:0 0 8px;font-size:24px}.muted{color:#64748b;line-height:1.55;margin-bottom:16px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.upload{border:2px dashed #94a3b8;border-radius:16px;padding:18px;text-align:center;background:#f8fafc}.upload input{max-width:100%}.preview{margin-top:12px;width:100%;max-height:440px;border-radius:14px;background:#000}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;min-height:46px;border:0;border-radius:12px;font-weight:900}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#172033}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:none}.status.show{display:block}.danger{background:#fff1f2;color:#be123c}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><button class="back" type="button" onclick="location.href='video-feed.html'">← 返回视频</button><strong>EchoCity Video</strong></div>
    <section class="card">
      <h1>发布短视频</h1>
      <div class="muted">第一版支持 MP4 / MOV / WebM。视频先进入审核状态，通过后才进入“推荐/同城/关注”信息流。</div>
      <div class="field"><label>选择视频</label><div class="upload"><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm,video/*" capture="environment"><video id="preview" class="preview" controls playsinline hidden></video></div></div>
      <div class="field"><label for="title">标题</label><input id="title" maxlength="80" placeholder="例如：广州老旧小区外墙渗漏维修全过程"></div>
      <div class="field"><label for="description">视频说明</label><textarea id="description" maxlength="1000" placeholder="介绍现场情况、施工方法、服务经验等"></textarea></div>
      <div class="field"><label for="city">城市</label><input id="city" maxlength="50" placeholder="广州"></div>
      <div class="field"><label for="serviceType">挂载服务类型（可选）</label><input id="serviceType" maxlength="80" placeholder="例如：外墙维修"></div>
      <div class="field"><label for="serviceName">按钮名称（可选）</label><input id="serviceName" maxlength="40" placeholder="例如：外墙维修"></div>
      <div class="actions"><button id="saveDraft" class="btn secondary" type="button">保存草稿</button><button id="submitReview" class="btn primary" type="button">提交审核</button></div>
      <div id="status" class="status"></div>
    </section>
  </main>
<script>
const db=window.echoCitySupabase;
const fileInput=document.getElementById('videoFile');const preview=document.getElementById('preview');const statusBox=document.getElementById('status');let currentUser=null;
function showStatus(text,error=false){statusBox.textContent=text;statusBox.className='status show'+(error?' danger':'')}
fileInput.addEventListener('change',()=>{const f=fileInput.files?.[0];if(!f){preview.hidden=true;return}preview.src=URL.createObjectURL(f);preview.hidden=false});
async function ensureUser(){const {data,error}=await db.auth.getUser();if(error||!data?.user){showStatus('当前还没有登录。短视频发布必须使用登录账号，以便确认作者身份。',true);return null}currentUser=data.user;return currentUser}
async function ensureProfile(user){const {data,error}=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();if(error){throw error}if(data)return data;const {error:insertError}=await db.from('profiles').insert({id:user.id,display_name:user.email?.split('@')[0]||'EchoCity 用户',primary_role:'resident',status:'active',is_public:true});if(insertError)throw insertError;return {id:user.id}}
function safeExt(name,type){const raw=(name.split('.').pop()||'mp4').toLowerCase();if(['mp4','mov','webm'].includes(raw))return raw;if(type==='video/quicktime')return 'mov';if(type==='video/webm')return 'webm';return 'mp4'}
async function publish(targetStatus){
 const user=await ensureUser();if(!user)return;
 const file=fileInput.files?.[0];if(!file){showStatus('请选择一个视频文件。',true);return}
 if(file.size>200*1024*1024){showStatus('视频超过 200MB，请先压缩后再上传。',true);return}
 const title=document.getElementById('title').value.trim();if(!title){showStatus('请填写视频标题。',true);return}
 try{
  showStatus('正在上传视频……');await ensureProfile(user);
  const ext=safeExt(file.name,file.type);const path=`${user.id}/${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}.${ext}`;
  const {data:upload,error:uploadError}=await db.storage.from('echocity-videos').upload(path,file,{contentType:file.type||'video/mp4',cacheControl:'3600',upsert:false});if(uploadError)throw uploadError;
  const {data:publicData}=db.storage.from('echocity-videos').getPublicUrl(upload.path);
  showStatus('视频上传完成，正在保存内容信息……');
  const payload={author_id:user.id,title,description:document.getElementById('description').value.trim()||null,video_url:publicData.publicUrl,city:document.getElementById('city').value.trim()||null,status:targetStatus,visibility:'public'};
  const {data:video,error:videoError}=await db.from('videos').insert(payload).select('id').single();if(videoError)throw videoError;
  const serviceType=document.getElementById('serviceType').value.trim();if(serviceType){const serviceName=document.getElementById('serviceName').value.trim()||serviceType;const {error:linkError}=await db.from('video_service_links').insert({video_id:video.id,service_type:serviceType,service_name:serviceName,action_type:'create_service_request',created_by:user.id});if(linkError)console.warn(linkError)}
  showStatus(targetStatus==='reviewing'?'提交成功：视频已进入审核队列。':'草稿保存成功。');setTimeout(()=>location.href='video-feed.html',900);
 }catch(err){console.error(err);showStatus('提交失败：'+(err?.message||'未知错误'),true)}
}
document.getElementById('saveDraft').addEventListener('click',()=>publish('draft'));
document.getElementById('submitReview').addEventListener('click',()=>publish('reviewing'));
ensureUser();
</script>
</body>
</html>
