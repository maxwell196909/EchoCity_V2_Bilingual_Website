<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发现 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.search{display:flex;gap:8px;position:sticky;top:0;background:#f5f6f8;padding:6px 0 12px;z-index:5}.search input{flex:1;border:0;border-radius:14px;padding:13px 14px;background:#fff;box-shadow:0 4px 18px #0f172a0d;font:inherit}.search button{border:0;border-radius:12px;padding:0 16px;background:#111827;color:#fff;font-weight:900}.hero{display:flex;gap:10px}.hero button{flex:1;border:0;border-radius:15px;padding:15px;background:#111827;color:#fff;font-weight:900;text-align:left}.hero small{display:block;color:#cbd5e1;margin-top:5px}.section{margin:12px 0 18px}.section h2{font-size:18px;margin:0 0 10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #0f172a0b}.thumb{aspect-ratio:4/5;background:#111}.thumb video,.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:10px}.title{font-weight:800;line-height:1.4}.meta{font-size:12px;color:#64748b;margin-top:6px}.people{display:grid;gap:8px}.person{display:flex;align-items:center;gap:10px;background:#fff;padding:10px;border-radius:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person .info{flex:1}.empty{padding:36px;text-align:center;color:#64748b}</style></head><body><main class="wrap"><div class="search"><input id="q" placeholder="搜索视频、创作者、话题、城市、服务"><button id="go">搜索</button></div><div class="hero"><button onclick="location.href='hot.html'">🔥 EchoCity 热榜<small>近 7 天观看、互动和服务转化</small></button><button onclick="location.href='audio-library.html'">♫ 音乐与原声<small>授权曲库与创作者原声</small></button></div><section class="section"><h2>热门话题</h2><div id="chips" class="chips"><span class="empty">正在读取话题……</span></div></section><section id="topicSection" class="section" hidden><h2>相关话题</h2><div id="topicResults" class="chips"></div></section><section class="section"><h2>创作者</h2><div id="people" class="people"><div class="empty">输入关键词开始搜索</div></div></section><section class="section"><h2>视频</h2><div id="videos" class="grid"><div class="empty" style="grid-column:1/-1">输入关键词开始搜索</div></div></section></main><script>const db=window.echoCitySupabase,q=document.getElementById('q'),people=document.getElementById('people'),videos=document.getElementById('videos'),chips=document.getElementById('chips'),topicResults=document.getElementById('topicResults'),topicSection=document.getElementById('topicSection');function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadTopics(){const {data:links}=await db.from('video_topics').select('topic_id').limit(500);const counts=new Map();(links||[]).forEach(x=>counts.set(x.topic_id,(counts.get(x.topic_id)||0)+1));const ids=[...counts.keys()];let rows=[];if(ids.length){const {data}=await db.from('topics').select('id,name,slug').in('id',ids).eq('status','active');rows=data||[]}rows.sort((a,b)=>(counts.get(b.id)||0)-(counts.get(a.id)||0));if(!rows.length){const {data}=await db.from('topics').select('id,name,slug').eq('status','active').order('created_at',{ascending:false}).limit(10);rows=data||[]}chips.innerHTML=rows.length?rows.slice(0,12).map(t=>`<button class="chip" onclick="location.href='topic.html?id=${t.id}'">#${esc(t.name)}</button>`).join(''):'<span class="empty">还没有话题</span>'}async function filterPeople(rows){const ids=rows.map(x=>x.id);if(!ids.length)return rows;const {data}=await db.from('profile_privacy_settings').select('user_id,discoverable_by_search').in('user_id',ids);const hidden=new Set((data||[]).filter(x=>x.discoverable_by_search===false).map(x=>x.user_id));return rows.filter(x=>!hidden.has(x.id))}async function search(){const term=q.value.trim().replace(/^#/,'');if(!term)return;people.innerHTML='<div class="empty">搜索中……</div>';videos.innerHTML='<div class="empty" style="grid-column:1/-1">搜索中……</div>';const pattern='%'+term+'%';const [pRes,v1,v2,tRes]=await Promise.all([db.from('profiles').select('id,display_name,avatar_url,city,bio').or(`display_name.ilike.${pattern},city.ilike.${pattern},bio.ilike.${pattern}`).limit(30),db.from('videos').select('id,author_id,title,description,video_url,cover_url,city').eq('status','published').eq('visibility','public').or(`title.ilike.${pattern},description.ilike.${pattern},city.ilike.${pattern}`).limit(30),db.from('video_service_links').select('video_id,service_type,service_name').or(`service_type.ilike.${pattern},service_name.ilike.${pattern}`).limit(30),db.from('topics').select('id,name,slug').eq('status','active').ilike('name',pattern).limit(20)]);const visiblePeople=await filterPeople(pRes.data||[]);const linkedIds=[...new Set((v2.data||[]).map(x=>x.video_id))];let linked=[];if(linkedIds.length){const r=await db.from('videos').select('id,author_id,title,description,video_url,cover_url,city').in('id',linkedIds).eq('status','published').eq('visibility','public');linked=r.data||[]}let topicVideos=[];const tids=(tRes.data||[]).map(x=>x.id);if(tids.length){const {data:vt}=await db.from('video_topics').select('video_id').in('topic_id',tids);const vids=[...new Set((vt||[]).map(x=>x.video_id))];if(vids.length){const r=await db.from('videos').select('id,author_id,title,description,video_url,cover_url,city').in('id',vids).eq('status','published').eq('visibility','public');topicVideos=r.data||[]}}const all=[...(v1.data||[]),...linked,...topicVideos].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);topicSection.hidden=!(tRes.data||[]).length;topicResults.innerHTML=(tRes.data||[]).map(t=>`<button class="chip" onclick="location.href='topic.html?id=${t.id}'">#${esc(t.name)}</button>`).join('');people.innerHTML=visiblePeople.length?visiblePeople.map(p=>`<div class="person" onclick="location.href='creator-profile.html?id=${p.id}'"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p.display_name||'E').slice(0,1))}</div><div class="info"><b>${esc(p.display_name||'EchoCity 用户')}</b><div class="meta">${esc(p.city||'')} ${esc(p.bio||'')}</div></div><span>›</span></div>`).join(''):'<div class="empty">没有找到相关创作者</div>';videos.innerHTML=all.length?all.map(v=>`<div class="card" onclick="location.href='video-feed-v3.html?video=${v.id}'"><div class="thumb">${v.cover_url?`<img src="${esc(v.cover_url)}">`:`<video muted playsinline preload="metadata" src="${esc(v.video_url)}"></video>`}</div><div class="body"><div class="title">${esc(v.title||'EchoCity 视频')}</div><div class="meta">${esc(v.city||'')}</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">没有找到相关视频</div>'}document.getElementById('go').onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});loadTopics();</script></body></html>
