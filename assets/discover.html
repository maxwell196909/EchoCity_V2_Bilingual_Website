<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发现 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.search{display:flex;gap:8px;position:sticky;top:0;background:#f5f6f8;padding:6px 0 12px;z-index:5}.search input{flex:1;border:0;border-radius:14px;padding:13px 14px;background:#fff;box-shadow:0 4px 18px #0f172a0d;font:inherit}.search button{border:0;border-radius:12px;padding:0 16px;background:#111827;color:#fff;font-weight:900}.section{margin:12px 0 18px}.section h2{font-size:18px;margin:0 0 10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #0f172a0b}.thumb{aspect-ratio:4/5;background:#111}.thumb video{width:100%;height:100%;object-fit:cover}.body{padding:10px}.title{font-weight:800;line-height:1.4}.meta{font-size:12px;color:#64748b;margin-top:6px}.people{display:grid;gap:8px}.person{display:flex;align-items:center;gap:10px;background:#fff;padding:10px;border-radius:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person .info{flex:1}.empty{padding:36px;text-align:center;color:#64748b}</style></head><body><main class="wrap"><div class="search"><input id="q" placeholder="搜索视频、创作者、城市、服务"><button id="go">搜索</button></div><section class="section"><h2>热门话题</h2><div id="chips" class="chips"><button class="chip">#广州维修</button><button class="chip">#社区更新</button><button class="chip">#工程现场</button><button class="chip">#城市服务</button><button class="chip">#家居维修</button></div></section><section class="section"><h2>创作者</h2><div id="people" class="people"><div class="empty">输入关键词开始搜索</div></div></section><section class="section"><h2>视频</h2><div id="videos" class="grid"><div class="empty" style="grid-column:1/-1">输入关键词开始搜索</div></div></section></main><script>const db=window.echoCitySupabase;const q=document.getElementById('q'),people=document.getElementById('people'),videos=document.getElementById('videos');function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function search(){const term=q.value.trim();if(!term)return;people.innerHTML='<div class="empty">搜索中……</div>';videos.innerHTML='<div class="empty" style="grid-column:1/-1">搜索中……</div>';const pattern='%'+term+'%';const [pRes,v1,v2]=await Promise.all([db.from('profiles').select('id,display_name,avatar_url,city,bio').or(`display_name.ilike.${pattern},city.ilike.${pattern},bio.ilike.${pattern}`).limit(20),db.from('videos').select('id,author_id,title,description,video_url,cover_url,city').eq('status','published').eq('visibility','public').or(`title.ilike.${pattern},description.ilike.${pattern},city.ilike.${pattern}`).limit(30),db.from('video_service_links').select('video_id,service_type,service_name').or(`service_type.ilike.${pattern},service_name.ilike.${pattern}`).limit(30)]);const linkedIds=[...new Set((v2.data||[]).map(x=>x.video_id))];let linked=[];if(linkedIds.length){const r=await db.from('videos').select('id,author_id,title,description,video_url,cover_url,city').in('id',linkedIds).eq('status','published').eq('visibility','public');linked=r.data||[]}const all=[...(v1.data||[]),...linked].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);people.innerHTML=(pRes.data||[]).length?(pRes.data||[]).map(p=>`<div class="person" onclick="location.href='creator-profile.html?id=${p.id}'"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p.display_name||'E').slice(0,1))}</div><div class="info"><b>${esc(p.display_name||'EchoCity 用户')}</b><div class="meta">${esc(p.city||'')} ${esc(p.bio||'')}</div></div><span>›</span></div>`).join(''):'<div class="empty">没有找到相关创作者</div>';videos.innerHTML=all.length?all.map(v=>`<div class="card" onclick="location.href='video-feed.html?video=${v.id}'"><div class="thumb"><video muted playsinline preload="metadata" src="${esc(v.video_url)}" ${v.cover_url?`poster="${esc(v.cover_url)}"`:''}></video></div><div class="body"><div class="title">${esc(v.title||'EchoCity 视频')}</div><div class="meta">${esc(v.city||'')}</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">没有找到相关视频</div>'}document.getElementById('go').onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.textContent.replace('#','');search()});</script></body></html>
