<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>关键节点监管 | EchoCity</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1f6feb;
      --primary-dark: #1557b0;
      --primary-soft: #edf5ff;

      --success: #18864b;
      --success-soft: #eaf8f0;

      --warning: #9a6700;
      --warning-soft: #fff6dc;

      --danger: #b42318;
      --danger-soft: #fff0ee;

      --purple: #6941c6;
      --purple-soft: #f1edff;

      --text: #172033;
      --text-light: #667085;

      --border: #d9e1ec;
      --background: #f4f7fb;
      --card: #ffffff;

      --shadow:
        0 16px 40px rgba(24, 39, 75, 0.08);
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #edf5ff 0%,
          #f7f9fc 42%,
          #f4f7fb 100%
        );

      color: var(--text);

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 22px 16px 58px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      font-size: 20px;
      font-weight: 800;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #65a4ff
        );

      color: #ffffff;
      font-weight: 900;

      box-shadow:
        0 8px 20px rgba(31, 111, 235, 0.22);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .top-button {
      min-height: 40px;
      padding: 0 13px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.9);
      color: var(--text);

      font-size: 13px;
      font-weight: 800;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;

      min-height: 30px;
      padding: 0 12px;

      border-radius: 999px;

      background: var(--primary-soft);
      color: var(--primary-dark);

      font-size: 13px;
      font-weight: 800;
    }

    .hero h1 {
      margin-top: 12px;

      font-size: clamp(29px, 6vw, 42px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .hero p {
      max-width: 820px;

      margin-top: 10px;

      color: var(--text-light);

      font-size: 15px;
      line-height: 1.75;
    }

    .card {
      margin-top: 16px;
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 21px;
      line-height: 1.4;
    }

    .card-description {
      margin-top: 7px;

      color: var(--text-light);

      font-size: 14px;
      line-height: 1.7;
    }

    .request-summary {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 12px;

      margin-top: 16px;
    }

    .summary-item {
      padding: 13px;

      border-radius: 13px;

      background: #f8fafc;
    }

    .summary-label {
      color: var(--text-light);

      font-size: 12px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 5px;

      color: var(--text);

      font-size: 14px;
      font-weight: 800;
      line-height: 1.6;
      word-break: break-word;
    }

    .control-summary {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 12px;

      margin-top: 16px;
    }

    .control-box {
      padding: 15px;

      border-radius: 14px;

      background: #f8fafc;
      text-align: center;
    }

    .control-number {
      color: var(--primary-dark);

      font-size: 27px;
      font-weight: 900;
    }

    .control-label {
      margin-top: 5px;

      color: var(--text-light);

      font-size: 12px;
      font-weight: 700;
    }

    .control-notice {
      margin-top: 16px;
      padding: 14px;

      border: 1px solid #f2d693;
      border-radius: 13px;

      background: var(--warning-soft);
      color: #6f4c00;

      font-size: 13px;
      line-height: 1.75;
    }

    .milestone-list {
      display: grid;
      gap: 16px;

      margin-top: 17px;
    }

    .milestone-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: #ffffff;
    }

    .milestone-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;

      padding: 17px;

      border-bottom: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          #fbfcfe 0%,
          #f7f9fc 100%
        );
    }

    .milestone-sequence {
      color: var(--primary-dark);

      font-size: 12px;
      font-weight: 800;
    }

    .milestone-title {
      margin-top: 5px;

      font-size: 20px;
      line-height: 1.4;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 31px;
      padding: 0 11px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-locked {
      background: #eef1f5;
      color: #596273;
    }

    .status-open {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .status-submitted {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .status-customer-review {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-paper-pending {
      background: #fff0e6;
      color: #a34b00;
    }

    .status-operation-review {
      background: #eef0ff;
      color: #4b4fa8;
    }

    .status-approved {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-rework {
      background: var(--danger-soft);
      color: var(--danger);
    }    .milestone-body {
      padding: 17px;
    }

    .milestone-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .milestone-detail {
      padding: 13px;

      border-radius: 12px;

      background: #f8fafc;
    }

    .milestone-detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--text-light);

      font-size: 12px;
      font-weight: 700;
    }

    .detail-value {
      margin-top: 6px;

      color: var(--text);

      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .control-progress {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;

      margin-top: 15px;
    }

    .progress-step {
      padding: 12px 10px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #ffffff;
      text-align: center;
    }

    .progress-step.done {
      border-color: #b9e4c8;

      background: var(--success-soft);
    }

    .progress-step.active {
      border-color: #b8d3fa;

      background: var(--primary-soft);
    }

    .progress-step.locked {
      opacity: 0.58;

      background: #f4f6f8;
    }

    .progress-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: #e8edf3;
      color: var(--text-light);

      font-size: 13px;
      font-weight: 900;
    }

    .progress-step.done
    .progress-icon {
      background: var(--success);
      color: #ffffff;
    }

    .progress-step.active
    .progress-icon {
      background: var(--primary);
      color: #ffffff;
    }

    .progress-title {
      margin-top: 7px;

      color: var(--text);

      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }

    .progress-time {
      margin-top: 4px;

      color: var(--text-light);

      font-size: 10px;
      line-height: 1.4;
    }

    .evidence-panel {
      margin-top: 15px;
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: #fbfcfe;
    }

    .evidence-title {
      font-size: 14px;
      font-weight: 800;
    }

    .evidence-list {
      display: grid;
      gap: 8px;

      margin-top: 10px;
    }

    .evidence-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;

      padding: 10px;

      border-radius: 10px;

      background: #ffffff;
    }

    .evidence-name {
      color: var(--text);

      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .evidence-status {
      color: var(--text-light);

      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .review-panel {
      margin-top: 15px;
      padding: 15px;

      border: 1px solid #dbe7f5;
      border-radius: 13px;

      background:
        linear-gradient(
          180deg,
          #f6faff 0%,
          #ffffff 100%
        );
    }

    .review-title {
      font-size: 15px;
      font-weight: 800;
    }

    .review-description {
      margin-top: 6px;

      color: var(--text-light);

      font-size: 12px;
      line-height: 1.65;
    }

    .review-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;

      margin-top: 13px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      color: var(--text);

      font-size: 12px;
      font-weight: 800;
    }

    .form-select,
    .form-textarea {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      outline: none;
    }

    .form-select {
      min-height: 44px;
      padding: 0 11px;
    }

    .form-textarea {
      min-height: 92px;
      padding: 11px;

      line-height: 1.6;
      resize: vertical;
    }

    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    .milestone-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;

      margin-top: 15px;
    }

    .action-button {
      min-height: 42px;
      padding: 0 15px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      font-size: 13px;
      font-weight: 800;
    }

    .action-button.primary {
      border-color: var(--primary);

      background: var(--primary);
      color: #ffffff;
    }

    .action-button.success {
      border-color: var(--success);

      background: var(--success);
      color: #ffffff;
    }

    .action-button.warning {
      border-color: #e4bd5e;

      background: var(--warning-soft);
      color: var(--warning);
    }

    .action-button.danger {
      border-color: #efb2ae;

      background: var(--danger-soft);
      color: var(--danger);
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-message {
      display: none;

      margin-top: 15px;
      padding: 13px 14px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.65;
    }

    .status-message.success {
      display: block;

      border: 1px solid #b9e4c8;

      background: var(--success-soft);
      color: var(--success);
    }

    .status-message.error {
      display: block;

      border: 1px solid #f0c0c0;

      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty-state {
      display: none;

      margin-top: 18px;
      padding: 30px 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: #ffffff;
      box-shadow: var(--shadow);

      text-align: center;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state h2 {
      font-size: 22px;
      line-height: 1.4;
    }

    .empty-state p {
      margin-top: 9px;

      color: var(--text-light);

      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .page {
        padding:
          15px
          13px
          44px;
      }

      .request-summary,
      .control-summary,
      .milestone-grid,
      .review-grid {
        grid-template-columns: 1fr;
      }

      .control-progress {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .milestone-header {
        flex-direction: column;
      }

      .milestone-actions {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">

      <a
        class="brand"
        href=" "
      >
        <span class="brand-mark">E</span>
        <span>EchoCity</span>
      </a >

      <div class="topbar-actions">

        <button
          class="top-button"
          type="button"
          onclick="goBack()"
          data-i18n="backButton"
        >
          返回订单
        </button>

        <button
          class="top-button"
          id="languageButton"
          type="button"
          onclick="toggleLanguage()"
        >
          EN
        </button>

      </div>

    </header>

    <section class="hero">

      <span
        class="hero-tag"
        data-i18n="heroTag"
      >
        关键节点监管
      </span>

      <h1 data-i18n="heroTitle">
        中间验收和下一阶段控制
      </h1>

      <p data-i18n="heroDescription">
        每个关键节点完成后，必须经过工人成果提交、客户评价、纸面签字和运营审核，才能开放下一阶段。
      </p >

    </section>

    <section
      class="card"
      id="requestCard"
    >

      <h2
        class="card-title"
        data-i18n="requestTitle"
      >
        当前服务订单
      </h2>

      <p
        class="card-description"
        data-i18n="requestDescription"
      >
        以下节点来自客户已经确认并签署的任务标准文件。
      </p >

      <div class="request-summary">

        <div class="summary-item">
          <div
            class="summary-label"
            data-i18n="requestIdLabel"
          >
            需求编号
          </div>

          <div
            class="summary-value"
            id="requestId"
          >
            --
          </div>
        </div>

        <div class="summary-item">
          <div
            class="summary-label"
            data-i18n="customerLabel"
          >
            客户
          </div>

          <div
            class="summary-value"
            id="customerName"
          >
            --
          </div>
        </div>

        <div class="summary-item">
          <div
            class="summary-label"
            data-i18n="serviceAddressLabel"
          >
            服务地址
          </div>

          <div
            class="summary-value"
            id="serviceAddress"
          >
            --
          </div>
        </div>

        <div class="summary-item">
          <div
            class="summary-label"
            data-i18n="requestStatusLabel"
          >
            订单状态
          </div>

          <div
            class="summary-value"
            id="requestStatus"
          >
            --
          </div>
        </div>

      </div>

      <div class="control-summary">

        <div class="control-box">
          <div
            class="control-number"
            id="totalMilestones"
          >
            0
          </div>

          <div
            class="control-label"
            data-i18n="totalMilestonesLabel"
          >
            全部节点
          </div>
        </div>

        <div class="control-box">
          <div
            class="control-number"
            id="openMilestones"
          >
            0
          </div>

          <div
            class="control-label"
            data-i18n="openMilestonesLabel"
          >
            当前开放
          </div>
        </div>

        <div class="control-box">
          <div
            class="control-number"
            id="pendingReviews"
          >
            0
          </div>

          <div
            class="control-label"
            data-i18n="pendingReviewsLabel"
          >
            等待审核
          </div>
        </div>

        <div class="control-box">
          <div
            class="control-number"
            id="approvedMilestones"
          >
            0
          </div>

          <div
            class="control-label"
            data-i18n="approvedMilestonesLabel"
          >
            已通过
          </div>
        </div>

      </div>

      <div
        class="control-notice"
        data-i18n="controlNotice"
      >
        下一阶段只有在前一节点客户评价完成、纸面中间验收单已上传并经运营审核后才能开放。
      </div>

    </section>

    <section
      class="card"
      id="milestonesCard"
    >

      <h2
        class="card-title"
        data-i18n="milestonesTitle"
      >
        关键节点清单
      </h2>

      <p
        class="card-description"
        data-i18n="milestonesDescription"
      >
        查看每一阶段的标准、证据和中间验收状态，并进行运营审核。
      </p >

      <div
        class="status-message"
        id="statusMessage"
      ></div>

      <div
        class="milestone-list"
        id="milestoneList"
      ></div>

    </section>

    <section
      class="empty-state"
      id="emptyState"
    >
      <h2 data-i18n="emptyTitle">
        没有找到关键节点
      </h2>

      <p data-i18n="emptyDescription">
        请先完成任务标准设置、客户确认和纸面签字流程。
      </p >
    </section>

  </main>

  <script>    const translations = {

        requestTitle: "当前服务订单",

        requestIdLabel: "需求编号",
        customerLabel: "客户",
        serviceAddressLabel: "服务地址",
        requestStatusLabel: "订单状态",

        totalMilestonesLabel: "全部节点",

        controlNotice:

        milestonesTitle: "关键节点清单",

        emptyTitle: "没有找到关键节点",
        emptyDescription:
          "请先完成任务标准设置、客户确认和纸面签字流程。",

        milestoneSequence: "第",
        milestoneUnit: "阶段",

        statusLocked: "下一阶段未开放",
        statusOpen: "当前阶段已开放",

        workScopeLabel: "本阶段工作范围",

        evidenceTitle: "阶段证据与文件",

        customerEvaluationLabel: "客户评价记录",
        paperDocumentLabel: "纸面中间验收单",
        operationRecordLabel: "运营审核记录",

        evidenceMissing: "尚未提交",
        evidenceSubmitted: "已经提交",
        evidenceUploaded: "已经上传",
        evidenceApproved: "审核通过",

    }    function createMilestoneFromTask(
      task,
      index
    ) {
      const isFirst =
        index === 0;

      return {
        id:
          "MILESTONE-" +
          Date.now() +
          "-" +

          Math.random()

        sequence:

          task.taskName,

          task.completionStandard,

        inspectionMethod:
          task.inspectionMethod,

        evidenceRequirement:

        plannedDate:

        isHiddenWork:

            task.isHiddenWork
          ),

        requiresPaperSignature:

          ),

        lockNextStage:

            task.lockNextStage
          ),

        status:
          isFirst
            ? "open"
            : "locked",

          isFirst
            ? new Date().toISOString()
            : null,

        workerSubmission: null,

    function initializeMilestones() {
      if (!currentRequest) {
        milestones = [];
        return;
      }

      if (
        Array.isArray(
          currentRequest.milestones
        ) &&
        currentRequest.milestones.length > 0
      ) {
        milestones =
          currentRequest.milestones;

        return;
      }

      const tasks =
        currentRequest
          .serviceStandards
          ?.tasks;

      if (!Array.isArray(tasks)) {
        milestones = [];
        return;
      }

      const milestoneTasks =
        tasks.filter(
          (task) =>
            task.isMilestone
        );

      milestones =
        milestoneTasks.map(
          (
            task,
            index
          ) =>
            createMilestoneFromTask(
              task,
              index
            )
        );

      currentRequest.milestones =
        milestones;

      saveCurrentRequest();
    }

    function saveCurrentRequest() {
      if (!currentRequest) {
        return;
      }

      currentRequest.milestones =
        milestones;

      currentRequest.updatedAt =
        new Date().toISOString();

      const requests =
        JSON.parse(
          localStorage.getItem(
            "echocity-service-requests"
          ) || "[]"
        );

      const requestIndex =
        requests.findIndex(
          (request) =>
            request.id ===
            currentRequest.id
        );

      if (requestIndex >= 0) {
        requests[requestIndex] =
          currentRequest;
      } else {
        requests.unshift(
          currentRequest
        );
      }

      localStorage.setItem(
        "echocity-service-requests",
        JSON.stringify(requests)
      );

      localStorage.setItem(
        "echocity-last-request",
        JSON.stringify(
          currentRequest
        )
      );

      localStorage.setItem(
        "echocity-last-milestones",
        JSON.stringify(
          milestones
        )
      );
    }

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) {
        return translate(
          "notProvided"
        );
      }

      const date =
        new Date(
          value + "T00:00:00"
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return value;
      }

      return date.toLocaleDateString(
        currentLanguage === "zh"
          ? "zh-CN"
          : "en-US",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );
    }

    function formatTimestamp(value) {
      if (!value) {
        return "--";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return value;
      }

      return date.toLocaleString(
        currentLanguage === "zh"
          ? "zh-CN"
          : "en-US"
      );
    }

    function yesOrNo(value) {
      return value
        ? translate("yesText")
        : translate("noText");

    function getProgressState(
      milestone,
      step
    ) {
      const order = {
        open: 0,
        worker_submitted: 1,
        customer_review: 2,
        paper_pending: 2,
        operation_review: 3,
        approved: 4,
        conditional_approved: 4,
        rework: 3,
        disputed: 3,
        paused: 3,
        locked: -1
      };

      const current =
        order[milestone.status] ??
        -1;

      if (
        milestone.status ===
        "locked"
      ) {
        return "locked";
      }

      if (current > step) {
        return "done";
      }

      if (current === step) {
        return "active";
      }

      return "locked";
    }

    function getProgressTime(
      milestone,
      step
    ) {
      const timeMap = {
        0: milestone.openedAt,

        1:
          milestone
            .workerSubmission
            ?.submittedAt,

        2:
          milestone
            .customerEvaluation
            ?.submittedAt,

        3:
          milestone
            .paperDocument
            ?.uploadedAt
      };

      return formatTimestamp(
        timeMap[step]
      );
    }

              getProgressTime(
                milestone,
                step
              )
            )}
          </div>

        </div>
      `;
    }

            onclick="
              openMilestone(
                '${milestone.id}'
              )
            "
            ${
              milestone.status !==
              "locked"
                ? "disabled"
                : ""
            }
          >
            ${escapeHTML(
              translate(
                "openCurrentButton"
              )
            )}
          </button>

          <button
            class="action-button"
            type="button"
            onclick="
              simulateWorkerSubmission(
                '${milestone.id}'
              )
            "
            ${
              milestone.status !==
              "open"
                ? "disabled"
                : ""
            }
          >
            ${escapeHTML(
              translate(
                "simulateWorkerButton"
              )
            )}
          </button>

          <button
            class="action-button warning"
            type="button"
            onclick="
              simulateCustomerEvaluation(
                '${milestone.id}'
              )
            "
            ${
              milestone.status !==
              "worker_submitted"
                ? "disabled"
                : ""
            }
          >
            ${escapeHTML(
              translate(
                "simulateCustomerButton"
              )
            )}
          </button>

          <button
            class="action-button"
            type="button"
            onclick="
              simulatePaperUpload(
                '${milestone.id}'
              )
            "
            ${
              milestone.status !==
                "customer_review" &&
              milestone.status !==
                "paper_pending"
                ? "disabled"
                : ""
            }
          >
            ${escapeHTML(
              translate(
                "simulatePaperButton"
              )
            )}
          </button>

          <button
            class="action-button success"
            type="button"
            onclick="
              saveOperationReview(
                '${milestone.id}'
              )
            "
            ${
              milestone.status !==
              "operation_review"
                ? "disabled"
                : ""
            }
          >
            ${escapeHTML(
              translate(
                "saveReviewButton"
              )
            )}
          </button>

        </div>
      `;
    }    function buildMilestoneCard(
      milestone
    ) {
      return `
        <article class="milestone-card">

          <div class="milestone-header">

            <div>

              <div class="milestone-sequence">
                ${escapeHTML(
                  translate(
                    "milestoneSequence"
                  )
                )}

                ${milestone.sequence}

                ${escapeHTML(
                  translate(
                    "milestoneUnit"
                  )
                )}
              </div>

              <h3 class="milestone-title">
                ${escapeHTML(
                  milestone
                    .milestoneName ||
                  milestone.taskName ||
                  translate(
                    "notProvided"
                  )
                )}
              </h3>

            </div>

            <span
              class="status-badge
              ${getMilestoneStatusClass(
                milestone.status
              )}"
            >
              ${escapeHTML(
                getMilestoneStatusName(
                  milestone.status
                )
              )}
            </span>

          </div>

          <div class="milestone-body">

            <div class="milestone-grid">

              ${buildDetail(
                "workScopeLabel",
                milestone.workScope,
                true
              )}

              ${buildDetail(
                "completionStandardLabel",
                milestone
                  .completionStandard,
                true
              )}

              ${buildDetail(
                "inspectionMethodLabel",
                milestone
                  .inspectionMethod,
                true
              )}

              ${buildDetail(
                "evidenceRequirementLabel",
                milestone
                  .evidenceRequirement,
                true
              )}

              ${buildDetail(
                "plannedDateLabel",
                formatDate(
                  milestone.plannedDate
                )
              )}

              ${buildDetail(
                "hiddenWorkLabel",
                yesOrNo(
                  milestone.isHiddenWork
                )
              )}

              ${buildDetail(
                "paperSignatureLabel",
                yesOrNo(
                  milestone
                    .requiresPaperSignature
                )
              )}

              ${buildDetail(
                "nextStageLockLabel",
                yesOrNo(
                  milestone.lockNextStage
                )
              )}

            </div>

            <div class="control-progress">

              ${buildProgressStep(
                milestone,
                0,
                "workerSubmissionStep"
              )}

              ${buildProgressStep(
                milestone,
                1,
                "customerEvaluationStep"
              )}

              ${buildProgressStep(
                milestone,
                2,
                "paperSignatureStep"
              )}

              ${buildProgressStep(
                milestone,
                3,
                "operationReviewStep"
              )}

            </div>

            ${buildEvidencePanel(
              milestone
            )}

            ${buildReviewPanel(
              milestone
            )}

            ${buildMilestoneActions(
              milestone
            )}

          </div>

        </article>
      `;
    }

    function renderMilestones() {
      const milestoneList =
        document.getElementById(
          "milestoneList"
        );

      if (
        !Array.isArray(milestones) ||
        milestones.length === 0
      ) {
        milestoneList.innerHTML =
          "";

        return;
      }

      milestoneList.innerHTML =
        milestones
          .map(
            buildMilestoneCard
          )
          .join("");

      updateControlSummary();
    }

    function showStatus(
      type,
      message
    ) {
      const statusMessage =
        document.getElementById(
          "statusMessage"
        );

      statusMessage.className =
        "status-message " + type;

      statusMessage.textContent =
        message;

      statusMessage.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    function findMilestone(
      milestoneId
    ) {
      return milestones.find(
        (milestone) =>
          milestone.id ===
          milestoneId
      );
    }

    function previousMilestoneApproved(
      milestone
    ) {
      if (
        milestone.sequence === 1
      ) {
        return true;
      }

      const previous =
        milestones.find(
          (item) =>
            item.sequence ===
            milestone.sequence - 1
        );

      return (
        previous &&
        (
          previous.status ===
            "approved" ||
          previous.status ===
            "conditional_approved"
        )
      );
    }

    function openMilestone(
      milestoneId
    ) {
      const milestone =
        findMilestone(
          milestoneId
        );

      if (!milestone) {
        return;
      }

      if (
        !previousMilestoneApproved(
          milestone
        )
      ) {
        showStatus(
          "error",
          translate(
            "previousStageRequired"
          )
        );

        return;
      }

      milestone.status =
        "open";

      milestone.openedAt =
        new Date().toISOString();

      milestone.updatedAt =
        new Date().toISOString();

      currentRequest.status =
        "in_progress";

      saveCurrentRequest();
      renderRequest();
      renderMilestones();

      showStatus(
        "success",
        translate("stageOpened")
      );
    }

    function simulateWorkerSubmission(
      milestoneId
    ) {
      const milestone =
        findMilestone(
          milestoneId
        );

      if (
        !milestone ||
        milestone.status !== "open"
      ) {
        return;
      }

      const now =
        new Date().toISOString();

      milestone.workerSubmission = {
        submittedAt: now,

        submittedBy:
          "worker",

        completionStatement:
          milestone
            .completionStandard,

        evidenceStatement:
          milestone
            .evidenceRequirement,

        status:
          "submitted"
      };

      milestone.status =
        "worker_submitted";

      milestone.updatedAt =
        now;

      currentRequest.status =
        "milestone_review";

      saveCurrentRequest();
      renderRequest();
      renderMilestones();

      showStatus(
        "success",
        translate(
          "workerSubmitted"
        )
      );
    }

    function simulateCustomerEvaluation(
      milestoneId
    ) {
      const milestone =
        findMilestone(
          milestoneId
        );

      if (
        !milestone ||
        milestone.status !==
          "worker_submitted"
      ) {
        return;
      }

      const now =
        new Date().toISOString();

      milestone.customerEvaluation = {
        submittedAt: now,

        completionResult:
          "completed",

        qualityResult:
          "satisfied",

        standardsResult:
          "compliant",

        damageFound:
          false,

        remainingIssues:
          "",

        nextStageDecision:
          "agree",

        comments:
          "Customer confirmed the stage result.",

        status:
          "submitted"
      };

      milestone.status =
        milestone
          .requiresPaperSignature
          ? "paper_pending"
          : "operation_review";

      milestone.updatedAt =
        now;

      currentRequest.status =
        "milestone_review";

      saveCurrentRequest();
      renderRequest();
      renderMilestones();

      showStatus(
        "success",
        translate(
          "customerSubmitted"
        )
      );
    }

    function simulatePaperUpload(
      milestoneId
    ) {
      const milestone =
        findMilestone(
          milestoneId
        );

      if (
        !milestone ||
        (
          milestone.status !==
            "customer_review" &&
          milestone.status !==
            "paper_pending"
        )
      ) {
        return;
      }

      const now =
        new Date().toISOString();

      milestone.paperDocument = {
        id:
          "INTERIM-PAPER-" +
          Date.now(),

        documentNumber:
          "EC-MILESTONE-" +
          String(
            Date.now()
          ).slice(-10),

        fileName:
          "signed-interim-acceptance.pdf",

        fileType:
          "application/pdf",

        uploadedAt:
          now,

        signedByCustomer:
          true,

        signedByWorker:
          true,

        status:
          "uploaded"
      };

      milestone.status =
        "operation_review";

      milestone.updatedAt =
        now;

      currentRequest.status =
        "milestone_review";

      saveCurrentRequest();
      renderRequest();
      renderMilestones();

      showStatus(
        "success",
        translate(
          "paperUploaded"
        )
      );
    }

    function openNextMilestone(
      milestone
    ) {
      const nextMilestone =
        milestones.find(
          (item) =>
            item.sequence ===
            milestone.sequence + 1
        );

      if (!nextMilestone) {
        return;
      }

      nextMilestone.status =
        "open";

      nextMilestone.openedAt =
        new Date().toISOString();

      nextMilestone.updatedAt =
        new Date().toISOString();
    }

    function saveOperationReview(
      milestoneId
    ) {
      const milestone =
        findMilestone(
          milestoneId
        );

      if (!milestone) {
        return;
      }

      if (
        !milestone
          .customerEvaluation ||
        (
          milestone
            .requiresPaperSignature &&
          !milestone.paperDocument
        )
      ) {
        showStatus(
          "error",
          translate(
            "reviewPrerequisite"
          )
        );

        return;
      }

      const resultElement =
        document.getElementById(
          `reviewResult-${milestone.id}`
        );

      const commentsElement =
        document.getElementById(
          `reviewComments-${milestone.id}`
        );

      const result =
        resultElement.value;

      const comments =
        commentsElement.value.trim();

      if (!result) {
        showStatus(
          "error",
          translate(
            "reviewResultRequired"
          )
        );

        return;
      }

      if (!comments) {
        showStatus(
          "error",
          translate(
            "reviewCommentsRequired"
          )
        );

        return;
      }

      const now =
        new Date().toISOString();

      milestone.operationReview = {
        result,
        comments,

        reviewedBy:
          "operations",

        reviewedAt:
          now
      };

      milestone.status =
        result;

      milestone.updatedAt =
        now;

      let successMessage =
        "reviewApproved";

      if (result === "approved") {
        openNextMilestone(
          milestone
        );

        currentRequest.status =
          "in_progress";
      }

      if (
        result ===
        "conditional_approved"
      ) {
        openNextMilestone(
          milestone
        );

        currentRequest.status =
          "in_progress";

        successMessage =
          "reviewConditionalSaved";
      }

      if (result === "rework") {
        currentRequest.status =
          "milestone_rework";

        successMessage =
          "reviewReworkSaved";
      }

      if (result === "disputed") {
        currentRequest.status =
          "disputed";

        successMessage =
          "reviewDisputeSaved";
      }

      if (result === "paused") {
        currentRequest.status =
          "paused";

        successMessage =
          "reviewPauseSaved";
      }

      const allApproved =
        milestones.length > 0 &&
        milestones.every(
          (item) =>
            item.status ===
              "approved" ||
            item.status ===
              "conditional_approved"
        );

      if (allApproved) {
        currentRequest.status =
          "customer_final_review";
      }

      saveCurrentRequest();
      renderRequest();
      renderMilestones();

      showStatus(
        "success",
        translate(
          successMessage
        )
      );
    }

    function goBack() {
      window.location.href =
        "admin-service-requests.html";
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        loadCurrentRequest();
        initializeMilestones();
        applyLanguage();
      }
    );
  </script>

</body>
</html>
