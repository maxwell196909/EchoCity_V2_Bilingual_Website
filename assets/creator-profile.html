<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>创作者主页 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#0b0d12;color:#fff}.wrap{max-width:720px;margin:auto;min-height:100vh}.hero{padding:calc(18px + env(safe-area-inset-top)) 18px 18px;background:linear-gradient(180deg,#1e293b,#0b0d12)}.top{display:flex;justify-content:space-between}.back,.more{border:0;background:#ffffff18;color:#fff;border-radius:999px;padding:9px 12px}.profile{display:flex;gap:14px;align-items:center;margin-top:24px}.avatar{width:82px;height:82px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:28px;font-weight:900;overflow:hidden}.name{font-size:23px;font-weight:900}.badge{display:inline-block;margin-left:7px;background:#2563eb;color:#fff;border-radius:999px;padding:3px 7px;font-size:11px;vertical-align:middle}.bio{margin-top:12px;color:#cbd5e1;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;text-align:center}.stats b{display:block;font-size:19px}.stats span{font-size:12px;color:#94a3b8}.actions{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:16px}.follow,.dm{height:46px;border:0;border-radius:12px;color:#fff;font-weight:900}.follow{background:#ef4444}.follow.active{background:#334155}.dm{background:#1f2937}.tabs{display:flex;border-bottom:1px solid #1f2937}.tab{flex:1;padding:14px;text-align:center;font-weight:800}.tab.active{border-bottom:3px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.item{aspect-ratio:3/4;background:#111;position:relative;overflow:hidden}.item video{width:100%;height:100%;object-fit:cover}.item .shade{position:absolute;inset:0;background:linear-gradient(transparent,#0008)}.item .label{position:absolute;left:7px;right:7px;bottom:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:50px 20px;text-align:center;color:#94a3b8}.private{padding:60px 22px;text-align:center;color:#cbd5e1}.private strong{display:block;font-size:22px;margin-bottom:8px}</style></head><body><main class="wrap"><section class="hero"><div class="top"><button class="back" onclick="history.back()">← 返回</button><button class="more">•••</button></div><div class="profile"><div id="avatar" class="avatar">E</div><div><div><span id="name" class="name">EchoCity 创作者</span><span id="badge" class="badge" hidden></span></div><div id="city" style="color:#94a3b8;margin-top:5px"></div></div></div><div id="bio" class="bio"></div><div class="stats"><div><b id="works">0</b><span>作品</span></div><div><b id="followers">-</b><span>粉丝</span></div><div><b id="following">-</b><span>关注</span></div><div><b id="likes">0</b><span>获赞</span></div></div><div class="actions"><button id="followBtn" class="follow">关注</button><button id="dmBtn" class="dm">私信</button></div></section><div class="tabs"><div class="tab active">作品</div><div id="likedTab" class="tab">喜欢</div></div><section id="grid" class="grid"></section></main><script>const db=window.echoCitySupabase,creatorId=new URLSearchParams(location.search).get('id');let me=null,privacy=null;function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function init(){if(!creatorId){grid.innerHTML='<div class="empty" style="grid-column:1/-1">缺少创作者编号</div>';return}const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:pp,error:pe}=await db.rpc('get_public_profile_v1',{p_user_id:creatorId});const p=Array.isArray(pp)?pp[0]:pp;if(pe||!p){grid.innerHTML='<div class="private" style="grid-column:1/-1"><strong>无法查看主页</strong>用户不存在或资料不可访问</div>';return}privacy=p;if(!p.can_view){name.textContent='私密账号';bio.textContent=p.account_visibility==='followers'?'关注该用户后可查看主页':'该用户的主页不公开';city.textContent='';grid.innerHTML='<div class="private" style="grid-column:1/-1"><strong>🔒 私密账号</strong>当前无权查看作品和资料</div>';if(!me){followBtn.textContent='登录后关注';dmBtn.style.display='none'}return}name.textContent=p.display_name||'EchoCity 创作者';city.textContent=p.city?('📍 '+p.city):'';bio.textContent=p.bio||'';if(p.verification_badge){badge.hidden=false;badge.textContent='✓ '+p.verification_badge}if(p.avatar_url)avatar.innerHTML='<img src="'+esc(p.avatar_url)+'" style="width:100%;height:100%;object-fit:cover">';else avatar.textContent=(p.display_name||'E').slice(0,1).toUpperCase();const [{data:s},{data:v}]=await Promise.all([db.rpc('get_creator_social_stats',{p_creator_id:creatorId}),db.from('videos').select('id,title,video_url,cover_url').eq('author_id',creatorId).eq('status','published').eq('visibility','public').order('published_at',{ascending:false})]);const st=Array.isArray(s)?s[0]:s;if(st){works.textContent=st.video_count||0;followers.textContent=p.show_follower_list?(st.follower_count||0):'私密';following.textContent=p.show_following_list?(st.following_count||0):'私密';likes.textContent=st.total_likes||0}likedTab.style.display=p.show_liked_videos?'block':'none';grid.innerHTML=(v||[]).length?(v||[]).map(x=>`<div class="item" onclick="location.href='video-feed-v3.html?video=${x.id}'"><video muted playsinline preload="metadata" src="${esc(x.video_url)}" ${x.cover_url?`poster="${esc(x.cover_url)}"`:''}></video><div class="shade"></div><div class="label">${esc(x.title||'视频')}</div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">还没有已发布作品</div>';if(me?.id===creatorId){followBtn.style.display='none';dmBtn.style.display='none'}else if(me){const {data:f}=await db.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',creatorId).maybeSingle();setFollow(!!f);if(p.allow_direct_messages==='none')dmBtn.style.display='none'}else{followBtn.textContent='登录后关注';dmBtn.textContent='登录后私信'}}function setFollow(on){followBtn.classList.toggle('active',on);followBtn.textContent=on?'已关注':'关注';followBtn.dataset.on=on?'1':'0'}followBtn.onclick=async()=>{if(!me)return alert('请先登录');const on=followBtn.dataset.on==='1';if(on){await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',creatorId);setFollow(false)}else{const {error}=await db.from('follows').insert({follower_id:me.id,following_id:creatorId});if(error)return alert(error.message);setFollow(true)}location.reload()};dmBtn.onclick=async()=>{if(!me)return alert('请先登录');const {data,error}=await db.rpc('start_direct_thread',{p_other_user:creatorId});if(error){const m=error.message||'';if(m.includes('FOLLOW_REQUIRED'))return alert('对方仅允许粉丝私信，请先关注。');if(m.includes('MUTUAL_FOLLOW_REQUIRED'))return alert('对方仅允许互相关注用户私信。');if(m.includes('DIRECT_MESSAGES_DISABLED'))return alert('对方已关闭私信。');if(m.includes('MESSAGING_BLOCKED'))return alert('当前无法向该用户发送私信。');return alert('无法发起私信：'+m)}location.href='direct-chat.html?thread='+data};init();</script></body></html>
