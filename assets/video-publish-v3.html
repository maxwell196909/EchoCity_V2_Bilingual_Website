<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布视频 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script><script src="../js/echocity-supabase.js?v=76"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:680px;margin:auto;padding:18px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #0f172a12}.card h1{margin:0 0 8px;font-size:24px}.muted{color:#64748b;line-height:1.55;margin-bottom:16px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:90px}.upload{border:2px dashed #94a3b8;border-radius:16px;padding:16px;background:#f8fafc}.pickers,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick,.btn{min-height:50px;border:0;border-radius:12px;font-weight:900}.library,.primary{background:#2563eb;color:#fff}.camera,.secondary{background:#e2e8f0;color:#172033}.fileName{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff;color:#475569;font-size:13px;word-break:break-all}.preview{margin-top:12px;width:100%;max-height:440px;border-radius:14px;background:#000}.actions{margin-top:18px}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:none;line-height:1.55}.status.show{display:block}.danger{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#047857}.progress{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px;display:none}.bar{height:100%;width:0;background:#2563eb}.hint{font-size:12px;color:#64748b;margin-top:6px}@media(max-width:520px){.pickers,.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><strong>EchoCity Video</strong></div><section class="card"><h1>发布短视频</h1><div class="muted">提交审核后会自动进入审核状态页，你可以看到“审核中 / 已通过 / 未通过”。</div><div class="field"><label>选择视频</label><div class="upload"><div class="pickers"><button id="pickLibrary" class="pick library" type="button">📁 从相册 / 文件选择</button><button id="pickCamera" class="pick camera" type="button">📹 直接拍摄</button></div><input id="videoLibrary" type="file" accept="video/*,video/mp4,video/quicktime,video/webm" hidden><input id="videoCamera" type="file" accept="video/*" capture="environment" hidden><div id="fileName" class="fileName">尚未选择视频</div><video id="preview" class="preview" controls playsinline hidden></video><div class="hint">当前单文件上限 50MB。</div></div></div><div class="field"><label>标题</label><input id="title" maxlength="80" placeholder="例如：广州道路施工现场"></div><div class="field"><label>视频说明</label><textarea id="description" maxlength="1000" placeholder="介绍现场情况、观点或问题"></textarea></div><div class="field"><label>城市</label><input id="city" maxlength="50" placeholder="广州"></div><div class="field"><label>具体位置</label><input id="locationText" maxlength="120" placeholder="例如：广州市天河区"></div><div class="field"><label># 话题</label><input id="topics" maxlength="240" placeholder="#广州 #城市治理"></div><div class="field"><label>挂载服务类型（可选）</label><input id="serviceType" maxlength="80" placeholder="例如：道路维修"></div><div class="field"><label>按钮名称（可选）</label><input id="serviceName" maxlength="40" placeholder="例如：我要报修"></div><div class="actions"><button id="saveDraft" class="btn secondary">保存草稿</button><button id="submitReview" class="btn primary">提交审核</button></div><div id="progress" class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status"></div></section></main><script>const db=window.echoCitySupabase,$=id=>document.getElementById(id);let selectedVideoFile=null,currentUser=null;const MAX_BYTES=50*1024*1024;function show(t,type='info'){$('status').textContent=t;$('status').className='status show'+(type==='error'?' danger':type==='success'?' success':'')}function setProgress(p){$('progress').style.display='block';$('bar').style.width=Math.max(0,Math.min(100,p))+'%';show('正在上传视频：'+Math.round(p)+'%')}function useFile(f){if(!f)return;selectedVideoFile=f;const mb=f.size/1024/1024;$('fileName').textContent=`已选择：${f.name} · ${mb.toFixed(1)} MB`;if(mb>50){show('视频超过 50MB，请换一段更短的视频。','error');return}if($('preview').src)URL.revokeObjectURL($('preview').src);$('preview').src=URL.createObjectURL(f);$('preview').hidden=false;$('preview').load();show('视频已选择，可以提交。')}$('pickLibrary').onclick=()=>$('videoLibrary').click();$('pickCamera').onclick=()=>$('videoCamera').click();$('videoLibrary').onchange=()=>useFile($('videoLibrary').files?.[0]);$('videoCamera').onchange=()=>useFile($('videoCamera').files?.[0]);async function ensureUser(){const {data:s}=await db.auth.getSession();if(s?.session?.user){currentUser=s.session.user;return currentUser}const {data:u}=await db.auth.getUser();if(u?.user){currentUser=u.user;return currentUser}location.href='video-auth.html?return='+encodeURIComponent('video-publish-v3.html');return null}async function ensureProfile(user){const {data}=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();if(data)return;const {error}=await db.from('profiles').insert({id:user.id,display_name:user.email?.split('@')[0]||'EchoCity 用户',primary_role:'customer',status:'active',is_public:true});if(error)throw error}function ext(name,type){const x=(name.split('.').pop()||'mp4').toLowerCase();if(['mp4','mov','webm'].includes(x))return x;if(type==='video/quicktime')return'mov';if(type==='video/webm')return'webm';return'mp4'}function parseTags(v){return [...new Set(v.split(/[，,\s]+/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean))].slice(0,10)}async function tusUpload(file,path){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw new Error('登录状态已失效');return new Promise((resolve,reject)=>{const upload=new tus.Upload(file,{endpoint:'https://dpljvspwcfglxfesxdmf.storage.supabase.co/storage/v1/upload/resumable',retryDelays:[0,3000,5000,10000,20000],headers:{authorization:'Bearer '+session.access_token,'x-upsert':'false'},uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,chunkSize:6*1024*1024,metadata:{bucketName:'echocity-videos',objectName:path,contentType:file.type||'video/mp4',cacheControl:'3600'},onError:reject,onProgress:(sent,total)=>setProgress(total?sent/total*100:0),onSuccess:()=>resolve(true)});upload.findPreviousUploads().then(prev=>{if(prev.length)upload.resumeFromPreviousUpload(prev[0]);upload.start()}).catch(reject)})}async function publish(targetStatus){const user=await ensureUser();if(!user)return;const file=selectedVideoFile;if(!file)return show('请先选择视频。','error');if(file.size>MAX_BYTES)return show('视频超过 50MB。','error');const title=$('title').value.trim();if(!title)return show('请填写视频标题。','error');$('saveDraft').disabled=$('submitReview').disabled=true;try{await ensureProfile(user);const path=`${user.id}/${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}.${ext(file.name,file.type)}`;if(file.size>6*1024*1024){show('正在启动分片上传……');await tusUpload(file,path)}else{show('正在上传视频……');const {error}=await db.storage.from('echocity-videos').upload(path,file,{contentType:file.type||'video/mp4',cacheControl:'3600',upsert:false});if(error)throw error}setProgress(100);const videoUrl=db.storage.from('echocity-videos').getPublicUrl(path).data.publicUrl;const payload={author_id:user.id,title,description:$('description').value.trim()||null,video_url:videoUrl,city:$('city').value.trim()||null,location_text:$('locationText').value.trim()||null,status:targetStatus,visibility:'public'};const {data:video,error:ve}=await db.from('videos').insert(payload).select('id').single();if(ve)throw ve;const tags=parseTags($('topics').value);if(tags.length)await db.rpc('set_video_topics_and_mentions',{p_video_id:video.id,p_topics:tags,p_mentions:[],p_location_text:payload.location_text});const serviceType=$('serviceType').value.trim();if(serviceType)await db.from('video_service_links').insert({video_id:video.id,service_type:serviceType,service_name:$('serviceName').value.trim()||serviceType,action_type:'create_service_request',created_by:user.id});if(targetStatus==='reviewing'){show('提交成功，正在进入审核状态……','success');location.href='video-review-status.html?video_id='+encodeURIComponent(video.id);return}show('草稿保存成功。','success')}catch(e){console.error(e);show('上传/提交失败：'+(e?.message||'未知错误'),'error')}finally{$('saveDraft').disabled=$('submitReview').disabled=false}}$('saveDraft').onclick=()=>publish('draft');$('submitReview').onclick=()=>publish('reviewing');ensureUser().then(u=>{if(u)show('已登录：'+(u.email||u.phone||'EchoCity 用户'))});</script></body></html>
