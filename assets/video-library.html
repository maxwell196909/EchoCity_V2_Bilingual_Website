<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的内容 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 32px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:0;border-radius:12px;background:#fff;padding:10px 13px;font-weight:800}.tabs{display:flex;background:#fff;padding:4px;border-radius:14px;margin:16px 0}.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:800}.tab.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.item{aspect-ratio:3/4;position:relative;background:#111;overflow:hidden}.item video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent,#0009)}.label{position:absolute;left:6px;right:6px;bottom:6px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:50px 16px;text-align:center;color:#94a3b8;grid-column:1/-1}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><strong>我的内容</strong></div><div class="tabs"><div class="tab active" data-mode="favorites">收藏</div><div class="tab" data-mode="likes">喜欢</div><div class="tab" data-mode="history">历史</div></div><section id="grid" class="grid"><div class="empty">正在读取……</div></section></main><script>const db=window.echoCitySupabase,grid=document.getElementById('grid');let mode='favorites';function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data:u}=await db.auth.getUser();if(!u?.user){grid.innerHTML='<div class="empty">登录后可查看收藏、喜欢和历史</div>';return}grid.innerHTML='<div class="empty">正在读取……</div>';let data,error;if(mode==='history'){({data,error}=await db.rpc('get_user_watch_history',{p_limit:120}))}else{({data,error}=await db.rpc('get_user_video_library',{p_mode:mode,p_limit:120}))}if(error){grid.innerHTML='<div class="empty">读取失败</div>';return}grid.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="item" onclick="location.href='video-feed-v2.html?video=${x.video_id}'"><video muted playsinline preload="metadata" src="${esc(x.video_url)}" ${x.cover_url?`poster="${esc(x.cover_url)}"`:''}></video><div class="shade"></div><div class="label">${esc(x.title||'视频')}</div></div>`).join(''):'<div class="empty">这里还没有内容</div>'}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));mode=t.dataset.mode;load()});load();</script></body></html>
