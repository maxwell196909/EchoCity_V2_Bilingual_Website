<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>售后整改任务 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(820px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border-radius:18px;background:#fff;border:1px solid #dbe3ee}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#1e3a8a,#2563eb)}.top{display:flex;justify-content:space-between}.switch{border:1px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:8px 12px}.card{padding:17px;margin-top:14px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:800}.muted{color:#64748b}.notice{background:#eff6ff}.error{background:#fee2e2;color:#991b1b}.btn{width:100%;border:0;border-radius:11px;padding:13px;margin-top:10px;background:#1d4ed8;color:#fff;font-weight:900;font-size:16px}.btn:disabled{opacity:.5}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}.file{padding:10px 0;border-top:1px solid #e5e7eb}.file button{border:0;background:none;color:#1d4ed8;font-weight:800}
</style></head><body><main class="page"><header class="hero"><div class="top"><strong>EchoCity</strong><button id="lang" class="switch">English</button></div><h1 id="title">售后整改任务</h1><p id="subtitle">查看整改范围、上传整改证据并提交客户复验</p></header><div id="message" class="card">正在验证服务人员专属链接……</div><section id="content" hidden><div id="detail" class="card"></div><div id="evidence" class="card"></div><div id="actions" class="card"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const URL='https://dpljvspwcfglxfesxdmf.supabase.co',KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-',client=window.supabase.createClient(URL,KEY);let lang=localStorage.getItem('echocity-lang')||'zh',auth={},data={};
const text={zh:{title:'售后整改任务',subtitle:'查看整改范围、上传整改证据并提交客户复验',loading:'正在验证服务人员专属链接……',scope:'整改范围',exclusions:'排除项',issue:'客户问题',evidence:'相关证据',none:'暂无可见证据',accept:'确认接手整改',upload:'上传整改照片或视频',submit:'完成整改并提交客户复验',note:'请输入整改说明',waiting:'已提交，等待客户复验',failed:'操作失败：'},en:{title:'After-sales Remediation',subtitle:'Review scope, upload remediation evidence and request customer reinspection',loading:'Validating your worker link…',scope:'Remediation scope',exclusions:'Exclusions',issue:'Customer issue',evidence:'Evidence',none:'No evidence available',accept:'Accept remediation task',upload:'Upload remediation photo or video',submit:'Complete and request customer reinspection',note:'Enter remediation notes',waiting:'Submitted; awaiting customer reinspection',failed:'Operation failed: '}};const t=k=>text[lang][k]||k;
async function rpc(name,body){const r=await fetch(`${URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||`API ${r.status}`);return p}function credentials(){const h=new URLSearchParams(location.hash.replace(/^#/,''));return{request_no:h.get('request_no')||sessionStorage.getItem('worker-as-request')||'',case_no:h.get('case_no')||sessionStorage.getItem('worker-as-case')||'',token:h.get('token')||sessionStorage.getItem('worker-as-token')||''}}
function applyLang(){$('title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('lang').textContent=lang==='zh'?'English':'中文';localStorage.setItem('echocity-lang',lang);render()}
function render(){if(!data.case)return;const c=data.case;$('detail').innerHTML=`<strong>${esc(c.case_no)}</strong>　<span class="tag">${esc(c.status)}</span><h3>${t('issue')}</h3><p>${esc(c.issue)}</p><h3>${t('scope')}</h3><p>${esc(c.scope)}</p><h3>${t('exclusions')}</h3><p>${esc(c.exclusions)}</p>`;const rows=data.evidence||[];$('evidence').innerHTML=`<h2>${t('evidence')}</h2>${rows.length?rows.map(e=>`<div class="file"><span>${esc(e.file_name)} · ${esc(e.uploaded_by_role)} · ${esc(e.review_status)}</span><button onclick="viewEvidence('${e.id}')">${lang==='zh'?'查看':'View'}</button></div>`).join(''):`<p class="muted">${t('none')}</p>`}`;if(c.status==='in_review')$('actions').innerHTML=`<textarea id="note" placeholder="${t('note')}"></textarea><button class="btn" onclick="transition('accept')">${t('accept')}</button>`;else if(c.status==='repairing')$('actions').innerHTML=`<textarea id="note" placeholder="${t('note')}"></textarea><input id="file" type="file" accept="image/jpeg,image/png,image/heic,video/mp4,video/quicktime"><button class="btn" onclick="uploadEvidence()">${t('upload')}</button><div id="upload-status" class="muted"></div><button class="btn" onclick="transition('submit_reinspection')">${t('submit')}</button>`;else $('actions').innerHTML=`<p class="muted">${t('waiting')}</p>`}
async function load(){try{auth=credentials();if(!auth.request_no||!auth.case_no||!auth.token)throw new Error('LINK_CREDENTIALS_MISSING');sessionStorage.setItem('worker-as-request',auth.request_no);sessionStorage.setItem('worker-as-case',auth.case_no);sessionStorage.setItem('worker-as-token',auth.token);data=await rpc('get_worker_after_sales_with_token',{p_request_no:auth.request_no,p_token:auth.token,p_case_no:auth.case_no});$('message').hidden=true;$('content').hidden=false;render()}catch(e){$('message').textContent=t('failed')+e.message;$('message').className='card error'}}
async function transition(action){const note=$('note')?.value.trim();if(!note){alert(t('note'));return}try{await rpc('transition_worker_after_sales_with_token',{p_request_no:auth.request_no,p_token:auth.token,p_case_no:auth.case_no,p_action:action,p_note:note});await load()}catch(e){alert(t('failed')+e.message)}}
async function uploadEvidence(){const f=$('file').files[0],s=$('upload-status');if(!f){s.textContent=lang==='zh'?'请选择文件':'Choose a file';return}try{s.textContent=lang==='zh'?'正在安全上传……':'Uploading securely…';const mime=f.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',mp4:'video/mp4',mov:'video/quicktime'}[(f.name.split('.').pop()||'').toLowerCase()]||'');const x=await client.functions.invoke('customer-warranty-evidence',{body:{action:'upload',actorRole:'worker',requestNo:auth.request_no,token:auth.token,caseNo:auth.case_no,fileName:f.name,fileSize:f.size,mimeType:mime}});if(x.error||!x.data?.uploadToken)throw x.error||new Error('SIGNED_UPLOAD_FAILED');const up=await client.storage.from(x.data.bucket).uploadToSignedUrl(x.data.path,x.data.uploadToken,f,{contentType:mime});if(up.error)throw up.error;await rpc('commit_worker_after_sales_evidence_with_token',{p_request_no:auth.request_no,p_token:auth.token,p_case_no:auth.case_no,p_storage_path:x.data.path,p_file_name:f.name,p_file_size:f.size,p_mime_type:mime});s.textContent=lang==='zh'?'上传成功':'Uploaded';await load()}catch(e){s.textContent=t('failed')+e.message}}
async function viewEvidence(id){try{const x=await client.functions.invoke('customer-warranty-evidence',{body:{action:'view',actorRole:'worker',requestNo:auth.request_no,token:auth.token,caseNo:auth.case_no,evidenceId:id}});if(x.error||!x.data?.signedUrl)throw x.error||new Error('SIGNED_VIEW_FAILED');window.open(x.data.signedUrl,'_blank','noopener')}catch(e){alert(t('failed')+e.message)}}$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};applyLang();load();
</script></body></html>
