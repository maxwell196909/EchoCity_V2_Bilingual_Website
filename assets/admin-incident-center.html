<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>异常监管中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1120px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:20px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#3f0d12,#a71d31)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.metric,.incident{padding:16px;border:1px solid #dbe3ee;border-radius:16px;background:#fff}.number{font-size:28px;font-weight:900;color:#b91c1c}.label,.muted{color:#64748b}.list{display:grid;gap:12px}.incident{display:grid;grid-template-columns:1.3fr 2fr auto;gap:15px;align-items:center}.title{font-size:18px;font-weight:900}.order{display:inline-block;margin-top:6px;color:#1d4ed8;text-decoration:none;font-weight:800}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.tag{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.critical,.high{background:#fee2e2;color:#991b1b}.medium{background:#fef3c7;color:#92400e}.resolved{background:#dcfce7;color:#166534}.in_review{background:#dbeafe;color:#1e40af}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.primary{background:#991b1b;color:#fff}.secondary{background:#e2e8f0;color:#172033}.btn:disabled{opacity:.45}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}.note{margin-top:7px;padding:8px;border-radius:9px;background:#f8fafc;font-size:13px}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.incident{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>异常监管中心</h1><p>统一监控超时、返工、争议、结算异常和系统接口风险</p></header><div id="message" class="message">正在扫描平台异常……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div id="incidents" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let platformToken='';
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const severityText={low:'低',medium:'中',high:'高',critical:'紧急'},statusText={open:'待处理',in_review:'处理中',resolved:'已解决',dismissed:'已排除'};
async function act(id,action,button){let note=null;if(action==='resolve'){note=prompt('请输入处理结果（至少3个字），该内容将写入审计记录：');if(!note||note.trim().length<3)return}else if(!confirm('确认由平台接管处理此异常？'))return;button.disabled=true;try{await rpc('update_platform_incident_with_token',{p_token:platformToken,p_incident_id:id,p_action:action,p_note:note});await load()}catch(e){alert(`操作失败：${e.message}`);button.disabled=false}}
function buttons(i){if(i.status==='open')return `<button class="btn primary" onclick="act('${esc(i.id)}','acknowledge',this)">接管处理</button>`;if(i.status==='in_review')return `<button class="btn primary" onclick="act('${esc(i.id)}','resolve',this)">登记解决</button>`;return '<span class="muted">已完成处理</span>'}
async function load(){try{platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_incident_center_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['待处理',s.open],['处理中',s.in_review],['高优先级',s.high_priority],['已解决',s.resolved]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const rows=d.incidents||[];$('incidents').innerHTML=rows.length?rows.map(i=>`<article class="incident"><div><div class="tags"><span class="tag ${esc(i.severity)}">${esc(severityText[i.severity]||i.severity)}风险</span><span class="tag ${esc(i.status)}">${esc(statusText[i.status]||i.status)}</span></div><div class="title">${esc(i.title)}</div>${i.request_no?`<a class="order" href="admin-order-360.html?request_no=${encodeURIComponent(i.request_no)}">${esc(i.request_no)} →</a>`:''}</div><div><div>${esc(i.detail)}</div><div class="muted">首次发现：${esc(new Date(i.first_detected_at).toLocaleString('zh-CN'))}</div>${i.owner_note?`<div class="note">处理记录：${esc(i.owner_note)}</div>`:''}</div><div class="actions">${buttons(i)}</div></article>`).join(''):'<div class="message">当前没有异常，平台运行正常。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`异常数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
