<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单进度 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(820px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.hero{padding:20px;background:linear-gradient(135deg,#0f2747,#2563eb);color:#fff}.hero a{color:#fff}.card{margin-top:13px;padding:17px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:11px;border-radius:10px;background:#f8fafc}.label,small{font-size:12px;color:#64748b}.timeline{margin-left:8px;padding-left:18px;border-left:3px solid #bfdbfe}.event{position:relative;padding-bottom:18px}.event:before{content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;background:#2563eb}.error{color:#991b1b;background:#fee2e2}@media(max-width:600px){.summary{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="hero"><a href="customer-my-requests.html">← 返回我的需求</a><h1>订单进度中心</h1><p>查看服务全过程最新进展</p></header><div id="message" class="card">正在读取订单进度……</div><section id="content" hidden><div id="summary" class="card summary"></div><div class="card"><h2>进度时间轴</h2><div id="timeline" class="timeline"></div></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'未填写').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN'):'未填写';async function load(){try{const no=new URLSearchParams(location.search).get('request_no'),phone=localStorage.getItem('echocity-customer-phone')||'',r=await window.echoCitySupabase.rpc('get_customer_progress_timeline',{p_request_no:no,p_customer_phone:phone});if(r.error||!r.data)throw r.error||new Error('NOT_FOUND');const d=r.data,q=d.request||{};$('summary').innerHTML=[['订单号',q.request_no],['当前状态',q.status],['服务类型',q.service_type],['服务日期',q.service_date],['服务人员',q.assigned_worker],['报价',q.quote_amount],['地址',q.address],['需求说明',q.description]].map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div>${esc(x[1])}</div></div>`).join('');const ev=[...(d.events||[]),...(d.inspections||[]).map(i=>({action:`${i.type} 验收`,to_status:i.result,note:i.review_note,created_at:i.created_at}))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));$('timeline').innerHTML=ev.length?ev.map(e=>`<div class="event"><strong>${esc(e.action)} · ${esc(e.to_status)}</strong><br><small>${esc(dt(e.created_at))}</small><div>${esc(e.note||'')}</div></div>`).join(''):'<div>订单已经建立，等待平台处理。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').textContent='读取失败，请先返回“我的需求”用订单号和手机号查询。';$('message').className='card error'}}load();</script></body></html>
