<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单进度 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(820px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.hero{padding:20px;background:linear-gradient(135deg,#0f2747,#2563eb);color:#fff}.hero a{color:#fff}.card{margin-top:13px;padding:17px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:11px;border-radius:10px;background:#f8fafc}.label,small{font-size:12px;color:#64748b}.timeline{margin-left:8px;padding-left:18px;border-left:3px solid #bfdbfe}.event{position:relative;padding-bottom:18px}.event:before{content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;background:#2563eb}.error{color:#991b1b;background:#fee2e2}.next{border:2px solid #bfdbfe;background:linear-gradient(180deg,#eff6ff,#fff)}.next h2{margin:0 0 8px}.next p{margin:0;color:#475569;line-height:1.65}.action{display:block;width:100%;margin-top:14px;padding:14px 18px;border:0;border-radius:13px;background:#2563eb;color:#fff;text-align:center;text-decoration:none;font-size:16px;font-weight:800}.wait{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;color:#475569}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:6px 10px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:700}@media(max-width:600px){.summary{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="hero"><a href="customer-my-requests.html">← 返回我的需求</a><h1>订单进度中心</h1><p>查看全过程，并直接完成当前该做的下一步</p></header><div id="message" class="card">正在读取订单进度……</div><section id="content" hidden><div id="summary" class="card summary"></div><div id="nextCard" class="card next"><h2>下一步</h2><p id="nextText">正在判断当前流程……</p><div class="meta"><span id="actorPill" class="pill"></span><span id="actionPill" class="pill"></span></div><a id="nextButton" class="action" hidden>继续办理</a><div id="waitBox" class="wait" hidden></div></div><div class="card"><h2>进度时间轴</h2><div id="timeline" class="timeline"></div></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'未填写').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN'):'未填写';function tokenFor(no){const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search),incoming=h.get('token')||q.get('customer_token')||'';if(incoming&&incoming.length===64)sessionStorage.setItem(`echocity-customer-token:${no}`,incoming);return incoming||sessionStorage.getItem(`echocity-customer-token:${no}`)||''}function secureLink(page,no,token){return `${page}?request_no=${encodeURIComponent(no)}#token=${encodeURIComponent(token)}`}function renderNext(q,token){const actor=q.current_actor||'',action=q.next_action||'',status=q.status||'';$('actorPill').textContent=`当前责任：${actor||'系统判断'}`;$('actionPill').textContent=`当前动作：${action||status||'等待处理'}`;let page='',label='',text='';if(status==='quoted'||action==='confirm_quote'){page='service-quote-confirmation.html';label='确认服务报价';text='报价已经准备好，请核对服务内容和价格后确认。'}else if(actor==='customer'&&action==='confirm_implementation_plan'){page='implementation-plan-workflow.html';label='确认施工方案';text='平台已经审核施工方案，现在需要您确认开工前方案。'}else if(status==='milestone_submitted'||(actor==='customer'&&action==='review_milestone')){page='customer-milestone-evaluation.html';label='阶段验收';text='工人已经提交阶段成果，请进行本阶段验收。'}else if(status==='awaiting_final_acceptance'||actor==='customer'&&action==='final_acceptance'){page='customer-final-acceptance.html';label='最终验收';text='服务已进入最终验收，请核对成果并给出最终结果。'}else if(status==='closed'||(status==='completed'&&actor!=='worker')){page='customer-warranty.html';label='查看质保与售后';text='订单主体服务已完成，可查看质保条款并在需要时提交售后。'}if(page&&token&&token.length===64){$('nextText').textContent=text;$('nextButton').textContent=label;$('nextButton').href=secureLink(page,q.request_no,token);$('nextButton').hidden=false;$('waitBox').hidden=true}else{$('nextButton').hidden=true;$('nextText').textContent=actor==='customer'?'当前需要客户操作，但安全链接不可用，请让平台重新发送客户订单专链。':'当前暂不需要您操作。';$('waitBox').textContent=actor==='worker'?'正在等待服务人员处理。':actor==='platform'?'正在等待平台处理。':'系统正在等待下一状态。';$('waitBox').hidden=false}}async function load(){try{const no=(new URLSearchParams(location.search).get('request_no')||'').trim().toUpperCase(),phone=localStorage.getItem('echocity-customer-phone')||'',token=tokenFor(no),r=await window.echoCitySupabase.rpc('get_customer_progress_timeline',{p_request_no:no,p_customer_phone:phone});if(r.error||!r.data)throw r.error||new Error('NOT_FOUND');const d=r.data,q=d.request||{};$('summary').innerHTML=[['订单号',q.request_no],['当前状态',q.status],['服务类型',q.service_type],['服务日期',q.service_date],['服务人员',q.assigned_worker],['报价',q.quote_amount],['地址',q.address],['需求说明',q.description]].map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div>${esc(x[1])}</div></div>`).join('');renderNext(q,token);const ev=[...(d.events||[]),...(d.inspections||[]).map(i=>({action:`${i.type} 验收`,to_status:i.result,note:i.review_note,created_at:i.created_at}))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));$('timeline').innerHTML=ev.length?ev.map(e=>`<div class="event"><strong>${esc(e.action)} · ${esc(e.to_status)}</strong><br><small>${esc(dt(e.created_at))}</small><div>${esc(e.note||'')}</div></div>`).join(''):'<div>订单已经建立，等待平台处理。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').textContent='无法读取完整订单。请使用平台发送的客户订单专链打开。';$('message').className='card error'}}load();</script></body></html>
