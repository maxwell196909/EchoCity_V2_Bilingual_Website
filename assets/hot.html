<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>热榜 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input{flex:1;border:0;border-radius:12px;padding:12px}.filters button{border:0;border-radius:12px;background:#111827;color:#fff;padding:0 16px;font-weight:900}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:42px 92px 1fr;gap:10px;background:#fff;border-radius:16px;padding:10px;align-items:center}.rank{font-size:24px;font-weight:900;text-align:center}.thumb{width:92px;aspect-ratio:3/4;border-radius:10px;object-fit:cover;background:#111}.title{font-weight:900;line-height:1.4}.meta{font-size:12px;color:#64748b;margin-top:6px}.score{font-size:12px;color:#ef4444;margin-top:5px}.empty{text-align:center;color:#64748b;padding:48px 12px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><h2>EchoCity 热榜</h2></div><div class="filters"><input id="city" placeholder="城市筛选，例如：广州"><button id="apply">查看</button></div><div id="list" class="list"><div class="empty">正在计算热榜……</div></div></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){list.innerHTML='<div class="empty">正在计算热榜……</div>';const c=document.getElementById('city').value.trim()||null;const {data,error}=await db.rpc('get_hot_videos_v1',{p_limit:50,p_city:c});if(error){list.innerHTML='<div class="empty">热榜读取失败：'+esc(error.message)+'</div>';return}list.innerHTML=(data||[]).length?(data||[]).map((v,i)=>`<div class="item" onclick="location.href='video-feed-v3.html?video=${v.video_id}'"><div class="rank">${i+1}</div>${v.cover_url?`<img class="thumb" src="${esc(v.cover_url)}">`:`<video class="thumb" muted playsinline preload="metadata" src="${esc(v.video_url)}"></video>`}<div><div class="title">${esc(v.title||'EchoCity 视频')}</div><div class="meta">${esc(v.city||'')} · ${v.published_at?new Date(v.published_at).toLocaleDateString():''}</div><div class="score">热度 ${Math.round(Number(v.hot_score||0))}</div></div></div>`).join(''):'<div class="empty">当前还没有已发布视频进入热榜。</div>'}document.getElementById('apply').onclick=load;load();</script></body></html>
