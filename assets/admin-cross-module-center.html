<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横向协同中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1500px,calc(100% - 22px));margin:auto;padding:14px 0 42px}.hero,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#111827,#0f766e)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.metric{padding:15px;border-radius:15px;background:#fff;border:1px solid #dbe3ee}.number{font-size:28px;font-weight:900;color:#0f766e}.label,.muted{color:#64748b}.card{padding:14px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px}.legend{display:flex;gap:8px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.table-wrap{overflow:auto;margin-top:12px;border:1px solid #dbe3ee;border-radius:14px}.matrix{border-collapse:separate;border-spacing:0;min-width:1600px;width:100%;background:#fff}.matrix th,.matrix td{padding:10px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;white-space:nowrap}.matrix th{position:sticky;top:0;background:#e8f5f2;z-index:2;color:#134e4a}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:1;background:#fff}.matrix th:first-child{z-index:3;background:#e8f5f2}.matrix tr:last-child td{border-bottom:0}.matrix a{color:#0f766e;text-decoration:none;font-weight:800}.matrix a:hover{text-decoration:underline}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.health-connected{background:#dcfce7;color:#166534}.health-incident{background:#fee2e2;color:#991b1b}.health-overdue{background:#ffedd5;color:#9a3412}.health-qualification_block,.health-gate_warning{background:#fef3c7;color:#92400e}.error{background:#fee2e2;color:#991b1b}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.hero{padding:17px}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>横向协同中心</h1><p>一个订单横向贯通内容来源、人员、方案、开工、施工、验收、结算、质保、售后与异常；所有状态实时取自原业务数据。</p></header><div id="message" class="card">正在建立跨模块数据视图……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div class="card"><div class="toolbar"><div><input id="search" placeholder="搜索订单号 / 服务类型 / 来源"><select id="health"><option value="">全部健康状态</option><option value="connected">互通正常</option><option value="incident">存在异常</option><option value="overdue">售后超时</option><option value="qualification_block">人员资格阻塞</option><option value="gate_warning">开工门禁异常</option></select></div><div class="legend"><span><i class="dot" style="background:#22c55e"></i>互通正常</span><span><i class="dot" style="background:#ef4444"></i>存在异常</span><span><i class="dot" style="background:#f59e0b"></i>需人工关注</span></div></div><div class="table-wrap"><table class="matrix"><thead><tr><th>统一订单</th><th>内容来源</th><th>健康</th><th>主状态 / 下一步</th><th>人员</th><th>实施方案</th><th>开工门禁</th><th>施工记录</th><th>质量验收</th><th>支付结算</th><th>质保</th><th>售后</th><th>异常</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN'):'—';const URL='https://dpljvspwcfglxfesxdmf.supabase.co',KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let orders=[];async function rpc(n,b){const r=await fetch(`${URL}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(b)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||`API ${r.status}`);return p}function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}const names={connected:'互通正常',incident:'存在异常',overdue:'售后超时',qualification_block:'人员资格阻塞',gate_warning:'开工门禁异常',unassigned:'未派工',profile_missing:'档案缺失',qualified:'资格合格',pending:'待处理',missing:'未建立',customer_confirmed:'客户已确认',platform_approved:'平台已批准',ready:'已齐备',blocked:'未齐备',not_ready:'未就绪',completed:'已完成',in_progress:'进行中',not_started:'未开始',not_applicable:'不适用',accepted:'客户已验收',awaiting_customer:'待客户验收',not_created:'未建立',archived:'已归档',payment_confirmed:'已确认付款',awaiting_payment:'待付款',pending_terms:'待设置条款',video:'视频',live:'直播',web:'网页'};const n=v=>names[v]||v||'—',link=(page,r,label)=>`<a href="${page}?request_no=${encodeURIComponent(r.request_no)}">${esc(label)}</a>`;function sourceLabel(r){const type=n(r.source_content_type||'web');const id=r.source_video_id||r.source_live_room_id;return id?`${type}<br><span class="muted">${esc(id)}</span>`:type}function render(){const term=$('search').value.trim().toLowerCase(),health=$('health').value,list=orders.filter(r=>(!health||r.health===health)&&(!term||`${r.request_no} ${r.service_type} ${r.source_content_type||''} ${r.source_video_id||''} ${r.source_live_room_id||''}`.toLowerCase().includes(term)));$('rows').innerHTML=list.map(r=>`<tr><td>${link('admin-order-360.html',r,r.request_no)}<br><span class="muted">${esc(r.service_type)}</span></td><td>${sourceLabel(r)}</td><td><span class="pill health-${esc(r.health)}">${esc(n(r.health))}</span></td><td>${esc(n(r.order_status))}<br><span class="muted">${esc(r.current_actor||'—')} → ${esc(r.next_action||'—')}</span></td><td>${link('admin-worker-management.html',r,n(r.worker_status))}</td><td>${link('admin-plan-center.html',r,n(r.plan_status))}</td><td>${link('admin-prestart-center.html',r,n(r.prestart_status))}</td><td>${link('admin-order-360.html',r,`${n(r.work_status)} · ${r.work_record_count}条`)}</td><td>${link('admin-quality-center.html',r,n(r.quality_status))}</td><td>${link('admin-settlement-ledger.html',r,n(r.settlement_status))}</td><td>${link('admin-warranty-center.html',r,n(r.warranty_status))}</td><td>${link('admin-warranty-center.html',r,`${r.open_after_sales}未结${r.overdue_after_sales?` / ${r.overdue_after_sales}超时`:''}`)}</td><td>${link('admin-incident-center.html',r,`${r.open_incidents}未结`)}</td><td>${esc(dt(r.updated_at))}</td></tr>`).join('')||'<tr><td colspan="14" class="muted">没有符合筛选条件的订单</td></tr>'}async function load(){try{const x=token();if(!x)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_cross_module_matrix_with_token',{p_token:x});orders=d.orders||[];const s=d.summary||{};$('metrics').innerHTML=[['订单总量',s.orders],['互通正常',s.connected],['需要关注',s.attention],['未结售后',s.open_after_sales],['未结异常',s.open_incidents]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');render();$('message').hidden=true;$('content').hidden=false}catch(e){$('message').textContent=`横向数据读取失败：${e.message}`;$('message').className='card error'}}$('search').addEventListener('input',render);$('health').addEventListener('change',render);load();
</script></body></html>
