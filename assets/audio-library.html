<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>音乐与原声 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:720px;margin:auto;padding:16px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900}.notice{background:#eff6ff;color:#1d4ed8;border-radius:14px;padding:13px;line-height:1.55;margin:14px 0}.card{background:#fff;border-radius:15px;padding:14px;margin:10px 0}.row{display:flex;gap:12px;align-items:center}.cover{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#e2e8f0}.info{flex:1}.meta{font-size:12px;color:#64748b;margin-top:4px}.empty{text-align:center;color:#64748b;padding:42px}</style></head><body><main class="wrap"><button class="back" onclick="history.back()">← 返回</button><h1>音乐与原声</h1><div class="notice">EchoCity 不建立“随便上传热门歌曲”的音乐库。平台曲库只展示已取得授权、平台自有版权或创作者确认拥有权利的音轨；视频自身声音作为“原声”使用。</div><div id="list"><div class="empty">正在读取授权音轨……</div></div></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');async function load(){const {data,error}=await db.from('audio_tracks').select('id,title,artist_name,cover_url,duration_seconds,source_type,rights_status').eq('status','active').in('rights_status',['licensed','owned']).order('created_at',{ascending:false}).limit(100);if(error){list.innerHTML='<div class="empty">读取失败：'+error.message+'</div>';return}list.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card"><div class="row">${x.cover_url?`<img class="cover" src="${x.cover_url}">`:`<div class="cover"></div>`}<div class="info"><b>${x.title}</b><div class="meta">${x.artist_name||'EchoCity 原声'} · ${x.source_type==='original'?'创作者原声':x.source_type==='licensed'?'已授权音乐':'平台音轨'} · ${x.rights_status}</div></div></div></div>`).join(''):'<div class="empty">当前授权曲库为空。发布视频仍可正常使用视频原声；后续取得正式音乐授权后可直接入库。</div>'}load();</script></body></html>
