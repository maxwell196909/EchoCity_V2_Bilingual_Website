<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台结算 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>body{margin:0;background:#eef4fb;font-family:Arial,"Microsoft YaHei";color:#17263b}.page{width:min(680px,calc(100% - 24px));margin:auto;padding:24px 0}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 10px 25px #17304c12}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5eaf1}.amount{font-size:28px;font-weight:800;color:#1556a3}button{width:100%;border:0;border-radius:12px;padding:14px;background:#1556a3;color:#fff;font-weight:800;margin-top:14px}button:disabled{opacity:.45}.message{margin-top:14px;line-height:1.6}</style></head><body><main class="page"><section class="card"><h1>平台订单结算</h1><div class="row"><span>订单号</span><strong id="no">—</strong></div><div class="row"><span>结算总额</span><strong id="total" class="amount">—</strong></div><div class="row"><span>工人应收</span><strong id="worker">—</strong></div><div class="row"><span>平台服务费</span><strong id="fee">—</strong></div><div class="row"><span>结算状态</span><strong id="status">—</strong></div></section><section class="card"><button id="payment" onclick="advance('confirm_payment')">确认客户款项已到账</button><button id="archive" onclick="advance('archive')">确认归档并关闭订单</button><div id="message" class="message"></div></section></main><script>let requestNo='',token='',settlement=null;const $=id=>document.getElementById(id);const labels={awaiting_payment:'等待客户付款',payment_confirmed:'客户付款已确认，等待工人收款',receipt_confirmed:'工人已确认收款，等待归档',archived:'已归档关闭'};async function load(){const p=new URLSearchParams(location.search),incoming=p.get('platform_token');requestNo=p.get('request_no')||'';if(incoming){sessionStorage.setItem('echocity-platform-token',incoming);p.delete('platform_token');history.replaceState(null,'',`${location.pathname}?${p}`)}token=incoming||sessionStorage.getItem('echocity-platform-token')||'';const {data,error}=await window.echoCitySupabase.rpc('get_order_settlement_with_token',{p_request_no:requestNo,p_role:'platform',p_token:token});if(error){$('message').textContent='读取结算失败，请重新从平台进入。';return}settlement=data;$('no').textContent=data.request_no;const money=v=>`${data.currency} ${Number(v||0).toFixed(2)}`;$('total').textContent=money(data.total_amount);$('worker').textContent=money(data.worker_amount);$('fee').textContent=money(data.platform_fee);$('status').textContent=labels[data.status]||data.status;$('payment').disabled=data.status!=='awaiting_payment';$('archive').disabled=data.status!=='receipt_confirmed';$('payment').style.display=data.status==='archived'?'none':'block';$('archive').style.display=data.status==='archived'?'none':'block';if(data.status==='archived')$('message').textContent='该订单已经完成结算并归档关闭，无需再次操作。'}async function advance(action){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='正在提交并核对状态……';const {data,error}=await window.echoCitySupabase.rpc('advance_order_settlement_with_token',{p_request_no:requestNo,p_role:'platform',p_token:token,p_action:action});if(error){$('message').textContent='操作失败，请刷新后重试。';await load();return}$('message').textContent=data.status==='payment_confirmed'?'付款已确认，请让工人确认收款。':'订单已归档关闭。';await load()}load();</script></body></html>
