<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台结算 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>body{margin:0;background:#eef4fb;font-family:Arial,"Microsoft YaHei";color:#17263b}.page{width:min(680px,calc(100% - 24px));margin:auto;padding:24px 0}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 10px 25px #17304c12}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #e5eaf1}.amount{font-size:28px;font-weight:800;color:#1556a3}label{display:block;margin-top:12px;font-weight:700}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:12px;padding:14px;background:#1556a3;color:#fff;font-weight:800;margin-top:14px}button:disabled{opacity:.45}.message{margin-top:14px;line-height:1.6}.error{color:#991b1b}.back{color:#1556a3;text-decoration:none;font-weight:700}</style></head><body><main class="page"><a class="back" href="admin-service-requests.html">← 返回订单管理</a><section class="card"><h1>平台订单结算</h1><div class="row"><span>订单号</span><strong id="no">—</strong></div><div class="row"><span>结算总额</span><strong id="totalView" class="amount">—</strong></div><div class="row"><span>工人应收</span><strong id="workerView">—</strong></div><div class="row"><span>平台服务费</span><strong id="feeView">—</strong></div><div class="row"><span>结算状态</span><strong id="status">—</strong></div></section><section id="setup" class="card" hidden><h2>建立结算单</h2><p>最终验收已完成。请核对总额及工人、平台分配；两项之和必须等于总额。</p><label>结算总额<input id="total" inputmode="decimal"></label><label>工人应收<input id="worker" inputmode="decimal"></label><label>平台服务费<input id="fee" inputmode="decimal"></label><label>币种<select id="currency"><option value="CNY">人民币 CNY</option><option value="USD">美元 USD</option></select></label><button onclick="createSettlement()">核对并建立结算单</button></section><section class="card"><button id="payment" onclick="advance('confirm_payment')" hidden>确认客户款项已到账</button><button id="archive" onclick="advance('archive')" hidden>确认归档并关闭订单</button><div id="message" class="message">正在安全读取结算信息……</div></section></main><script>
let requestNo='',token='';const $=id=>document.getElementById(id);const labels={awaiting_payment:'等待客户付款',payment_confirmed:'客户付款已确认，等待工人收款',receipt_confirmed:'工人已确认收款，等待归档',archived:'已归档关闭'};
async function rpc(name,args){const {data,error}=await window.echoCitySupabase.rpc(name,args);if(error)throw error;return data}
function readCredentials(){const p=new URLSearchParams(location.search),incoming=p.get('platform_token');requestNo=p.get('request_no')||'';if(incoming){sessionStorage.setItem('echocity-platform-token',incoming);p.delete('platform_token');history.replaceState(null,'',`${location.pathname}?${p}`)}token=incoming||sessionStorage.getItem('echocity-platform-token')||localStorage.getItem('echocity-platform-token')||''}
function money(v,c='CNY'){return `${c} ${Number(v||0).toFixed(2)}`}
function showSettlement(d){document.querySelectorAll('button').forEach(b=>b.disabled=false);$('message').className='message';$('setup').hidden=true;$('totalView').textContent=money(d.total_amount,d.currency);$('workerView').textContent=money(d.worker_amount,d.currency);$('feeView').textContent=money(d.platform_fee,d.currency);$('status').textContent=labels[d.status]||d.status;$('payment').hidden=d.status!=='awaiting_payment';$('archive').hidden=d.status!=='receipt_confirmed';$('message').textContent=d.status==='archived'?'该订单已经完成结算并归档关闭。':'结算单已建立，请按当前责任方完成下一步。'}
async function load(){try{readCredentials();if(!requestNo||!token)throw new Error('链接缺少订单号或平台访问凭证');const d=await rpc('prepare_order_settlement_with_token',{p_request_no:requestNo,p_token:token});$('no').textContent=d.request_no;if(d.settlement){showSettlement(d.settlement);return}$('total').value=Number(d.quote_amount||0).toFixed(2);$('totalView').textContent='尚未建立';$('status').textContent='待平台核定';$('setup').hidden=false;$('message').textContent='请先建立结算单。'}catch(e){$('message').textContent=`读取结算失败：${e.message}`;$('message').className='message error'}}
async function createSettlement(){const total=Number($('total').value),worker=Number($('worker').value),fee=Number($('fee').value);if(!Number.isFinite(total)||!Number.isFinite(worker)||!Number.isFinite(fee)){alert('请完整填写三个金额。');return}if(Math.round((worker+fee)*100)!==Math.round(total*100)){alert('工人应收与平台服务费之和必须等于结算总额。');return}if(!confirm(`确认建立结算单？\n总额：${money(total,$('currency').value)}\n工人：${money(worker,$('currency').value)}\n平台：${money(fee,$('currency').value)}`))return;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await rpc('create_order_settlement_with_token',{p_request_no:requestNo,p_token:token,p_total_amount:total,p_worker_amount:worker,p_platform_fee:fee,p_currency:$('currency').value});await load()}catch(e){$('message').textContent=`建立结算单失败：${e.message}`;$('message').className='message error';document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function advance(action){if(!confirm(action==='confirm_payment'?'确认已经核对真实到账凭证？':'确认工人已收款并归档关闭订单？'))return;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='正在提交并核对状态……';try{await rpc('advance_order_settlement_with_token',{p_request_no:requestNo,p_role:'platform',p_token:token,p_action:action});await load()}catch(e){$('message').textContent=`操作失败：${e.message}`;$('message').className='message error';document.querySelectorAll('button').forEach(b=>b.disabled=false)}}load();
</script></body></html>
