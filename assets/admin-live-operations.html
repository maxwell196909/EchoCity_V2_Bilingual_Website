<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直播运营 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900}.dark{background:#111827;color:#fff}.chips{display:flex;gap:8px;overflow:auto;margin:16px 0}.chip{border:0;border-radius:999px;padding:9px 13px;background:#fff}.chip.on{background:#111827;color:#fff}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 5px 20px #0f172a0b}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:11px}.meta{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.warn{background:#dc2626;color:#fff}.restore{background:#e2e8f0}.empty{text-align:center;color:#64748b;padding:40px}</style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="history.back()">← 返回</button><h2>直播运营后台</h2><button class="btn dark" onclick="load()">刷新</button></div><div class="chips"><button class="chip on" data-status="live">直播中</button><button class="chip" data-status="scheduled">待开播</button><button class="chip" data-status="ended">已结束</button><button class="chip" data-status="">全部</button></div><section id="list"><div class="empty">正在读取……</div></section></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');let filter='live';function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),t=q.get('platform_token')||h.get('platform_token')||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}return t}function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const t=token();if(!t){list.innerHTML='<div class="empty">缺少平台访问凭证</div>';return}list.innerHTML='<div class="empty">读取中……</div>';const {data,error}=await db.rpc('list_platform_live_rooms_with_token',{p_token:t,p_status:filter||null});if(error){list.innerHTML='<div class="empty">读取失败：'+esc(error.message)+'</div>';return}const rows=Array.isArray(data)?data:[];list.innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="row"><div><span class="status">${r.status==='live'?'直播中':r.status==='scheduled'?'待开播':'已结束'}</span><h3>${esc(r.title)}</h3><div class="meta">主播：${esc(r.host_name)}${r.city?' · '+esc(r.city):''}<br>观看：${r.viewer_count||0} · 峰值：${r.peak_viewers||0} · 举报：${r.report_count||0}<br>供应商：${esc(r.stream_provider||'未接入')}</div></div><button class="btn" onclick="location.href='live-room.html?id=${r.room_id}'">查看</button></div><div class="actions">${r.status!=='ended'?`<button class="warn" onclick="act('${r.room_id}','end')">强制结束</button>`:''}${r.status==='ended'?`<button class="restore" onclick="act('${r.room_id}','restore')">恢复待开播</button>`:''}</div></article>`).join(''):'<div class="empty">当前没有直播记录</div>'}async function act(id,action){const note=prompt('填写平台处理备注（可选）')||'';if(action==='end'&&!confirm('确认由平台强制结束该直播？'))return;const {error}=await db.rpc('review_platform_live_room_with_token',{p_token:token(),p_room_id:id,p_action:action,p_note:note});if(error)return alert('处理失败：'+error.message);load()}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.status;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));load()});load();</script></body></html>
