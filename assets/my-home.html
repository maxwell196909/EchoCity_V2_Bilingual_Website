<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 32px}.profile{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:18px;padding:18px}.avatar{width:70px;height:70px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:26px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:22px;font-weight:900;margin-top:10px}.bio{color:#cbd5e1;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}.stats b{display:block;font-size:19px}.stats span{font-size:12px;color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.item{background:#fff;border-radius:14px;padding:16px;font-weight:800}.item small{display:block;color:#64748b;font-weight:400;margin-top:5px}.section{margin-top:20px}.section h2{font-size:17px}.wide{background:#fff;border-radius:14px;padding:15px;margin:8px 0;font-weight:800}</style></head><body><main class="wrap"><section class="profile"><div id="avatar" class="avatar">E</div><div id="name" class="name">EchoCity 用户</div><div id="bio" class="bio"></div><div class="stats"><div><b id="following">0</b><span>关注</span></div><div><b id="followers">0</b><span>粉丝</span></div><div><b id="likes">0</b><span>获赞</span></div></div></section><div class="grid"><div class="item" onclick="location.href='video-library.html'">收藏 / 喜欢 / 历史<small>我的内容库</small></div><div class="item" onclick="location.href='creator-center.html'">创作者中心<small>作品与数据</small></div><div class="item" onclick="location.href='video-publish.html'">发布作品<small>上传短视频</small></div><div class="item" onclick="location.href='messages-home.html'">消息<small>通知与私信</small></div></div><section class="section"><h2>EchoCity 业务</h2><div class="wide" onclick="location.href='customer-role-home.html'">客户服务中心</div><div class="wide" onclick="location.href='worker-role-home.html'">服务人员中心</div><div class="wide" onclick="location.href='../index.html'">城市服务首页</div><div class="wide" onclick="location.href='admin-dashboard.html'">平台管理后台</div></section></main><script>const db=window.echoCitySupabase;async function load(){const {data:u}=await db.auth.getUser();const me=u?.user;if(!me){bio.textContent='登录后可查看个人资料、收藏和创作者数据';return}const [{data:p},{data:s}]=await Promise.all([db.from('profiles').select('display_name,avatar_url,bio').eq('id',me.id).maybeSingle(),db.rpc('get_creator_social_stats',{p_creator_id:me.id})]);if(p){name.textContent=p.display_name||me.email?.split('@')[0]||'EchoCity 用户';bio.textContent=p.bio||'';if(p.avatar_url)avatar.innerHTML='<img src="'+p.avatar_url.replace(/\"/g,'')+'">';else avatar.textContent=(p.display_name||'E').slice(0,1).toUpperCase()}const st=Array.isArray(s)?s[0]:s;if(st){following.textContent=st.following_count||0;followers.textContent=st.follower_count||0;likes.textContent=st.total_likes||0}}load();</script></body></html>
