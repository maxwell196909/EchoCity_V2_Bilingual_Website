<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人员与信用管理 | EchoCity</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1100px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border:1px solid #dbe3ee;border-radius:20px;background:#fff}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#12345b,#0f766e)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.metric,.worker{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:16px}.number{font-size:28px;font-weight:900;color:#0f766e}.label,.muted{color:#64748b}.list{display:grid;gap:12px}.worker{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:14px;align-items:center}.name{font-size:18px;font-weight:900}.score{font-size:22px;font-weight:900;color:#1d4ed8}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.tag.active{background:#dcfce7;color:#166534}.tag.paused,.tag.suspended{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn-primary{background:#0f766e;color:#fff}.btn-warn{background:#fff1f2;color:#9f1239}.btn:disabled{opacity:.45;cursor:not-allowed}.message{padding:14px;margin-top:14px;border-radius:14px;background:#fff;border:1px solid #dbe3ee}.error{background:#fee2e2;color:#991b1b}.empty{padding:24px;text-align:center;color:#64748b}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.worker{grid-template-columns:1fr}.actions{justify-content:flex-start}}
  </style>
</head>
<body><main class="page">
  <header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>人员与服务信用管理</h1><p>统一管理服务人员准入、在岗状态、履约成绩和信用记录</p></header>
  <div id="message" class="message">正在读取人员档案……</div>
  <section id="content" hidden><div id="metrics" class="metrics"></div><div id="workers" class="list"></div></section>
</main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusText={pending:'待准入',active:'在岗',paused:'已暂停',suspended:'已停用'},verifyText={unverified:'未核验',pending:'核验中',verified:'已认证',rejected:'未通过'},availabilityText={available:'可接单',busy:'服务中',offline:'离线'};
let platformToken='';
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co';
const SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';
async function rpc(name,body){
  const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const payload=await response.json().catch(()=>null);
  if(!response.ok)throw new Error(payload?.message||payload?.hint||`API ${response.status}`);
  return payload;
}
function token(){const p=new URLSearchParams(location.search),x=p.get('platform_token');if(x){sessionStorage.setItem('echocity-platform-token',x);p.delete('platform_token');history.replaceState(null,'',location.pathname)}return x||sessionStorage.getItem('echocity-platform-token')||''}
function maskPhone(v){if(!v)return '未登记手机号';return v.length>7?`${v.slice(0,3)}****${v.slice(-4)}`:v}
async function setStatus(id,status,button){
  if(!confirm(`确认将该服务人员调整为“${statusText[status]}”吗？`))return;
  document.querySelectorAll('.btn').forEach(x=>x.disabled=true);button.textContent='正在保存…';
  try{await rpc('update_platform_worker_status_with_token',{p_token:platformToken,p_worker_id:id,p_status:status})}catch(e){alert(`操作失败：${e.message}`)}
  await load();
}
async function load(){
  try{platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_worker_roster_with_token',{p_token:platformToken});
    const s=d.summary||{};$('metrics').innerHTML=[['人员总数',s.total],['在岗人员',s.active],['当前可接单',s.available],['待资格核验',s.pending_verification]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');
    const workers=d.workers||[];$('workers').innerHTML=workers.length?workers.map(w=>`<article class="worker"><div><div class="name">${esc(w.full_name)}</div><div class="muted">${esc(maskPhone(w.phone))}${w.city?` · ${esc(w.city)}`:''}</div><div class="tags"><span class="tag ${esc(w.status)}">${esc(statusText[w.status]||w.status)}</span><span class="tag">${esc(verifyText[w.verification_status]||w.verification_status)}</span><span class="tag">${esc(availabilityText[w.availability_status]||w.availability_status)}</span></div></div><div><div class="score">${esc(w.credit_score)} 分</div><div class="muted">服务信用</div></div><div><strong>${esc(w.completed_orders)}</strong> 完成 · <strong>${esc(w.rework_count)}</strong> 返工 · <strong>${esc(w.dispute_count)}</strong> 争议</div><div class="actions"><button class="btn btn-primary" ${w.status==='active'?'disabled':''} onclick="setStatus('${esc(w.id)}','active',this)">恢复在岗</button><button class="btn btn-warn" ${w.status==='paused'?'disabled':''} onclick="setStatus('${esc(w.id)}','paused',this)">暂停接单</button></div></article>`).join(''):'<div class="empty">暂无服务人员，请先完成一次派工。</div>';
    $('message').hidden=true;$('content').hidden=false;
  }catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`人员数据读取失败：${e.message}`;$('message').className='message error'}
}
load();
</script></body></html>
