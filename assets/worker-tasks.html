<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>我的任务 | EchoCity</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --success: #15803d;
      --success-soft: #ecfdf3;

      --warning: #a16207;
      --warning-soft: #fff7ed;

      --danger: #b91c1c;
      --danger-soft: #fef2f2;

      --info: #1e40af;
      --info-soft: #eff6ff;

      --text: #172033;
      --muted: #667085;

      --border: #d8dee9;
      --background: #f3f6fb;
      --card: #ffffff;

      --shadow:
        0 14px 36px
        rgba(
          31,
          41,
          55,
          0.08
        );
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #edf5ff,
          var(--background)
        );
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width:
        min(
          980px,
          calc(100% - 24px)
        );

      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 800;
    }

    .logo {
      display: grid;
      place-items: center;

      width: 38px;
      height: 38px;

      border-radius: 12px;

      background: var(--primary);
      color: #ffffff;

      font-weight: 900;
    }

    .back-button,
    .language-button {
      padding: 8px 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: #ffffff;
      color: var(--text);

      font-weight: 700;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size:
        clamp(
          30px,
          6vw,
          44px
        );

      line-height: 1.2;
    }

    .hero p {
      margin-top: 10px;

      color: var(--muted);

      line-height: 1.7;
    }

    .card {
      margin-top: 16px;
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 21px;
      line-height: 1.4;
    }

    .card-description {
      margin-top: 7px;

      color: var(--muted);

      line-height: 1.6;
    }

    .search-row {
      display: grid;
      grid-template-columns:
        1fr auto;
      gap: 10px;

      margin-top: 16px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      outline: none;
    }

    .input,
    .select {
      min-height: 46px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 100px;
      padding: 12px;

      resize: vertical;
      line-height: 1.65;
    }

    .file-input {
      width: 100%;
      margin-bottom: 9px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 11px;
      background: #ffffff;
      color: var(--text);
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(
          37,
          99,
          235,
          0.12
        );
    }

    .primary-button,
    .secondary-button,
    .success-button,
    .warning-button,
    .danger-button {
      min-height: 44px;
      padding: 0 16px;

      border-radius: 11px;

      font-weight: 800;
    }

    .primary-button {
      border: 0;

      background: var(--primary);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      border: 1px solid var(--border);

      background: #ffffff;
      color: var(--text);
    }

    .success-button {
      border: 0;

      background: var(--success);
      color: #ffffff;
    }

    .warning-button {
      border: 0;

      background: var(--warning);
      color: #ffffff;
    }

    .danger-button {
      border: 0;

      background: var(--danger);
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 14px;
      padding: 12px 14px;

      border-radius: 11px;

      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: var(--info-soft);
      color: var(--info);
    }

    .message.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .message.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .task-list {
      display: grid;
      gap: 16px;

      margin-top: 16px;
    }

    .task-card {
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: #ffffff;
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .task-number {
      font-size: 20px;
      font-weight: 900;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;

      min-height: 30px;
      padding: 4px 11px;

      border-radius: 999px;

      background: var(--info-soft);
      color: var(--info);

      font-size: 13px;
      font-weight: 800;
    }

    .task-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 10px;

      margin-top: 14px;
    }

    .detail {
      padding: 11px;

      border-radius: 11px;

      background: #f8fafc;
    }

    .detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;
    }

    .detail-value {
      margin-top: 5px;

      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      margin-top: 16px;
    }

    .readiness-panel {
      grid-column: 1 / -1;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }

    .readiness-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .readiness-list {
      display: grid;
      gap: 8px;
    }

    .readiness-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }

    .readiness-item.pass {
      color: #16713a;
    }

    .readiness-item.fail {
      color: #a33a28;
    }

    .prestart-checks {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .prestart-check {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      line-height: 1.5;
    }

    .work-panel {
      margin-top: 16px;
      padding: 16px;

      border: 1px dashed var(--border);
      border-radius: 14px;

      background: #fafcff;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 13px;

      margin-top: 14px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 13px;
      font-weight: 800;
    }

    .panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 15px;
    }

    @media (
      max-width: 700px
    ) {
      .search-row,
      .task-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .detail.full,
      .form-group.full {
        grid-column: 1;
      }

      .task-header {
        flex-direction: column;
      }

      .task-actions,
      .panel-actions {
        flex-direction: column;
      }

      .task-actions button,
      .panel-actions button,
      .search-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">

      <button id="backButton" class="back-button" type="button">← 返回</button>

      <div class="brand">

    <section class="hero">

        recordSaveFailed: "工作记录保存失败。",

        completionFailed: "最终完成提交失败。",
        closePanel: "关闭"
      },

      en: {
        backButton: "← Back",
        pageTitle: "My Tasks",
        pageDescription: "Find and process service tasks assigned to you.",
        searchTitle: "Find Worker Tasks",
        searchDescription: "Enter the worker phone number used by the administrator.",
        workerPhonePlaceholder: "Enter worker phone number",
        searchButton: "Find Tasks",
        searching: "Searching for tasks...",
        noTasks: "No tasks were found for this phone number.",
        taskListTitle: "My Service Tasks",
        taskListDescription: "Complete acceptance, arrival, start, work records, and completion in order.",
        loadSuccess: "Tasks loaded successfully.",
        loadFailed: "Unable to load tasks. Check the network or database.",
        supabaseUnavailable: "Supabase connection is unavailable.",
        requestNumber: "Request Number",
        status: "Task Status",
        customerPhone: "Customer Phone",
        serviceAddress: "Service Address",
        meetingDate: "Meeting Date",
        meetingTime: "Meeting Time",
        siteManager: "Site Manager",
        siteManagerPhone: "Manager Phone",
        assignmentNotes: "Assignment Notes",
        estimatedDuration: "Estimated Duration",
        workerName: "Worker Name",
        workerPhone: "Worker Phone",
        workerRole: "Worker Role",
        workerPay: "Worker Pay",
        notProvided: "Not provided",
        statusAssigned: "Assigned",
        statusAccepted: "Accepted",
        statusArrived: "Arrived",
        statusWorking: "Work in Progress",
        statusCompleted: "Completion Submitted",
        statusConditional: "Conditionally Completed",
        statusRework: "Rework Required",
        statusDisputed: "Disputed",
        acceptTask: "Accept Task",
        confirmArrival: "Confirm Arrival",
        startWork: "Start Work",
        saveWork: "Save Work Record",
        submitCompletion: "Submit Final Completion",
        taskAccepted: "The task has been accepted.",
        arrivalConfirmed: "Arrival at the site has been confirmed.",
        workStarted: "The work has started.",
        statusUpdateFailed: "Unable to update the task status.",
        workPanelTitle: "Daily Work Record",
        workDate: "Work Date",
        startTime: "Start Time",
        endTime: "End Time",
        workHours: "Work Hours",
        workProgress: "Work Progress",
        materialsUsed: "Materials Used",
        issuesFound: "Issues Found",
        photoRecord: "Photo Record",
        videoRecord: "Video Record",
        choosePhotos: "Choose Photos (multiple allowed)",
        chooseVideos: "Choose Videos (multiple allowed)",
        optionalMediaUrl: "Optional: paste existing file links",
        uploadingMedia: "Uploading photos and videos...",
        mediaTooLarge: "Each file must be 50MB or smaller.",
        customerSiteComment: "Customer Site Comment",
        finalCompletionTitle: "Final Completion",
        completionSummary: "Completion Summary",
        completionEvidence: "Completion Evidence",
        outstandingIssues: "Outstanding Issues",
        customerAcceptanceItems: "Items Requiring Customer Acceptance",
        requiredWorkFields: "Enter the work date and work progress.",
        requiredCompletionFields: "Enter the completion summary and acceptance items.",
        recordSaved: "The work record was saved.",
        recordSaveFailed: "Unable to save the work record.",
        completionSubmitted: "Final completion was submitted for customer acceptance.",
        completionFailed: "Unable to submit final completion.",
        closePanel: "Close"
      }
    };

    let currentLanguage =
      localStorage.getItem(
        "echocity-language"
      ) || "zh";

    let loadedTasks = [];

    const workerLinkParams = new URLSearchParams(window.location.search);
    const workerLinkSecret = new URLSearchParams(window.location.hash.slice(1));
    const workerRequestNo = String(
      workerLinkParams.get("request_no") ||
      workerLinkParams.get("request") ||
      ""
    ).trim().toUpperCase();
    const workerTaskToken = String(
      workerLinkParams.get("worker_token") ||
      workerLinkParams.get("task_token") ||
      workerLinkParams.get("token") ||
      workerLinkSecret.get("token") ||
      ""
    ).trim();

    function hasValidWorkerLink() {
      return /^REQ-[A-Z0-9-]{4,80}$/.test(workerRequestNo) &&
        workerTaskToken.length >= 32 &&
        workerTaskToken.length <= 128;
    }

    async function loadDedicatedWorkerTask(showSuccess = true) {
      if (!hasValidWorkerLink()) {
        throw new Error(bi(
          "服务方专用链接无效或缺少访问凭证，请使用平台最新发送的任务链接。",
          "The worker link is invalid or missing its access token. Use the latest task link from the platform."
        ));
      }

      const client = getSupabaseClient();
      const { data, error } = await client.rpc("read_task_with_token", {
        p_request_no: workerRequestNo,
        p_token: workerTaskToken,
        p_role: "worker"
      });

      if (error) throw error;
      if (!data) throw new Error(bi("任务不存在或链接已经失效。", "The task was not found or the link has expired."));

      const plans = Array.isArray(data.plans) ? data.plans : [];
      loadedTasks = [{
        ...data,
        implementation_plan: plans[0] || null
      }];

      document.getElementById("taskSection").classList.remove("hidden");
      renderTasks();
      handleWorkspaceMode();

      if (showSuccess) showMessage(translate("loadSuccess"), "success");
      return loadedTasks[0];
    }

    function translate(key) {
      return (
        translations[currentLanguage]?.[key] ||
        translations.zh[key] ||
        key
      );
    }

    function setText(
      elementId,
      translationKey
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (element) {
        element.textContent =
          translate(
            translationKey
          );
      }
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh"
          ? "zh-CN"
          : "en";

      document.title =
        `${translate("pageTitle")} | EchoCity`;

      const textMap = {
        backButton: "backButton",
        pageTitle: "pageTitle",
        pageDescription: "pageDescription",
        searchTitle: "searchTitle",
        searchDescription: "searchDescription",
        searchButton: "searchButton",
        taskListTitle: "taskListTitle",
        taskListDescription: "taskListDescription"
      };

      Object.entries(
        textMap
      ).forEach(
        ([
          elementId,
          translationKey
        ]) => {
          setText(
            elementId,
            translationKey
          );
        }
      );

      document.getElementById(
        "workerPhoneInput"
      ).placeholder =
        translate(
          "workerPhonePlaceholder"
        );

      document.getElementById(
        "languageButton"
      ).textContent =
        currentLanguage === "zh"
          ? "EN"
          : "中文";

      if (
        loadedTasks.length > 0
      ) {
        renderTasks();
      }
    }

    function normalizePhone(value) {
      return String(
        value || ""
      )
        .trim()
        .replace(
          /[^\d+]/g,
          ""
        );
    }

    function escapeHTML(value) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    function showMessage(
      text,
      type = "info"
    ) {
      const messageBox =
        document.getElementById(
          "message"
        );

      messageBox.textContent =
        text;

      messageBox.className =
        `message show ${type}`;
    }

    function clearMessage() {
      const messageBox =
        document.getElementById(
          "message"
        );

      messageBox.textContent =
        "";

      messageBox.className =
        "message";
    }

    function getSupabaseClient() {
      const client =
        window.echoCitySupabase;

      if (
        !client ||
        typeof client.from !==
          "function"
      ) {
        throw new Error(
          translate(
            "supabaseUnavailable"
          )
        );
      }

      return client;
    }

    function getStatusText(status) {
      const statusMap = {
        assigned:
          "statusAssigned",

        accepted:
          "statusAccepted",

        arrived:
          "statusArrived",

        working:
          "statusWorking",

        in_progress:
          "statusWorking",

        completed:
          "statusCompleted",

        awaiting_final_acceptance:
          "statusCompleted",

        conditionally_completed:
          "statusConditional",

        final_rework:
          "statusRework",

        disputed:
          "statusDisputed"
      };

      return translate(
        statusMap[status] ||
        "status"
      );
    }

    function createDetail(
      label,
      value,
      fullWidth = false
    ) {
      const displayValue =
        value === null ||
        value === undefined ||
        value === ""
          ? translate(
              "notProvided"
            )
          : value;

      return `
        <div class="detail ${
          fullWidth
            ? "full"
            : ""
        }">
          <div class="detail-label">
            ${escapeHTML(label)}

    async function searchWorkerTasks() {
      if (!hasValidWorkerLink()) {
        showMessage(
          bi(
            "为保护订单数据，服务方任务必须通过平台发送的专用链接打开。",
            "To protect order data, worker tasks must be opened from the dedicated platform link."
          ),
          "error"
        );
        return;
      }

      try {
        showMessage(translate("searching"), "info");
        await loadDedicatedWorkerTask(true);
      } catch (error) {
        console.error("Dedicated worker task load failed:", error);
        loadedTasks = [];
        document.getElementById("taskSection").classList.add("hidden");
        showMessage(error?.message || translate("loadFailed"), "error");
      }
      return;

      const phone =
        normalizePhone(
          document.getElementById(
            "workerPhoneInput"
          ).value
        );

      if (!phone) {
        showMessage(
          translate(
            "workerPhonePlaceholder"
          ),
          "error"
        );

        return;
      }

      localStorage.setItem(
        "echocity-worker-phone",
        phone
      );

      const searchButton =
        document.getElementById(
          "searchButton"
        );

      searchButton.disabled =
        true;

      showMessage(
        translate(
          "searching"
        ),
        "info"
      );

      try {
        const client =
          getSupabaseClient();

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .select("*")
          .eq(
            "assigned_worker_phone",
            phone
          )
          .order(
            "updated_at",
            {
              ascending: false
            }
          );

        if (error) {
          throw error;
        }

        loadedTasks =
          Array.isArray(data)
            ? data
            : [];

        const requestNumbers =
          loadedTasks
            .map((task) => task.request_no)
            .filter(Boolean);

        if (requestNumbers.length) {
          const {
            data: plans,
            error: planError
          } = await client
            .from("implementation_plans")
            .select("*")
            .in("request_no", requestNumbers)
            .order("version", { ascending: false });

          if (planError) {
            console.warn(
              "Implementation plans could not be loaded:",
              planError
            );
          } else {
            const latestPlans = new Map();

            (plans || []).forEach((plan) => {
              if (!latestPlans.has(plan.request_no)) {
                latestPlans.set(plan.request_no, plan);
              }
            });

            loadedTasks = loadedTasks.map((task) => ({
              ...task,
              implementation_plan:
                latestPlans.get(task.request_no) || null
            }));
          }
        }

        if (
          loadedTasks.length === 0
        ) {
          document.getElementById(
            "taskSection"
          ).classList.add(
            "hidden"
          );

          showMessage(
            translate(
              "noTasks"
            ),
            "warning"
          );

          return;
        }

        document.getElementById(
          "taskSection"
        ).classList.remove(
          "hidden"
        );

        renderTasks();

        handleWorkspaceMode();

        showMessage(
          translate(
            "loadSuccess"
          ),
          "success"
        );
      } catch (error) {
        console.error(
          "Worker task search failed:",
          error
        );

        loadedTasks = [];

        document.getElementById(
          "taskSection"
        ).classList.add(
          "hidden"
        );

        showMessage(
          error?.message ||
          translate(
            "loadFailed"
          ),
          "error"
        );
      } finally {
        searchButton.disabled =
          false;
      }
    }

    function findTask(requestNo) {

    function handleWorkspaceMode() {
      const mode = new URLSearchParams(
        window.location.search
      ).get("mode");

      if (!mode || mode === "tasks" || mode === "progress") {
        return;
      }

      if (mode === "reminders") {
        const blockedCount = loadedTasks.filter(
          (item) => getReadiness(item).some((check) => !check.pass)
        ).length;

        showMessage(
          bi(
            `Echo 提醒：共有 ${blockedCount} 个任务存在未完成的开工条件，请查看任务卡中的检查清单。`,
            `Echo reminder: ${blockedCount} task(s) have incomplete pre-start conditions. Review the checklist in each task card.`
          ),
          blockedCount ? "warning" : "success"
        );
        return;
      }

      const task =
        mode === "start"
          ? loadedTasks.find((item) => item.status === "arrived")
          : loadedTasks.find((item) =>
              ["working", "in_progress"].includes(item.status)
            );

      if (!task) {
        showMessage(
          bi(
            "当前没有符合该操作阶段的任务，请查看任务状态和开工条件。",
            "No task is currently at this action stage. Review its status and readiness."
          ),
          "warning"
        );
        return;
      }

      if (mode === "start") {
        openPrestartPanel(task.request_no);
      } else if (mode === "records") {
        openWorkPanel(task.request_no);
      } else if (mode === "milestones") {
        openCompletionPanel(task.request_no);
      }
    }

    function formatPlanContent(plan) {
      if (!plan?.content) {
        return "";
      }

      if (typeof plan.content === "string") {
        return plan.content;
      }

      const content = plan.content;
      return [
        content.scope || content.work_scope,
        content.quality_requirements || content.quality,
        content.completion_standard || content.standard,
        content.method || content.construction_method
      ].filter(Boolean).join("\n");
    }

    function getReadiness(task) {
      const plan = task.implementation_plan;
      const agreement = task.prework_agreement || {};

        [];

      return [
        {
          label: bi("客户已确认报价及工作", "Customer approved quote and work"),
          pass: task.quote_confirmed === true ||
            !["draft", "submitted", "reviewed", "quoted"].includes(task.status)
        },
        {

          pass: Boolean(plan?.approved_at) ||
            ["approved", "customer_confirmed"].includes(plan?.status) ||

            ["approved", "customer_confirmed"].includes(agreement.plan_status)
        },
        {
          label: bi("客户已确认施工方案", "Customer confirmed implementation plan"),
          pass: Boolean(plan?.customer_confirmed_at) ||
            Boolean(agreement.plan_customer_confirmed_at) ||
            agreement.plan_status === "customer_confirmed"
        },
        {
          label: bi("现场关键条件已确认", "Critical site conditions confirmed"),

    }    async function updateTaskStatus(
      requestNo,
      newStatus,
      successMessage
    ) {
      try {
        if (!hasValidWorkerLink() || requestNo !== workerRequestNo) {
          throw new Error(bi("服务方专用链接无效。", "The worker link is invalid."));
        }

        const action = newStatus === "accepted"
          ? "accept"
          : newStatus === "arrived"
            ? "arrive"
            : null;

        if (!action) throw new Error("INVALID_WORKER_ACTION");

        const client = getSupabaseClient();
        const { error } = await client.rpc("transition_worker_task_with_token", {
          p_request_no: requestNo,
          p_token: workerTaskToken,
          p_action: action
        });

        if (error) throw error;
        await loadDedicatedWorkerTask(false);
        showMessage(translate(successMessage), "success");
        return true;
      } catch (error) {
        console.error("Secure worker transition failed:", error);
        showMessage(error?.message || translate("statusUpdateFailed"), "error");
        return false;
      }

      try {
        const client =
          getSupabaseClient();

        const updatedAt =
          new Date().toISOString();

        const updateData = {
          status: newStatus,
          updated_at: updatedAt
        };

        if (
          newStatus ===
          "accepted"
        ) {
          updateData.accepted_at =
            updatedAt;
        }

        if (
          newStatus ===
          "arrived"
        ) {
          updateData.arrived_at =
            updatedAt;
        }

        if (
          newStatus ===
          "in_progress"
        ) {
          updateData.work_started_at =
            updatedAt;
        }

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .update(
            updateData
          )
          .eq(
            "request_no",
            requestNo
          )
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const taskIndex =
          loadedTasks.findIndex(
            (task) =>
              String(
                task.request_no
              ) ===
              String(
                requestNo
              )
          );

        if (
          taskIndex >= 0
        ) {
          loadedTasks[
            taskIndex
          ] =
            data || {
              ...loadedTasks[
                taskIndex
              ],
              ...updateData
            };
        }

        renderTasks();

        showMessage(
          translate(
            successMessage
          ),
          "success"
        );

        return true;
      } catch (error) {
        console.error(
          "Task status update failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "statusUpdateFailed"
          ),
          "error"
        );

        return false;
      }
    }

    async function confirmPrestartAndStart(requestNo) {
      const task = findTask(requestNo);
      const siteConfirmed = document.getElementById(`siteCondition-${requestNo}`)?.checked;
      const scopeConfirmed = document.getElementById(`scopeCondition-${requestNo}`)?.checked;
      const photoFiles = Array.from(
        document.getElementById(`prestartPhotos-${requestNo}`)?.files || []
      );

      if (!siteConfirmed || !scopeConfirmed || photoFiles.length === 0) {
        showMessage(
          bi("请完成两项确认并至少上传一张开工前照片。", "Complete both confirmations and upload at least one photo."),
          "error"
        );
        return;
      }

      try {
        const upload = await uploadSecureWorkerPhoto(
          "prestart",
          requestNo,
          photoFiles[0]
        );
        const client = getSupabaseClient();
        const { error } = await client.rpc("start_task_with_token", {
          p_request_no: requestNo,
          p_token: workerTaskToken,
          p_site_conditions_confirmed: true,
          p_scope_confirmed: true,
          p_storage_path: upload.path,
          p_file_name: photoFiles[0].name,
          p_file_size: photoFiles[0].size,
          p_mime_type: photoFiles[0].type
        });

        if (error) throw error;
        await loadDedicatedWorkerTask(false);
        showMessage(translate("workStarted"), "success");
        return;
      } catch (error) {
        console.error("Secure pre-start confirmation failed:", error);
        showMessage(error?.message || translate("statusUpdateFailed"), "error");
        return;
      }

      try {
        const client = getSupabaseClient();
        const workerPhone = normalizePhone(
          task.assigned_worker_phone ||
          document.getElementById("workerPhoneInput").value
        );

        showMessage(translate("uploadingMedia"), "info");

        const photoUrls = await uploadEvidenceFiles(
          client,
          requestNo,
          workerPhone,
          photoFiles,
          "prestart-photos"
        );

        const confirmedAt = new Date().toISOString();
        const preworkAgreement = {
          ...(task.prework_agreement || {}),
          site_conditions_confirmed: true,
          scope_and_quality_reviewed: true,
          photo_urls: photoUrls,
          confirmed_at: confirmedAt
        };

        const { data, error } = await client
          .from("service_requests")
          .update({
            prework_agreement: preworkAgreement,
            prework_confirmed_at: confirmedAt,
            status: "in_progress",
            work_started_at: confirmedAt,
            updated_at: confirmedAt
          })
          .eq("request_no", requestNo)
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const taskIndex = loadedTasks.findIndex(
          (item) => String(item.request_no) === String(requestNo)
        );

        if (taskIndex >= 0) {
          loadedTasks[taskIndex] = {
            ...loadedTasks[taskIndex],
            ...(data || {}),
            implementation_plan: task.implementation_plan
          };
        }

        renderTasks();
        showMessage(translate("workStarted"), "success");
      } catch (error) {
        console.error("Pre-start confirmation failed:", error);
        showMessage(error?.message || translate("statusUpdateFailed"), "error");
      }
    }

    function calculateWorkHours(
      startTime,
      endTime
    ) {
      if (
        !startTime ||
        !endTime
      ) {
        return null;
      }

      const [
        startHour,
        startMinute
      ] =
        startTime
          .split(":")
          .map(Number);

      const [
        endHour,
        endMinute
      ] =
        endTime
          .split(":")
          .map(Number);

      let minutes =
        (
          endHour * 60 +
          endMinute
        ) -
        (
          startHour * 60 +
          startMinute
        );

      if (
        minutes < 0
      ) {
        minutes +=
          24 * 60;
      }

      return Number(
        (
          minutes / 60
        ).toFixed(2)
      );
    }

    async function uploadEvidenceFiles(
      client,
      requestNo,
      workerPhone,
      files,
      mediaType
    ) {
      const uploadedUrls = [];

      for (const file of files) {
        if (file.size > 50 * 1024 * 1024) {
          throw new Error(
            translate(
              "mediaTooLarge"
            )
          );
        }

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const objectPath = [
          requestNo,
          workerPhone,
          mediaType,
          `${Date.now()}-${crypto.randomUUID()}-${safeName}`
        ].join("/");

        const {
          error: uploadError
        } = await client.storage
          .from(
            "work-evidence"
          )
          .upload(
            objectPath,
            file,
            {
              cacheControl: "3600",
              contentType:
                file.type ||
                undefined,
              upsert: false
            }
          );

        if (uploadError) {
          throw uploadError;
        }

        const {
          data: publicData
        } = client.storage
          .from(
            "work-evidence"
          )
          .getPublicUrl(
            objectPath
          );

        uploadedUrls.push(
          publicData.publicUrl
        );
      }

      return uploadedUrls;
    }

    async function uploadSecureWorkerPhoto(kind, requestNo, file) {
      if (!hasValidWorkerLink() || requestNo !== workerRequestNo) {
        throw new Error(bi("服务方专用链接无效。", "The worker link is invalid."));
      }
      if (!file || file.size < 1 || file.size > 10 * 1024 * 1024) {
        throw new Error(bi("请选择一张不超过10MB的现场照片。", "Choose one site photo no larger than 10MB."));
      }

      const client = getSupabaseClient();
      const slug = kind === "prestart"
        ? "worker-prestart-upload"
        : "worker-process-upload";
      showMessage(translate("uploadingMedia"), "info");

      const { data: signed, error: signError } = await client.functions.invoke(slug, {
        body: {
          requestNo,
          token: workerTaskToken,
          fileName: file.name,
          mimeType: file.type,
          fileSize: file.size
        }
      });
      if (signError) throw signError;
      if (!signed?.path || !signed?.uploadToken) {
        throw new Error(signed?.error || "SIGNED_UPLOAD_FAILED");
      }

      const { error: uploadError } = await client.storage
        .from(signed.bucket || "work-evidence")
        .uploadToSignedUrl(signed.path, signed.uploadToken, file, {
          contentType: file.type,
          upsert: false
        });
      if (uploadError) throw uploadError;
      return signed;
    }

    async function saveWorkRecord(
      requestNo
    ) {
      const task =
        findTask(
          requestNo

      if (!task) {

      const workDate =
        document.getElementById(
          `workDate-${requestNo}`

      const startTime =
        document.getElementById(
          `startTime-${requestNo}`
        ).value;

      const endTime =
        document.getElementById(
          `endTime-${requestNo}`
        ).value;

      let workHours =
        Number(
          document.getElementById(
            `workHours-${requestNo}`
          ).value ||
          0
        );

      const workProgress =
        document.getElementById(
          `workProgress-${requestNo}`
        ).value.trim();

      const materialsUsed =
        document.getElementById(
          `materialsUsed-${requestNo}`
        ).value.trim();

      const issuesFound =
        document.getElementById(
          `issuesFound-${requestNo}`
        ).value.trim();

      let photoRecord =
        document.getElementById(
          `photoRecord-${requestNo}`
        ).value.trim();

      let videoRecord =
        document.getElementById(
          `videoRecord-${requestNo}`
        ).value.trim();

      const photoFiles =
        Array.from(
          document.getElementById(
            `photoFiles-${requestNo}`
          ).files || []
        );

      const videoFiles =
        Array.from(
          document.getElementById(
            `videoFiles-${requestNo}`
          ).files || []
        );

      const customerComment =
        document.getElementById(
          `customerComment-${requestNo}`
        ).value.trim();

      if (
        !workDate ||
        !workProgress
      ) {
        showMessage(
          translate(
            "requiredWorkFields"
          ),
          "error"
        );

        return;
      }

      if (
        !workHours &&
        startTime &&
        endTime
      ) {
        workHours =
          calculateWorkHours(
            startTime,
            endTime
          ) || 0;
      }

      try {
        if (photoFiles.length === 0) {
          throw new Error(bi(
            "保存施工记录时请至少选择一张过程照片。",
            "Select at least one progress photo before saving the work record."
          ));
        }

        const upload = await uploadSecureWorkerPhoto(
          "process",
          requestNo,
          photoFiles[0]
        );
        const client = getSupabaseClient();
        const { error } = await client.rpc("submit_work_record_with_token", {
          p_request_no: requestNo,
          p_token: workerTaskToken,
          p_work_progress: workProgress,
          p_materials_used: materialsUsed || null,
          p_issues_found: issuesFound || null,
          p_work_hours: workHours || null,
          p_storage_path: upload.path,
          p_file_name: photoFiles[0].name,
          p_file_size: photoFiles[0].size,
          p_mime_type: photoFiles[0].type
        });

        if (error) throw error;
        await loadDedicatedWorkerTask(false);
        showMessage(translate("recordSaved"), "success");
        closeTaskPanel(requestNo);
        return;
      } catch (error) {
        console.error("Secure work record save failed:", error);
        showMessage(error?.message || translate("recordSaveFailed"), "error");
        return;
      }

      try {
        const client =
          getSupabaseClient();

        const workerPhone =
          normalizePhone(
            task.assigned_worker_phone ||
            document.getElementById(
              "workerPhoneInput"
            ).value
          );

        if (
          photoFiles.length ||
          videoFiles.length
        ) {
          showMessage(
            translate(
              "uploadingMedia"
            ),
            "info"
          );
        }

        const uploadedPhotos =
          await uploadEvidenceFiles(
            client,
            task.request_no,
            workerPhone,
            photoFiles,
            "photos"
          );

        const uploadedVideos =
          await uploadEvidenceFiles(
            client,
            task.request_no,
            workerPhone,
            videoFiles,
            "videos"
          );

        photoRecord = [
          photoRecord,
          ...uploadedPhotos
        ].filter(Boolean).join("\n");

        videoRecord = [
          videoRecord,
          ...uploadedVideos
        ].filter(Boolean).join("\n");

        const recordData = {
          request_no:
            task.request_no,

          worker_phone:
            workerPhone,

          work_date:
            workDate,

          start_time:
            startTime ||
            null,

          end_time:
            endTime ||
            null,

          work_hours:
            workHours ||
            0,

          work_progress:
            workProgress,

          materials_used:
            materialsUsed ||
            null,

          issues_found:
            issuesFound ||
            null,

          photo_record:
            photoRecord ||
            null,

          video_record:
            videoRecord ||
            null,

          customer_site_comment:
            customerComment ||
            null,

          recorded_at:
            new Date()
              .toISOString()
        };

        const {
          error
        } = await client
          .from(
            "work_records"
          )
          .insert(
            recordData
          );

        if (error) {
          throw error;
        }

        showMessage(
          translate(
            "recordSaved"
          ),
          "success"
        );

        closeTaskPanel(
          requestNo
        );
      } catch (error) {
        console.error(
          "Work record save failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "recordSaveFailed"
          ),
          "error"
        );
      }

    async function submitFinalCompletion(
      requestNo
    ) {
      const task =
        findTask(
          requestNo
        );

      if (!task) {
        return;
      }

      const completionSummary =
        document.getElementById(
          `completionSummary-${requestNo}`
        ).value.trim();

      let completionEvidence =
        document.getElementById(
          `completionEvidence-${requestNo}`
        ).value.trim();

      const finalPhotoFiles = Array.from(
        document.getElementById(`finalPhotoFiles-${requestNo}`).files || []
      );

      const finalVideoFiles = Array.from(
        document.getElementById(`finalVideoFiles-${requestNo}`).files || []
      );

      const outstandingIssues =
        document.getElementById(
          `outstandingIssues-${requestNo}`
        ).value.trim();

      const acceptanceItems =
        document.getElementById(
          `acceptanceItems-${requestNo}`
        ).value.trim();

      if (
        !completionSummary ||
        !acceptanceItems
      ) {
        showMessage(
          translate(
            "requiredCompletionFields"
          ),
          "error"
        );

        return;
      }

      try {
        const milestoneSummary = [
          completionSummary,
          acceptanceItems ? `${bi("验收重点", "Acceptance focus")}：${acceptanceItems}` : "",
          outstandingIssues ? `${bi("遗留问题", "Outstanding issues")}：${outstandingIssues}` : ""
        ].filter(Boolean).join("\n");
        const client = getSupabaseClient();
        const { error } = await client.rpc("submit_milestone_with_token", {
          p_request_no: requestNo,
          p_token: workerTaskToken,
          p_summary: milestoneSummary
        });

        if (error) throw error;
        await loadDedicatedWorkerTask(false);
        showMessage(
          bi("阶段成果已提交，等待客户检查和平台审核。", "The milestone was submitted for customer and platform review."),
          "success"
        );
        return;
      } catch (error) {
        console.error("Secure milestone submission failed:", error);
        showMessage(error?.message || translate("completionFailed"), "error");
        return;
      }


      try {
        const client =
          getSupabaseClient();

        const workerPhone = normalizePhone(
          task.assigned_worker_phone || document.getElementById("workerPhoneInput").value
        );

        if (finalPhotoFiles.length || finalVideoFiles.length) {
          showMessage(translate("uploadingMedia"), "info");
        }

        const uploadedPhotos = await uploadEvidenceFiles(
          client, task.request_no, workerPhone, finalPhotoFiles, "completion-photos"
        );
        const uploadedVideos = await uploadEvidenceFiles(
          client, task.request_no, workerPhone, finalVideoFiles, "completion-videos"
        );
        completionEvidence = [completionEvidence, ...uploadedPhotos, ...uploadedVideos]
          .filter(Boolean).join("\n");

        const submittedAt =
          new Date()
            .toISOString();

        const updateData = {
          status:
            "awaiting_final_acceptance",

          completion_summary:
            completionSummary,

          completion_evidence:
            completionEvidence ||
            null,

          outstanding_issues:
            outstandingIssues ||
            null,

          customer_acceptance_focus:
            acceptanceItems,

          work_completed_at:
            submittedAt,

          updated_at:
            submittedAt
        };

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .update(
            updateData
          )
          .eq(
            "request_no",
            requestNo
          )
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const taskIndex =
          loadedTasks.findIndex(
            (item) =>
              String(
                item.request_no
              ) ===
              String(
                requestNo
              )
          );

        if (
          taskIndex >= 0
        ) {
          loadedTasks[
            taskIndex
          ] =
            data || {
              ...loadedTasks[
                taskIndex
              ],
              ...updateData
            };
        }

        renderTasks();

        showMessage(
          translate(
            "completionSubmitted"
          ),
          "success"
        );
      } catch (error) {
        console.error(
          "Final completion submit failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "completionFailed"
          ),
          "error"
        );
      }
    }
