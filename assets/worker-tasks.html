<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>我的任务 | EchoCity</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --success: #15803d;
      --success-soft: #ecfdf3;

      --warning: #a16207;
      --warning-soft: #fff7ed;

      --danger: #b91c1c;
      --danger-soft: #fef2f2;

      --info: #1e40af;
      --info-soft: #eff6ff;

      --text: #172033;
      --muted: #667085;

      --border: #d8dee9;
      --background: #f3f6fb;
      --card: #ffffff;

      --shadow:
        0 14px 36px
        rgba(
          31,
          41,
          55,
          0.08
        );
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #edf5ff,
          var(--background)
        );
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width:
        min(
          980px,
          calc(100% - 24px)
        );

      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 800;
    }

    .logo {
      display: grid;
      place-items: center;

      width: 38px;
      height: 38px;

      border-radius: 12px;

      background: var(--primary);
      color: #ffffff;

      font-weight: 900;
    }

    .language-button {
      padding: 8px 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: #ffffff;
      color: var(--text);

      font-weight: 700;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size:
        clamp(
          30px,
          6vw,
          44px
        );

      line-height: 1.2;
    }

    .hero p {
      margin-top: 10px;

      color: var(--muted);

      line-height: 1.7;
    }

    .card {
      margin-top: 16px;
      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 21px;
      line-height: 1.4;
    }

    .card-description {
      margin-top: 7px;

      color: var(--muted);

      line-height: 1.6;
    }

    .search-row {
      display: grid;
      grid-template-columns:
        1fr auto;
      gap: 10px;

      margin-top: 16px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      outline: none;
    }

    .input,
    .select {
      min-height: 46px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 100px;
      padding: 12px;

      resize: vertical;
      line-height: 1.65;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(
          37,
          99,
          235,
          0.12
        );
    }

    .primary-button,
    .secondary-button,
    .success-button,
    .warning-button,
    .danger-button {
      min-height: 44px;
      padding: 0 16px;

      border-radius: 11px;

      font-weight: 800;
    }

    .primary-button {
      border: 0;

      background: var(--primary);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      border: 1px solid var(--border);

      background: #ffffff;
      color: var(--text);
    }

    .success-button {
      border: 0;

      background: var(--success);
      color: #ffffff;
    }

    .warning-button {
      border: 0;

      background: var(--warning);
      color: #ffffff;
    }

    .danger-button {
      border: 0;

      background: var(--danger);
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 14px;
      padding: 12px 14px;

      border-radius: 11px;

      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.info {
      background: var(--info-soft);
      color: var(--info);
    }

    .message.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .message.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .message.error {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .task-list {
      display: grid;
      gap: 16px;

      margin-top: 16px;
    }

    .task-card {
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: #ffffff;
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .task-number {
      font-size: 20px;
      font-weight: 900;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;

      min-height: 30px;
      padding: 4px 11px;

      border-radius: 999px;

      background: var(--info-soft);
      color: var(--info);

      font-size: 13px;
      font-weight: 800;
    }

    .task-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 10px;

      margin-top: 14px;
    }

    .detail {
      padding: 11px;

      border-radius: 11px;

      background: #f8fafc;
    }

    .detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;
    }

    .detail-value {
      margin-top: 5px;

      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      margin-top: 16px;
    }

    .work-panel {
      margin-top: 16px;
      padding: 16px;

      border: 1px dashed var(--border);
      border-radius: 14px;

      background: #fafcff;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 13px;

      margin-top: 14px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 13px;
      font-weight: 800;
    }

    .panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 15px;
    }

    @media (
      max-width: 700px
    ) {
      .search-row,
      .task-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .detail.full,
      .form-group.full {
        grid-column: 1;
      }

      .task-header {
        flex-direction: column;
      }

      .task-actions,
      .panel-actions {
        flex-direction: column;
      }

      .task-actions button,
      .panel-actions button,
      .search-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">

      <div class="brand">
        <div class="logo">E</div>
        <span>EchoCity</span>
      </div>

      <button
        id="languageButton"
        class="language-button"
        type="button"
      >
        EN
      </button>

    </header>

    <section class="hero">

      <h1 id="pageTitle">
        我的任务
      </h1>

      <p id="pageDescription">
        查询并处理已经分配给你的服务任务。
      </p>

    </section>

    <section class="card">

      <h2 id="searchTitle">
        查询工人任务
      </h2>

      <p
        id="searchDescription"
        class="card-description"
      >
        请输入管理员派工时填写的工人手机号。
      </p>

      <div class="search-row">

        <input
          id="workerPhoneInput"
          class="input"
          type="tel"
          placeholder="请输入工人手机号"
        />

        <button
          id="searchButton"
          class="primary-button"
          type="button"
        >
          查询任务
        </button>

      </div>

      <div
        id="message"
        class="message"
        role="status"
      ></div>

    </section>

    <section
      id="taskSection"
      class="card hidden"
    >

      <h2 id="taskListTitle">
        我的服务任务
      </h2>

      <p
        id="taskListDescription"
        class="card-description"
      >
        按照任务状态逐步完成接单、到达、开工和完工。
      </p>

      <div
        id="taskList"
        class="task-list"
      ></div>

    </section>

  </main>  <script>
    const translations = {
      zh: {
        pageTitle: "我的任务",
        pageDescription: "查询并处理已经分配给你的服务任务。",
        searchTitle: "查询工人任务",
        searchDescription: "请输入管理员派工时填写的工人手机号。",

        taskAccepted: "任务已成功接收。",

        statusUpdateFailed: "任务状态更新失败。",
        workPanelTitle: "每日工作记录",

        startTime: "开始时间",
        endTime: "结束时间",
        workHours: "工作小时",
        workProgress: "工作进展",
        materialsUsed: "使用材料",
        issuesFound: "发现问题",

        videoRecord: "视频记录",
        customerSiteComment: "客户现场意见",
        finalCompletionTitle: "最终完成说明",
        completionSummary: "完成情况说明",
        completionEvidence: "成果证据",
        outstandingIssues: "遗留问题",
        customerAcceptanceItems: "请客户重点验收内容",
        requiredWorkFields: "请填写工作日期和工作进展。",
        requiredCompletionFields: "请填写完成情况说明和验收重点。",
        recordSaved: "工作记录已保存。",
        recordSaveFailed: "工作记录保存失败。",
        completionSubmitted: "最终完成已提交，等待客户最终验收。",
        completionFailed: "最终完成提交失败。",
        closePanel: "关闭"
      },

      en: {
        pageTitle: "My Tasks",
        pageDescription: "Find and process service tasks assigned to you.",
        searchTitle: "Find Worker Tasks",
        searchDescription: "Enter the worker phone number used by the administrator.",
        workerPhonePlaceholder: "Enter worker phone number",
        searchButton: "Find Tasks",
        searching: "Searching for tasks...",
        noTasks: "No tasks were found for this phone number.",
        taskListTitle: "My Service Tasks",
        taskListDescription: "Complete acceptance, arrival, start, work records, and completion in order.",
        loadSuccess: "Tasks loaded successfully.",
        loadFailed: "Unable to load tasks. Check the network or database.",
        supabaseUnavailable: "Supabase connection is unavailable.",
        requestNumber: "Request Number",
        status: "Task Status",
        customerPhone: "Customer Phone",
        serviceAddress: "Service Address",
        meetingDate: "Meeting Date",
        meetingTime: "Meeting Time",
        siteManager: "Site Manager",
        siteManagerPhone: "Manager Phone",
        assignmentNotes: "Assignment Notes",
        estimatedDuration: "Estimated Duration",
        workerName: "Worker Name",
        workerPhone: "Worker Phone",
        workerRole: "Worker Role",
        workerPay: "Worker Pay",
        notProvided: "Not provided",
        statusAssigned: "Assigned",
        statusAccepted: "Accepted",
        statusArrived: "Arrived",
        statusWorking: "Work in Progress",
        statusCompleted: "Completion Submitted",
        statusConditional: "Conditionally Completed",
        statusRework: "Rework Required",
        statusDisputed: "Disputed",
        acceptTask: "Accept Task",
        confirmArrival: "Confirm Arrival",
        startWork: "Start Work",
        saveWork: "Save Work Record",
        submitCompletion: "Submit Final Completion",
        taskAccepted: "The task has been accepted.",
        arrivalConfirmed: "Arrival at the site has been confirmed.",
        workStarted: "The work has started.",
        statusUpdateFailed: "Unable to update the task status.",
        workPanelTitle: "Daily Work Record",
        workDate: "Work Date",
        startTime: "Start Time",
        endTime: "End Time",
        workHours: "Work Hours",
        workProgress: "Work Progress",
        materialsUsed: "Materials Used",
        issuesFound: "Issues Found",
        photoRecord: "Photo Record",
        videoRecord: "Video Record",
        customerSiteComment: "Customer Site Comment",
        finalCompletionTitle: "Final Completion",
        completionSummary: "Completion Summary",
        completionEvidence: "Completion Evidence",
        outstandingIssues: "Outstanding Issues",
        customerAcceptanceItems: "Items Requiring Customer Acceptance",
        requiredWorkFields: "Enter the work date and work progress.",
        requiredCompletionFields: "Enter the completion summary and acceptance items.",
        recordSaved: "The work record was saved.",
        recordSaveFailed: "Unable to save the work record.",
        completionSubmitted: "Final completion was submitted for customer acceptance.",
        completionFailed: "Unable to submit final completion.",
        closePanel: "Close"
      }
    };

    let currentLanguage =
      localStorage.getItem(
        "echocity-language"
      ) || "zh";

    let loadedTasks = [];

    function translate(key) {
      return (
        translations[currentLanguage]?.[key] ||
        translations.zh[key] ||
        key
      );
    }

    function setText(
      elementId,
      translationKey
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (element) {
        element.textContent =
          translate(
            translationKey
          );
      }
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh"
          ? "zh-CN"
          : "en";

      document.title =
        `${translate("pageTitle")} | EchoCity`;

      const textMap = {
        pageTitle: "pageTitle",
        pageDescription: "pageDescription",
        searchTitle: "searchTitle",
        searchDescription: "searchDescription",
        searchButton: "searchButton",
        taskListTitle: "taskListTitle",
        taskListDescription: "taskListDescription"
      };

      Object.entries(
        textMap
      ).forEach(
        ([
          elementId,
          translationKey
        ]) => {
          setText(
            elementId,
            translationKey
          );
        }
      );

      document.getElementById(
        "workerPhoneInput"
      ).placeholder =
        translate(
          "workerPhonePlaceholder"
        );

      document.getElementById(
        "languageButton"
      ).textContent =
        currentLanguage === "zh"
          ? "EN"
          : "中文";

      if (
        loadedTasks.length > 0
      ) {
        renderTasks();
      }
    }

    function normalizePhone(value) {
      return String(
        value || ""
      )
        .trim()
        .replace(
          /[^\d+]/g,
          ""
        );
    }

    function escapeHTML(value) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    function showMessage(
      text,
      type = "info"
    ) {
      const messageBox =
        document.getElementById(
          "message"
        );

      messageBox.textContent =
        text;

      messageBox.className =
        `message show ${type}`;
    }

    function clearMessage() {
      const messageBox =
        document.getElementById(
          "message"
        );

      messageBox.textContent =
        "";

      messageBox.className =
        "message";
    }

    function getSupabaseClient() {
      const client =
        window.echoCitySupabase;

      if (
        !client ||
        typeof client.from !==
          "function"
      ) {
        throw new Error(
          translate(
            "supabaseUnavailable"
          )
        );
      }

      return client;
    }

    function getStatusText(status) {
      const statusMap = {
        assigned:
          "statusAssigned",

        accepted:
          "statusAccepted",

        arrived:
          "statusArrived",

        working:
          "statusWorking",

        in_progress:
          "statusWorking",

        completed:
          "statusCompleted",

        awaiting_final_acceptance:
          "statusCompleted",

        conditionally_completed:
          "statusConditional",

        final_rework:
          "statusRework",

        disputed:
          "statusDisputed"
      };

      return translate(
        statusMap[status] ||
        "status"
      );
    }

    function createDetail(
      label,
      value,
      fullWidth = false
    ) {
      const displayValue =
        value === null ||
        value === undefined ||
        value === ""
          ? translate(
              "notProvided"
            )
          : value;

      return `
        <div class="detail ${
          fullWidth
            ? "full"
            : ""
        }">
          <div class="detail-label">
            ${escapeHTML(label)}
          </div>

          <div class="detail-value">
            ${escapeHTML(
              displayValue
            )}
          </div>
        </div>
      `;
    }

    async function searchWorkerTasks() {
      const phone =
        normalizePhone(
          document.getElementById(
            "workerPhoneInput"
          ).value
        );

      if (!phone) {
        showMessage(
          translate(
            "workerPhonePlaceholder"
          ),
          "error"
        );

        return;
      }

      const searchButton =
        document.getElementById(
          "searchButton"
        );

      searchButton.disabled =
        true;

      showMessage(
        translate(
          "searching"
        ),
        "info"
      );

      try {
        const client =
          getSupabaseClient();

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .select("*")
          .eq(
            "assigned_worker_phone",
            phone
          )
          .order(
            "updated_at",
            {
              ascending: false
            }
          );

        if (error) {
          throw error;
        }

        loadedTasks =
          Array.isArray(data)
            ? data
            : [];

        if (
          loadedTasks.length === 0
        ) {
          document.getElementById(
            "taskSection"
          ).classList.add(
            "hidden"
          );

          showMessage(
            translate(
              "noTasks"
            ),
            "warning"
          );

          return;
        }

        document.getElementById(
          "taskSection"
        ).classList.remove(
          "hidden"
        );

        renderTasks();

        showMessage(
          translate(
            "loadSuccess"
          ),
          "success"
        );
      } catch (error) {
        console.error(
          "Worker task search failed:",
          error
        );

        loadedTasks = [];

        document.getElementById(
          "taskSection"
        ).classList.add(
          "hidden"
        );

        showMessage(
          error?.message ||
          translate(
            "loadFailed"
          ),
          "error"
        );
      } finally {
        searchButton.disabled =
          false;
      }
    }

    function findTask(requestNo) {
      return loadedTasks.find(
        (task) =>
          String(
            task.request_no
          ) ===
          String(
            requestNo
          )
      );
    }

    function getTaskActionButton(task) {
      const requestNo =
        escapeHTML(
          task.request_no
        );

      if (
        task.status ===
        "assigned"
      ) {
        return `
          <button
            class="primary-button"
            type="button"
            onclick="acceptTask('${requestNo}')"
          >
            ${escapeHTML(
              translate(
                "acceptTask"
              )
            )}
          </button>
        `;
      }

      if (
        task.status ===
        "accepted"
      ) {
        return `
          <button
            class="primary-button"
            type="button"
            onclick="confirmArrival('${requestNo}')"
          >
            ${escapeHTML(
              translate(
                "confirmArrival"
              )
            )}
          </button>
        `;
      }

      if (
        task.status ===
        "arrived"
      ) {
        return `
          <button
            class="success-button"
            type="button"
            onclick="startWork('${requestNo}')"
          >
            ${escapeHTML(
              translate(
                "startWork"
              )
            )}
          </button>
        `;
      }

      if (
        task.status ===
          "working" ||
        task.status ===
          "in_progress"
      ) {
        return `
          <button
            class="secondary-button"
            type="button"
            onclick="openWorkPanel('${requestNo}')"
          >
            ${escapeHTML(
              translate(
                "saveWork"
              )

    }    async function updateTaskStatus(
      requestNo,
      newStatus,
      successMessage
    ) {
      try {
        const client =
          getSupabaseClient();

        const updatedAt =
          new Date().toISOString();

        const updateData = {
          status: newStatus,
          updated_at: updatedAt
        };

        if (
          newStatus ===
          "accepted"
        ) {
          updateData.accepted_at =
            updatedAt;
        }

        if (
          newStatus ===
          "arrived"
        ) {
          updateData.arrived_at =
            updatedAt;
        }

        if (
          newStatus ===
          "in_progress"
        ) {
          updateData.work_started_at =
            updatedAt;
        }

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .update(
            updateData
          )
          .eq(
            "request_no",
            requestNo
          )
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const taskIndex =
          loadedTasks.findIndex(
            (task) =>
              String(
                task.request_no
              ) ===
              String(
                requestNo
              )
          );

        if (
          taskIndex >= 0
        ) {
          loadedTasks[
            taskIndex
          ] =
            data || {
              ...loadedTasks[
                taskIndex
              ],
              ...updateData
            };
        }

        renderTasks();

        showMessage(
          translate(
            successMessage
          ),
          "success"
        );

        return true;
      } catch (error) {
        console.error(
          "Task status update failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "statusUpdateFailed"
          ),
          "error"
        );

        return false;
      }
    }

    function calculateWorkHours(
      startTime,
      endTime
    ) {
      if (
        !startTime ||
        !endTime
      ) {
        return null;
      }

      const [
        startHour,
        startMinute
      ] =
        startTime
          .split(":")
          .map(Number);

      const [
        endHour,
        endMinute
      ] =
        endTime
          .split(":")
          .map(Number);

      let minutes =
        (
          endHour * 60 +
          endMinute
        ) -
        (
          startHour * 60 +
          startMinute
        );

      if (
        minutes < 0
      ) {
        minutes +=
          24 * 60;
      }

      return Number(
        (
          minutes / 60
        ).toFixed(2)
      );
    }

    async function submitFinalCompletion(
      requestNo
    ) {
      const task =
        findTask(
          requestNo
        );

      if (!task) {
        return;
      }

      const completionSummary =
        document.getElementById(
          `completionSummary-${requestNo}`
        ).value.trim();

      const completionEvidence =
        document.getElementById(
          `completionEvidence-${requestNo}`
        ).value.trim();

      const outstandingIssues =
        document.getElementById(
          `outstandingIssues-${requestNo}`
        ).value.trim();

      const acceptanceItems =
        document.getElementById(
          `acceptanceItems-${requestNo}`
        ).value.trim();

      if (
        !completionSummary ||
        !acceptanceItems
      ) {
        showMessage(
          translate(
            "requiredCompletionFields"
          ),
          "error"
        );

        return;
      }

      const confirmed =
        window.confirm(
          currentLanguage ===
            "zh"
            ? "确认已经完成全部服务，并提交客户最终验收吗？"
            : "Confirm that all work is complete and submit it for customer final acceptance?"
        );

      if (!confirmed) {
        return;
      }

      try {
        const client =
          getSupabaseClient();

        const submittedAt =
          new Date()
            .toISOString();

        const updateData = {
          status:
            "awaiting_final_acceptance",

          completion_summary:
            completionSummary,

          completion_evidence:
            completionEvidence ||
            null,

          outstanding_issues:
            outstandingIssues ||
            null,

          customer_acceptance_items:
            acceptanceItems,

          work_completed_at:
            submittedAt,

          updated_at:
            submittedAt
        };

        const {
          data,
          error
        } = await client
          .from(
            "service_requests"
          )
          .update(
            updateData
          )
          .eq(
            "request_no",
            requestNo
          )
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const taskIndex =
          loadedTasks.findIndex(
            (item) =>
              String(
                item.request_no
              ) ===
              String(
                requestNo
              )
          );

        if (
          taskIndex >= 0
        ) {
          loadedTasks[
            taskIndex
          ] =
            data || {
              ...loadedTasks[
                taskIndex
              ],
              ...updateData
            };
        }

        renderTasks();

        showMessage(
          translate(
            "completionSubmitted"
          ),
          "success"
        );
      } catch (error) {
        console.error(
          "Final completion submit failed:",
          error
        );

        showMessage(
          error?.message ||
          translate(
            "completionFailed"
          ),
          "error"
        );
      }
    }
