      --danger: #b91c1c;

    body {

      color: var(--text);

      padding: 24px 0 48px;

      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {

      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
    }

    .brand-logo {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.24);
    }

    .language-button {
      min-width: 54px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: #ffffff;
      font-weight: 700;
    }

    .language-button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .eyebrow {
      margin-bottom: 7px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
    }

    .page-title {
      margin-bottom: 10px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.15;
    }

    .page-description {
      max-width: 720px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .card {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid rgba(216, 222, 233, 0.95);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 38px rgba(31, 41, 55, 0.08);
    }

    .card-title {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .card-description {
      margin-bottom: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }

    .text-input,
    .agreement-input,
    .work-input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: #ffffff;
      outline: none;
    }

    .text-input:focus,
    .agreement-input:focus,
    .work-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea.agreement-input,
    textarea.work-input {
      min-height: 96px;
      resize: vertical;
    }

    .primary-button,
    .secondary-button,
    .success-button,
    .danger-button {
      min-height: 44px;
      padding: 10px 17px;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 800;
    }

    .primary-button {
      background: var(--primary);
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      color: var(--primary);
      border: 1px solid var(--primary);
      background: #ffffff;
    }

    .success-button {
      background: var(--success);
    }

    .danger-button {
      background: var(--danger);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.55;
    }

    .message.show {
      display: block;
    }

    .message.info {
      color: #1e40af;
      background: #eff6ff;
    }

    .message.success {
      color: var(--success);
      background: var(--success-bg);
    }

    .message.error {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .task-list {
      display: grid;
      gap: 20px;
      margin-top: 22px;
    }

    .task-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .task-number {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .task-title {
      font-size: 21px;
      line-height: 1.35;
    }

    .status-badge {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 999px;
      color: #1e40af;
      background: #eff6ff;
      font-size: 13px;
      font-weight: 800;
    }

    .task-body {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    .task-detail {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      line-height: 1.55;
    }

    .task-detail-label {
      color: var(--muted);
      font-weight: 700;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 8px;
    }

    .workflow-section {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f9fbff;
    }

    .workflow-title {
      margin-bottom: 6px;
      font-size: 19px;
    }

    .workflow-description {
      margin-bottom: 16px;
      color: var(--muted);
      line-height: 1.55;
    }

    .check-section {
      margin-top: 14px;
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
    }

    .check-section-title {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .check-list {
      display: grid;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      line-height: 1.5;
    }

    .check-item input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
    }

    .agreement-form,
    .work-form {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      align-items: center;
      gap: 12px 16px;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
    }

    .agreement-form label,
    .work-form label {
      font-size: 14px;
      font-weight: 800;
    }

    .full-width-field {
      grid-column: 2;
    }

    .section-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .page-shell {
        width: min(100% - 16px, 980px);
        padding-top: 14px;
      }

        margin-bottom: 20px;
      }

      .card {
        padding: 16px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .search-row button {
        width: 100%;
      }

      .task-header {
        flex-direction: column;
      }

      .task-detail {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .agreement-form,
      .work-form {
        grid-template-columns: 1fr;
      }

      .full-width-field {
        grid-column: 1;
      }

      .task-actions button {
        width: 100%;
      }
    }
  </style>
</head>

  let currentLanguage =
    localStorage.getItem("echocity-language") || "zh";

  if (!translations[currentLanguage]) {
    currentLanguage = "zh";
  }

  function t(key) {
    return translations[currentLanguage][key] || key;
  }

  function applyStaticTranslations() {
    document.documentElement.lang =
      currentLanguage === "zh" ? "zh-CN" : "en";

    document.title =
      currentLanguage === "zh"
        ? "我的任务 | EchoCity"
        : "My Tasks | EchoCity";

    document.getElementById("pageEyebrow").textContent =
      t("pageEyebrow");

    document.getElementById("pageTitle").textContent =
      t("pageTitle");

    document.getElementById("pageDescription").textContent =
      t("pageDescription");

    document.getElementById("searchTitle").textContent =
      t("searchTitle");

    document.getElementById("searchDescription").textContent =
      t("searchDescription");

    document.getElementById("workerPhoneInput").placeholder =
      t("phonePlaceholder");

    document.getElementById("searchTaskButton").textContent =
      t("searchTaskButton");

    document.getElementById("languageButton").textContent =
      currentLanguage === "zh" ? "EN" : "中文";
  }

  function changeLanguage() {
    currentLanguage =
      currentLanguage === "zh" ? "en" : "zh";

  /*

  /*
   * 设置查询按钮状态
   */
  function setSearchButtonLoading(isLoading) {
    const button =
      document.getElementById("searchTaskButton");

    button.disabled = isLoading;

    button.textContent = isLoading
      ? t("loadingTasks")
      : t("searchTaskButton");

  /*
   * 处理手机号码
   * 保留 + 号和数字，删除空格、横线、括号。
   */
  function normalizePhone(phone) {
    return String(phone || "")
      .trim()
      .replace(/[^\d+]/g, "");
  }

  /*
   * 防止HTML内容破坏页面结构
   */
  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /*
   * 安全读取数据库字段
   * 数据库字段名称暂时不一致时，可以读取多个候选字段。
   */
  function getTaskValue(task, fieldNames, fallback = "") {
    for (const fieldName of fieldNames) {
      const value = task?.[fieldName];

      if (
        value !== undefined &&
        value !== null &&
        value !== ""
      ) {
        return value;
      }
    }

    return fallback;
  }

  /*
   * 日期时间格式化
   */
  function formatDateTime(value) {
    if (!value) {
      return t("emptyValue");
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat(
      currentLanguage === "zh"
        ? "zh-CN"
        : "en-US",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(date);
  }

  /*
   * 任务状态标准化
   */
  function normalizeTaskStatus(task) {
    const rawStatus = String(
      getTaskValue(
        task,
        [
          "worker_status",
          "task_status",
          "status"
        ],
        "pending"
      )
    )
      .trim()
      .toLowerCase();

    const statusMap = {
      pending: "pending",
      assigned: "pending",
      waiting: "pending",

      accepted: "accepted",
      accept: "accepted",

      arrived: "arrived",
      onsite: "arrived",
      on_site: "arrived",

      agreement_submitted: "agreement_submitted",
      prework_confirmed: "agreement_submitted",
      pre_work_confirmed: "agreement_submitted",

      working: "working",
      in_progress: "working",
      started: "working",

      milestone_submitted: "milestone_submitted",
      milestone: "milestone_submitted",

      completed: "completed",
      finished: "completed",
      final_submitted: "completed"
    };

    return statusMap[rawStatus] || "pending";
  }

  /*
   * 根据任务状态显示文字
   */
  function getTaskStatusText(status) {
    const statusTextMap = {
      pending: "statusPending",
      accepted: "statusAccepted",
      arrived: "statusArrived",
      agreement_submitted:
        "statusAgreementSubmitted",
      working: "statusWorking",
      milestone_submitted:
        "statusMilestoneSubmitted",
      completed: "statusCompleted"
    };

    return t(
      statusTextMap[status] ||
      "statusPending"
    );
  }

  /*
   * 查询任务
   */
  async function searchWorkerTasks() {
    clearPageMessage();

    const input =
      document.getElementById("workerPhoneInput");

    const phone = normalizePhone(input.value);

    if (!phone) {
      showPageMessage(t("noPhone"), "error");
      input.focus();
      return;
    }

    const client = getSupabaseClient();

    if (
      !client ||
      typeof client.from !== "function"
    ) {
      showPageMessage(
        t("supabaseUnavailable"),
        "error"
      );
      return;
    }

    currentWorkerPhone = phone;
    setSearchButtonLoading(true);

    const taskList =
      document.getElementById("taskList");

    taskList.innerHTML = "";

    showPageMessage(
      t("loadingTasks"),
      "info"
    );

    try {
      /*
       * 当前使用 service_requests 表。
       * 每一个任务继续使用同一个 request_no。
       */
      const { data, error } = await client
        .from("service_requests")
        .select(`
  request_no,
  service_type,
  description,
  service_date,
  status,
  assigned_worker,
  assigned_worker_phone,
  worker_task_scope,
  assigned_start_time,
  created_at,
  updated_at
`)
       .eq("assigned_worker_phone", phone)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        throw error;
      }

      window.loadedWorkerTasks =
        Array.isArray(data) ? data : [];

      if (
        window.loadedWorkerTasks.length === 0
      ) {
        showPageMessage(
          t("noTasks"),
          "info"
        );

        taskList.innerHTML = `
          <div class="card empty-state">
            ${escapeHtml(t("noTasks"))}
          </div>
        `;

        return;
      }

      clearPageMessage();

      /*
       * renderTasks函数将在第4段建立。
       */
      if (typeof renderTasks === "function") {
        renderTasks(
          window.loadedWorkerTasks
        );
      }
    } catch (error) {
      console.error(
        "Worker task search failed:",
        error
      );

      window.loadedWorkerTasks = [];

      showPageMessage(
        t("taskLoadFailed"),
        "error"
      );
    } finally {
      setSearchButtonLoading(false);
    }
  }

  /*
   * 点击查询按钮
   */
  document
    .getElementById("searchTaskButton")
    .addEventListener(
      "click",
      searchWorkerTasks
    );

  /*
   * 在手机号码输入框按Enter，也可以查询
   */
  document
    .getElementById("workerPhoneInput")
    .addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Enter") {
          searchWorkerTasks();
        }
      }
    );  /*
   * 从任务数据中读取需求编号
   */
  function getRequestNumber(task) {
    return String(
      getTaskValue(
        task,
        [
          "request_no",
          "request_number",
          "service_request_no"
        ],
        ""
      )
    );
  }

  /*
   * 根据需求编号找到当前任务
   */
  function findLoadedTask(requestNo) {
    return window.loadedWorkerTasks.find(
      function (task) {
        return (
          getRequestNumber(task) ===
          String(requestNo)
        );
      }
    );
  }

  /*
   * 更新本地任务状态
   */
  function updateLocalTaskStatus(
    requestNo,
    newStatus
  ) {
    const task = findLoadedTask(requestNo);

    if (!task) {
      return;
    }
    task.status = newStatus;
    task.worker_status = newStatus;
    task.task_status = newStatus;
  }

  /*
   * 更新数据库中的任务状态
   */
  async function updateTaskStatus(
    requestNo,
    newStatus,
    successMessage
  ) {
    const client = getSupabaseClient();

    if (
      !client ||
      typeof client.from !== "function"
    ) {
      showPageMessage(
        t("supabaseUnavailable"),
        "error"
      );
      return false;
    }

    showPageMessage(
      currentLanguage === "zh"
        ? "正在更新任务状态……"
        : "Updating task status...",
      "info"
    );

    try {
      const updateData = {
  status: newStatus,
  updated_at: new Date().toISOString()
};

      const { error } = await client
        .from("service_requests")
        .update(updateData)
        .eq("request_no", requestNo);

      if (error) {
        throw error;
      }

      updateLocalTaskStatus(
        requestNo,
        newStatus
      );

      renderTasks(
        window.loadedWorkerTasks
      );

      showPageMessage(
        successMessage,
        "success"
      );

      return true;
    } catch (error) {
      console.error(
        "Task status update failed:",
        error
      );

      showPageMessage(
        t("taskUpdateFailed"),
        "error"
      );

      return false;
    }
  }

  /*
   * 接受任务
   */
  async function acceptTask(requestNo) {
    await updateTaskStatus(
      requestNo,
      "accepted",
      t("acceptedSuccessfully")
    );
  }

  /*
   * 确认已经到达现场
   */
  async function confirmArrival(requestNo) {
    const confirmed = window.confirm(
      currentLanguage === "zh"
        ? "请确认：你已经到达客户服务现场。"
        : "Please confirm that you have arrived at the service location."
    );

    if (!confirmed) {
      return;
    }

    const client = getSupabaseClient();

    if (
      !client ||
      typeof client.from !== "function"
    ) {
      showPageMessage(
        t("supabaseUnavailable"),
        "error"
      );
      return;
    }

    showPageMessage(
      currentLanguage === "zh"
        ? "正在确认到场……"
        : "Confirming arrival...",
      "info"
    );

    try {
      const { error } = await client
        .from("service_requests")
        .update({
  status: "arrived",
  updated_at: new Date().toISOString()
})
        .eq("request_no", requestNo);

      if (error) {
        throw error;
      }

      updateLocalTaskStatus(
        requestNo,
        "arrived"
      );

      const task = findLoadedTask(requestNo);


      renderTasks(
        window.loadedWorkerTasks
      );

      showPageMessage(
        t("arrivalConfirmed"),
        "success"
      );
    } catch (error) {
      console.error(
        "Arrival confirmation failed:",
        error
      );

      showPageMessage(
        t("taskUpdateFailed"),
        "error"
      );
    }
  }

  /*
   * 生成单项任务信息
   */
  function buildTaskDetail(
    label,
    value
  ) {
    const displayValue =
      value === undefined ||
      value === null ||
      value === ""
        ? t("emptyValue")
        : value;

    return `
      <div class="task-detail">
        <div class="task-detail-label">
          ${escapeHtml(label)}
        </div>

        <div>
          ${escapeHtml(displayValue)}
        </div>
      </div>
    `;

  /*
   * 生成价格显示
   */
  function formatPrice(task) {
    const price = getTaskValue(
      task,
      [
        "confirmed_price",
        "agreed_price",
        "quoted_price",
        "price"
      ],
      ""
    );

    if (
      price === "" ||
      price === null ||
      price === undefined
    ) {
      return t("emptyValue");
    }

    const currency = getTaskValue(
      task,
      [
        "currency",
        "price_currency"
      ],
      "USD"
    );

    return `${currency} ${price}`;
  }

  /*
   * 根据状态生成操作按钮
   */
  function buildTaskActionButtons(
    task,
    status
  ) {
    const requestNo =
      getRequestNumber(task);

    if (status === "pending") {
      return `
        <button
          class="primary-button"
          type="button"
          onclick="acceptTask(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(t("acceptTask"))}
        </button>
      `;
    }

    if (status === "accepted") {
      return `
        <button
          class="primary-button"
          type="button"
          onclick="confirmArrival(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(
            t("confirmArrival")
          )}
        </button>
      `;
    }

    if (status === "arrived") {
      return `
        <button
          class="primary-button"
          type="button"
          onclick="showPreWorkAgreement(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(
            t("preWorkTitle")
          )}
        </button>
      `;
    }

    if (
      status ===
      "agreement_submitted"
    ) {
      return `
        <button
          class="success-button"
          type="button"
          onclick="startWork(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(t("startWork"))}
        </button>
      `;
    }

    if (status === "working") {
      return `
        <button
          class="primary-button"
          type="button"
          onclick="showWorkExecution(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(
            t("workExecutionTitle")
          )}
        </button>
      `;
    }

    if (
      status ===
      "milestone_submitted"
    ) {
      return `
        <button
          class="secondary-button"
          type="button"
          onclick="showFinalCompletion(
            '${escapeHtml(requestNo)}'
          )"
        >
          ${escapeHtml(
            t("finalCompletionTitle")
          )}
        </button>
      `;
    }

    return `
      <button
        class="secondary-button"
        type="button"
        disabled
      >
        ${escapeHtml(
          t("statusCompleted")
        )}
      </button>
    `;
  }

      normalizeTaskStatus(task);

      getTaskValue(
        task,
        [
          "service_title",
          "service_name",
          "title",
          "request_title"
        ],
        t("unknownTask")
      );

    const customerName =
      getTaskValue(
        task,
        [
          "customer_name",
          "contact_name",
          "requester_name"
        ],
        t("notAvailable")
      );

    const customerPhone =
      getTaskValue(
        task,
        [
          "customer_phone",
          "contact_phone",
          "requester_phone"
        ],
        t("notAvailable")
      );

    const address =
      getTaskValue(
        task,
        [
          "service_address",
          "address",
          "location"
        ],
        t("notAvailable")
      );

    const scheduledTime =
      getTaskValue(
        task,
        [
          "scheduled_time",
          "appointment_time",
          "service_time"
        ],
        ""
      );

    const workerName =
  getTaskValue(

    [
      "assigned_worker",
      "worker_name",
      "assigned_worker_name"
    ],
    t("notAvailable")
  );

    const requirements =
      getTaskValue(
        task,
        [
          "customer_requirements",
          "service_requirements",
          "requirements",
          "description"
        ],

      );

    const qualityStandards =

    return `

  /*

  /*
   * 计算工作小时数
   */
  function calculateWorkHours(
    startTime,
    endTime
  ) {
    if (!startTime || !endTime) {
      return "";
    }

    const startParts =
      startTime.split(":");

    const endParts =
      endTime.split(":");

    if (
      startParts.length !== 2 ||
      endParts.length !== 2
    ) {
      return "";
    }

    const startMinutes =
      Number(startParts[0]) * 60 +
      Number(startParts[1]);

    let endMinutes =
      Number(endParts[0]) * 60 +
      Number(endParts[1]);

    if (
      Number.isNaN(startMinutes) ||
      Number.isNaN(endMinutes)
    ) {
      return "";
    }

    if (endMinutes < startMinutes) {
      endMinutes += 24 * 60;
    }

    const totalHours =
      (endMinutes - startMinutes) / 60;

    return totalHours
      .toFixed(2)
      .replace(/\.00$/, "");
  }

   */
  function restoreWorkDraft(
    requestNo,
    container
  ) {
    const storageKey =
      `echocity-work-draft-${requestNo}`;

    const savedText =
      localStorage.getItem(storageKey);

    if (!savedText) {
      return;
    }

    try {
      const savedData =
        JSON.parse(savedText);

      const inputs =
        container.querySelectorAll(
          "[data-work-input]"
        );

      inputs.forEach(
        function (input) {
          const fieldName =
            input.dataset.workInput;

          if (
            savedData[fieldName] !==
            undefined
          ) {
            input.value =
              savedData[fieldName];
          }
        }
      );
    } catch (error) {
      console.error(
        "Restore work draft failed:",
        error
      );
    }
  }

  async function saveWorkProgress(

) {
  const container =
    getWorkflowContainer(requestNo);

  if (!container) {
    return;

      calculateWorkHours(
        workData.start_time,

    new Date().toISOString();

     * 每次保存都会新增一行，
     * 不会覆盖以前的记录。
     */
    const {
      data: insertedRecord,
      error: insertError
    } = await client
      .from("work_records")
      .insert({
        request_no:
          requestNo,

        worker_phone:
          currentWorkerPhone || null,

        work_date:

        start_time:

            data-milestone-input="submitted_time"
            value="${escapeHtml(
              new Date()
                .toISOString()
                .slice(0, 16)
            )}"
          >

          <label>
            ${
              currentLanguage === "zh"
                ? "需要客户重点检查的内容"
                : "Items Requiring Customer Review"
            }
          </label>

          <textarea
            class="work-input"
            data-milestone-input="customer_review_items"
            placeholder="${
              currentLanguage === "zh"
                ? "填写需要客户检查、确认或签字的工作内容"
                : "Describe the work requiring customer inspection, confirmation, or signature"
            }"
          ></textarea>
        </div>

        <p class="section-note">
          ${
            currentLanguage === "zh"
              ? "阶段成果提交后，客户将在客户验收页面完成检查、意见和签字确认。"
              : "After submission, the customer will inspect, comment, and sign through the customer acceptance page."
          }
        </p >

        <div class="task-actions">
          <button
            class="secondary-button"
            type="button"
            onclick="showWorkExecution(
              '${escapeHtml(requestNo)}'
            )"
          >
            ${
              currentLanguage === "zh"
                ? "返回工作记录"
                : "Back to Work Record"
            }
          </button>

          <button
            class="primary-button"
            type="button"
            onclick="submitMilestone(
              '${escapeHtml(requestNo)}'
            )"
          >
            ${escapeHtml(
              t("submitMilestoneButton")
            )}
          </button>
        </div>
      </section>
    `;

    restoreMilestoneDraft(
      requestNo,
      container
    );

    container.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  /*
   * 读取阶段成果表单
   */
  function collectMilestoneInputs(
    container
  ) {
    const inputs =
      container.querySelectorAll(
        "[data-milestone-input]"
      );

    const result = {};

    inputs.forEach(
      function (input) {
        const fieldName =
          input.dataset.milestoneInput;

        result[fieldName] =
          String(input.value || "").trim();
      }
    );

    return result;
  }

  /*
   * 本地保存阶段成果草稿
   */
  function saveMilestoneDraftLocally(
    requestNo,
    milestoneData
  ) {
    localStorage.setItem(
      `echocity-milestone-${requestNo}`,
      JSON.stringify(milestoneData)
    );
  }

  /*
   * 恢复阶段成果草稿
   */
  function restoreMilestoneDraft(
    requestNo,
    container
  ) {
    const savedText =
      localStorage.getItem(
        `echocity-milestone-${requestNo}`
      );

    if (!savedText) {
      return;
    }

    try {
      const savedData =
        JSON.parse(savedText);

      const inputs =
        container.querySelectorAll(
          "[data-milestone-input]"
        );

      inputs.forEach(
        function (input) {
          const fieldName =
            input.dataset.milestoneInput;

          if (
            savedData[fieldName] !==
            undefined
          ) {
            input.value =
              savedData[fieldName];
          }
        }
      );
    } catch (error) {
      console.error(
        "Restore milestone draft failed:",
        error
      );
    }
  }

  /*
   * 提交阶段成果
   */
  async function submitMilestone(
    requestNo
  ) {
    const container =
      getWorkflowContainer(requestNo);

    if (!container) {
      return;
    }

    const milestoneData =
      collectMilestoneInputs(
        container
      );

    if (
      !milestoneData.milestone_summary ||
      !milestoneData.worker_signature ||
      !milestoneData.submitted_time
    ) {
      showPageMessage(
        currentLanguage === "zh"
          ? "请填写阶段成果说明、工作人员签名和提交时间。"
          : "Enter the milestone summary, worker signature, and submission time.",
        "error"
      );

      return;
    }

    milestoneData.request_no =
      requestNo;

    milestoneData.worker_phone =
      currentWorkerPhone;

    milestoneData.submitted_at =
      new Date().toISOString();

    saveMilestoneDraftLocally(
      requestNo,
      milestoneData
    );

    const client =
      getSupabaseClient();

    if (
      !client ||
      typeof client.from !== "function"
    ) {
      showPageMessage(
        t("supabaseUnavailable"),
        "error"
      );
      return;
    }

    const submitButton =
      container.querySelector(
        ".primary-button"
      );

    if (submitButton) {
      submitButton.disabled = true;

      submitButton.textContent =
        currentLanguage === "zh"
          ? "正在提交……"
          : "Submitting...";
    }

    showPageMessage(
      currentLanguage === "zh"
        ? "正在提交阶段成果……"
        : "Submitting milestone results...",
      "info"
    );

    try {
      const submittedAt =
        new Date().toISOString();

      const { error } = await client
        .from("service_requests")
        .update({
          status:
            "milestone_submitted",

          milestone_summary:
            milestoneData
              .milestone_summary,

          milestone_evidence:
            milestoneData
              .milestone_evidence ||
            null,

          milestone_worker_signature:
            milestoneData
              .worker_signature,

          milestone_customer_review_items:
            milestoneData
              .customer_review_items ||
            null,

          milestone_submitted_at:
            submittedAt,

          updated_at:
            submittedAt
        })
        .eq(
          "request_no",
          requestNo
        );

      if (error) {
        throw error;
      }

      updateLocalTaskStatus(
        requestNo,
        "milestone_submitted"
      );

      const task =
        findLoadedTask(requestNo);

      if (task) {
        task.milestone_summary =
          milestoneData
            .milestone_summary;

        task.milestone_evidence =
          milestoneData
            .milestone_evidence;

        task.milestone_submitted_at =
          submittedAt;
      }

      renderTasks(
        window.loadedWorkerTasks
      );

      showPageMessage(
        currentLanguage === "zh"
          ? "阶段成果已提交，等待客户阶段验收。"
          : "The milestone has been submitted and is awaiting customer acceptance.",
        "success"
      );
    } catch (error) {
      console.error(
        "Submit milestone failed:",
        error
      );

      showPageMessage(
        currentLanguage === "zh"
          ? "阶段成果提交失败，请稍后再试。"
          : "Unable to submit the milestone. Please try again.",
        "error"
      );

      if (submitButton) {
        submitButton.disabled = false;

        submitButton.textContent =
          t("submitMilestoneButton");
      }
    }
  }  /*
   * 显示最终完成提交表单
   */
  function showFinalCompletion(requestNo) {
    const container =
      getWorkflowContainer(requestNo);

    if (!container) {
      return;
    }

    const task =
      findLoadedTask(requestNo);

    const workerName = getTaskValue(
      task,
      [
        "worker_name",
        "assigned_worker_name"
      ],
      ""
    );

    const completionTime =
      new Date()
        .toISOString()
        .slice(0, 16);

    container.innerHTML = `
      <section class="workflow-section">
        <h3 class="workflow-title">
          ${escapeHtml(
            t("finalCompletionTitle")
          )}
        </h3>

        <p class="workflow-description">
          ${escapeHtml(
            t("finalCompletionDescription")
          )}
        </p >

        <div class="work-form">
          <label>
            ${escapeHtml(
              t("completionSummary")
            )}
          </label>

          <textarea
            class="work-input"
            data-completion-input="completion_summary"
            placeholder="${escapeHtml(
              t(
                "completionSummaryPlaceholder"
              )
            )}"
          ></textarea>

          <label>
            ${
              currentLanguage === "zh"
                ? "最终成果证据"
                : "Final Evidence"
            }
          </label>

          <textarea
            class="work-input"
            data-completion-input="completion_evidence"
            placeholder="${
              currentLanguage === "zh"
                ? "填写最终照片、视频、文件及其他成果证明"
                : "List final photographs, videos, files, and other evidence"
            }"
          ></textarea>

          <label>
            ${
              currentLanguage === "zh"
                ? "遗留问题"
                : "Outstanding Issues"
            }
          </label>

          <textarea
            class="work-input"
            data-completion-input="outstanding_issues"
            placeholder="${
              currentLanguage === "zh"
                ? "如无遗留问题，请填写“无”"
                : "Enter None when there are no outstanding issues"
            }"
          ></textarea>

          <label>
            ${
              currentLanguage === "zh"
                ? "现场清理确认"
                : "Site Cleanup Confirmation"
            }
          </label>

          <select
            class="work-input"
            data-completion-input="site_cleanup_confirmed"
          >
            <option value="">
              ${
                currentLanguage === "zh"
                  ? "请选择"
                  : "Select"
              }
            </option>

            <option value="yes">
              ${
                currentLanguage === "zh"
                  ? "已完成现场清理"
                  : "Site cleanup completed"
              }
            </option>

            <option value="no">
              ${
                currentLanguage === "zh"
                  ? "尚未完成现场清理"
                  : "Site cleanup not completed"
              }
            </option>
          </select>

          <label>
            ${
              currentLanguage === "zh"
                ? "工具和剩余材料确认"
                : "Tools and Remaining Materials"
            }
          </label>

          <textarea
            class="work-input"
            data-completion-input="tools_materials_note"
            placeholder="${
              currentLanguage === "zh"
                ? "说明工具撤离、剩余材料移交或处理情况"
                : "Describe tool removal and the handling of remaining materials"
            }"
          ></textarea>

          <label>
            ${
              currentLanguage === "zh"
                ? "工作人员签名"
                : "Worker Signature"
            }
          </label>

          <input
            class="work-input"
            type="text"
            data-completion-input="worker_signature"
            value="${escapeHtml(
              workerName
            )}"
            placeholder="${
              currentLanguage === "zh"
                ? "请输入工作人员姓名作为签名"
                : "Enter the worker’s name as a signature"
            }"
          >

          <label>
            ${
              currentLanguage === "zh"
                ? "完成日期与时间"
                : "Completion Date and Time"
            }
          </label>

          <input
            class="work-input"
            type="datetime-local"
            data-completion-input="completion_time"
            value="${escapeHtml(
              completionTime
            )}"
          >

          <label>
            ${
              currentLanguage === "zh"
                ? "请客户重点验收的内容"
                : "Items Requiring Final Acceptance"
            }
          </label>

          <textarea
            class="work-input"
            data-completion-input="customer_acceptance_items"
            placeholder="${
              currentLanguage === "zh"
                ? "填写需要客户最终检查、确认和签字的内容"
                : "Describe the items requiring final customer inspection and signature"
            }"
          ></textarea>
        </div>

        <p class="section-note">
          ${
            currentLanguage === "zh"
              ? "工作人员提交最终成果后，任务将进入客户最终验收环节。客户验收通过后才能结算和归档。"
              : "After final submission, the task enters customer final acceptance. Settlement and archiving follow customer approval."
          }
        </p >

        <div class="task-actions">
          <button
            class="secondary-button"
            type="button"
            onclick="showWorkExecution(
              '${escapeHtml(requestNo)}'
            )"
          >
            ${
              currentLanguage === "zh"
                ? "返回工作记录"
                : "Back to Work Record"
            }
          </button>

          <button
            class="success-button"
            type="button"
            onclick="submitFinalCompletion(
              '${escapeHtml(requestNo)}'
            )"
          >
            ${escapeHtml(
              t("submitFinalCompletion")
            )}
          </button>
        </div>
      </section>
    `;

    restoreCompletionDraft(
      requestNo,
      container
    );

    container.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  /*
   * 读取最终完成表单
   */
  function collectCompletionInputs(
    container
  ) {
    const inputs =
      container.querySelectorAll(
        "[data-completion-input]"
      );

    const result = {};

    inputs.forEach(
      function (input) {
        const fieldName =
          input.dataset.completionInput;

        result[fieldName] =
          String(input.value || "").trim();
      }
    );

    return result;
  }

  /*
   * 本地保存最终完成草稿
   */
  function saveCompletionDraftLocally(
    requestNo,
    completionData
  ) {
    localStorage.setItem(
      `echocity-completion-${requestNo}`,
      JSON.stringify(completionData)
    );
  }

  /*
   * 恢复最终完成草稿
   */
  function restoreCompletionDraft(
    requestNo,
    container
  ) {
    const savedText =
      localStorage.getItem(
        `echocity-completion-${requestNo}`
      );

    if (!savedText) {
      return;
    }

    try {
      const savedData =
        JSON.parse(savedText);

      const inputs =
        container.querySelectorAll(
          "[data-completion-input]"
        );

      inputs.forEach(
        function (input) {
          const fieldName =
            input.dataset.completionInput;

          if (
            savedData[fieldName] !==
            undefined
          ) {
            input.value =
              savedData[fieldName];
          }
        }
      );
    } catch (error) {
      console.error(
        "Restore completion draft failed:",
        error
      );
    }
  }

  /*
   * 提交最终完成成果
   */
  async function submitFinalCompletion(
    requestNo
  ) {
    const container =
      getWorkflowContainer(requestNo);

    if (!container) {
      return;
    }

    const completionData =
      collectCompletionInputs(
        container
      );

    if (
      !completionData.completion_summary ||
      !completionData.worker_signature ||
      !completionData.completion_time ||
      !completionData
        .site_cleanup_confirmed
    ) {
      showPageMessage(
        currentLanguage === "zh"
          ? "请填写最终完成说明、现场清理情况、工作人员签名和完成时间。"
          : "Enter the final summary, site cleanup status, worker signature, and completion time.",
        "error"
      );

      return;
    }

    const confirmed =
      window.confirm(
        currentLanguage === "zh"
          ? "请确认：全部工作已经完成，现在提交客户最终验收。"
          : "Please confirm that all work is complete and ready for final customer acceptance."
      );

    if (!confirmed) {
      return;
    }

    completionData.request_no =
      requestNo;

    completionData.worker_phone =
      currentWorkerPhone;

    completionData.submitted_at =
      new Date().toISOString();

    saveCompletionDraftLocally(
      requestNo,
      completionData
    );

    const client =
      getSupabaseClient();

    if (
      !client ||
      typeof client.from !== "function"
    ) {
      showPageMessage(
        t("supabaseUnavailable"),
        "error"
      );
      return;
    }

    const submitButton =
      container.querySelector(
        ".success-button"
      );

    if (submitButton) {
      submitButton.disabled = true;

      submitButton.textContent =
        currentLanguage === "zh"
          ? "正在提交……"
          : "Submitting...";
    }

    showPageMessage(
      currentLanguage === "zh"
        ? "正在提交最终成果……"
        : "Submitting final results...",
      "info"
    );

    try {
      const submittedAt =
        new Date().toISOString();

      const { error } = await client
        .from("service_requests")
        .update({
          status: "completed",

          completion_summary:
            completionData
              .completion_summary,

          completion_evidence:
            completionData
              .completion_evidence ||
            null,

          outstanding_issues:
            completionData
              .outstanding_issues ||
            null,

          site_cleanup_confirmed:
            completionData
              .site_cleanup_confirmed ===
            "yes",

          tools_materials_note:
            completionData
              .tools_materials_note ||
            null,

          completion_worker_signature:
            completionData
              .worker_signature,

          customer_acceptance_items:
completionData.customer_acceptance_items || null,

          work_completed_at:
            submittedAt,

          updated_at:
            submittedAt
        })
        .eq(
          "request_no",
          requestNo
        );

      if (error) {
        throw error;
      }

      updateLocalTaskStatus(
        requestNo,
        "completed"
      );

      const task =
        findLoadedTask(requestNo);

      if (task) {
        task.completion_summary =
          completionData
            .completion_summary;

        task.work_completed_at =
  submittedAt;
      }

      renderTasks(
        window.loadedWorkerTasks
      );

      showPageMessage(
        currentLanguage === "zh"
          ? "最终成果已提交，正在等待客户最终验收。"
          : "Final results were submitted and are awaiting customer acceptance.",
        "success"
      );
    } catch (error) {
  console.error(
    "Final completion submission failed:",
    error
  );

  console.error(
    "Final error message:",
    error?.message
  );

  console.error(
    "Final error code:",
    error?.code
  );

  console.error(
    "Final error details:",
    error?.details
  );

  console.error(
    "Final error hint:",
    error?.hint
  );

      showPageMessage(
        currentLanguage === "zh"
          ? "最终成果提交失败，请稍后再试。"
          : "Unable to submit the final results. Please try again.",
        "error"
      );

      if (submitButton) {
        submitButton.disabled = false;

        submitButton.textContent =
          t("submitFinalCompletion");
      }
    }
  }

  /*
   * 页面启动
   */
  function initializeWorkerTasksPage() {
    applyStaticTranslations();

    const params =
      new URLSearchParams(
        window.location.search
      );

    const phoneFromUrl =
      params.get("phone");

    const savedPhone =
      localStorage.getItem(
        "echocity-worker-phone"
      );

    const initialPhone =
      phoneFromUrl ||
      savedPhone ||
      "";

    if (initialPhone) {
      const normalizedPhone =
        normalizePhone(initialPhone);

      document
        .getElementById(
          "workerPhoneInput"
        )
        .value = normalizedPhone;

      currentWorkerPhone =
        normalizedPhone;
    }

    document
      .getElementById(
        "workerPhoneInput"
      )
      .addEventListener(
        "change",
        function (event) {
          const phone =
            normalizePhone(
              event.target.value
            );

          event.target.value = phone;

          if (phone) {
            localStorage.setItem(
              "echocity-worker-phone",
              phone
            );
          }
        }
      );
  }

  initializeWorkerTasksPage();
</script>
</body>
</html>
