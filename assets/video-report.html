<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>举报内容 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:620px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 36px}.card{background:#fff;border-radius:18px;padding:18px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:14px}.reason{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:13px;margin:8px 0}.reason.active{border-color:#ef4444;background:#fef2f2}.note{width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin-top:12px}.submit{width:100%;height:46px;border:0;border-radius:12px;background:#ef4444;color:#fff;font-weight:900;margin-top:14px}</style></head><body><main class="wrap"><button class="back" onclick="history.back()">← 返回</button><section class="card"><h1>举报视频</h1><p style="color:#64748b">请选择最符合的原因。平台会记录举报并进入审核流程。</p><div id="reasons"></div><textarea id="note" class="note" placeholder="补充说明（可选）"></textarea><button id="submit" class="submit">提交举报</button></section></main><script>const db=window.echoCitySupabase,videoId=new URLSearchParams(location.search).get('video_id');let selected='';const opts=[['illegal','违法违规'],['fraud','欺诈或虚假信息'],['harassment','骚扰或攻击'],['privacy','侵犯隐私'],['copyright','侵犯知识产权'],['dangerous','危险行为'],['spam','垃圾营销'],['other','其他']];reasons.innerHTML=opts.map(([v,t])=>`<button class="reason" data-v="${v}">${t}</button>`).join('');document.querySelectorAll('.reason').forEach(b=>b.onclick=()=>{selected=b.dataset.v;document.querySelectorAll('.reason').forEach(x=>x.classList.toggle('active',x===b))});submit.onclick=async()=>{const {data:u}=await db.auth.getUser();const me=u?.user;if(!me){alert('请先登录');return}if(!videoId||!selected){alert('请选择举报原因');return}const {error}=await db.from('content_reports').insert({reporter_id:me.id,target_type:'video',target_id:videoId,reason_code:selected,details:note.value.trim()||null});if(error){alert('提交失败：'+error.message);return}alert('举报已提交');history.back()};</script></body></html>
