<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>关系 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 30px}.top{display:flex;justify-content:space-between;align-items:center}button{font:inherit}.back{border:0;border-radius:10px;padding:9px 12px;background:#fff}.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin:14px 0}.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:900}.tab.active{background:#111827;color:#fff}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.body{flex:1}.name{font-weight:900}.meta{font-size:12px;color:#64748b;margin-top:3px}.act{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.danger{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#94a3b8;padding:50px 10px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><h2>关注与粉丝</h2></div><div class="tabs"><button class="tab active" data-mode="following">关注</button><button class="tab" data-mode="followers">粉丝</button><button class="tab" data-mode="blocked">黑名单</button></div><section id="list" class="list"></section></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');let me=null,mode='following';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){list.innerHTML='<div class="empty">登录后查看关系数据</div>';return}load()}async function load(){list.innerHTML='<div class="empty">正在读取……</div>';let ids=[];if(mode==='following'){const {data}=await db.from('follows').select('following_id').eq('follower_id',me.id);ids=(data||[]).map(x=>x.following_id)}else if(mode==='followers'){const {data}=await db.from('follows').select('follower_id').eq('following_id',me.id);ids=(data||[]).map(x=>x.follower_id)}else{const {data}=await db.from('user_blocks').select('blocked_id').eq('blocker_id',me.id);ids=(data||[]).map(x=>x.blocked_id)}if(!ids.length){list.innerHTML='<div class="empty">这里还没有内容</div>';return}const {data:p}=await db.from('profiles').select('id,display_name,avatar_url,city,bio').in('id',ids);list.innerHTML=(p||[]).map(x=>`<article class="item"><div class="avatar" onclick="location.href='creator-profile.html?id=${x.id}'">${x.avatar_url?`<img src="${esc(x.avatar_url)}">`:esc((x.display_name||'E').slice(0,1))}</div><div class="body"><div class="name">${esc(x.display_name||'EchoCity 用户')}</div><div class="meta">${esc([x.city,x.bio].filter(Boolean).join(' · '))}</div></div>${mode==='blocked'?`<button class="act" onclick="unblock('${x.id}')">解除</button>`:`<button class="act danger" onclick="blockUser('${x.id}')">拉黑</button>`}</article>`).join('')}async function blockUser(id){await db.from('user_blocks').upsert({blocker_id:me.id,blocked_id:id},{onConflict:'blocker_id,blocked_id'});await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',id);load()}async function unblock(id){await db.from('user_blocks').delete().eq('blocker_id',me.id).eq('blocked_id',id);load()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));mode=t.dataset.mode;load()});init();</script></body></html>
