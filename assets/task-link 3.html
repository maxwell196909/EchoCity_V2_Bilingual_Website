<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EchoCity | 专用任务链接</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#eef4fb;color:#152238}
    .page{width:min(920px,calc(100% - 24px));margin:auto;padding:18px 0 44px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.nav-left{display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}
    button{border:1px solid #ccd6e3;background:#fff;border-radius:999px;padding:9px 15px;font-weight:700}
    .hero,.card{background:#fff;border:1px solid #d8e1ec;border-radius:18px;box-shadow:0 12px 32px rgba(35,55,80,.08)}
    .hero{padding:24px;background:linear-gradient(135deg,#0e4d70,#11835d);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,42px)}
    .hero p{margin:0;line-height:1.65;opacity:.9}.card{margin-top:15px;padding:19px}.hidden{display:none}.status{line-height:1.65}
    .error{background:#fff0f0;color:#a71d2a;border-color:#f2c8cc}.badge{display:inline-block;padding:5px 11px;border-radius:999px;background:#e8f2ff;color:#1555a2;font-size:13px;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:14px}.item{padding:13px;border-radius:12px;background:#f6f8fb}
    .item.full{grid-column:1/-1}.label{font-size:12px;color:#64748b;font-weight:700}.value{margin-top:6px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .section-title{margin:0 0 12px;font-size:19px}.counts{display:flex;gap:10px;flex-wrap:wrap}.count{padding:10px 13px;background:#eef7f3;border-radius:10px;color:#176440;font-weight:700}
    .notice{margin-top:14px;padding:12px;border-radius:11px;background:#fff8df;color:#775800;line-height:1.55}
    .action-box{margin-top:15px;padding:19px;background:#fff;border:1px solid #d8e1ec;border-radius:18px}.check-row{display:flex;gap:10px;align-items:flex-start;margin:12px 0;line-height:1.5}
    .check-row input{width:20px;height:20px;margin-top:1px}.file-label{display:block;margin:16px 0 7px;font-weight:800}.file-input{width:100%;padding:12px;border:1px dashed #9dafc4;border-radius:12px;background:#f8fafc}
    .primary{margin-top:16px;background:#087a4b;color:#fff;border-color:#087a4b;border-radius:12px;padding:12px 18px}.primary:disabled{opacity:.45}.action-status{margin-top:12px;line-height:1.55}.success{color:#087a4b}.danger{color:#b42318}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.item.full{grid-column:1}.top{align-items:flex-start}}
  </style>
</head>
<body>
<main class="page">
  <header class="top"><div class="nav-left"><button id="backButton" type="button">← 返回</button><div class="brand">EchoCity</div></div><button id="langButton" type="button">EN</button></header>
  <section class="hero">
    <h1 id="title">任务协同页面</h1>
    <p id="subtitle">客户、工人和平台围绕同一任务查看实时信息。</p>
  </section>
  <section id="loadingCard" class="card"><div id="loadingText" class="status">正在安全读取任务信息……</div></section>
  <section id="errorCard" class="card error hidden"><div id="errorText" class="status"></div></section>
  <section id="taskCard" class="card hidden">
    <span id="roleBadge" class="badge"></span>
    <div class="grid">
      <div class="item"><div id="requestLabel" class="label"></div><div id="requestNo" class="value"></div></div>
      <div class="item"><div id="statusLabel" class="label"></div><div id="status" class="value"></div></div>
      <div class="item"><div id="typeLabel" class="label"></div><div id="serviceType" class="value"></div></div>
      <div class="item"><div id="dateLabel" class="label"></div><div id="serviceDate" class="value"></div></div>
      <div class="item full"><div id="descriptionLabel" class="label"></div><div id="description" class="value"></div></div>
      <div class="item full"><div id="addressLabel" class="label"></div><div id="address" class="value"></div></div>
      <div class="item"><div id="actorLabel" class="label"></div><div id="currentActor" class="value"></div></div>
      <div class="item"><div id="actionLabel" class="label"></div><div id="nextAction" class="value"></div></div>
      <div class="item"><div id="workerLabel" class="label"></div><div id="worker" class="value"></div></div>
      <div class="item"><div id="startLabel" class="label"></div><div id="startAt" class="value"></div></div>
    </div>
  </section>
  <section id="recordsCard" class="card hidden">
    <h2 id="recordsTitle" class="section-title"></h2>
    <div class="counts">
      <div id="planCount" class="count"></div><div id="inspectionCount" class="count"></div><div id="evidenceCount" class="count"></div>
    </div>
    <div id="readOnlyNotice" class="notice"></div>
  </section>
  <section id="workerActionCard" class="action-box hidden">
    <h2 id="prestartTitle" class="section-title"></h2>
    <label class="check-row"><input id="siteCheck" type="checkbox"><span id="siteCheckText"></span></label>
    <label class="check-row"><input id="scopeCheck" type="checkbox"><span id="scopeCheckText"></span></label>
    <label id="photoLabel" class="file-label" for="prestartPhoto"></label>
    <input id="prestartPhoto" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment">
    <button id="startWorkButton" class="primary" type="button" disabled></button>
    <div id="actionStatus" class="action-status"></div>
  </section>
</main>
<script>
  const text={
    zh:{back:"← 返回",title:"任务协同页面",subtitle:"客户、工人和平台围绕同一任务查看实时信息。",loading:"正在安全读取任务信息……",invalid:"链接缺少必要信息，请联系平台重新发送。",expired:"链接无效或已经过期，请联系平台重新发送。",request:"任务编号",status:"当前状态",type:"服务类型",date:"计划日期",description:"任务内容",address:"服务地址",actor:"当前责任方",action:"下一步工作",worker:"服务人员",start:"计划开始时间",records:"任务资料",plans:"方案",inspections:"验收",evidence:"证据",notice:"任务资料由客户、工人和平台共享；不同角色仅能执行自己的操作。",none:"未填写",prestart:"开工前确认",siteCheck:"已与客户确认现场施工条件、水电、出入和安全要求",scopeCheck:"已核对任务范围、质量标准、完成时间和验收要求",photo:"上传开工前现场照片（至少1张）",startButton:"确认并开始工作",starting:"正在上传照片并登记开工……",started:"开工登记成功，任务已进入施工中。",choosePhoto:"请先选择一张现场照片。",completeChecks:"请先完成两项现场确认。",fileTooLarge:"照片不能超过10MB。",actionFailed:"提交失败，请稍后重试或联系平台。",alreadyStarted:"该任务已经开始施工。",roles:{customer:"客户",worker:"工人",platform:"平台"}},
    en:{back:"← Back",title:"Task Collaboration",subtitle:"Customer, worker and platform view the same live task data.",loading:"Securely loading task data...",invalid:"This link is incomplete. Ask the platform to send a new one.",expired:"This link is invalid or expired. Ask the platform to send a new one.",request:"Request number",status:"Status",type:"Service type",date:"Service date",description:"Task description",address:"Service address",actor:"Current actor",action:"Next action",worker:"Worker",start:"Planned start",records:"Task records",plans:"Plans",inspections:"Inspections",evidence:"Evidence",notice:"Task records are shared by customer, worker and platform; each role can only perform its own actions.",none:"Not provided",prestart:"Pre-start confirmation",siteCheck:"Site access, utilities and safety requirements were confirmed with the customer",scopeCheck:"Scope, quality, completion time and acceptance requirements were checked",photo:"Upload a pre-start site photo (at least one)",startButton:"Confirm and start work",starting:"Uploading photo and recording work start...",started:"Work start recorded. The task is now in progress.",choosePhoto:"Select one site photo first.",completeChecks:"Complete both confirmations first.",fileTooLarge:"The photo must not exceed 10 MB.",actionFailed:"Submission failed. Try again or contact the platform.",alreadyStarted:"This task has already started.",roles:{customer:"Customer",worker:"Worker",platform:"Platform"}}
  };
  let lang=localStorage.getItem("echocity-language")||"zh";let task=null;let role="";let requestNo="";let token="";let uploadContext=null;
  const $=id=>document.getElementById(id);const show=id=>$(id).classList.remove("hidden");const hide=id=>$(id).classList.add("hidden");
  function value(v){return v===null||v===undefined||v===""?text[lang].none:String(v)}
  function dateTime(v){if(!v)return text[lang].none;const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString(lang==="zh"?"zh-CN":"en-US")}
  function applyLanguage(){const t=text[lang];document.documentElement.lang=lang==="zh"?"zh-CN":"en";$("backButton").textContent=t.back;$("langButton").textContent=lang==="zh"?"EN":"中文";$("title").textContent=t.title;$("subtitle").textContent=t.subtitle;$("loadingText").textContent=t.loading;
    [["requestLabel",t.request],["statusLabel",t.status],["typeLabel",t.type],["dateLabel",t.date],["descriptionLabel",t.description],["addressLabel",t.address],["actorLabel",t.actor],["actionLabel",t.action],["workerLabel",t.worker],["startLabel",t.start],["recordsTitle",t.records],["readOnlyNotice",t.notice],["prestartTitle",t.prestart],["siteCheckText",t.siteCheck],["scopeCheckText",t.scopeCheck],["photoLabel",t.photo],["startWorkButton",t.startButton]].forEach(([id,v])=>$(id).textContent=v);if(task)render();}
  function render(){const t=text[lang];$("roleBadge").textContent=t.roles[role]||role;$("requestNo").textContent=value(task.request_no);$("status").textContent=value(task.status);$("serviceType").textContent=value(task.service_type);$("serviceDate").textContent=value(task.service_date);$("description").textContent=value(task.description);$("address").textContent=value(task.address);$("currentActor").textContent=value(task.current_actor);$("nextAction").textContent=value(task.next_action);$("worker").textContent=value(task.assigned_worker);$("startAt").textContent=dateTime(task.assigned_start_time);$("planCount").textContent=`${t.plans}: ${(task.plans||[]).length}`;$("inspectionCount").textContent=`${t.inspections}: ${(task.inspections||[]).length}`;$("evidenceCount").textContent=`${t.evidence}: ${(task.evidence||[]).length}`;}
  function refreshStartButton(){$("startWorkButton").disabled=!($("siteCheck").checked&&$("scopeCheck").checked&&$("prestartPhoto").files.length&&uploadContext)}
  async function prepareWorkerAction(client){if(role!=="worker")return;if(["in_progress","working"].includes(task.status)){$("actionStatus").textContent=text[lang].alreadyStarted;$('actionStatus').className='action-status success';show("workerActionCard");return;}const {data,error}=await client.rpc("worker_upload_context_with_token",{p_request_no:requestNo,p_token:token});if(error)throw error;uploadContext=data;show("workerActionCard");refreshStartButton();}
  async function startWork(){const t=text[lang];const file=$("prestartPhoto").files[0];if(!$("siteCheck").checked||!$("scopeCheck").checked){$("actionStatus").textContent=t.completeChecks;return}if(!file){$("actionStatus").textContent=t.choosePhoto;return}if(file.size>uploadContext.max_file_bytes){$("actionStatus").textContent=t.fileTooLarge;return}const client=window.echoCitySupabase;$("startWorkButton").disabled=true;$("actionStatus").className="action-status";$("actionStatus").textContent=t.starting;try{const nameExt=(file.name.split(".").pop()||"").toLowerCase();const mime=file.type||({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",heic:"image/heic",heif:"image/heif"}[nameExt]||"");if(!uploadContext.accepted_types.includes(mime))throw new Error("UNSUPPORTED_IMAGE_TYPE");const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/heic":"heic","image/heif":"heif"}[mime];const unique=(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));const path=`${uploadContext.path_prefix}/${Date.now()}-${unique}.${ext}`;const {error:uploadError}=await client.storage.from(uploadContext.bucket).upload(path,file,{contentType:mime,upsert:false});if(uploadError)throw uploadError;const {data,error}=await client.rpc("start_task_with_token",{p_request_no:requestNo,p_token:token,p_site_conditions_confirmed:true,p_scope_confirmed:true,p_storage_path:path,p_file_name:file.name,p_file_size:file.size,p_mime_type:mime});if(error)throw error;task.status=data.status;task.current_actor=data.current_actor;task.next_action=data.next_action;task.work_started_at=new Date().toISOString();render();$("actionStatus").className="action-status success";$("actionStatus").textContent=t.started;$("siteCheck").disabled=true;$("scopeCheck").disabled=true;$("prestartPhoto").disabled=true;}catch(error){console.error(error);$("actionStatus").className="action-status danger";$("actionStatus").textContent=t.actionFailed;refreshStartButton();}}
  async function load(){const query=new URLSearchParams(location.search);const secret=new URLSearchParams(location.hash.slice(1));requestNo=query.get("request");role=query.get("role")||"";token=secret.get("token");if(!requestNo||!token||!["customer","worker","platform"].includes(role)){hide("loadingCard");$("errorText").textContent=text[lang].invalid;show("errorCard");return;}
    try{const client=window.echoCitySupabase;if(!client)throw new Error("NO_CLIENT");const {data,error}=await client.rpc("read_task_with_token",{p_request_no:requestNo,p_token:token,p_role:role});if(error)throw error;task=data;render();hide("loadingCard");show("taskCard");show("recordsCard");await prepareWorkerAction(client);}catch(error){console.error(error);hide("loadingCard");$("errorText").textContent=text[lang].expired;show("errorCard");}}
  $("backButton").addEventListener("click",()=>{if(history.length>1){history.back();}else{location.href="../index.html";}});
  ["siteCheck","scopeCheck","prestartPhoto"].forEach(id=>$(id).addEventListener("change",refreshStartButton));$("startWorkButton").addEventListener("click",startWork);
  $("langButton").addEventListener("click",()=>{lang=lang==="zh"?"en":"zh";localStorage.setItem("echocity-language",lang);applyLanguage();});applyLanguage();load();
</script>
</body>
</html>
