<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>评论 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#fff;color:#111827}.wrap{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;z-index:4}.back{border:0;background:#f3f4f6;border-radius:999px;padding:9px 12px}.count{font-weight:900}.list{padding:8px 14px}.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f1f5f9}.avatar{width:40px;height:40px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.body{flex:1}.name{font-size:13px;color:#64748b;font-weight:800}.text{margin:5px 0;line-height:1.5}.time{font-size:12px;color:#94a3b8}.reply{border:0;background:none;color:#2563eb;padding:0;margin-left:8px}.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px}.composer input{flex:1;border:1px solid #d1d5db;border-radius:999px;padding:12px 15px;font:inherit}.composer button{border:0;border-radius:999px;background:#2563eb;color:#fff;font-weight:900;padding:0 18px}.empty{text-align:center;color:#94a3b8;padding:44px 18px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><div id="count" class="count">评论</div><span></span></div><section id="list" class="list"><div class="empty">正在读取评论……</div></section></main><div class="composer"><input id="input" maxlength="500" placeholder="留下你的评论"><button id="send">发送</button></div><script>const db=window.echoCitySupabase;const videoId=new URLSearchParams(location.search).get('video_id');let me=null,replyTo=null;const list=document.getElementById('list'),input=document.getElementById('input');function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!videoId){list.innerHTML='<div class="empty">缺少视频编号</div>';return}const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:c,error}=await db.from('video_comments').select('id,user_id,parent_id,content,created_at').eq('video_id',videoId).eq('status','published').order('created_at',{ascending:true}).limit(300);if(error){list.innerHTML='<div class="empty">评论读取失败</div>';return}const ids=[...new Set((c||[]).map(x=>x.user_id))];const {data:p}=ids.length?await db.from('profiles').select('id,display_name,avatar_url').in('id',ids):{data:[]};const pm=new Map((p||[]).map(x=>[x.id,x]));document.getElementById('count').textContent=`${(c||[]).length} 条评论`;list.innerHTML=(c||[]).length?(c||[]).map(x=>{const u=pm.get(x.user_id)||{},name=u.display_name||'EchoCity 用户';return `<article class="comment" data-id="${x.id}" data-user="${x.user_id}"><div class="avatar">${u.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc(name.slice(0,1))}</div><div class="body"><div class="name">${esc(name)}${x.parent_id?' · 回复':''}</div><div class="text">${esc(x.content)}</div><div class="time">${new Date(x.created_at).toLocaleString()}<button class="reply" onclick="setReply('${x.id}','${esc(name)}')">回复</button>${me?.id===x.user_id?`<button class="reply" onclick="removeComment('${x.id}')">删除</button>`:''}</div></div></article>`}).join(''):'<div class="empty">还没有评论，来发表第一条吧。</div>'}window.setReply=(id,name)=>{replyTo=id;input.placeholder='回复 @'+name;input.focus()};window.removeComment=async id=>{if(!confirm('删除这条评论？'))return;await db.from('video_comments').delete().eq('id',id);load()};document.getElementById('send').onclick=async()=>{const text=input.value.trim();if(!text)return;if(!me){alert('请先登录后评论');return}const {error}=await db.from('video_comments').insert({video_id:videoId,user_id:me.id,parent_id:replyTo,content:text,status:'published'});if(error){alert('评论失败：'+error.message);return}input.value='';replyTo=null;input.placeholder='留下你的评论';load()};load();</script></body></html>
