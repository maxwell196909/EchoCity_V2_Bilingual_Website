<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手机号登录 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#07111f,#0b1730);color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(520px,calc(100% - 28px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;color:#172033;border-radius:22px;padding:22px;box-shadow:0 18px 50px #0006}.logo{font-size:26px;font-weight:900;margin-bottom:6px}.sub{color:#64748b;line-height:1.6;margin-bottom:20px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;min-height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;font:inherit;background:#fff}.phoneRow{display:grid;grid-template-columns:104px 1fr;gap:8px}.country{min-height:50px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-weight:900;color:#172033}.primary{width:100%;min-height:50px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-weight:900;font-size:16px}.secondary{width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;color:#172033;font-weight:900;margin-top:10px}.note{margin-top:14px;font-size:13px;color:#64748b;line-height:1.6}.status{display:none;margin-top:14px;padding:12px;border-radius:12px}.status.show{display:block;background:#eff6ff;color:#1d4ed8}.status.error{background:#fff1f2;color:#be123c}.otpBox,.emailBox,.logged{display:none}.showBlock{display:block}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#94a3b8;font-size:13px}.divider:before,.divider:after{content:"";height:1px;background:#e2e8f0;flex:1}.small{font-size:12px;color:#94a3b8}.logout{background:#e2e8f0;color:#172033;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><a class="back" id="backLink" href="video-feed-v4.html">← 返回视频</a><strong>EchoCity Video</strong></div><section class="card"><div class="logo">手机号登录</div><div class="sub">中国大陆版固定使用 +86 手机号 + 短信验证码。无需选择运营商，移动、电信、联通、广电用户使用同一个登录入口。</div><div id="phoneBox"><div class="field"><label>手机号码</label><div class="phoneRow"><div class="country">🇨🇳 +86</div><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="11" placeholder="请输入11位手机号"></div></div><button id="sendOtp" class="primary" type="button">获取验证码</button><div id="otpBox" class="otpBox"><div class="field" style="margin-top:14px"><label>短信验证码</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入6位验证码"></div><button id="verifyOtp" class="primary" type="button">登录 EchoCity</button><div class="small" style="margin-top:8px">验证码为一次性使用；60 秒后可重新获取。</div></div><div class="divider">其他方式</div><button id="emailToggle" class="secondary" type="button">使用邮箱登录</button></div><div id="emailBox" class="emailBox"><div class="field"><label>邮箱</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位"></div><button id="emailLogin" class="primary" type="button">邮箱登录</button><button id="phoneToggle" class="secondary" type="button">返回手机号登录</button></div><div id="logged" class="logged"><h2>已经登录</h2><p id="who"></p><button id="continueBtn" class="primary" type="button">返回短视频</button><button id="logoutBtn" class="primary logout" type="button">退出登录</button></div><div id="status" class="status"></div><div class="note">运营商不需要用户选择。平台短信通道应覆盖中国移动、中国电信、中国联通、中国广电；携号转网用户同样按手机号直接接收验证码。</div></section></main><script>const db=window.echoCitySupabase,$=id=>document.getElementById(id),params=new URLSearchParams(location.search);let currentPhone='';const safeReturn=(()=>{const r=params.get('return')||'video-feed-v4.html';try{const u=new URL(r,location.href);return u.origin===location.origin?u.href:new URL('video-feed-v4.html',location.href).href}catch(e){return new URL('video-feed-v4.html',location.href).href}})();$('backLink').href=safeReturn;function show(t,e=false){$('status').textContent=t;$('status').className='status show'+(e?' error':'')}function normalizePhone(){let n=$('phone').value.replace(/[^0-9]/g,'');if(n.startsWith('86')&&n.length===13)n=n.slice(2);if(!/^1\d{10}$/.test(n))throw new Error('请输入正确的中国大陆11位手机号。');return '+86'+n}async function ensureProfile(user){if(!user)return;const {data}=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();if(data)return;const tail=(user.phone||'').slice(-4);await db.from('profiles').insert({id:user.id,display_name:tail?'用户'+tail:'EchoCity用户',primary_role:'customer',status:'active',is_public:true,phone:user.phone||null})}async function refresh(){const {data}=await db.auth.getUser();const u=data?.user;if(u){$('phoneBox').style.display='none';$('emailBox').classList.remove('showBlock');$('logged').classList.add('showBlock');$('who').textContent=u.phone||u.email||'EchoCity 用户'}else{$('phoneBox').style.display='block';$('logged').classList.remove('showBlock')}}$('sendOtp').onclick=async()=>{try{currentPhone=normalizePhone();$('sendOtp').disabled=true;show('正在发送短信验证码……');const {error}=await db.auth.signInWithOtp({phone:currentPhone,options:{shouldCreateUser:true}});if(error)throw error;$('otpBox').classList.add('showBlock');show('验证码已发送，请查看手机短信。');let s=60;$('sendOtp').textContent=`${s} 秒后重发`;const timer=setInterval(()=>{s--;if(s<=0){clearInterval(timer);$('sendOtp').disabled=false;$('sendOtp').textContent='重新获取验证码'}else $('sendOtp').textContent=`${s} 秒后重发`},1000)}catch(e){$('sendOtp').disabled=false;$('sendOtp').textContent='获取验证码';show('验证码发送失败：'+(e?.message||'请稍后重试'),true)}};$('verifyOtp').onclick=async()=>{const token=$('otp').value.replace(/\D/g,'');if(!currentPhone)return show('请先获取验证码。',true);if(token.length!==6)return show('请输入6位短信验证码。',true);$('verifyOtp').disabled=true;try{const {data,error}=await db.auth.verifyOtp({phone:currentPhone,token,type:'sms'});if(error)throw error;await ensureProfile(data?.user);show('登录成功，正在返回短视频。');setTimeout(()=>location.href=safeReturn,500)}catch(e){show('验证码验证失败：'+(e?.message||'请重新输入'),true);$('verifyOtp').disabled=false}};$('emailToggle').onclick=()=>{$('phoneBox').style.display='none';$('emailBox').classList.add('showBlock');$('status').className='status'};$('phoneToggle').onclick=()=>{$('emailBox').classList.remove('showBlock');$('phoneBox').style.display='block';$('status').className='status'};$('emailLogin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('请输入邮箱和密码。',true);try{$('emailLogin').disabled=true;const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await ensureProfile(data?.user);show('登录成功，正在返回短视频。');setTimeout(()=>location.href=safeReturn,500)}catch(e){show('邮箱登录失败：'+(e?.message||'请稍后重试'),true)}finally{$('emailLogin').disabled=false}};$('continueBtn').onclick=()=>location.href=safeReturn;$('logoutBtn').onclick=async()=>{await db.auth.signOut();show('已经退出登录。');await refresh()};refresh();</script></body></html>
