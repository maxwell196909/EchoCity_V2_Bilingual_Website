<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 / 注册 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#07111f,#0b1730);color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(520px,calc(100% - 28px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;color:#172033;border-radius:22px;padding:22px;box-shadow:0 18px 50px #0006}.logo{font-size:26px;font-weight:900;margin-bottom:6px}.sub{color:#64748b;line-height:1.6;margin-bottom:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef2f7;border-radius:12px;padding:4px;margin-bottom:18px}.tab{border:0;border-radius:10px;padding:11px;font-weight:900;background:transparent}.tab.active{background:#111827;color:#fff}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;font:inherit}.primary{width:100%;min-height:50px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-weight:900;font-size:16px}.note{margin-top:14px;font-size:13px;color:#64748b;line-height:1.6}.status{display:none;margin-top:14px;padding:12px;border-radius:12px}.status.show{display:block;background:#eff6ff;color:#1d4ed8}.status.error{background:#fff1f2;color:#be123c}.logged{display:none}.logged.show{display:block}.logout{margin-top:10px;background:#e2e8f0;color:#172033}</style></head><body><main class="wrap"><div class="top"><a class="back" id="backLink" href="video-feed-v4.html">← 返回视频</a><strong>EchoCity Video</strong></div><section class="card"><div class="logo">登录 EchoCity</div><div class="sub">登录后可发布视频、点赞、收藏、关注、评论和使用“我的”。登录后仍返回短视频系统。</div><div id="authBox"><div class="tabs"><button id="loginTab" class="tab active" type="button">登录</button><button id="registerTab" class="tab" type="button">注册</button></div><div class="field"><label>邮箱</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位"></div><div id="nameField" class="field" hidden><label>昵称</label><input id="displayName" maxlength="40" placeholder="例如：Peter"></div><button id="submit" class="primary" type="button">登录</button><div class="note">注册时如果系统要求邮箱确认，请先到邮箱完成确认，再回来登录。</div></div><div id="logged" class="logged"><h2>已经登录</h2><p id="who"></p><button id="continueBtn" class="primary" type="button">返回短视频</button><button id="logoutBtn" class="primary logout" type="button">退出登录</button></div><div id="status" class="status"></div></section></main><script>const db=window.echoCitySupabase,$=id=>document.getElementById(id),params=new URLSearchParams(location.search);let mode='login';const safeReturn=(()=>{const r=params.get('return')||'video-feed-v4.html';try{const u=new URL(r,location.href);return u.origin===location.origin?u.href:new URL('video-feed-v4.html',location.href).href}catch(e){return new URL('video-feed-v4.html',location.href).href}})();$('backLink').href=safeReturn;function show(t,e=false){$('status').textContent=t;$('status').className='status show'+(e?' error':'')}function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('nameField').hidden=m!=='register';$('submit').textContent=m==='login'?'登录':'注册账号';$('password').autocomplete=m==='login'?'current-password':'new-password'}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');async function refresh(){const {data}=await db.auth.getUser();const u=data?.user;if(u){$('authBox').hidden=true;$('logged').classList.add('show');$('who').textContent=u.email||'EchoCity 用户'}else{$('authBox').hidden=false;$('logged').classList.remove('show')}}$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('请输入邮箱和密码。',true);if(password.length<6)return show('密码至少 6 位。',true);$('submit').disabled=true;try{if(mode==='login'){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;show('登录成功，正在返回短视频。');setTimeout(()=>location.href=safeReturn,500)}else{const displayName=$('displayName').value.trim();const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:displayName||email.split('@')[0]}}});if(error)throw error;if(data?.session){try{await db.from('profiles').upsert({id:data.user.id,display_name:displayName||email.split('@')[0],primary_role:'customer',status:'active',is_public:true},{onConflict:'id'})}catch(e){}show('注册成功，正在返回短视频。');setTimeout(()=>location.href=safeReturn,600)}else show('注册申请已提交。请检查邮箱确认邮件，确认后再登录。')}}catch(e){show((mode==='login'?'登录失败：':'注册失败：')+(e?.message||'请稍后重试'),true)}finally{$('submit').disabled=false}};$('continueBtn').onclick=()=>location.href=safeReturn;$('logoutBtn').onclick=async()=>{await db.auth.signOut();show('已经退出登录。');await refresh()};refresh();</script></body></html>
