<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070a"><title>EchoCity 视频</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}button{font:inherit}.shell{height:100%;position:relative}.tabs{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;z-index:30;display:flex;justify-content:center;gap:24px;text-shadow:0 1px 4px #000}.tab{font-weight:900;opacity:.65;cursor:pointer}.tab.active{opacity:1}.tab.active:after{content:"";display:block;width:20px;height:3px;margin:6px auto 0;background:#fff;border-radius:3px}.discover{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;z-index:31;border:0;border-radius:999px;background:#0008;color:#fff;padding:9px 12px}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.card{height:100%;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 28%,transparent 52%,#000d)}.actions{position:absolute;right:10px;bottom:max(114px,calc(env(safe-area-inset-bottom) + 90px));z-index:7;display:flex;flex-direction:column;gap:12px;align-items:center}.action{width:62px;border:0;background:transparent;color:#fff;text-shadow:0 1px 4px #000;font-weight:800}.bubble{width:46px;height:46px;margin:auto;display:grid;place-items:center;border-radius:50%;background:#0008;font-size:22px}.action small{display:block;font-size:11px;margin-top:3px}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#2563eb;overflow:hidden;display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.meta{position:absolute;left:14px;right:82px;bottom:max(24px,env(safe-area-inset-bottom));z-index:6;text-shadow:0 1px 4px #000}.author{font-weight:900;font-size:17px}.title{margin-top:7px;font-weight:800;line-height:1.4}.desc{font-size:14px;margin-top:4px;line-height:1.45;opacity:.92}.city{font-size:12px;margin-top:6px;opacity:.8}.topics{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.topic{border:0;background:transparent;color:#fff;font-weight:900;padding:0;text-shadow:0 1px 3px #000}.cta{position:absolute;left:14px;right:78px;bottom:max(88px,calc(env(safe-area-inset-bottom) + 58px));z-index:8;display:flex;gap:8px}.cta button{border:1px solid #ffffff55;border-radius:999px;padding:10px 14px;background:#111b;color:#fff;font-weight:900}.cta .primary{background:#2563eb;border-color:#2563eb}.state{height:100%;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at top,#1e3a8a,#090d14 58%)}.state p{color:#cbd5e1;line-height:1.6}.state button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#111e;padding:10px 14px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:760px){.card{max-width:520px;margin:auto}.tabs{max-width:520px;margin:auto}.actions{right:calc((100% - 520px)/2 + 10px)}.meta{left:calc((100% - 520px)/2 + 14px);right:calc((100% - 520px)/2 + 82px)}.cta{left:calc((100% - 520px)/2 + 14px);right:calc((100% - 520px)/2 + 78px)}}</style></head><body><main class="shell"><button class="discover" onclick="location.href='discover.html'">⌕ 发现</button><div class="tabs"><span class="tab" data-feed="local">同城</span><span class="tab" data-feed="following">关注</span><span class="tab active" data-feed="recommend">推荐</span></div><section id="feed" class="feed"></section><div id="toast" class="toast"></div></main><script>const db=window.echoCitySupabase,feed=document.getElementById('feed'),toast=document.getElementById('toast');let me=null,myCity=null,active='recommend',sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now()),timers=new Map(),blocked=new Set();function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1500)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function initUser(){const {data}=await db.auth.getUser();me=data?.user||null;if(me){const [{data:p},{data:b}]=await Promise.all([db.from('profiles').select('city').eq('id',me.id).maybeSingle(),db.from('user_blocks').select('blocked_id').eq('blocker_id',me.id)]);myCity=p?.city||null;blocked=new Set((b||[]).map(x=>x.blocked_id))}}async function recommended(){const {data,error}=await db.rpc('get_recommended_videos_v1',{p_limit:30,p_city:null});if(error)throw error;return (data||[]).map(x=>({id:x.video_id,author_id:x.author_id,title:x.title,description:x.description,video_url:x.video_url,cover_url:x.cover_url,city:x.city,published_at:x.published_at,score:x.score}))}async function load(){feed.innerHTML='<div class="state"><div><h2>EchoCity Video</h2><p>正在加载……</p></div></div>';let v=[];try{if(active==='recommend'){v=await recommended()}else{let q=db.from('videos').select('id,author_id,title,description,video_url,cover_url,duration_seconds,city,location_text,published_at').eq('status','published').eq('visibility','public');if(active==='local'){if(!myCity)return state('请先设置城市','完善个人资料中的城市后，就可以看到同城视频。');q=q.eq('city',myCity)}if(active==='following'){if(!me)return state('请先登录','登录后才能查看你关注的创作者。');const {data:f}=await db.from('follows').select('following_id').eq('follower_id',me.id);const ids=(f||[]).map(x=>x.following_id).filter(id=>!blocked.has(id));if(!ids.length)return state('关注流还是空的','去发现页找创作者并关注他们。','去发现');q=q.in('author_id',ids)}const r=await q.order('published_at',{ascending:false}).limit(30);if(r.error)throw r.error;v=r.data||[]}}catch(e){return state('读取失败',e.message||'无法读取内容')}v=v.filter(x=>!blocked.has(x.author_id));const target=new URLSearchParams(location.search).get('video');if(target&&!v.some(x=>x.id===target)){const {data:t}=await db.from('videos').select('id,author_id,title,description,video_url,cover_url,duration_seconds,city,location_text,published_at').eq('id',target).eq('status','published').eq('visibility','public').maybeSingle();if(t&&!blocked.has(t.author_id))v.unshift(t)}if(!v.length)return state('这里还没有视频',active==='recommend'?'发布第一条视频后就会出现在这里。':'当前筛选下没有视频。','发布视频');if(target){const hit=v.find(x=>x.id===target);if(hit)v=[hit,...v.filter(x=>x.id!==target)]}const aids=[...new Set(v.map(x=>x.author_id).filter(Boolean))],vids=v.map(x=>x.id);const [pr,lr,vtr]=await Promise.all([aids.length?db.from('profiles').select('id,display_name,avatar_url').in('id',aids):Promise.resolve({data:[]}),db.from('video_service_links').select('video_id,service_type,service_name').in('video_id',vids).eq('active',true),db.from('video_topics').select('video_id,topic_id').in('video_id',vids)]);const topicIds=[...new Set((vtr.data||[]).map(x=>x.topic_id))];const tr=topicIds.length?await db.from('topics').select('id,name,slug').in('id',topicIds).eq('status','active'):({data:[]});const pm=new Map((pr.data||[]).map(x=>[x.id,x])),lm=new Map(),tm=new Map(),topicMap=new Map((tr.data||[]).map(x=>[x.id,x]));(lr.data||[]).forEach(x=>{if(!lm.has(x.video_id))lm.set(x.video_id,x)});(vtr.data||[]).forEach(x=>{const t=topicMap.get(x.topic_id);if(t){if(!tm.has(x.video_id))tm.set(x.video_id,[]);tm.get(x.video_id).push(t)}});feed.innerHTML=v.map((x,i)=>card(x,pm.get(x.author_id),lm.get(x.id),tm.get(x.id)||[],i)).join('');bind();observe();v.forEach(updateStats)}function state(h,p,b){feed.innerHTML=`<div class="state"><div><h2>${esc(h)}</h2><p>${esc(p)}</p>${b?`<button onclick="${b==='去发现'?"location.href='discover.html'":"location.href='video-publish.html'"}">${esc(b)}</button>`:''}</div></div>`}function card(v,p,l,topics,i){const n=p?.display_name||'EchoCity 创作者',a=p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(n.slice(0,1)),service=l?.service_name||l?.service_type||'同类服务';return `<article class="card" data-id="${v.id}" data-author="${v.author_id}" data-index="${i}"><video class="media" src="${esc(v.video_url)}" ${v.cover_url?`poster="${esc(v.cover_url)}"`:''} playsinline loop preload="metadata"></video><div class="shade"></div><div class="actions"><button class="action author-btn"><span class="avatar">${a}</span><small>作者</small></button><button class="action like"><span class="bubble">♡</span><small data-count="like">0</small></button><button class="action comment"><span class="bubble">💬</span><small data-count="comment">0</small></button><button class="action fav"><span class="bubble">☆</span><small data-count="favorite">0</small></button><button class="action share"><span class="bubble">↗</span><small data-count="share">0</small></button><button class="action report"><span class="bubble">⋯</span><small>举报</small></button></div><div class="cta"><button class="ai">问 AI</button><button class="primary service" data-service="${esc(l?.service_type||'general')}" data-name="${esc(service)}">我要${esc(service)}</button></div><div class="meta"><div class="author">@${esc(n)}</div><div class="title">${esc(v.title||'EchoCity 视频')}</div>${v.description?`<div class="desc">${esc(v.description)}</div>`:''}${topics.length?`<div class="topics">${topics.map(t=>`<button class="topic" data-topic="${t.id}">#${esc(t.name)}</button>`).join('')}</div>`:''}${v.city||v.location_text?`<div class="city">📍 ${esc(v.location_text||v.city)}</div>`:''}</div></article>`}async function updateStats(v){const {data}=await db.rpc('get_video_social_stats',{p_video_id:v.id});const s=Array.isArray(data)?data[0]:data,c=feed.querySelector(`[data-id="${v.id}"]`);if(!s||!c)return;c.querySelector('[data-count="like"]').textContent=s.like_count||0;c.querySelector('[data-count="comment"]').textContent=s.comment_count||0;c.querySelector('[data-count="favorite"]').textContent=s.favorite_count||0;c.querySelector('[data-count="share"]').textContent=s.share_count||0}function bind(){document.querySelectorAll('.card').forEach(c=>{const v=c.querySelector('video');v.onclick=()=>v.paused?v.play().catch(()=>{}):v.pause();c.querySelector('.author-btn').onclick=()=>location.href=`creator-profile.html?id=${c.dataset.author}`;c.querySelector('.comment').onclick=()=>location.href=`video-comments.html?video_id=${c.dataset.id}`;c.querySelector('.like').onclick=()=>toggle(c,'like');c.querySelector('.fav').onclick=()=>toggle(c,'favorite');c.querySelector('.share').onclick=()=>share(c);c.querySelector('.report').onclick=()=>location.href=`report-content.html?target_type=video&target_id=${c.dataset.id}`;c.querySelector('.ai').onclick=()=>openAI(c);c.querySelector('.service').onclick=e=>openService(c,e.currentTarget);c.querySelectorAll('.topic').forEach(t=>t.onclick=e=>{e.stopPropagation();location.href=`topic.html?id=${t.dataset.topic}`})})}async function toggle(c,action){if(!me)return say('登录后使用');const {data}=await db.from('video_interactions').select('id').eq('video_id',c.dataset.id).eq('user_id',me.id).eq('action',action).maybeSingle();if(data?.id)await db.from('video_interactions').delete().eq('id',data.id);else{const {error}=await db.from('video_interactions').insert({video_id:c.dataset.id,user_id:me.id,action});if(error)return say('操作失败')}updateStats({id:c.dataset.id});say(data?.id?'已取消':'操作成功')}async function share(c){const url=new URL(location.href);url.searchParams.set('video',c.dataset.id);if(me)await db.from('video_interactions').upsert({video_id:c.dataset.id,user_id:me.id,action:'share'},{onConflict:'video_id,user_id,action'});if(navigator.share){try{await navigator.share({title:'EchoCity 视频',url:url.href})}catch(e){}}else{try{await navigator.clipboard.writeText(url.href);say('链接已复制')}catch(e){}}updateStats({id:c.dataset.id})}function openAI(c){if(me)db.from('video_conversions').insert({video_id:c.dataset.id,user_id:me.id,conversion_type:'ai_consult'});location.href=`customer-role-home.html?source=video&video_id=${c.dataset.id}&intent=ai_consult`}function openService(c,b){if(me)db.from('video_conversions').insert({video_id:c.dataset.id,user_id:me.id,conversion_type:'service_click',metadata:{service_type:b.dataset.service}});location.href=`customer-role-home.html?source=video&video_id=${c.dataset.id}&service_type=${encodeURIComponent(b.dataset.service)}&service_name=${encodeURIComponent(b.dataset.name)}`}function observe(){const o=new IntersectionObserver(es=>es.forEach(e=>{const c=e.target,v=c.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.72){document.querySelectorAll('.card video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});if(!timers.has(c.dataset.id))timers.set(c.dataset.id,Date.now())}else{v.pause();finishWatch(c,v)}}),{threshold:[0,.72,1]});document.querySelectorAll('.card').forEach(c=>o.observe(c))}async function finishWatch(c,v){const s=timers.get(c.dataset.id);if(!s)return;timers.delete(c.dataset.id);if(!me)return;const ms=Math.max(0,Date.now()-s);if(ms<500)return;const duration=v.duration?Math.round(v.duration*1000):null,complete=duration?ms>=duration*.9:false;await Promise.all([db.from('feed_impressions').insert({user_id:me.id,video_id:c.dataset.id,feed_type:active,session_id:sessionId,position:Number(c.dataset.index),watch_ms:ms,video_duration_ms:duration,completed:complete}),db.from('video_watch_history').upsert({user_id:me.id,video_id:c.dataset.id,last_watched_at:new Date().toISOString(),watch_ms:ms,completed:complete},{onConflict:'user_id,video_id'})])}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));active=t.dataset.feed;load()});addEventListener('pagehide',()=>document.querySelectorAll('.card').forEach(c=>finishWatch(c,c.querySelector('video'))));(async()=>{await initUser();await load()})();</script></body></html>
