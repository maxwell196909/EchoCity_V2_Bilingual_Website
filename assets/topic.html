<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>话题 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#0b0d12;color:#fff}.wrap{max-width:760px;margin:auto;min-height:100vh}.hero{padding:calc(18px + env(safe-area-inset-top)) 16px 20px;background:linear-gradient(180deg,#1d4ed8,#0b0d12)}button{font:inherit}.back{border:0;border-radius:999px;padding:9px 12px;background:#ffffff22;color:#fff}.hero h1{font-size:30px;margin:22px 0 8px}.hero p{color:#dbeafe;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.item{aspect-ratio:3/4;background:#111;position:relative;overflow:hidden}.item video{width:100%;height:100%;object-fit:cover}.label{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;text-shadow:0 1px 3px #000}.empty{padding:60px 20px;text-align:center;color:#94a3b8}</style></head><body><main class="wrap"><section class="hero"><button class="back" onclick="history.back()">← 返回</button><h1 id="name">#话题</h1><p id="desc">正在加载话题内容……</p></section><section id="grid" class="grid"></section></main><script>const db=window.echoCitySupabase,q=new URLSearchParams(location.search),slug=q.get('slug'),id=q.get('id'),grid=document.getElementById('grid');function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){let tq=db.from('topics').select('id,name,slug,description').eq('status','active');tq=id?tq.eq('id',id):tq.eq('slug',slug||'');const {data:t}=await tq.maybeSingle();if(!t){desc.textContent='没有找到这个话题';return}name.textContent='#'+t.name;desc.textContent=t.description||'EchoCity 话题';const {data:links}=await db.from('video_topics').select('video_id').eq('topic_id',t.id);const ids=(links||[]).map(x=>x.video_id);if(!ids.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">这个话题还没有视频</div>';return}const {data:v}=await db.from('videos').select('id,title,video_url,cover_url').in('id',ids).eq('status','published').eq('visibility','public').order('published_at',{ascending:false});grid.innerHTML=(v||[]).map(x=>`<div class="item" onclick="location.href='video-feed-v3.html?video=${x.id}'"><video muted playsinline preload="metadata" src="${esc(x.video_url)}" ${x.cover_url?`poster="${esc(x.cover_url)}"`:''}></video><div class="label">${esc(x.title||'视频')}</div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">这个话题还没有已发布视频</div>'}load();</script></body></html>
