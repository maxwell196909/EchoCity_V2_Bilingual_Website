<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>提交服务需求 | EchoCity</title>

  <link
    rel="stylesheet"
    href="echocity-ui.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/echocity-supabase.js"></script>

  <style>
    .service-types {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .service-option {
      position: relative;
    }

    .service-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .service-option span {
      display: grid;
      place-items: center;
      min-height: 90px;
      padding: 14px;
      border: 1px solid var(--echo-border);
      border-radius: 14px;
      background: #fff;
      text-align: center;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .service-option span:hover {
      border-color: var(--echo-primary);
      transform: translateY(-1px);
    }

    .service-option input:checked + span {
      border-color: var(--echo-primary);
      background: var(--echo-info-soft);
      color: var(--echo-primary);
    }

    .form-section {
      margin-top: 24px;
    }

    .form-title {
      font-size: 18px;
      font-weight: 900;
    }

    .form-description {
      margin-top: 6px;
      color: var(--echo-muted);
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 14px;
      font-weight: 800;
    }

    .required {
      color: var(--echo-danger);
    }

    .contact-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .contact-options label {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 13px;
      border: 1px solid var(--echo-border);
      border-radius: var(--echo-radius-small);
      background: #fff;
      font-weight: 700;
    }

    .contact-options input,
    .agreement input {
      width: 18px;
      height: 18px;
    }

    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      padding: 14px;
      border-radius: 13px;
      background: #f8fafc;
      line-height: 1.65;
    }

    .agreement input {
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .result-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--echo-border);
      border-radius: 14px;
      background: #f8fafc;
    }

    .result-box.show {
      display: block;
    }

    .request-number {
      margin-top: 8px;
      color: var(--echo-primary);
      font-size: 24px;
      font-weight: 900;
      word-break: break-word;
    }

    @media (max-width: 700px) {
      .service-types,
      .form-grid,
      .contact-options {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: 1;
      }

      .actions {
        flex-direction: column-reverse;
      }
    }
  </style>
</head>

<body>
  <main class="echo-page">

    <header class="echo-header">
      <div class="echo-brand-row">
        <a class="echo-brand" href="../index.html">
          <span class="echo-logo">E</span>
          <span>EchoCity</span>
        </a>

        <button
          id="languageButton"
          class="echo-language-button"
          type="button"
        >
          EN
        </button>
      </div>

      <div class="echo-title-area">
        <div id="pageEyebrow" class="echo-eyebrow">
          本地人员与生活服务
        </div>

        <h1 id="pageTitle" class="echo-page-title">
          你好，我能帮你什么？
        </h1>

        <p id="pageDescription" class="echo-page-description">
          告诉数字人 Echo 你的需要。我们会组织合适的人员和资源，在确认范围、价格和时间后开始服务。
        </p>
      </div>
    </header>

    <section class="echo-card">
      <h2 id="serviceTypeTitle" class="echo-card-title">
        你需要哪一类服务？
      </h2>

      <p id="serviceTypeDescription" class="echo-card-description">
        选择最接近的类型，再填写具体需求。
      </p>

      <div class="service-types">
        <label class="service-option">
          <input
            type="radio"
            name="serviceType"
            value="temporary_worker"
          >
          <span id="temporaryWorkerText">需要人手</span>
        </label>

        <label class="service-option">
          <input
            type="radio"
            name="serviceType"
            value="repair_cleaning"
          >
          <span id="repairCleaningText">维修或清洁</span>
        </label>

        <label class="service-option">
          <input
            type="radio"
            name="serviceType"
            value="life_support"
          >
          <span id="lifeSupportText">生活帮助</span>
        </label>
      </div>

      <div class="form-section">
        <h3 id="needTitle" class="form-title">
          请告诉我具体需要什么
        </h3>

        <p id="needDescription" class="form-description">
          请说明服务内容、人数、地点和大概时间。
        </p>

        <div class="form-grid">
          <div class="form-group full">
            <label id="detailsLabel" class="form-label" for="requestDetails">
              需求说明 <span class="required">*</span>
            </label>

            <textarea
              id="requestDetails"
              class="echo-textarea"
              placeholder="例如：明天下午需要两个人帮我搬家具，大约工作3小时。"
            ></textarea>
          </div>

          <div class="form-group">
            <label id="addressLabel" class="form-label" for="serviceAddress">
              服务地址 <span class="required">*</span>
            </label>

            <input
              id="serviceAddress"
              class="echo-input"
              type="text"
              placeholder="请输入服务地址"
            >
          </div>

          <div class="form-group">
            <label id="timeLabel" class="form-label" for="preferredTime">
              期望服务时间
            </label>

            <input
              id="preferredTime"
              class="echo-input"
              type="datetime-local"
            >
          </div>

          <div class="form-group">
            <label id="countryLabel" class="form-label" for="country">
              国家或地区
            </label>

            <input
              id="country"
              class="echo-input"
              type="text"
              placeholder="例如：中国、美国"
            >
          </div>

          <div class="form-group">
            <label id="durationLabel" class="form-label" for="estimatedDuration">
              预计服务时长
            </label>

            <input
              id="estimatedDuration"
              class="echo-input"
              type="text"
              placeholder="例如：3小时、2天"
            >
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3 id="contactTitle" class="form-title">
          请留下联系方式
        </h3>

        <p id="contactDescription" class="form-description">
          手机号和邮箱至少填写一项，不需要注册。
        </p>

        <div class="form-grid">
          <div class="form-group">
            <label id="phoneLabel" class="form-label" for="customerPhone">
              手机号
            </label>

            <input
              id="customerPhone"
              class="echo-input"
              type="tel"
              placeholder="请输入手机号"
            >
          </div>

          <div class="form-group">
            <label id="emailLabel" class="form-label" for="customerEmail">
              邮箱
            </label>

            <input
              id="customerEmail"
              class="echo-input"
              type="email"
              placeholder="请输入邮箱"
            >
          </div>

          <div class="form-group full">
            <label id="preferenceLabel" class="form-label">
              首选联系方式
            </label>

            <div class="contact-options">
              <label>
                <input
                  type="radio"
                  name="contactPreference"
                  value="phone"
                  checked
                >
                <span id="phonePreferenceText">电话或短信</span>
              </label>

              <label>
                <input
                  type="radio"
                  name="contactPreference"
                  value="email"
                >
                <span id="emailPreferenceText">邮件</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <label class="agreement">
        <input id="agreementCheckbox" type="checkbox">

        <span id="agreementText">
          我确认以上信息真实，并同意 EchoCity 联系我核实需求、报价和服务安排。
        </span>
      </label>

      <div
        id="message"
        class="echo-message"
        role="status"
      ></div>

      <div class="actions">
        <button
          id="clearButton"
          class="echo-button echo-button-secondary"
          type="button"
        >
          清空
        </button>

        <button
          id="submitButton"
          class="echo-button echo-button-primary"
          type="button"
        >
          提交需求
        </button>
      </div>

      <div id="requestResult" class="result-box">
        <h3 id="resultTitle" class="form-title">
          需求已提交
        </h3>

        <p id="resultDescription" class="form-description">
          请保存需求编号，后续可以查询报价和服务进度。
        </p>

        <div id="requestNumber" class="request-number">—</div>
      </div>
    </section>
  </main>

  <script>
    const translations = {
      zh: {
        pageEyebrow: "本地人员与生活服务",
        pageTitle: "你好，我能帮你什么？",
        pageDescription: "告诉数字人 Echo 你的需要。我们会组织合适的人员和资源，在确认范围、价格和时间后开始服务。",
        serviceTypeTitle: "你需要哪一类服务？",
        serviceTypeDescription: "选择最接近的类型，再填写具体需求。",
        temporaryWorkerText: "需要人手",
        repairCleaningText: "维修或清洁",
        lifeSupportText: "生活帮助",
        needTitle: "请告诉我具体需要什么",
        needDescription: "请说明服务内容、人数、地点和大概时间。",
        detailsLabel: "需求说明 *",
        detailsPlaceholder: "例如：明天下午需要两个人帮我搬家具，大约工作3小时。",
        addressLabel: "服务地址 *",
        addressPlaceholder: "请输入服务地址",
        timeLabel: "期望服务时间",
        countryLabel: "国家或地区",
        countryPlaceholder: "例如：中国、美国",
        durationLabel: "预计服务时长",
        durationPlaceholder: "例如：3小时、2天",
        contactTitle: "请留下联系方式",
        contactDescription: "手机号和邮箱至少填写一项，不需要注册。",
        phoneLabel: "手机号",
        phonePlaceholder: "请输入手机号",
        emailLabel: "邮箱",
        emailPlaceholder: "请输入邮箱",
        preferenceLabel: "首选联系方式",
        phonePreferenceText: "电话或短信",
        emailPreferenceText: "邮件",
        agreementText: "我确认以上信息真实，并同意 EchoCity 联系我核实需求、报价和服务安排。",
        clearButton: "清空",
        submitButton: "提交需求",
        submitting: "正在提交……",
        resultTitle: "需求已提交",
        resultDescription: "请保存需求编号，后续可以查询报价和服务进度。",
        requiredType: "请选择服务类型。",
        requiredDetails: "请填写具体需求。",
        requiredAddress: "请填写服务地址。",
        requiredContact: "手机号和邮箱至少填写一项。",
        invalidEmail: "请输入正确的邮箱地址。",
        requiredAgreement: "请先勾选确认。",
        success: "需求提交成功。",
        failed: "需求提交失败。",
        noClient: "Supabase 连接不可用。",
        clearConfirm: "确认清空已经填写的内容吗？"
      },

      en: {
        pageEyebrow: "Local Workforce and Life Services",
        pageTitle: "Hello, how can I help you?",
        pageDescription: "Tell Echo what you need. We will organize suitable people and resources, then confirm the scope, price, and schedule before work begins.",
        serviceTypeTitle: "What type of service do you need?",
        serviceTypeDescription: "Choose the closest category and enter the details below.",
        temporaryWorkerText: "Extra Help",
        repairCleaningText: "Repair or Cleaning",
        lifeSupportText: "Life Support",
        needTitle: "Tell us what you need",
        needDescription: "Describe the work, number of people, location, and approximate time.",
        detailsLabel: "Request Details *",
        detailsPlaceholder: "Example: I need two people tomorrow afternoon to move furniture for about three hours.",
        addressLabel: "Service Address *",
        addressPlaceholder: "Enter the service address",
        timeLabel: "Preferred Service Time",
        countryLabel: "Country or Region",
        countryPlaceholder: "Example: United States or China",
        durationLabel: "Estimated Duration",
        durationPlaceholder: "Example: 3 hours or 2 days",
        contactTitle: "Leave your contact details",
        contactDescription: "Enter at least a phone number or email. Registration is not required.",
        phoneLabel: "Phone Number",
        phonePlaceholder: "Enter phone number",
        emailLabel: "Email",
        emailPlaceholder: "Enter email address",
        preferenceLabel: "Preferred Contact Method",
        phonePreferenceText: "Phone or Text",
        emailPreferenceText: "Email",
        agreementText: "I confirm that the information is accurate and agree that EchoCity may contact me about the request, quotation, and service arrangements.",
        clearButton: "Clear",
        submitButton: "Submit Request",
        submitting: "Submitting...",
        resultTitle: "Request Submitted",
        resultDescription: "Save the request number to check the quotation and service progress.",
        requiredType: "Select a service type.",
        requiredDetails: "Enter the request details.",
        requiredAddress: "Enter the service address.",
        requiredContact: "Enter at least a phone number or email.",
        invalidEmail: "Enter a valid email address.",
        requiredAgreement: "Confirm the agreement before submitting.",
        success: "The request was submitted successfully.",
        failed: "Unable to submit the request.",
        noClient: "Supabase connection is unavailable.",
        clearConfirm: "Clear all information entered in the form?"
      }
    };

    let currentLanguage =
      localStorage.getItem("echocity-language") || "zh";

    const textIds = [
      "pageEyebrow",
      "pageTitle",
      "pageDescription",
      "serviceTypeTitle",
      "serviceTypeDescription",
      "temporaryWorkerText",
      "repairCleaningText",
      "lifeSupportText",
      "needTitle",
      "needDescription",
      "detailsLabel",
      "addressLabel",
      "timeLabel",
      "countryLabel",
      "durationLabel",
      "contactTitle",
      "contactDescription",
      "phoneLabel",
      "emailLabel",
      "preferenceLabel",
      "phonePreferenceText",
      "emailPreferenceText",
      "agreementText",
      "clearButton",
      "submitButton",
      "resultTitle",
      "resultDescription"
    ];

    function t(key) {
      return translations[currentLanguage]?.[key] ||
        translations.zh[key] ||
        key;
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh" ? "zh-CN" : "en";

      textIds.forEach((id) => {
        const element = document.getElementById(id);

        if (element) {
          element.textContent = t(id);
        }
      });

      document.getElementById("requestDetails").placeholder =
        t("detailsPlaceholder");

      document.getElementById("serviceAddress").placeholder =
        t("addressPlaceholder");

      document.getElementById("country").placeholder =
        t("countryPlaceholder");

      document.getElementById("estimatedDuration").placeholder =
        t("durationPlaceholder");

      document.getElementById("customerPhone").placeholder =
        t("phonePlaceholder");

      document.getElementById("customerEmail").placeholder =
        t("emailPlaceholder");

      document.getElementById("languageButton").textContent =
        currentLanguage === "zh" ? "EN" : "中文";

      document.title = `${t("pageTitle")} | EchoCity`;
    }

    function showMessage(text, type = "info") {
      const box = document.getElementById("message");
      box.textContent = text;
      box.className = `echo-message show ${type}`;
    }

    function clearMessage() {
      const box = document.getElementById("message");
      box.textContent = "";
      box.className = "echo-message";
    }

    function selectedValue(name) {
      return document.querySelector(
        `input[name="${name}"]:checked`
      )?.value || "";
    }

    function normalizePhone(value) {
      return String(value || "")
        .trim()
        .replace(/[^\d+]/g, "");
    }

    function generateRequestNumber() {
      const now = new Date();
      const number =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0") +
        String(Math.floor(1000 + Math.random() * 9000));

      return `REQ-${number}`;
    }

    function readForm() {
      return {
        serviceType: selectedValue("serviceType"),
        requestDetails:
          document.getElementById("requestDetails").value.trim(),
        serviceAddress:
          document.getElementById("serviceAddress").value.trim(),
        preferredTime:
          document.getElementById("preferredTime").value,
        country:
          document.getElementById("country").value.trim(),
        estimatedDuration:
          document.getElementById("estimatedDuration").value.trim(),
        customerPhone:
          normalizePhone(
            document.getElementById("customerPhone").value
          ),
        customerEmail:
          document.getElementById("customerEmail")
            .value.trim().toLowerCase(),
        contactPreference:
          selectedValue("contactPreference"),
        agreement:
          document.getElementById("agreementCheckbox").checked
      };
    }

    function validateForm(values) {
      if (!values.serviceType) {
        showMessage(t("requiredType"), "error");
        return false;
      }

      if (!values.requestDetails) {
        showMessage(t("requiredDetails"), "error");
        return false;
      }

      if (!values.serviceAddress) {
        showMessage(t("requiredAddress"), "error");
        return false;
      }

      if (!values.customerPhone && !values.customerEmail) {
        showMessage(t("requiredContact"), "error");
        return false;
      }

      if (
        values.customerEmail &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.customerEmail)
      ) {
        showMessage(t("invalidEmail"), "error");
        return false;
      }

      if (!values.agreement) {
        showMessage(t("requiredAgreement"), "error");
        return false;
      }

      return true;
    }

    function resetForm() {
      document
        .querySelectorAll('input[name="serviceType"]')
        .forEach((input) => input.checked = false);

      [
        "requestDetails",
        "serviceAddress",
        "preferredTime",
        "country",
        "estimatedDuration",
        "customerPhone",
        "customerEmail"
      ].forEach((id) => {
        document.getElementById(id).value = "";
      });

      document.getElementById("agreementCheckbox").checked = false;
      document.getElementById("requestResult").classList.remove("show");
      clearMessage();
    }

    async function submitRequest() {
      const values = readForm();

      if (!validateForm(values)) {
        return;
      }

      const client = window.echoCitySupabase;

      if (!client || typeof client.from !== "function") {
        showMessage(t("noClient"), "error");
        return;
      }

      const requestNumber = generateRequestNumber();
      const now = new Date().toISOString();
      const submitButton = document.getElementById("submitButton");

      submitButton.disabled = true;
      submitButton.textContent = t("submitting");
      clearMessage();

      try {
        const requestData = {
          request_no: requestNumber,
          service_type: values.serviceType,
          request_details: values.requestDetails,
          service_address: values.serviceAddress,
          preferred_time: values.preferredTime
            ? new Date(values.preferredTime).toISOString()
            : null,
          country: values.country || null,
          estimated_duration: values.estimatedDuration || null,
          customer_phone: values.customerPhone || null,
          customer_email: values.customerEmail || null,
          contact_preference:
            values.contactPreference ||
            (values.customerPhone ? "phone" : "email"),
          status: "submitted",
          created_at: now,
          updated_at: now
        };

        const { data, error } = await client
          .from("service_requests")
          .insert(requestData)
          .select("*")
          .maybeSingle();

        if (error) {
          throw error;
        }

        const saved = data || requestData;

        document.getElementById("requestNumber").textContent =
          saved.request_no;

        document.getElementById("requestResult")
          .classList.add("show");

        showMessage(t("success"), "success");

        localStorage.setItem(
          "echocity-last-request",
          JSON.stringify(saved)
        );
      } catch (error) {
        console.error("Service request submission failed:", error);
        showMessage(error?.message || t("failed"), "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = t("submitButton");
      }
    }

    document
      .getElementById("languageButton")
      .addEventListener("click", () => {
        currentLanguage =
          currentLanguage === "zh" ? "en" : "zh";

        localStorage.setItem(
          "echocity-language",
          currentLanguage
        );

        applyLanguage();
      });

    document
      .getElementById("clearButton")
      .addEventListener("click", () => {
        if (window.confirm(t("clearConfirm"))) {
          resetForm();
        }
      });

    document
      .getElementById("submitButton")
      .addEventListener("click", submitRequest);

    applyLanguage();
  </script>
</body>
</html>
