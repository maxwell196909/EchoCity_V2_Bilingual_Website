<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2747">
  <title>服务需求管理 | EchoCity</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(100% - 20px,1100px);margin:auto;padding:20px 0 40px}.top{padding:20px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0f2747,#2563eb)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#fff;text-decoration:none;font-size:21px;font-weight:900}.lang{min-height:40px;padding:0 15px;border:1px solid #ffffff70;border-radius:999px;color:#fff;background:#ffffff18;font-weight:900}.top h1{margin:24px 0 8px;font-size:clamp(28px,5vw,44px)}.top p{margin:0;line-height:1.6;opacity:.86}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.search{min-height:46px;padding:0 14px;border:1px solid #dbe3ee;border-radius:12px;font:inherit}.button{min-height:46px;padding:0 17px;border:0;border-radius:12px;color:#fff;background:#2563eb;font-weight:900;cursor:pointer}.notice{display:none;margin-top:14px;padding:13px;border-radius:12px;line-height:1.55}.notice.show{display:block}.notice.info{color:#1e40af;background:#dbeafe}.notice.error{color:#991b1b;background:#fee2e2}.list{display:grid;gap:12px;margin-top:16px}.card{padding:17px;border:1px solid #dbe3ee;border-radius:16px;background:#fff;box-shadow:0 10px 28px #0f172a0b}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.number{font-size:18px;font-weight:900}.status{padding:5px 9px;border-radius:999px;color:#1d4ed8;background:#eff6ff;font-size:12px;font-weight:900}.details{margin-top:10px;line-height:1.65}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.meta div{padding:9px;border-radius:10px;background:#f8fafc;color:#475569;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.link{display:inline-grid;place-items:center;min-height:40px;padding:0 13px;border-radius:10px;color:#fff;background:#2563eb;text-decoration:none;font-size:14px;font-weight:900}.secondary{color:#1d4ed8;background:#eff6ff}.empty{padding:30px;border:1px dashed #cbd5e1;border-radius:16px;background:#fff;text-align:center;color:#64748b}@media(max-width:650px){.tools{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.card-top{display:grid}.page{padding-top:8px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="bar"><a class="brand" href="../index.html">EchoCity</a><button id="lang" class="lang" type="button">EN</button></div>
      <h1 id="title">服务需求管理</h1>
      <p id="intro">查看客户的新需求，进入报价，并继续派工和全过程监管。</p>
    </header>
    <section class="tools">
      <input id="search" class="search" type="search" placeholder="搜索需求编号、电话或需求内容">
      <button id="refresh" class="button" type="button">刷新</button>
      <a class="button" href="admin-operations-overview.html" style="display:grid;place-items:center;text-decoration:none">运营驾驶舱</a>
    </section>
    <div id="notice" class="notice info"></div>
    <section id="list" class="list"></section>
  </main>
  <script>
    const words={zh:{title:"服务需求管理",intro:"查看客户的新需求，并根据订单状态进入下一工作环节。",search:"搜索需求编号、电话或需求内容",refresh:"刷新",loading:"正在读取服务需求……",empty:"暂无服务需求。",error:"读取失败，请检查网络、Supabase 连接和数据权限。",quote:"查看或修改报价",customerConfirmQuote:"客户确认报价",assign:"派工",workerTask:"查看工人任务",monitor:"过程监管",finalAcceptance:"客户最终验收",viewResult:"查看验收结果",handleIssue:"处理返工或争议",phone:"联系电话",type:"服务类型",updated:"更新时间",unknown:"待确认",submitted:"待审核",reviewed:"审核中",quoted:"等待客户确认报价",quote_confirmed:"报价已确认，等待派工",confirmed:"报价已确认，等待派工",assigned:"已派工，等待工人接单",accepted:"工人已接单，等待到场",arrived:"工人已到场，等待开工",agreement_submitted:"开工资料已提交",working:"服务进行中",in_progress:"服务进行中",milestone_submitted:"节点成果待审核",milestone_approved:"节点已通过",awaiting_final_acceptance:"等待客户最终验收",waiting_final_acceptance:"等待客户最终验收",completed:"客户已验收完成",conditionally_completed:"客户有条件验收",final_rework:"最终验收要求返工",disputed:"订单存在争议"},en:{title:"Service Requests",intro:"Review customer requests and continue to the correct next step based on each order status.",search:"Search request number, phone, or details",refresh:"Refresh",loading:"Loading service requests…",empty:"No service requests found.",error:"Unable to load requests. Check the network, Supabase connection, and data permissions.",quote:"View or Edit Quote",customerConfirmQuote:"Customer Quote Approval",assign:"Assign Worker",workerTask:"View Worker Task",monitor:"Monitor Progress",finalAcceptance:"Customer Final Acceptance",viewResult:"View Acceptance Result",handleIssue:"Handle Rework or Dispute",phone:"Phone",type:"Service Type",updated:"Updated",unknown:"Pending",submitted:"Pending Review",reviewed:"Under Review",quoted:"Awaiting Quote Approval",quote_confirmed:"Quote Approved — Awaiting Assignment",confirmed:"Quote Approved — Awaiting Assignment",assigned:"Assigned — Awaiting Worker Acceptance",accepted:"Worker Accepted — Awaiting Arrival",arrived:"Worker Arrived — Awaiting Start",agreement_submitted:"Pre-start Documents Submitted",working:"Service in Progress",in_progress:"Service in Progress",milestone_submitted:"Milestone Awaiting Review",milestone_approved:"Milestone Approved",awaiting_final_acceptance:"Awaiting Customer Final Acceptance",waiting_final_acceptance:"Awaiting Customer Final Acceptance",completed:"Customer Acceptance Completed",conditionally_completed:"Conditionally Accepted",final_rework:"Final Rework Required",disputed:"Order Disputed"}};
    let language=localStorage.getItem("echocity-language")||"zh";
    let requests=[];
    const el=id=>document.getElementById(id);
    const t=key=>words[language][key];
    const esc=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    function applyLanguage(){document.documentElement.lang=language==="zh"?"zh-CN":"en";el("title").textContent=t("title");el("intro").textContent=t("intro");el("search").placeholder=t("search");el("refresh").textContent=t("refresh");el("lang").textContent=language==="zh"?"EN":"中文";document.title=`${t("title")} | EchoCity`;render();}
    function show(message,type="info"){el("notice").textContent=message;el("notice").className=`notice show ${type}`;}
    function hideNotice(){el("notice").className="notice info";}
    function dateText(value){if(!value)return t("unknown");try{return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-US",{dateStyle:"medium",timeStyle:"short"}).format(new Date(value));}catch{return value;}}
    function statusText(status){const terminal={closed:{zh:"已归档关闭",en:"Archived and Closed"},archived:{zh:"已归档",en:"Archived"},awaiting_payment:{zh:"等待付款",en:"Awaiting Payment"},payment_confirmed:{zh:"付款已确认",en:"Payment Confirmed"},receipt_confirmed:{zh:"收款已确认",en:"Receipt Confirmed"}};return terminal[status]?.[language]||words[language][status]||status||t("unknown");}
    function actionLinks(item){const status=String(item.status||"submitted");const query=encodeURIComponent(item.request_no||"");const link=(href,label,secondary=false)=>`<a class="link${secondary?" secondary":""}" href="${href}">${esc(t(label))}</a>`;if(["closed","archived"].includes(status))return `<a class="link secondary" href="admin-order-archive.html?request_no=${query}">${esc(statusText(status))}</a>`;if(["submitted","reviewed"].includes(status))return link(`admin-service-quote.html?request_no=${query}`,"quote");if(status==="quoted")return link(`service-quote-confirmation.html?request_no=${query}`,"customerConfirmQuote")+link(`admin-service-quote.html?request_no=${query}`,"quote",true);if(["confirmed","quote_confirmed"].includes(status))return link(`admin-service-assignment.html?request_no=${query}`,"assign");if(status==="assigned")return link(`worker-tasks.html?request_no=${query}`,"workerTask")+link(`admin-service-milestones.html?request_no=${query}`,"monitor",true);if(["accepted","arrived","agreement_submitted","working","in_progress","milestone_submitted","milestone_approved"].includes(status))return link(`admin-service-milestones.html?request_no=${query}`,"monitor");if(["awaiting_final_acceptance","waiting_final_acceptance"].includes(status))return link(`customer-final-acceptance.html?request_no=${query}`,"finalAcceptance");if(["completed","conditionally_completed"].includes(status))return link(`admin-settlement.html?request_no=${query}`,"进入结算")+link(`customer-final-acceptance.html?request_no=${query}`,"viewResult",true);if(["final_rework","disputed"].includes(status))return link(`admin-service-milestones.html?request_no=${query}`,"handleIssue");if(["awaiting_payment","payment_confirmed","receipt_confirmed"].includes(status))return link(`admin-settlement.html?request_no=${query}`,"进入结算");return link(`admin-service-quote.html?request_no=${query}`,"quote");}
    function render(){const q=el("search").value.trim().toLowerCase();const rows=requests.filter(item=>[item.request_no,item.customer_phone,item.request_details,item.service_type,item.status].some(v=>String(v??"").toLowerCase().includes(q)));if(!rows.length){el("list").innerHTML=`<div class="empty">${esc(t("empty"))}</div>`;return;}el("list").innerHTML=rows.map(item=>{const no=esc(item.request_no||"");return `<article class="card"><div class="card-top"><div class="number">${no||esc(t("unknown"))}</div><div class="status">${esc(statusText(item.status))}</div></div><div class="details">${esc(item.request_details||item.description||t("unknown"))}</div><div class="meta"><div><strong>${esc(t("phone"))}</strong><br>${esc(item.customer_phone||t("unknown"))}</div><div><strong>${esc(t("type"))}</strong><br>${esc(item.service_type||t("unknown"))}</div><div><strong>${esc(t("updated"))}</strong><br>${esc(dateText(item.updated_at))}</div></div><div class="actions">${actionLinks(item)}</div></article>`;}).join("");}
    function platformToken(){const params=new URLSearchParams(window.location.search),hashParams=new URLSearchParams(window.location.hash.replace(/^#/,""));const incoming=params.get("platform_token")||hashParams.get("platform_token");if(incoming){localStorage.setItem("echocity-platform-token",incoming);sessionStorage.setItem("echocity-platform-token",incoming);params.delete("platform_token");const clean=params.toString()?`${window.location.pathname}?${params}`:window.location.pathname;history.replaceState(null,"",clean);}return localStorage.getItem("echocity-platform-token")||sessionStorage.getItem("echocity-platform-token")||"";}
    async function load(){show(t("loading"));try{const token=platformToken();if(!token)throw new Error("Missing platform access token");const client=window.echoCitySupabase;if(!client)throw new Error("Supabase unavailable");const{data,error}=await client.rpc("list_platform_requests_with_token",{p_token:token});if(error)throw error;requests=data||[];hideNotice();render();}catch(error){console.error(error);show(t("error"),"error");requests=[];render();}}
    el("lang").addEventListener("click",()=>{language=language==="zh"?"en":"zh";localStorage.setItem("echocity-language",language);applyLanguage();});el("refresh").addEventListener("click",load);el("search").addEventListener("input",render);applyLanguage();load();
  </script>
</body>
</html>
