<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>服务需求管理 | EchoCity</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1f6feb;
      --primary-dark: #1557b0;
      --primary-soft: #edf5ff;

      --success: #18864b;
      --success-soft: #eaf8f0;

      --warning: #9a6700;
      --warning-soft: #fff6dc;

      --danger: #b42318;
      --danger-soft: #fff0ee;

      --text: #172033;
      --text-light: #667085;

      --border: #d9e1ec;
      --background: #f4f7fb;
      --card: #ffffff;

      --shadow:
        0 16px 40px rgba(24, 39, 75, 0.08);
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #edf5ff 0%,
          #f7f9fc 38%,
          #f4f7fb 100%
        );

      color: var(--text);

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 26px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #65a4ff
        );

      color: #ffffff;
      font-weight: 900;

      box-shadow:
        0 8px 20px rgba(31, 111, 235, 0.22);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-button {
      min-height: 40px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.88);
      color: var(--text);

      font-weight: 800;
      cursor: pointer;
    }

    .topbar-button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .hero {
      margin-bottom: 20px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;

      min-height: 30px;
      padding: 0 12px;

      border-radius: 999px;

      background: var(--primary-soft);
      color: var(--primary-dark);

      font-size: 13px;
      font-weight: 800;
    }

    .hero h1 {
      margin-top: 12px;

      font-size: clamp(29px, 6vw, 44px);
      line-height: 1.16;
      letter-spacing: -1px;
    }

    .hero p {
      max-width: 760px;

      margin-top: 10px;

      color: var(--text-light);

      font-size: 15px;
      line-height: 1.7;
    }

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 14px;

      margin-bottom: 18px;
    }

    .stat-card {
      padding: 17px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--text-light);
      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 7px;

      font-size: 27px;
      font-weight: 900;
      line-height: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns:
        minmax(220px, 1fr)
        190px
        170px;
      gap: 12px;

      margin-bottom: 18px;
      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .search-input,
    .filter-select {
      width: 100%;
      min-height: 46px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #ffffff;
      color: var(--text);

      padding: 0 13px;
      outline: none;
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    .request-list {
      display: grid;
      gap: 14px;
    }

    .request-card {
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);
      box-shadow: var(--shadow);
    }

    .request-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .request-main {
      min-width: 0;
    }

    .request-number {
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .request-title {
      margin-top: 5px;

      font-size: 20px;
      line-height: 1.4;
      word-break: break-word;
    }

    .request-time {
      margin-top: 5px;

      color: var(--text-light);
      font-size: 13px;
      line-height: 1.5;
    }    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 32px;
      padding: 0 12px;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-new {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-quoted {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .status-confirmed {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-declined {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .status-assigned {
      background: #eef0ff;
      color: #4b4fa8;
    }

    .status-progress {
      background: #e8f7ff;
      color: #146a8a;
    }

    .status-completed {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-cancelled {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .request-details {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 12px;

      margin-top: 16px;
    }

    .detail-item {
      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;
    }

    .detail-label {
      color: var(--text-light);
      font-size: 12px;
      font-weight: 700;
    }

    .detail-value {
      margin-top: 5px;

      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      word-break: break-word;
    }

    .request-description {
      margin-top: 14px;
      padding: 14px;

      border-radius: 13px;

      background: #f8fafc;
      color: var(--text);

      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .request-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;

      margin-top: 16px;
    }

    .action-button {
      min-height: 40px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;
    }

    .action-button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .action-button.primary {
      border-color: var(--primary);

      background: var(--primary);
      color: #ffffff;
    }

    .action-button.primary:hover {
      background: var(--primary-dark);
      color: #ffffff;
    }

    .status-select {
      min-height: 40px;
      padding: 0 12px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      font-size: 13px;
      font-weight: 700;

      outline: none;
    }

    .empty-state {
      display: none;

      padding: 34px 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: #ffffff;
      box-shadow: var(--shadow);

      text-align: center;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state h2 {
      font-size: 22px;
      line-height: 1.4;
    }

    .empty-state p {
      max-width: 560px;

      margin: 10px auto 0;

      color: var(--text-light);

      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 860px) {
      .stats-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .request-details {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .page {
        padding:
          15px
          13px
          40px;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-button {
        min-width: 64px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 23px;
      }

      .request-card {
        padding: 15px;
      }

      .request-card-header {
        flex-direction: column;
      }

      .request-details {
        grid-template-columns: 1fr;
      }

      .request-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .action-button,
      .status-select {
        width: 100%;
      }
    }
  </style>
</head>

<option

>

    let currentLanguage =
      localStorage.getItem("echocity-language") || "zh";

    let serviceRequests = [];

    function translate(key) {
      return (
        translations[currentLanguage][key] ||
        translations.zh[key] ||
        key
      );
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh"
          ? "zh-CN"
          : "en";

      document
        .querySelectorAll("[data-i18n]")
        .forEach((element) => {
          const key =
            element.getAttribute("data-i18n");

          if (translations[currentLanguage][key]) {
            element.textContent =
              translations[currentLanguage][key];
          }
        });

      document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach((element) => {
          const key =
            element.getAttribute(
              "data-i18n-placeholder"
            );

          if (translations[currentLanguage][key]) {
            element.placeholder =
              translations[currentLanguage][key];
          }
        });

      document.getElementById(
        "languageButton"
      ).textContent =
        currentLanguage === "zh"
          ? "EN"
          : "中文";
    }

    function toggleLanguage() {
      currentLanguage =
        currentLanguage === "zh"
          ? "en"
          : "zh";

      localStorage.setItem(
        "echocity-language",
        currentLanguage
      );

      applyLanguage();
      renderRequests();
    }

    function openRequestPage() {
      window.location.href =
        "service-request.html";
    }

    async function loadRequests() {
  try {
    const supabaseClient = window.echoCitySupabase;

    if (!supabaseClient) {
      throw new Error("Supabase connection is not available.");
    }

    const { data, error } = await supabaseClient
      .from("service_requests")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      throw error;
    }

    serviceRequests = (data || []).map((item) => ({
      id: item.request_no,
      requestId: item.request_no,
      requestNo: item.request_no,

      serviceType: item.service_type,
      type: item.service_type,

      description: item.description,
      request: item.description,
      details: item.description,

      serviceDate: item.service_date,
      date: item.service_date,

      startTime: item.start_time,
      time: item.start_time,

      workers: item.workers || 1,
      workerCount: item.workers || 1,
      duration: item.duration || "",

      postalCode: item.postal_code || "",
      zipCode: item.postal_code || "",
      address: item.address || "",

      customerName: item.customer_name || "",
      name: item.customer_name || "",

      customerPhone: item.customer_phone || "",
      phone: item.customer_phone || "",

      status: item.status || "submitted",

      quoteAmount: item.quote_amount,
      quoteNote: item.quote_note || "",
      quoteConfirmed: item.quote_confirmed || false,
      assignedWorker: item.assigned_worker || "",

      createdAt: item.created_at,
      updatedAt: item.updated_at
    }));

    renderRequests();

    console.log(
      "Service requests loaded from Supabase:",
      serviceRequests
    );
  } catch (error) {
    console.error(
      "Failed to load service requests from Supabase:",
      error
    );

    serviceRequests = [];
    renderRequests();
  }
}
    function saveRequests() {
      localStorage.setItem(
        "echocity-service-requests",
        JSON.stringify(serviceRequests)
      );
    }

    function getServiceName(serviceType) {
      const serviceMap = {
        workers: "serviceWorkers",
        repair: "serviceRepair",
        support: "serviceSupport"
      };

      return translate(
        serviceMap[serviceType] ||
        "serviceUnknown"
      );
    }

    function getStatusName(status) {
      const statusMap = {
  new: "statusNew",
  quoted: "statusQuoted",
  confirmed: "statusConfirmed",
  quote_declined: "statusDeclined",
  assigned: "statusAssigned",
  in_progress: "statusProgress",
  completed: "statusCompleted",
  cancelled: "statusCancelled"
};

      return translate(
        statusMap[status] ||
        "statusNew"
      );
    }

    function getStatusClass(status) {
      const classMap = {
  new: "status-new",
  quoted: "status-quoted",
  confirmed: "status-confirmed",
  quote_declined: "status-declined",
  assigned: "status-assigned",
  in_progress: "status-progress",
  completed: "status-completed",
  cancelled: "status-cancelled"
};
      return (
        classMap[status] ||
        "status-new"
      );
    }

    function formatDateTime(
      serviceDate,
      serviceTime
    ) {
      if (!serviceDate && !serviceTime) {
        return translate("notProvided");
      }

      let dateText =
        serviceDate || "";

      if (serviceDate) {
        const date =
          new Date(
            serviceDate + "T00:00:00"
          );

        dateText =
          date.toLocaleDateString(
            currentLanguage === "zh"
              ? "zh-CN"
              : "en-US",
            {
              year: "numeric",
              month: "long",
              day: "numeric"
            }
          );
      }

      return serviceTime
        ? `${dateText} ${serviceTime}`
        : dateText;
    }

    function formatSubmittedTime(createdAt) {
      if (!createdAt) {
        return translate("notProvided");
      }

      const date =
        new Date(createdAt);

      if (Number.isNaN(date.getTime())) {
        return createdAt;
      }

      return date.toLocaleString(
        currentLanguage === "zh"
          ? "zh-CN"
          : "en-US"
      );
    }

    function formatWorkersAndHours(
      workerCount,
      estimatedHours
    ) {
      let workerText = "";

      if (workerCount === "5plus") {
        workerText =
          translate("fivePlusWorkers");
      } else {
        const count =
          Number(workerCount || 1);

        const unit =
          count === 1
            ? translate("workerUnit")
            : translate("workersUnit");

        workerText =
          `${count} ${unit}`;
      }

      let hourText = "";

      if (
        !estimatedHours ||
        estimatedHours === "unknown"
      ) {
        hourText =
          translate("unknownHours");
      } else {
        const hours =
          Number(estimatedHours);

        const unit =
          hours === 1
            ? translate("hourUnit")
            : translate("hoursUnit");

        hourText =
          `${hours} ${unit}`;
      }

      return `${workerText} · ${hourText}`;
    }

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }    function getFilteredRequests() {
      const searchValue =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const statusValue =
        document
          .getElementById("statusFilter")
          .value;

      const serviceValue =
        document
          .getElementById("serviceFilter")
          .value;

      return serviceRequests.filter((request) => {
        const searchableText = [
          request.id,
          request.customerName,
          request.customerPhone,
          request.customerEmail,
          request.serviceAddress,
          request.description
        ]
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          !searchValue ||
          searchableText.includes(searchValue);

        const matchesStatus =
          statusValue === "all" ||
          request.status === statusValue;

        const matchesService =
          serviceValue === "all" ||
          request.serviceType === serviceValue;

        return (
          matchesSearch &&
          matchesStatus &&
          matchesService
        );
      });
    }

    function updateStatistics() {
      const total =
        serviceRequests.length;

      const newTotal =
        serviceRequests.filter(
          (request) =>
            (request.status || "new") === "new"
        ).length;

      const activeTotal =
        serviceRequests.filter(
          (request) =>
            [
  "quoted",
  "confirmed",
  "assigned",
  "in_progress"
].includes(request.status)
        ).length;

      const completedTotal =
        serviceRequests.filter(
          (request) =>
            request.status === "completed"
        ).length;

      document.getElementById(
        "totalCount"
      ).textContent = total;

      document.getElementById(
        "newCount"
      ).textContent = newTotal;

      document.getElementById(
        "activeCount"
      ).textContent = activeTotal;

      document.getElementById(
        "completedCount"
      ).textContent = completedTotal;
    }

    function buildStatusOptions(
      currentStatus
    ) {
      const statuses = [
  ["new", "statusNew"],
  ["reviewed", "statusReviewed"],
  ["quoted", "statusQuoted"],
  ["confirmed", "statusConfirmed"],
  ["quote_declined", "statusDeclined"],
  ["assigned", "statusAssigned"],
  ["in_progress", "statusInProgress"],
  ["completed", "statusCompleted"],
  ["cancelled", "statusCancelled"]
];

      return statuses
        .map(([value, labelKey]) => {
          const selected =
            value === currentStatus
              ? "selected"
              : "";

          return `
            <option
              value="${value}"
              ${selected}
            >
              ${escapeHTML(
                translate(labelKey)
              )}
            </option>
          `;
        })
        .join("");
    }

    function createRequestCard(request) {
      const status =
        request.status || "new";

      const requestId =
        request.id || "--";

      const customerName =
        request.customerName ||
        translate("notProvided");

      const customerPhone =
        request.customerPhone ||
        translate("notProvided");

      const address =
        request.serviceAddress ||
        translate("notProvided");

      const description =
        request.description ||
        translate("notProvided");

      return `
        <article class="request-card">

          <div class="request-card-header">

            <div class="request-main">

              <div class="request-number">
                ${escapeHTML(
                  translate("requestNumber")
                )}：
                ${escapeHTML(requestId)}
              </div>

              <h2 class="request-title">
                ${escapeHTML(
                  getServiceName(
                    request.serviceType
                  )
                )}
              </h2>

              <div class="request-time">
                ${escapeHTML(
                  translate("submittedAt")
                )}：
                ${escapeHTML(
                  formatSubmittedTime(
                    request.createdAt
                  )
                )}
              </div>

            </div>

            <span
              class="status-badge
              ${getStatusClass(status)}"
            >
              ${escapeHTML(
                getStatusName(status)
              )}
            </span>

          </div>

          <div class="request-details">

            <div class="detail-item">
              <div class="detail-label">
                ${escapeHTML(
                  translate("serviceTime")
                )}
              </div>

              <div class="detail-value">
                ${escapeHTML(
                  formatDateTime(
                    request.serviceDate,
                    request.serviceTime
                  )
                )}
              </div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                ${escapeHTML(
                  translate("customer")
                )}
              </div>

              <div class="detail-value">
                ${escapeHTML(
                  customerName
                )}
              </div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                ${escapeHTML(
                  translate("phone")
                )}
              </div>

              <div class="detail-value">
                ${escapeHTML(
                  customerPhone
                )}
              </div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                ${escapeHTML(
                  translate(
                    "workersAndHours"
                  )
                )}
              </div>

              <div class="detail-value">
                ${escapeHTML(
                  formatWorkersAndHours(
                    request.workerCount,
                    request.estimatedHours
                  )
                )}
              </div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                ${escapeHTML(
                  translate("address")
                )}
              </div>

              <div class="detail-value">
                ${escapeHTML(address)}
              </div>
            </div>

          </div>

          <div class="request-description">
            <strong>
              ${escapeHTML(
                translate("requestDetails")
              )}：
            </strong>

            <br />

            ${escapeHTML(description)}
          </div>

          <div class="request-actions">

            <select
              class="status-select"
              onchange="
                updateRequestStatus(
                  '${escapeHTML(requestId)}',
                  this.value
                )
              "
              aria-label="${escapeHTML(
                translate("changeStatus")
              )}"
            >
              ${buildStatusOptions(status)}
            </select>

            <button
              class="action-button primary"
              type="button"
              onclick="
                setAsLatestRequest(
                  '${escapeHTML(requestId)}'
                )
              "
            >
              ${escapeHTML(
                translate("viewLatest")
              )}
            </button>

            <button
              class="action-button"
              type="button"
              onclick="
                contactCustomer(
                  '${escapeHTML(
                    customerPhone
                  )}'
                )
              "
            >
              ${escapeHTML(
                translate("callCustomer")
              )}
            </button>

            <button
              class="action-button"
              type="button"
              onclick="
                deleteRequest(
                  '${escapeHTML(requestId)}'
                )
              "
            >
              ${escapeHTML(
                translate("deleteRequest")
              )}
            </button>

          </div>

        </article>
      `;
    }

    function renderRequests() {
      const requestList =
        document.getElementById(
          "requestList"
        );

      const emptyState =
        document.getElementById(
          "emptyState"
        );

      const filteredRequests =
        getFilteredRequests();

      updateStatistics();

      if (serviceRequests.length === 0) {
        requestList.innerHTML = "";

        emptyState.classList.add("show");

        emptyState.querySelector(
          "h2"
        ).textContent =
          translate("emptyTitle");

        emptyState.querySelector(
          "p"
        ).textContent =
          translate("emptyDescription");

        return;
      }

      if (filteredRequests.length === 0) {
        requestList.innerHTML = "";

        emptyState.classList.add("show");

        emptyState.querySelector(
          "h2"
        ).textContent =
          translate("noMatchTitle");

        emptyState.querySelector(
          "p"
        ).textContent =
          translate("noMatchDescription");

        return;
      }

      emptyState.classList.remove("show");

      requestList.innerHTML =
        filteredRequests
          .map(createRequestCard)
          .join("");
    }

    async function updateRequestStatus(
  requestId,
  newStatus
) {
  const request = serviceRequests.find(
    (item) =>
      item.requestId === requestId ||
      item.requestNo === requestId ||
      item.id === requestId
  );

  if (!request) {
    console.error(
      "Service request not found:",
      requestId
    );
    return;
  }

  try {
    const client =
      window.echoCitySupabase;

    if (!client) {
      throw new Error(
        "Supabase connection is not available."
      );
    }

    const updatedAt =
      new Date().toISOString();

    const { data, error } =
      await client
        .from("service_requests")
        .update({
          status: newStatus,
          updated_at: updatedAt
        })
        .eq(
          "request_no",
          requestId
        )
        .select()
        .single();

    if (error) {
      throw error;
    }

    request.status = data.status;
    request.updatedAt = data.updated_at;

    renderRequests();

    console.log(
      "Service request status updated:",
      data
    );
  } catch (error) {
    console.error(
      "Failed to update service request status:",
      error
    );

    window.alert(
      currentLanguage === "zh"
        ? "状态更新失败，请检查网络后重试。"
        : "Status update failed. Please try again."
    );

    await loadRequests();
  }
}


    function setAsLatestRequest(
      requestId
    ) {
      const request =
        serviceRequests.find(
          (item) =>
            item.id === requestId
        );

      if (!request) {
        return;
      }
request.status = "quote_pending";
request.quoteStatus = "pending";
request.updatedAt = new Date().toISOString();

const requestIndex =
  serviceRequests.findIndex(
    (item) => item.id === request.id
  );

if (requestIndex >= 0) {
  serviceRequests[requestIndex] = request;
}

localStorage.setItem(
  "echocity-service-requests",
  JSON.stringify(serviceRequests)
);
      localStorage.setItem(
        "echocity-last-request",
        JSON.stringify(request)
      );

      window.location.href =
  "admin-service-quote.html";
    }

    function contactCustomer(
      phoneNumber
    ) {
      if (
        !phoneNumber ||
        phoneNumber ===
          translate("notProvided")
      ) {
        return;
      }

      const cleanNumber =
        String(phoneNumber)
          .replace(
            /[^0-9+]/g,
            ""
          );

      if (!cleanNumber) {
        return;
      }

      window.location.href =
        `tel:${cleanNumber}`;
    }

    function deleteRequest(
      requestId
    ) {
      const confirmed =
        window.confirm(
          translate("confirmDelete")
        );

      if (!confirmed) {
        return;
      }

      serviceRequests =
        serviceRequests.filter(
          (item) =>
            item.id !== requestId
        );

      saveRequests();

      const latestRequest =
        JSON.parse(
          localStorage.getItem(
            "echocity-last-request"
          ) || "null"
        );

      if (
        latestRequest &&
        latestRequest.id === requestId
      ) {
        localStorage.removeItem(
          "echocity-last-request"
        );
      }

      renderRequests();

      window.alert(
        translate("deleteSuccess")
      );
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        loadRequests();
        applyLanguage();
        renderRequests();
      }
    );
  </script>

</body>
