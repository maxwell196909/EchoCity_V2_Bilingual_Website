<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>账号与隐私 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 36px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900;margin-bottom:14px}.card{background:#fff;border-radius:18px;padding:18px}.row{padding:14px 0;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.row label{display:block;font-weight:900;margin-bottom:7px}.row select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px}.toggle{display:flex;justify-content:space-between;align-items:center}.toggle input{width:22px;height:22px}.hint{font-size:12px;color:#64748b;margin-top:5px}.save{width:100%;height:46px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;margin-top:16px}.status{padding:12px;margin-top:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;display:none}</style></head><body><main class="wrap"><button class="back" onclick="history.back()">← 返回</button><section class="card"><h1>账号与隐私</h1><div class="row"><label>账号可见范围</label><select id="visibility"><option value="public">公开</option><option value="followers">仅关注者</option><option value="private">私密账号</option></select><div class="hint">第一版用于平台隐私规则和后续推荐/搜索过滤。</div></div><div class="row"><label>谁可以给我发私信</label><select id="dm"><option value="everyone">所有人</option><option value="followers">仅关注者</option><option value="none">任何人都不可以</option></select></div><div class="row toggle"><div><b>允许被搜索发现</b><div class="hint">关闭后，后续搜索推荐将隐藏账号。</div></div><input id="discoverable" type="checkbox"></div><div class="row toggle"><div><b>展示关注列表</b></div><input id="showFollowing" type="checkbox"></div><div class="row toggle"><div><b>展示粉丝列表</b></div><input id="showFollowers" type="checkbox"></div><div class="row toggle"><div><b>展示喜欢的视频</b></div><input id="showLikes" type="checkbox"></div><div class="row toggle"><div><b>展示所在城市</b></div><input id="showCity" type="checkbox"></div><button id="save" class="save">保存设置</button><div id="status" class="status"></div></section></main><script>const db=window.echoCitySupabase;let me=null;const box=document.getElementById('status');function msg(t){box.textContent=t;box.style.display='block'}async function init(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!me){msg('请先登录后设置隐私。');save.disabled=true;return}const {data}=await db.from('profile_privacy_settings').select('*').eq('user_id',me.id).maybeSingle();const s=data||{account_visibility:'public',allow_direct_messages:'everyone',discoverable_by_search:true,show_following_list:true,show_follower_list:true,show_liked_videos:false,show_city:true};visibility.value=s.account_visibility;dm.value=s.allow_direct_messages;discoverable.checked=s.discoverable_by_search;showFollowing.checked=s.show_following_list;showFollowers.checked=s.show_follower_list;showLikes.checked=s.show_liked_videos;showCity.checked=s.show_city}save.onclick=async()=>{if(!me)return;const payload={user_id:me.id,account_visibility:visibility.value,allow_direct_messages:dm.value,discoverable_by_search:discoverable.checked,show_following_list:showFollowing.checked,show_follower_list:showFollowers.checked,show_liked_videos:showLikes.checked,show_city:showCity.checked,updated_at:new Date().toISOString()};const {error}=await db.from('profile_privacy_settings').upsert(payload,{onConflict:'user_id'});msg(error?'保存失败：'+error.message:'设置已保存。')};init();</script></body></html>
