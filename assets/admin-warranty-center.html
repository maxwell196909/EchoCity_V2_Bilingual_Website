<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保修与售后中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1160px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#7c2d12,#ea580c)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.metric,.card{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:28px;font-weight:900;color:#c2410c}.muted{color:#64748b}.notice{padding:14px;border-radius:14px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin:14px 0}.list{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr auto;gap:15px;align-items:center}.no{font-weight:900;color:#1d4ed8}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.pending_terms,.open,.in_review{background:#fef3c7;color:#92400e}.active,.closed{background:#dcfce7;color:#166534}.repairing,.awaiting_reinspection{background:#dbeafe;color:#1e40af}.expired,.suspended,.rejected,.overdue{background:#fee2e2;color:#991b1b}.btn{border:0;padding:10px 12px;border-radius:10px;background:#c2410c;color:#fff;font-weight:900;cursor:pointer;margin:3px}.secondary{background:#475569}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}h2{margin:24px 0 10px}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>保修与售后中心</h1><p>从已验收、已结算订单生成保修档案，统一处理售后、责任、时限和复验</p></header><div class="notice">保修只在居民确认并完成结算后建立。期限、范围、排除项和响应时限必须由平台人工批准；AI只能整理、提醒和跟踪，不能自动承诺保修、拒绝客户或关闭售后。</div><div id="message" class="message">正在读取保修与售后数据……</div><section id="content" hidden><div id="metrics" class="metrics"></div><h2>保修档案</h2><div id="warranties" class="list"></div><h2>售后工单</h2><div id="cases" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const URL='https://dpljvspwcfglxfesxdmf.supabase.co',KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let data={};
async function rpc(name,body){const r=await fetch(`${URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const statusText={pending_terms:'待人工配置条款',active:'保修有效',expired:'已到期',suspended:'已暂停',closed:'已关闭',open:'待受理',in_review:'审核中',repairing:'处理中',awaiting_reinspection:'待复验',rejected:'已驳回'};
function ask(label,def=''){const v=prompt(label,def);return v===null?null:v.trim()}
async function activate(id){const days=ask('请输入人工批准的保修天数（1–3650）');if(days===null)return;const scope=ask('请输入保修包含范围');if(scope===null)return;const exclusions=ask('请输入保修排除项（即使没有也请写“无”）');if(exclusions===null)return;const hours=ask('请输入首次响应时限（小时，1–720）');if(hours===null)return;const note=ask('请输入人工审批说明');if(note===null)return;await run('activate_warranty_with_token',{p_token:token(),p_warranty_id:id,p_warranty_days:Number(days),p_scope:scope,p_exclusions:exclusions,p_response_hours:Number(hours),p_note:note},'保修条款已激活')}
async function createCase(id){const issue=ask('请输入客户确认后的售后问题');if(issue===null)return;const evidence=ask('请输入照片/视频/材料记录（可留空）','');if(evidence===null)return;const severity=ask('请输入等级：normal / urgent / critical','normal');if(severity===null)return;await run('create_after_sales_case_with_token',{p_token:token(),p_warranty_id:id,p_issue:issue,p_evidence:evidence,p_severity:severity},'售后工单已建立')}
async function caseAction(id,action){const labels={review:'受理审核',repair:'开始处理',reinspect:'提交复验',close:'复验通过并关闭',reject:'驳回'};const note=ask(`请输入“${labels[action]}”的人工处理说明`);if(note===null)return;let result=null;if(action==='close'){result=ask('请输入复验结果（关闭工单必填）');if(result===null)return}await run('update_after_sales_case_with_token',{p_token:token(),p_case_id:id,p_action:action,p_note:note,p_reinspection_result:result},'售后状态已更新')}
async function run(name,body,ok){try{$('message').hidden=false;$('message').className='message';$('message').textContent='正在提交……';await rpc(name,body);alert(ok);await load()}catch(e){alert(`提交失败：${e.message}`);$('message').textContent=`操作失败：${e.message}`;$('message').className='message error'}}
function warrantyActions(w){return w.status==='pending_terms'?`<button class="btn" onclick="activate('${w.id}')">人工配置并激活</button>`:w.status==='active'?`<button class="btn" onclick="createCase('${w.id}')">新建售后工单</button>`:''}
function caseActions(c){if(['closed','rejected'].includes(c.status))return '';const next=c.status==='open'?['review','reject']:c.status==='in_review'?['repair','reject']:c.status==='repairing'?['reinspect']:['close','repair'];return next.map(a=>`<button class="btn ${a==='reject'?'secondary':''}" onclick="caseAction('${c.id}','${a}')">${{review:'受理',reject:'驳回',repair:'开始处理',reinspect:'提交复验',close:'复验通过并关闭'}[a]}</button>`).join('')}
async function load(){try{const t=token();if(!t)throw new Error('链接缺少平台访问凭证');data=await rpc('get_platform_warranty_center_with_token',{p_token:t});const s=data.summary||{};$('metrics').innerHTML=[['待配置条款',s.pending_terms],['有效保修',s.active],['处理中售后',s.open_cases],['已超时售后',s.overdue_cases]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="muted">${esc(x[0])}</div></div>`).join('');$('warranties').innerHTML=(data.warranties||[]).map(w=>`<article class="card row"><div><div class="no">${esc(w.request_no)}</div><div>${esc(w.service_type)}</div><span class="tag ${esc(w.status)}">${esc(statusText[w.status]||w.status)}</span></div><div><strong>包含：</strong>${esc(w.scope)}<br><strong>排除：</strong>${esc(w.exclusions)}<br><span class="muted">响应 ${esc(w.response_hours)} 小时</span></div><div><div>开始 ${w.start_at?new Date(w.start_at).toLocaleDateString('zh-CN'):'—'}</div><div>截止 ${w.end_at?new Date(w.end_at).toLocaleDateString('zh-CN'):'—'}</div><div>未结案 ${esc(w.open_cases)}</div></div><div>${warrantyActions(w)}</div></article>`).join('')||'<div class="message">暂无符合“已验收并完成结算”的保修档案。</div>';$('cases').innerHTML=(data.cases||[]).map(c=>{const overdue=c.due_at&&!['closed','rejected'].includes(c.status)&&new Date(c.due_at)<new Date();return `<article class="card row"><div><div class="no">${esc(c.case_no)}</div><div>${esc(c.request_no)}</div><span class="tag ${overdue?'overdue':esc(c.status)}">${overdue?'已超时':esc(statusText[c.status]||c.status)}</span></div><div><strong>${esc(c.issue)}</strong><br><span class="muted">证据：${esc(c.evidence)}</span></div><div>责任人员 ${esc(c.worker_phone)}<br>时限 ${c.due_at?new Date(c.due_at).toLocaleString('zh-CN'):'—'}<br>复验 ${esc(c.reinspection_result)}</div><div>${caseActions(c)}</div></article>`}).join('')||'<div class="message">暂无售后工单。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`保修数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
