<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>确认服务报价 | EchoCity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #eef5ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
      color: #172033;
      background:
        linear-gradient(
          180deg,
          #edf4ff 0%,
          #f8fbff 100%
        );
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #172033;
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-icon {
      display: flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #2878e5,
          #6557e8
        );
      box-shadow:
        0 10px 24px
        rgba(40, 120, 229, 0.24);
    }

    .language-button {
      min-width: 56px;
      min-height: 44px;
      padding: 9px 15px;
      border: 1px solid #ccd8e8;
      border-radius: 14px;
      color: #233044;
      background: #ffffff;
      font-weight: 700;
    }

    .language-button:active {
      transform: scale(0.98);
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro-label {
      margin: 0 0 9px;
      color: #2872d8;
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size:
        clamp(
          32px,
          7vw,
          46px
        );
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .intro-description {
      margin: 0;
      color: #65738a;
      line-height: 1.7;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.info {
      color: #255c9a;
      background: #e8f2ff;
      border: 1px solid #c6dcfa;
    }

    .message.success {
      color: #17633a;
      background: #e8f7ef;
      border: 1px solid #bce6ce;
    }

    .message.error {
      color: #9b2c2c;
      background: #fff0f0;
      border: 1px solid #f1c1c1;
    }

    .quote-card,
    .empty-card {
      border: 1px solid #d9e3f0;
      border-radius: 24px;
      background:
        rgba(
          255,
          255,
          255,
          0.96
        );
      box-shadow:
        0 16px 40px
        rgba(36, 68, 108, 0.09);
    }

    .quote-card {
      display: none;
      padding: 22px;
    }

    .quote-card.show {
      display: block;
    }

    .request-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .request-number {
      margin-bottom: 7px;
      color: #2872d8;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .service-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.3;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      color: #1f5d9c;
      background: #e8f2ff;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .details {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 11px;
      margin-bottom: 15px;
    }

    .detail {
      min-width: 0;
      padding: 14px;
      border-radius: 15px;
      background: #f3f6fa;
    }

    .detail-label {
      margin-bottom: 6px;
      color: #718096;
      font-size: 12px;
    }

    .detail-value {
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .description-box {
      margin-bottom: 16px;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fc;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .quote-panel {
      margin-top: 16px;
      padding: 20px;
      border-radius: 18px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #1f67d8,
          #234ec5
        );
      box-shadow:
        0 12px 28px
        rgba(31, 103, 216, 0.22);
    }

    .quote-label {
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.88;
    }

    .quote-amount {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.15;
    }

    .quote-note {
      margin-top: 12px;
      padding-top: 12px;
      border-top:
        1px solid
        rgba(255, 255, 255, 0.24);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .decision-title {
      margin: 22px 0 12px;
      font-size: 17px;
      font-weight: 800;
    }

    .decision-actions {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .decision-button {
      min-height: 54px;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 800;
    }

    .accept-button {
      border: 0;
      color: #ffffff;
      background: #2878e5;
    }

    .decline-button {
      border: 1px solid #e0b7b7;
      color: #9b2c2c;
      background: #fffafa;
    }

    .decision-button:active {
      transform: scale(0.985);
    }

    .decision-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .result-box {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      line-height: 1.6;
      text-align: center;
    }

    .result-box.show {
      display: block;
    }

    .result-box.accepted {
      color: #17633a;
      background: #e8f7ef;
      border: 1px solid #bce6ce;
    }

    .result-box.declined {
      color: #8a5a16;
      background: #fff6df;
      border: 1px solid #ead49c;
    }

    .back-link {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 0 18px;
      border: 1px solid #ccd8e8;
      border-radius: 15px;
      color: #233044;
      background: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }

    .empty-card {
      display: none;
      padding: 38px 22px;
      text-align: center;
    }

    .empty-card.show {
      display: block;
    }

    .empty-card h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .empty-card p {
      margin: 0;
      color: #68768b;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      .details,
      .decision-actions {
        grid-template-columns: 1fr;
      }

      .request-head {
        flex-direction: column;
      }

      .status-badge {
        align-self: flex-start;
      }

      .quote-card {
        padding: 17px;
      }

      .quote-amount {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

    <header class="topbar">

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>

  <script>
    const translations = {
      zh: {
        label: "客户报价确认",
        title: "请确认服务报价",
        subtitle:
          "请核对服务内容和报价。确认后，订单将进入人员匹配和派工流程。",

        loading: "正在读取云端报价……",
        loadError:
          "报价读取失败，请检查网络后重新打开。",
        submitting:
          "正在提交您的选择……",
        submitError:
          "提交失败，请检查网络后重新尝试。",

        serviceDate: "服务日期",
        startTime: "开始时间",
        serviceAddress: "服务地址",
        workers: "需要人数",
        quoteLabel: "服务报价",
        decisionTitle:
          "请选择是否接受本次报价",

        acceptQuote: "确认报价",
        declineQuote: "暂不接受",
        backRequests: "返回我的需求",

        notFoundTitle: "没有找到报价",
        notFoundText:
          "请返回“我的需求”，重新选择一条已报价的订单。",

        noQuoteTitle: "报价尚未准备完成",
        noQuoteText:
          "运营人员尚未填写正式报价，请稍后再查看。",

        acceptedResult:
          "您已确认本次报价。订单将进入人员匹配和派工流程。",
        declinedResult:
          "您暂未接受本次报价。运营人员将根据情况与您联系。",

        statusSubmitted: "待人工确认",
        statusReviewed: "需求已确认",
        statusQuoted: "等待客户确认",
        statusConfirmed: "报价已确认",
        statusDeclined: "暂不接受",
        statusAssigned: "已派工",
        statusInProgress: "服务进行中",
        statusCompleted: "已完成",
        statusCancelled: "已取消",

        serviceRepair: "维修或清洁",
        serviceWorkers: "需要人手",
        serviceSupport: "生活帮助",
        serviceUnknown: "其他服务",

        noDescription: "未填写服务说明",
        noQuoteNote: "未填写报价说明",
        notProvided: "未填写"
      },

      en: {
        label: "Customer quote confirmation",
        title: "Confirm Service Quote",
        subtitle:
          "Please review the service details and quote. Once accepted, the request will move to worker matching and assignment.",

        loading: "Loading the cloud quote...",
        loadError:
          "Unable to load the quote. Please check your connection and reopen this page.",
        submitting:
          "Submitting your decision...",
        submitError:
          "Submission failed. Please check your connection and try again.",

        serviceDate: "Service date",
        startTime: "Start time",
        serviceAddress: "Service address",
        workers: "Workers needed",
        quoteLabel: "Service quote",
        decisionTitle:
          "Please choose whether to accept this quote",

        acceptQuote: "Accept Quote",
        declineQuote: "Not Now",
        backRequests: "Back to My Requests",

        notFoundTitle: "Quote Not Found",
        notFoundText:
          "Return to My Requests and select an order with a quote.",

        noQuoteTitle: "Quote Not Ready",
        noQuoteText:
          "The operations team has not completed the formal quote. Please check again later.",

        acceptedResult:
          "You accepted this quote. The request will move to worker matching and assignment.",
        declinedResult:
          "You have not accepted this quote. The operations team may contact you.",

        statusSubmitted: "Pending review",
        statusReviewed: "Request confirmed",
        statusQuoted: "Waiting for customer",
        statusConfirmed: "Quote accepted",
        statusDeclined: "Not accepted",
        statusAssigned: "Assigned",
        statusInProgress: "In progress",
        statusCompleted: "Completed",
        statusCancelled: "Cancelled",

        serviceRepair: "Repair or Cleaning",
        serviceWorkers: "Extra Help",
        serviceSupport: "Daily Support",
        serviceUnknown: "Other Service",

        noDescription:
          "No service description provided",
        noQuoteNote:
          "No quote note provided",
        notProvided: "Not provided"
      }
    };

    let currentLanguage =
      localStorage.getItem(
        "echocity-language"
      ) || "zh";

    let currentRequest = null;
    let requestNo = "";

    const languageButton =
      document.getElementById(
        "languageButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const quoteCard =
      document.getElementById(
        "quoteCard"
      );

    const emptyCard =
      document.getElementById(
        "emptyCard"
      );

    const requestNumber =
      document.getElementById(
        "requestNumber"
      );

    const serviceTitle =
      document.getElementById(
        "serviceTitle"
      );

    const statusBadge =
      document.getElementById(
        "statusBadge"
      );

    const serviceDate =
      document.getElementById(
        "serviceDate"
      );

    const startTime =
      document.getElementById(
        "startTime"
      );

    const serviceAddress =
      document.getElementById(
        "serviceAddress"
      );

    const workers =
      document.getElementById(
        "workers"
      );

    const description =
      document.getElementById(
        "description"
      );

    const quoteAmount =
      document.getElementById(
        "quoteAmount"
      );

    const quoteNote =
      document.getElementById(
        "quoteNote"
      );

    const decisionTitle =
      document.getElementById(
        "decisionTitle"
      );

    const decisionActions =
      document.getElementById(
        "decisionActions"
      );

    const acceptButton =
      document.getElementById(
        "acceptButton"
      );

    const declineButton =
      document.getElementById(
        "declineButton"
      );

    const resultBox =
      document.getElementById(
        "resultBox"
      );

    function t(key) {
      return (
        translations[currentLanguage][key] ||
        translations.zh[key] ||
        key
      );
    }

    function applyLanguage() {
      document.documentElement.lang =
        currentLanguage === "zh"
          ? "zh-CN"
          : "en";

      languageButton.textContent =
        currentLanguage === "zh"
          ? "EN"
          : "中文";

      document
        .querySelectorAll("[data-i18n]")
        .forEach((element) => {
          const key =
            element.getAttribute(
              "data-i18n"
            );

          element.textContent = t(key);
        });

      if (currentRequest) {
        renderRequest(currentRequest);
      }
    }

    function showMessage(
      type,
      text
    ) {
      message.className =
        `message ${type} show`;

      message.textContent = text;
    }

    function hideMessage() {
      message.className =
        "message";

      message.textContent = "";
    }

    function showEmpty(
      titleKey = "notFoundTitle",
      textKey = "notFoundText"
    ) {
      quoteCard.classList.remove(
        "show"
      );

      emptyCard.classList.add(
        "show"
      );

      const title =
        emptyCard.querySelector("h2");

      const text =
        emptyCard.querySelector("p");

      title.textContent =
        t(titleKey);

      text.textContent =
        t(textKey);
    }

    function getRequestNumber() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      return (
        params.get("request_no") ||
        params.get("requestNo") ||
        params.get("id") ||
        ""
      ).trim();
    }

    function getServiceName(
      serviceType
    ) {
      const serviceMap = {
        repair: "serviceRepair",
        workers: "serviceWorkers",
        support: "serviceSupport"
      };

      return t(
        serviceMap[serviceType] ||
        "serviceUnknown"
      );
    }

    function getStatusText(status) {
      const statusMap = {
        submitted: "statusSubmitted",
        new: "statusSubmitted",
        reviewed: "statusReviewed",
        quoted: "statusQuoted",
        confirmed: "statusConfirmed",
        quote_confirmed:
          "statusConfirmed",
        quote_declined:
          "statusDeclined",
        assigned: "statusAssigned",
        in_progress:
          "statusInProgress",
        completed: "statusCompleted",
        cancelled: "statusCancelled"
      };

      return t(
        statusMap[status] ||
        "statusSubmitted"
      );
    }

    function formatMoney(value) {
      const amount =
        Number(value);

      if (!Number.isFinite(amount)) {
        return "$0.00";
      }

      return new Intl.NumberFormat(
        "en-US",
        {
          style: "currency",
          currency: "USD"
        }
      ).format(amount);
    }

    function updateDecisionDisplay(
      status
    ) {
      decisionActions.style.display =
        "none";

      decisionTitle.style.display =
        "none";

      resultBox.className =
        "result-box";

      resultBox.textContent = "";

      if (status === "quoted") {
        decisionTitle.style.display =
          "block";

        decisionActions.style.display =
          "grid";

        return;
      }

      if (
        status === "confirmed" ||
        status === "quote_confirmed"
      ) {
        resultBox.className =
          "result-box accepted show";

        resultBox.textContent =
          t("acceptedResult");

        return;
      }

      if (
        status === "quote_declined"
      ) {
        resultBox.className =
          "result-box declined show";

        resultBox.textContent =
          t("declinedResult");
      }
    }

    function renderRequest(item) {
      requestNumber.textContent =
        item.request_no || requestNo;

      serviceTitle.textContent =
        getServiceName(
          item.service_type
        );

      statusBadge.textContent =
        getStatusText(item.status);

      serviceDate.textContent =
        item.service_date ||
        t("notProvided");

      startTime.textContent =
        item.start_time ||
        t("notProvided");

      serviceAddress.textContent =
        item.address ||
        t("notProvided");

      workers.textContent =
        item.workers ??
        t("notProvided");

      description.textContent =
        item.description ||
        t("noDescription");

      quoteAmount.textContent =
        formatMoney(
          item.quote_amount
        );

      quoteNote.textContent =
        item.quote_note ||
        t("noQuoteNote");

      updateDecisionDisplay(
        item.status
      );

      emptyCard.classList.remove(
        "show"
      );

      quoteCard.classList.add(
        "show"
      );
    }

    async function loadQuote() {
      requestNo =
        getRequestNumber();

      if (!requestNo) {
        hideMessage();
        showEmpty();
        return;
      }

      showMessage(
        "info",
        t("loading")
      );

      try {
        const client =
          window.echoCitySupabase;

        if (!client) {
          throw new Error(
            "Supabase client unavailable."
          );
        }

        const { data, error } =
          await client
            .from("service_requests")
            .select("*")
            .eq(
              "request_no",
              requestNo
            )
            .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          hideMessage();
          showEmpty();
          return;
        }

        if (
          data.quote_amount === null ||
          data.quote_amount === undefined
        ) {
          hideMessage();

          showEmpty(
            "noQuoteTitle",
            "noQuoteText"
          );

          return;
        }

        currentRequest = data;

        hideMessage();
        renderRequest(data);
      } catch (error) {
        console.error(
          "Failed to load service quote:",
          error
        );

        showMessage(
          "error",
          t("loadError")
        );

        showEmpty();
      }
    }    async function submitDecision(
      newStatus
    ) {
      if (
        !currentRequest ||
        !requestNo
      ) {
        showMessage(
          "error",
          t("notFoundText")
        );

        return;
      }

      const accepted =
        newStatus === "confirmed";

      const confirmText =
        accepted
          ? (
              currentLanguage === "zh"
                ? "确认接受本次报价吗？"
                : "Accept this quote?"
            )
          : (
              currentLanguage === "zh"
                ? "确认暂不接受本次报价吗？"
                : "Decline this quote for now?"
            );

      if (
        !window.confirm(confirmText)
      ) {
        return;
      }

      acceptButton.disabled = true;
      declineButton.disabled = true;

      showMessage(
        "info",
        t("submitting")
      );

      try {
        const client =
          window.echoCitySupabase;

        if (!client) {
          throw new Error(
            "Supabase client unavailable."
          );
        }

        const updatedAt =
          new Date().toISOString();

        const { data, error } =
          await client
            .from("service_requests")
            .update({
              status: newStatus,
              quote_confirmed: accepted,
              updated_at: updatedAt
            })
            .eq(
              "request_no",
              requestNo
            )
            .select("*")
            .single();

        if (error) {
          throw error;
        }

        currentRequest = data;

        hideMessage();
        renderRequest(data);

        console.log(
          "Customer quote decision saved:",
          data
        );
      } catch (error) {
        console.error(
          "Failed to submit quote decision:",
          error
        );

        showMessage(
          "error",
          t("submitError")
        );

        acceptButton.disabled = false;
        declineButton.disabled = false;
      }
    }

    acceptButton.addEventListener(
      "click",
      () => {
        submitDecision(
          "confirmed"
        );
      }
    );

    declineButton.addEventListener(
      "click",
      () => {
        submitDecision(
          "quote_declined"
        );
      }
    );

    languageButton.addEventListener(
      "click",
      () => {
        currentLanguage =
          currentLanguage === "zh"
            ? "en"
            : "zh";

        localStorage.setItem(
          "echocity-language",
          currentLanguage
        );

        applyLanguage();

        if (!currentRequest) {
          showMessage(
            "info",
            t("loading")
          );
        }
      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        applyLanguage();
        await loadQuote();
      }
    );
  </script>
</body>
</html>
