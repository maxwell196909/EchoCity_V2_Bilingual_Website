<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>质量与验收中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1120px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#14532d,#059669)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.metric,.order{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:28px;font-weight:900;color:#047857}.label,.muted{color:#64748b}.notice{padding:14px;border-radius:14px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;margin:14px 0}.list{display:grid;gap:12px}.order{display:grid;grid-template-columns:1.1fr 1.5fr 1fr auto;gap:15px;align-items:center}.order-no{font-weight:900;color:#1d4ed8}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.platform_review{background:#dbeafe;color:#1e40af}.customer_final{background:#fef3c7;color:#92400e}.rework,.dispute{background:#fee2e2;color:#991b1b}.evidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.evidence span{font-size:13px;color:#475569}.missing{color:#b91c1c!important;font-weight:900}.btn{display:inline-block;padding:10px 12px;border-radius:10px;background:#047857;color:#fff;text-decoration:none;font-weight:900}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>质量与验收中心</h1><p>过程证据、里程碑复核、最终验收、返工和争议统一监管</p></header><div class="notice">平台可复核里程碑，但不能代客户完成最终验收；工人也不能验收自己的工作。证据缺失时应补充记录或返工。</div><div id="message" class="message">正在读取质量与验收数据……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div id="orders" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const queueText={platform_review:'待平台里程碑复核',customer_final:'待客户最终验收',rework:'返工整改',dispute:'争议处理中'};
function action(o){if(o.queue==='platform_review')return `<a class="btn" href="admin-service-milestones.html?request_no=${encodeURIComponent(o.request_no)}">平台复核里程碑</a>`;if(o.queue==='customer_final')return '<a class="btn" href="customer-final-acceptance.html">打开客户验收入口</a>';return `<a class="btn" href="admin-incident-center.html">进入异常处理</a>`}
async function load(){try{const platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_quality_center_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['待平台复核',s.platform_milestone_review],['待客户最终验收',s.customer_final_acceptance],['返工或争议',s.rework_or_dispute],['证据不完整',s.evidence_incomplete]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const rows=d.orders||[];$('orders').innerHTML=rows.length?rows.map(o=>`<article class="order"><div><a class="order-no" href="admin-order-360.html?request_no=${encodeURIComponent(o.request_no)}">${esc(o.request_no)}</a><div>${esc(o.service_type)} · ${esc(o.worker||'未派工')}</div><div class="muted">${esc(o.status)}</div></div><div><span class="tag ${esc(o.queue)}">${esc(queueText[o.queue]||o.queue)}</span><div>${esc(o.milestone_summary||o.outstanding_issues||'暂无补充说明')}</div></div><div><strong>工时 ${esc(o.work_hours)}</strong><div class="evidence"><span class="${Number(o.work_record_count)===0?'missing':''}">记录 ${esc(o.work_record_count)}</span><span class="${Number(o.photo_record_count)===0?'missing':''}">照片 ${esc(o.photo_record_count)}</span><span>视频 ${esc(o.video_record_count)}</span></div></div><div>${action(o)}</div></article>`).join(''):'<div class="message">当前没有验收待办。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`质量数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
