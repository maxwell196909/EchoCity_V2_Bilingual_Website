<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>举报审核 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#0f172a}header{position:sticky;top:0;z-index:10;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:#0f172a;color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:18px;margin:0}.refresh{border:0;border-radius:10px;padding:9px 12px;background:#fff;font-weight:900}.tabs{display:flex;gap:6px;overflow:auto;margin-top:10px}.tab{border:0;border-radius:999px;padding:8px 11px;background:#ffffff18;color:#fff;white-space:nowrap}.tab.active{background:#fff;color:#111827}main{max-width:900px;margin:auto;padding:14px}.notice{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;color:#64748b}.list{display:grid;gap:12px}.card{background:#fff;border-radius:15px;padding:14px;box-shadow:0 5px 20px #0f172a0b}.head{display:flex;justify-content:space-between;gap:10px}.type{font-weight:900}.time{font-size:12px;color:#94a3b8}.reason{font-weight:800;margin-top:10px}.details{color:#475569;line-height:1.55;margin-top:6px;white-space:pre-wrap}.target{font-size:12px;color:#64748b;margin-top:8px;word-break:break-all}.note{width:100%;min-height:66px;margin-top:10px;padding:10px;border:1px solid #cbd5e1;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:900}.review{background:#fef3c7}.resolve{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.open{background:#dbeafe;color:#1d4ed8}.empty{text-align:center;padding:48px;color:#94a3b8}</style></head><body><header><div class="top"><h1>EchoCity 内容举报审核</h1><button id="refresh" class="refresh">刷新</button></div><div class="tabs"><button class="tab active" data-status="submitted">待处理</button><button class="tab" data-status="reviewing">审核中</button><button class="tab" data-status="resolved">已处理</button><button class="tab" data-status="rejected">已驳回</button><button class="tab" data-status="all">全部</button></div></header><main><div id="notice" class="notice">正在读取举报……</div><section id="list" class="list"></section></main><script>const db=window.echoCitySupabase,notice=document.getElementById('notice'),list=document.getElementById('list');let status='submitted';function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));const t=q.get('platform_token')||h.get('platform_token')||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}return t}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const t=token();if(!t){notice.textContent='缺少平台访问凭证，请从平台入口打开。';list.innerHTML='';return}notice.textContent='正在读取举报……';const {data,error}=await db.rpc('list_content_reports_with_platform_token',{p_token:t,p_status:status});if(error){notice.textContent='读取失败：'+error.message;list.innerHTML='';return}const rows=Array.isArray(data)?data:[];notice.textContent=`${status==='all'?'全部':'当前'} ${rows.length} 条`;list.innerHTML=rows.length?rows.map(r=>`<article class="card" data-id="${r.id}" data-type="${esc(r.target_type)}" data-target="${esc(r.target_id)}"><div class="head"><div class="type">${esc(r.target_type)} 举报</div><div class="time">${new Date(r.created_at).toLocaleString()}</div></div><div class="reason">原因：${esc(r.reason_code)}</div><div class="details">${esc(r.details||'未填写补充说明')}</div><div class="target">目标：${esc(r.target_id)}</div><textarea class="note" placeholder="平台审核备注"></textarea><div class="actions">${r.target_type==='video'?'<button class="btn open" data-open>查看视频</button>':''}<button class="btn review" data-decision="reviewing">标记审核中</button><button class="btn resolve" data-decision="resolve">处理完成</button><button class="btn reject" data-decision="reject">驳回举报</button></div></article>`).join(''):'<div class="empty">当前没有举报记录</div>'}async function decide(card,d){const t=token(),note=card.querySelector('.note').value.trim()||null;card.querySelectorAll('button').forEach(b=>b.disabled=true);const {error}=await db.rpc('review_content_report_with_platform_token',{p_token:t,p_report_id:card.dataset.id,p_decision:d,p_note:note});if(error){alert('提交失败：'+error.message);card.querySelectorAll('button').forEach(b=>b.disabled=false);return}load()}list.onclick=e=>{const open=e.target.closest('[data-open]');if(open){const c=open.closest('.card');location.href=`video-feed-v3.html?video=${encodeURIComponent(c.dataset.target)}`;return}const b=e.target.closest('[data-decision]');if(b)decide(b.closest('.card'),b.dataset.decision)};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));status=t.dataset.status;load()});document.getElementById('refresh').onclick=load;load();</script></body></html>
