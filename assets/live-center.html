<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直播 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:780px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900}.primary{background:#ef4444;color:#fff}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 20px #0f172a0b}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}.form textarea{min-height:80px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.room{background:#fff;border-radius:16px;overflow:hidden}.cover{aspect-ratio:16/10;background:#111;display:grid;place-items:center;color:#fff;font-size:36px}.body{padding:11px}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#fee2e2;color:#b91c1c}.muted{color:#64748b;font-size:12px;margin-top:6px}.empty{padding:36px;text-align:center;color:#64748b}@media(max-width:560px){.list{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="history.back()">← 返回</button><h2>EchoCity 直播</h2><button id="toggleCreate" class="btn primary">＋开直播</button></div><section id="creator" class="card" hidden><h3>创建直播间</h3><div class="form"><input id="title" maxlength="120" placeholder="直播标题"><textarea id="desc" maxlength="800" placeholder="直播介绍"></textarea><input id="city" maxlength="50" placeholder="城市，例如：广州"><input id="locationText" maxlength="120" placeholder="位置（可选）"><input id="serviceType" maxlength="80" placeholder="挂载服务类型（可选）"><input id="serviceName" maxlength="60" placeholder="服务按钮名称（可选）"><button id="createBtn" class="btn primary">创建直播间</button></div></section><section><h3>正在直播</h3><div id="liveList" class="list"><div class="empty">读取中……</div></div></section><section><h3>我的直播</h3><div id="mine" class="list"><div class="empty">登录后查看</div></div></section></main><script>const db=window.echoCitySupabase;let me=null;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(r){return `<div class="room" onclick="location.href='live-room.html?id=${r.id}'"><div class="cover">${r.cover_url?`<img src="${esc(r.cover_url)}" style="width:100%;height:100%;object-fit:cover">`:'LIVE'}</div><div class="body"><span class="status">${r.status==='live'?'直播中':r.status==='scheduled'?'待开播':'已结束'}</span><b style="display:block;margin-top:8px">${esc(r.title)}</b><div class="muted">${esc(r.city||'')} ${r.started_at?' · '+new Date(r.started_at).toLocaleString():''}</div></div></div>`}async function load(){const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:l}=await db.from('live_rooms').select('*').eq('status','live').order('started_at',{ascending:false}).limit(30);liveList.innerHTML=(l||[]).length?(l||[]).map(card).join(''):'<div class="empty" style="grid-column:1/-1">当前还没有直播</div>';if(me){const {data:m}=await db.from('live_rooms').select('*').eq('host_id',me.id).order('created_at',{ascending:false}).limit(20);mine.innerHTML=(m||[]).length?(m||[]).map(card).join(''):'<div class="empty" style="grid-column:1/-1">还没有创建过直播</div>'}}toggleCreate.onclick=()=>{if(!me)return alert('请先登录');creator.hidden=!creator.hidden};createBtn.onclick=async()=>{if(!me)return alert('请先登录');const t=title.value.trim();if(!t)return alert('请填写直播标题');const {data,error}=await db.rpc('create_live_room_v1',{p_title:t,p_description:desc.value.trim()||null,p_city:city.value.trim()||null,p_location_text:locationText.value.trim()||null,p_cover_url:null,p_service_type:serviceType.value.trim()||null,p_service_name:serviceName.value.trim()||null});if(error)return alert('创建失败：'+error.message);location.href='live-room.html?id='+data};load();</script></body></html>
