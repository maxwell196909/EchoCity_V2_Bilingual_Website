<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营驾驶舱 | EchoCity</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/echocity-supabase.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1050px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero,.card{border-radius:20px;background:#fff;border:1px solid #dbe3ee}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#0f2747,#2563eb)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.metric{padding:17px;border-radius:16px;background:#fff;border:1px solid #dbe3ee}.number{font-size:30px;font-weight:900;color:#1d4ed8}.label{margin-top:5px;color:#64748b}.card{margin-top:14px;padding:17px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:800}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.alert-row{grid-template-columns:1.4fr 1fr 1fr}.order-link{color:#1d4ed8;font-weight:800;text-decoration:none}.order-link:hover{text-decoration:underline}.overdue{color:#b91c1c;font-weight:800}.empty{padding:12px 0;color:#64748b}.error{color:#991b1b;background:#fee2e2}@media(max-width:720px){.metrics{grid-template-columns:repeat(2,1fr)}.row,.alert-row{grid-template-columns:1fr}.card-head{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero"><a href="admin-service-requests.html">← 返回订单管理</a>　<a href="admin-worker-management.html">人员与信用 →</a>　<a href="admin-settlement-ledger.html">结算台账 →</a><h1>平台运营驾驶舱</h1><p>实时掌握订单数量、超时待办和业务闭环情况</p></header>
    <div id="message" class="card">正在读取运营数据……</div>
    <section id="content" hidden>
      <div id="metrics" class="metrics"></div>
      <div class="card"><div class="card-head"><h2>超时待办</h2><span id="alert-count" class="badge">0</span></div><div id="alerts"></div></div>
      <div class="card"><h2>最近更新的订单</h2><div id="recent"></div></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function token(){const p=new URLSearchParams(location.search),x=p.get('platform_token');if(x){sessionStorage.setItem('echocity-platform-token',x);p.delete('platform_token');history.replaceState(null,'',location.pathname)}return x||sessionStorage.getItem('echocity-platform-token')||''}
    function orderHref(requestNo){return `admin-service-requests.html?request_no=${encodeURIComponent(requestNo)}`}
    async function load(){
      try{
        const platformToken=token();
        const [summaryResult,alertsResult]=await Promise.all([
          window.echoCitySupabase.rpc('get_platform_operations_summary_with_token',{p_token:platformToken}),
          window.echoCitySupabase.rpc('get_platform_overdue_alerts_with_token',{p_token:platformToken})
        ]);
        if(summaryResult.error)throw summaryResult.error;if(alertsResult.error)throw alertsResult.error;
        const d=summaryResult.data,items=[['订单总量',d.total],['待审核',d.pending_review],['待客户确认报价',d.pending_quote_confirmation],['待派工',d.pending_assignment],['服务进行中',d.active],['待最终验收',d.pending_final_acceptance],['返工或争议',d.disputed],['已完成闭环',d.closed]];
        $('metrics').innerHTML=items.map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');
        const alerts=alertsResult.data?.alerts||[];$('alert-count').textContent=alerts.length;
        $('alerts').innerHTML=alerts.length?alerts.map(x=>`<div class="row alert-row"><a class="order-link" href="${orderHref(x.request_no)}">${esc(x.request_no)}</a><span>${esc(x.status)}</span><span class="overdue">已等待 ${esc(x.hours_waiting)} 小时</span></div>`).join(''):'<div class="empty">暂无超时订单，当前流程运行正常。</div>';
        const recent=d.recent||[];
        $('recent').innerHTML=recent.length?recent.map(x=>`<div class="row"><a class="order-link" href="${orderHref(x.request_no)}">${esc(x.request_no)}</a><span>${esc(x.status)}</span><span>${esc(new Date(x.updated_at).toLocaleString('zh-CN'))}</span></div>`).join(''):'<div class="empty">暂无订单数据。</div>';
        $('message').hidden=true;$('content').hidden=false;
      }catch(e){console.error(e);$('message').textContent='运营数据读取失败或平台链接已经失效。';$('message').className='card error'}
    }
    load();
  </script>
</body>
</html>
