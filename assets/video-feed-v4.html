<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070a"><title>EchoCity 视频 V4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}button{font:inherit}.shell{height:100%;position:relative}.tabs{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;z-index:30;display:flex;justify-content:center;gap:24px;text-shadow:0 1px 4px #000}.tab{font-weight:900;opacity:.62}.tab.active{opacity:1}.tab.active:after{content:"";display:block;width:20px;height:3px;margin:6px auto 0;background:#fff;border-radius:3px}.discover,.live-entry{position:fixed;top:max(10px,env(safe-area-inset-top));z-index:31;border:0;border-radius:999px;background:#0009;color:#fff;padding:9px 12px;font-weight:800}.discover{left:10px}.live-entry{right:10px;background:#dc2626}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.card{height:100%;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 28%,transparent 54%,#000e)}.actions{position:absolute;right:10px;bottom:max(112px,calc(env(safe-area-inset-bottom) + 88px));z-index:7;display:flex;flex-direction:column;gap:11px;align-items:center}.action{width:62px;border:0;background:transparent;color:#fff;text-shadow:0 1px 4px #000;font-weight:800}.bubble{width:46px;height:46px;margin:auto;display:grid;place-items:center;border-radius:50%;background:#0009;font-size:22px}.action small{display:block;font-size:11px;margin-top:3px}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#2563eb;overflow:hidden;display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.meta{position:absolute;left:14px;right:82px;bottom:max(24px,env(safe-area-inset-bottom));z-index:6;text-shadow:0 1px 4px #000}.author{font-weight:900;font-size:17px}.badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#2563eb;font-size:10px;vertical-align:2px}.title{margin-top:7px;font-weight:800;line-height:1.4}.desc{font-size:14px;margin-top:4px;line-height:1.45;opacity:.92}.city{font-size:12px;margin-top:6px;opacity:.8}.topics{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.topic{border:0;background:transparent;color:#fff;font-weight:900;padding:0}.cta{position:absolute;left:14px;right:78px;bottom:max(88px,calc(env(safe-area-inset-bottom) + 58px));z-index:8;display:flex;gap:8px}.cta button{border:1px solid #ffffff55;border-radius:999px;padding:10px 14px;background:#111b;color:#fff;font-weight:900}.cta .primary{background:#2563eb;border-color:#2563eb}.state{height:100%;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at top,#1e3a8a,#090d14 58%)}.state p{color:#cbd5e1;line-height:1.6}.state button{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#111e;padding:10px 14px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:760px){.card{max-width:520px;margin:auto}.tabs{max-width:520px;margin:auto}.actions{right:calc((100% - 520px)/2 + 10px)}.meta{left:calc((100% - 520px)/2 + 14px);right:calc((100% - 520px)/2 + 82px)}.cta{left:calc((100% - 520px)/2 + 14px);right:calc((100% - 520px)/2 + 78px)}}</style></head><body><main class="shell"><button class="discover" onclick="location.href='discover.html'">⌕ 发现</button><button class="live-entry" onclick="location.href='live-center.html'">● 直播</button><div class="tabs"><span class="tab" data-feed="local">同城</span><span class="tab" data-feed="following">关注</span><span class="tab active" data-feed="recommend">推荐</span></div><section id="feed" class="feed"></section><div id="toast" class="toast"></div></main><script>const db=window.echoCitySupabase,feed=document.getElementById('feed'),toast=document.getElementById('toast');let me=null,myCity=null,active='recommend',blocked=new Set(),watchStarts=new Map(),sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1500)}function state(h,p,b){feed.innerHTML=`<div class="state"><div><h2>${esc(h)}</h2><p>${esc(p)}</p>${b?`<button onclick="location.href='${b.url}'">${esc(b.text)}</button>`:''}</div></div>`}async function initUser(){const {data}=await db.auth.getUser();me=data?.user||null;if(me){const [{data:p},{data:b}]=await Promise.all([db.from('profiles').select('city').eq('id',me.id).maybeSingle(),db.from('user_blocks').select('blocked_id').eq('blocker_id',me.id)]);myCity=p?.city||null;blocked=new Set((b||[]).map(x=>x.blocked_id))}}async function getVideos(){if(active==='recommend'){const {data,error}=await db.rpc('get_recommended_videos_v1',{p_limit:30,p_city:null});if(error)throw error;return (data||[]).map(x=>({id:x.video_id,author_id:x.author_id,title:x.title,description:x.description,video_url:x.video_url,cover_url:x.cover_url,city:x.city,published_at:x.published_at}))}let q=db.from('videos').select('id,author_id,title,description,video_url,cover_url,duration_seconds,city,location_text,published_at').eq('status','published').eq('visibility','public');if(active==='local'){if(!myCity)return [];q=q.eq('city',myCity)}if(active==='following'){if(!me)throw new Error('请先登录');const {data:f}=await db.from('follows').select('following_id').eq('follower_id',me.id);const ids=(f||[]).map(x=>x.following_id).filter(x=>!blocked.has(x));if(!ids.length)return [];q=q.in('author_id',ids)}const {data,error}=await q.order('published_at',{ascending:false}).limit(30);if(error)throw error;return data||[]}async function load(){feed.innerHTML='<div class="state"><div><h2>EchoCity Video</h2><p>正在加载……</p></div></div>';let rows=[];try{rows=await getVideos()}catch(e){return state('读取失败',e.message||'无法读取内容')}rows=rows.filter(x=>!blocked.has(x.author_id));if(!rows.length){if(active==='local'&&!myCity)return state('请先设置城市','设置城市后查看同城视频',{text:'账号设置',url:'account-settings.html'});if(active==='following')return state('关注流还是空的','关注创作者后，这里会显示他们的作品',{text:'去发现',url:'discover.html'});return state('这里还没有视频','发布第一条视频后会进入审核和推荐',{text:'发布视频',url:'video-publish.html'})}const target=new URLSearchParams(location.search).get('video');if(target){const hit=rows.find(x=>x.id===target);if(hit)rows=[hit,...rows.filter(x=>x.id!==target)]}const authors=[...new Set(rows.map(x=>x.author_id))],vids=rows.map(x=>x.id);const [pRes,lRes,tRes]=await Promise.all([db.from('profiles').select('id,display_name,avatar_url').in('id',authors),db.from('video_service_links').select('video_id,service_type,service_name').in('video_id',vids).eq('active',true),db.from('video_topics').select('video_id,topic_id').in('video_id',vids)]);const profileMap=new Map((pRes.data||[]).map(x=>[x.id,x])),serviceMap=new Map();(lRes.data||[]).forEach(x=>{if(!serviceMap.has(x.video_id))serviceMap.set(x.video_id,x)});const topicIds=[...new Set((tRes.data||[]).map(x=>x.topic_id))],topicMap=new Map(),videoTopics=new Map();if(topicIds.length){const {data:ts}=await db.from('topics').select('id,name').in('id',topicIds).eq('status','active');(ts||[]).forEach(x=>topicMap.set(x.id,x));(tRes.data||[]).forEach(x=>{const t=topicMap.get(x.topic_id);if(t){if(!videoTopics.has(x.video_id))videoTopics.set(x.video_id,[]);videoTopics.get(x.video_id).push(t)}})}const badgeMap=new Map();await Promise.all(authors.map(async id=>{const {data}=await db.rpc('get_public_profile_v1',{p_user_id:id});const p=Array.isArray(data)?data[0]:data;if(p?.can_view)badgeMap.set(id,p.verification_badge||null)}));feed.innerHTML=rows.map((v,i)=>card(v,profileMap.get(v.author_id),serviceMap.get(v.id),videoTopics.get(v.id)||[],badgeMap.get(v.author_id),i)).join('');bind();observe();rows.forEach(v=>updateStats(v.id))}function card(v,p,l,topics,badge,i){const n=p?.display_name||'EchoCity 创作者',av=p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(n.slice(0,1)),service=l?.service_name||l?.service_type||'同类服务';return `<article class="card" data-id="${v.id}" data-author="${v.author_id}" data-index="${i}"><video class="media" src="${esc(v.video_url)}" ${v.cover_url?`poster="${esc(v.cover_url)}"`:''} playsinline loop preload="metadata"></video><div class="shade"></div><div class="actions"><button class="action author-btn"><span class="avatar">${av}</span><small>作者</small></button><button class="action like"><span class="bubble">♡</span><small data-count="like">0</small></button><button class="action comment"><span class="bubble">💬</span><small data-count="comment">0</small></button><button class="action fav"><span class="bubble">☆</span><small data-count="favorite">0</small></button><button class="action share"><span class="bubble">↗</span><small data-count="share">0</small></button><button class="action report"><span class="bubble">⋯</span><small>举报</small></button></div><div class="cta"><button class="ai">问 AI</button><button class="primary service" data-service="${esc(l?.service_type||'general')}" data-name="${esc(service)}">我要${esc(service)}</button></div><div class="meta"><div class="author">@${esc(n)}${badge?`<span class="badge">✓ ${esc(badge)}</span>`:''}</div><div class="title">${esc(v.title||'EchoCity 视频')}</div>${v.description?`<div class="desc">${esc(v.description)}</div>`:''}${topics.length?`<div class="topics">${topics.map(t=>`<button class="topic" data-topic="${t.id}">#${esc(t.name)}</button>`).join('')}</div>`:''}${v.city||v.location_text?`<div class="city">📍 ${esc(v.location_text||v.city)}</div>`:''}</div></article>`}async function updateStats(id){const {data}=await db.rpc('get_video_social_stats',{p_video_id:id});const s=Array.isArray(data)?data[0]:data,c=feed.querySelector(`[data-id="${id}"]`);if(!s||!c)return;['like','comment','favorite','share'].forEach(k=>{const el=c.querySelector(`[data-count="${k}"]`);if(el)el.textContent=s[k+'_count']||0})}function bind(){document.querySelectorAll('.card').forEach(c=>{const v=c.querySelector('video');v.onclick=()=>v.paused?v.play().catch(()=>{}):v.pause();c.querySelector('.author-btn').onclick=()=>location.href='creator-profile.html?id='+c.dataset.author;c.querySelector('.comment').onclick=()=>location.href='video-comments.html?video_id='+c.dataset.id;c.querySelector('.like').onclick=()=>toggle(c,'like');c.querySelector('.fav').onclick=()=>toggle(c,'favorite');c.querySelector('.share').onclick=()=>share(c);c.querySelector('.report').onclick=()=>location.href='report-content.html?target_type=video&target_id='+c.dataset.id;c.querySelector('.ai').onclick=()=>openAI(c);c.querySelector('.service').onclick=e=>openService(c,e.currentTarget);c.querySelectorAll('.topic').forEach(t=>t.onclick=e=>{e.stopPropagation();location.href='topic.html?id='+t.dataset.topic})})}async function toggle(c,action){if(!me)return say('登录后使用');const {data}=await db.from('video_interactions').select('id').eq('video_id',c.dataset.id).eq('user_id',me.id).eq('action',action).maybeSingle();if(data?.id)await db.from('video_interactions').delete().eq('id',data.id);else{const {error}=await db.from('video_interactions').insert({video_id:c.dataset.id,user_id:me.id,action});if(error)return say('操作失败')}updateStats(c.dataset.id);say(data?.id?'已取消':'操作成功')}async function share(c){const url=new URL(location.href);url.searchParams.set('video',c.dataset.id);if(me)await db.from('video_interactions').upsert({video_id:c.dataset.id,user_id:me.id,action:'share'},{onConflict:'video_id,user_id,action'});if(navigator.share){try{await navigator.share({title:'EchoCity 视频',url:url.href})}catch(e){}}else try{await navigator.clipboard.writeText(url.href);say('链接已复制')}catch(e){}updateStats(c.dataset.id)}function openAI(c){if(me)db.from('video_conversions').insert({video_id:c.dataset.id,user_id:me.id,conversion_type:'ai_consult'});location.href='customer-role-home.html?source=video&video_id='+c.dataset.id+'&intent=ai_consult'}function openService(c,b){if(me)db.from('video_conversions').insert({video_id:c.dataset.id,user_id:me.id,conversion_type:'service_click',metadata:{service_type:b.dataset.service}});location.href='customer-role-home.html?source=video&video_id='+c.dataset.id+'&service_type='+encodeURIComponent(b.dataset.service)+'&service_name='+encodeURIComponent(b.dataset.name)}function observe(){const io=new IntersectionObserver(entries=>entries.forEach(e=>{const c=e.target,v=c.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.72){document.querySelectorAll('.card video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});if(!watchStarts.has(c.dataset.id))watchStarts.set(c.dataset.id,Date.now())}else{v.pause();finishWatch(c,v)}}),{threshold:[0,.72,1]});document.querySelectorAll('.card').forEach(c=>io.observe(c))}async function finishWatch(c,v){const s=watchStarts.get(c.dataset.id);if(!s)return;watchStarts.delete(c.dataset.id);if(!me)return;const ms=Math.max(0,Date.now()-s);if(ms<500)return;const duration=v.duration?Math.round(v.duration*1000):null,complete=duration?ms>=duration*.9:false;await db.from('feed_impressions').insert({user_id:me.id,video_id:c.dataset.id,feed_type:active,session_id:sessionId,position:Number(c.dataset.index)||0,watch_duration_ms:ms,completed:complete})}document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{active=t.dataset.feed;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));await load()});(async()=>{await initUser();await load()})();</script></body></html>
