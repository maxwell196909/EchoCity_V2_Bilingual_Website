<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>实名认证审核 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:820px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900}.filters{display:flex;gap:8px;margin:14px 0}.filters select,.filters button{padding:11px;border-radius:11px;border:1px solid #cbd5e1}.filters button{background:#111827;color:#fff;border:0;font-weight:900}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:10px}.meta{font-size:12px;color:#64748b;margin-top:5px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.ok{background:#16a34a;color:#fff}.no{background:#fee2e2;color:#b91c1c}.empty{text-align:center;padding:42px;color:#64748b}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><h2>实名认证审核</h2></div><div class="filters"><select id="status"><option value="submitted">待审核</option><option value="verified">已认证</option><option value="rejected">未通过</option><option value="">全部</option></select><button id="reload">刷新</button></div><div id="list"><div class="empty">正在读取……</div></div></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');function token(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search),t=q.get('platform_token')||h.get('platform_token')||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}return t}async function load(){const t=token();if(!t){list.innerHTML='<div class="empty">缺少平台访问凭证。</div>';return}const {data,error}=await db.rpc('list_identity_verifications_with_platform_token',{p_token:t,p_status:status.value||null});if(error){list.innerHTML='<div class="empty">读取失败：'+error.message+'</div>';return}list.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card"><b>${x.display_name||'EchoCity 用户'}</b> · ${x.verification_type}<div class="meta">状态：${x.status} · 提交：${new Date(x.submitted_at).toLocaleString()}</div>${x.display_badge?`<div class="meta">标识：${x.display_badge}</div>`:''}${x.status==='submitted'?`<div class="actions"><button class="ok" onclick="review('${x.id}','approve')">通过</button><button class="no" onclick="review('${x.id}','reject')">驳回</button></div>`:''}</div>`).join(''):'<div class="empty">没有符合条件的认证申请。</div>'}async function review(id,decision){const badge=decision==='approve'?(prompt('认证标识，例如：已实名认证 / 注册监理工程师','已实名认证')||'已认证'):null;const note=prompt('审核备注（可选）','')||null;const {error}=await db.rpc('review_identity_verification_with_platform_token',{p_token:token(),p_request_id:id,p_decision:decision,p_badge:badge,p_note:note});if(error){alert('审核失败：'+error.message);return}load()}reload.onclick=load;status.onchange=load;load();</script></body></html>
