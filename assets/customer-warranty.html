<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的保修与售后 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(820px,calc(100% - 22px));margin:auto;padding:14px 0 42px}.hero,.card{border-radius:18px;background:#fff;border:1px solid #dbe3ee}.hero{padding:22px;color:#fff;background:linear-gradient(135deg,#7c2d12,#f97316)}.top{display:flex;justify-content:space-between;gap:10px}.switch{border:1px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:8px 12px}.card{padding:17px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:12px;border-radius:12px;background:#f8fafc}.label,.muted{color:#64748b}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:800}.active,.closed{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}label{display:block;font-weight:800;margin:13px 0 6px}textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}textarea{min-height:105px}.confirm{display:flex;gap:9px;align-items:flex-start;margin:14px 0}.confirm input{width:20px;height:20px}.btn{width:100%;border:0;padding:13px;border-radius:11px;background:#c2410c;color:#fff;font-size:16px;font-weight:900}.btn:disabled{opacity:.5}.case{padding:12px 0;border-top:1px solid #e5e7eb}.case:first-child{border-top:0}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><div class="top"><strong>EchoCity</strong><button id="lang" class="switch">English</button></div><h1 data-i18n="title">我的保修与售后</h1><p data-i18n="subtitle">查看保修条款，并提交已确认的售后问题</p></header><div id="message" class="card" data-i18n="loading">正在验证客户专属链接……</div><section id="content" hidden><div class="card"><h2 data-i18n="record">保修档案</h2><div id="warranty" class="grid"></div></div><form id="form" class="card"><h2 data-i18n="submitTitle">提交售后问题</h2><p class="muted" data-i18n="submitHint">请先完整描述问题；平台将人工审核范围、责任与处理安排。</p><label for="issue" data-i18n="issue">问题描述</label><textarea id="issue" maxlength="2000" required></textarea><label for="evidence" data-i18n="evidence">证据说明或已上传材料编号</label><textarea id="evidence" maxlength="1000"></textarea><label for="severity" data-i18n="severity">紧急程度</label><select id="severity"><option value="normal" data-i18n="normal">一般</option><option value="urgent" data-i18n="urgent">紧急</option><option value="critical" data-i18n="critical">重大安全风险</option></select><label class="confirm"><input id="confirmed" type="checkbox"><span data-i18n="confirm">我已核对并确认以上问题描述准确，提交后进入平台人工受理流程。</span></label><button id="submit" class="btn" type="submit" data-i18n="submit">确认提交</button></form><div class="card"><h2 data-i18n="history">售后记录</h2><div id="cases"></div></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const URL='https://dpljvspwcfglxfesxdmf.supabase.co',KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';let lang=localStorage.getItem('echocity-lang')||'zh',auth={},data={};
const tx={zh:{title:'我的保修与售后',subtitle:'查看保修条款，并提交已确认的售后问题',loading:'正在验证客户专属链接……',record:'保修档案',submitTitle:'提交售后问题',submitHint:'请先完整描述问题；平台将人工审核范围、责任与处理安排。',issue:'问题描述',evidence:'证据说明或已上传材料编号',severity:'紧急程度',normal:'一般',urgent:'紧急',critical:'重大安全风险',confirm:'我已核对并确认以上问题描述准确，提交后进入平台人工受理流程。',submit:'确认提交',history:'售后记录',scope:'保修范围',exclusions:'排除项',period:'保修期间',response:'首次响应时限',hours:'小时',empty:'暂无售后记录',inactive:'保修尚未激活或已经到期，暂不能提交售后。',success:'提交成功，售后工单号：',failed:'操作失败：'},en:{title:'My Warranty & After-sales',subtitle:'Review warranty terms and submit a confirmed after-sales request',loading:'Validating your secure customer link…',record:'Warranty Record',submitTitle:'Submit an After-sales Request',submitHint:'Describe the issue fully. The platform team will review scope, responsibility and handling arrangements.',issue:'Issue description',evidence:'Evidence note or uploaded material reference',severity:'Urgency',normal:'Normal',urgent:'Urgent',critical:'Critical safety risk',confirm:'I have checked and confirmed that the description is accurate. Submission enters manual platform review.',submit:'Confirm and submit',history:'After-sales History',scope:'Coverage',exclusions:'Exclusions',period:'Warranty period',response:'Initial response target',hours:'hours',empty:'No after-sales records.',inactive:'The warranty is not active or has expired. Submission is unavailable.',success:'Submitted. Case number: ',failed:'Operation failed: '}};
function t(k){return tx[lang][k]||k}function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=t(x.dataset.i18n));$('lang').textContent=lang==='zh'?'English':'中文';localStorage.setItem('echocity-lang',lang);render()}
async function rpc(name,body){const r=await fetch(`${URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function credentials(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const request_no=h.get('request_no')||sessionStorage.getItem('warranty-request-no')||'',token=h.get('token')||sessionStorage.getItem('warranty-customer-token')||'';if(h.get('request_no')&&h.get('token')){sessionStorage.setItem('warranty-request-no',request_no);sessionStorage.setItem('warranty-customer-token',token)}return{request_no,token}}
const status={zh:{pending_terms:'待平台配置条款',active:'保修有效',expired:'已到期',open:'待受理',in_review:'审核中',repairing:'处理中',awaiting_reinspection:'待复验',closed:'已关闭',rejected:'已驳回'},en:{pending_terms:'Terms pending',active:'Active',expired:'Expired',open:'Awaiting review',in_review:'Under review',repairing:'In progress',awaiting_reinspection:'Awaiting reinspection',closed:'Closed',rejected:'Rejected'}};
function date(v){return v?new Date(v).toLocaleDateString(lang==='zh'?'zh-CN':'en-US'):'—'}function render(){if(!data.warranty)return;const w=data.warranty;$('warranty').innerHTML=`<div class="item"><div class="label">${t('scope')}</div><strong>${esc(w.scope)}</strong></div><div class="item"><div class="label">${t('exclusions')}</div><strong>${esc(w.exclusions)}</strong></div><div class="item"><div class="label">${t('period')}</div><strong>${date(w.start_at)} — ${date(w.end_at)}</strong></div><div class="item"><div class="label">${t('response')}</div><strong>${esc(w.response_hours)} ${t('hours')}</strong>　<span class="tag ${esc(w.status)}">${esc(status[lang][w.status]||w.status)}</span></div>`;const rows=data.cases||[];$('cases').innerHTML=rows.length?rows.map(c=>`<div class="case"><strong>${esc(c.case_no)}</strong>　<span class="tag ${esc(c.status)}">${esc(status[lang][c.status]||c.status)}</span><div>${esc(c.issue)}</div><div class="muted">${date(c.opened_at)} · ${esc(c.platform_note)}</div></div>`).join(''):`<p class="muted">${t('empty')}</p>`;const active=w.status==='active';for(const id of ['issue','evidence','severity','confirmed','submit'])$(id).disabled=!active;if(!active)$('submit').textContent=t('inactive')}
async function load(){try{auth=credentials();if(!auth.request_no||!auth.token)throw new Error('LINK_CREDENTIALS_MISSING');data=await rpc('get_customer_warranty_with_token',{p_request_no:auth.request_no,p_token:auth.token});$('message').hidden=true;$('content').hidden=false;render()}catch(e){$('message').textContent=`${t('failed')}${e.message}`;$('message').className='card error'}}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};$('form').onsubmit=async e=>{e.preventDefault();try{if(!$('confirmed').checked)throw new Error('CUSTOMER_CONFIRMATION_REQUIRED');$('submit').disabled=true;const x=await rpc('submit_customer_after_sales_with_token',{p_request_no:auth.request_no,p_token:auth.token,p_issue:$('issue').value,p_evidence_note:$('evidence').value,p_severity:$('severity').value,p_customer_confirmed:true});alert(t('success')+x.case_no);$('form').reset();await load()}catch(e){alert(t('failed')+e.message)}finally{$('submit').disabled=false}};applyLang();load();
</script></body></html>
