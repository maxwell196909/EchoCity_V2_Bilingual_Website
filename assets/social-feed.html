<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>动态广场 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back,.publish{border:0;border-radius:999px;padding:10px 14px;font-weight:900}.back{background:#fff}.publish{background:#111827;color:#fff}.list{display:grid;gap:10px}.item{background:#fff;border-radius:16px;padding:15px;box-shadow:0 6px 20px #0f172a0a}.head{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:900}.meta{font-size:12px;color:#94a3b8;margin-top:3px}.content{margin-top:12px;line-height:1.7;white-space:pre-wrap}.empty{text-align:center;padding:60px 20px;color:#94a3b8}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><h2>动态广场</h2><button class="publish" onclick="location.href='post-publish.html'">＋ 发布</button></div><section id="list" class="list"><div class="empty">正在读取动态……</div></section></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data:rows,error}=await db.from('social_posts').select('id,author_id,content,city,created_at').eq('status','published').eq('visibility','public').order('created_at',{ascending:false}).limit(100);if(error){list.innerHTML='<div class="empty">动态读取失败</div>';return}const ids=[...new Set((rows||[]).map(x=>x.author_id))];const {data:p}=ids.length?await db.from('profiles').select('id,display_name,avatar_url').in('id',ids):{data:[]};const pm=new Map((p||[]).map(x=>[x.id,x]));list.innerHTML=(rows||[]).length?(rows||[]).map(x=>{const u=pm.get(x.author_id)||{},name=u.display_name||'EchoCity 用户';return `<article class="item"><div class="head" onclick="location.href='creator-profile.html?id=${x.author_id}'"><div class="avatar">${u.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc(name.slice(0,1))}</div><div><div class="name">${esc(name)}</div><div class="meta">${x.city?'📍 '+esc(x.city)+' · ':''}${new Date(x.created_at).toLocaleString()}</div></div></div><div class="content">${esc(x.content)}</div></article>`}).join(''):'<div class="empty">还没有动态，发布第一条吧。</div>'}load();</script></body></html>
