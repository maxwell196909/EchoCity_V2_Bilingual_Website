<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>动态广场 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back,.publish{border:0;border-radius:999px;padding:10px 14px;font-weight:900}.back{background:#fff}.publish{background:#111827;color:#fff}.list{display:grid;gap:10px}.item{background:#fff;border-radius:16px;padding:15px;box-shadow:0 6px 20px #0f172a0a}.head{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:900}.meta{font-size:12px;color:#94a3b8;margin-top:3px}.content{margin-top:12px;line-height:1.7;white-space:pre-wrap}.actions{display:flex;gap:18px;margin-top:13px;padding-top:11px;border-top:1px solid #f1f5f9}.action{border:0;background:transparent;font-weight:800;color:#475569}.action.active{color:#ef4444}.comments{display:none;margin-top:12px;border-top:1px solid #f1f5f9;padding-top:10px}.comments.show{display:block}.comment{padding:8px 0;border-bottom:1px solid #f8fafc;line-height:1.5}.comment b{font-size:13px}.comment span{color:#475569}.composer{display:flex;gap:7px;margin-top:8px}.composer input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:999px;padding:10px 12px}.composer button{border:0;border-radius:999px;background:#111827;color:#fff;font-weight:900;padding:0 14px}.empty{text-align:center;padding:60px 20px;color:#94a3b8}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><h2>动态广场</h2><button class="publish" onclick="location.href='post-publish.html'">＋ 发布</button></div><section id="list" class="list"><div class="empty">正在读取动态……</div></section></main><script>const db=window.echoCitySupabase,list=document.getElementById('list');let me=null;function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:rows,error}=await db.from('social_posts').select('id,author_id,content,city,created_at').eq('status','published').eq('visibility','public').order('created_at',{ascending:false}).limit(100);if(error){list.innerHTML='<div class="empty">动态读取失败</div>';return}const ids=[...new Set((rows||[]).map(x=>x.author_id))],postIds=(rows||[]).map(x=>x.id);const [{data:p},{data:likes},{data:comments}]=await Promise.all([ids.length?db.from('profiles').select('id,display_name,avatar_url').in('id',ids):Promise.resolve({data:[]}),postIds.length?db.from('social_post_likes').select('post_id,user_id').in('post_id',postIds):Promise.resolve({data:[]}),postIds.length?db.from('social_post_comments').select('id,post_id,user_id,content,created_at').in('post_id',postIds).eq('status','published').order('created_at',{ascending:true}):Promise.resolve({data:[]})]);const pm=new Map((p||[]).map(x=>[x.id,x])),likeCount=new Map(),liked=new Set(),commentMap=new Map();(likes||[]).forEach(x=>{likeCount.set(x.post_id,(likeCount.get(x.post_id)||0)+1);if(me&&x.user_id===me.id)liked.add(x.post_id)});(comments||[]).forEach(x=>{if(!commentMap.has(x.post_id))commentMap.set(x.post_id,[]);commentMap.get(x.post_id).push(x)});const commentUsers=[...new Set((comments||[]).map(x=>x.user_id))];let cpm=new Map();if(commentUsers.length){const {data:cp}=await db.from('profiles').select('id,display_name').in('id',commentUsers);cpm=new Map((cp||[]).map(x=>[x.id,x]))}list.innerHTML=(rows||[]).length?(rows||[]).map(x=>{const u=pm.get(x.author_id)||{},name=u.display_name||'EchoCity 用户',cs=commentMap.get(x.id)||[];return `<article class="item" data-id="${x.id}"><div class="head" onclick="location.href='creator-profile.html?id=${x.author_id}'"><div class="avatar">${u.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc(name.slice(0,1))}</div><div><div class="name">${esc(name)}</div><div class="meta">${x.city?'📍 '+esc(x.city)+' · ':''}${new Date(x.created_at).toLocaleString()}</div></div></div><div class="content">${esc(x.content)}</div><div class="actions"><button class="action like ${liked.has(x.id)?'active':''}" onclick="toggleLike('${x.id}')">♥ <span>${likeCount.get(x.id)||0}</span></button><button class="action" onclick="toggleComments('${x.id}')">💬 <span>${cs.length}</span></button></div><div id="comments-${x.id}" class="comments">${cs.map(c=>`<div class="comment"><b>${esc(cpm.get(c.user_id)?.display_name||'EchoCity 用户')}：</b><span>${esc(c.content)}</span></div>`).join('')||'<div class="meta">还没有评论</div>'}<div class="composer"><input id="input-${x.id}" maxlength="500" placeholder="写评论"><button onclick="sendComment('${x.id}')">发送</button></div></div></article>`}).join(''):'<div class="empty">还没有动态，发布第一条吧。</div>'}window.toggleComments=id=>document.getElementById('comments-'+id)?.classList.toggle('show');window.toggleLike=async id=>{if(!me){location.href='video-auth.html?return='+encodeURIComponent('social-feed.html');return}const {data}=await db.from('social_post_likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(data)await db.from('social_post_likes').delete().eq('post_id',id).eq('user_id',me.id);else{const {error}=await db.from('social_post_likes').insert({post_id:id,user_id:me.id});if(error)return alert('点赞失败：'+error.message)}load()};window.sendComment=async id=>{if(!me){location.href='video-auth.html?return='+encodeURIComponent('social-feed.html');return}const input=document.getElementById('input-'+id),text=input.value.trim();if(!text)return;const {error}=await db.from('social_post_comments').insert({post_id:id,user_id:me.id,content:text});if(error)return alert('评论失败：'+error.message);input.value='';await load();document.getElementById('comments-'+id)?.classList.add('show')};load();</script></body></html>
