<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阶段验收 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(760px,calc(100% - 22px));margin:auto;padding:16px 0 42px}.hero,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.hero{padding:20px;background:linear-gradient(135deg,#312e81,#2563eb);color:#fff}.hero a{color:#fff}.card{margin-top:14px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:12px;border-radius:11px;background:#f8fafc}.label{font-size:12px;color:#64748b;margin-bottom:5px}.value{white-space:pre-wrap;line-height:1.55}.textarea{width:100%;min-height:110px;margin-top:10px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{min-height:50px;border:0;border-radius:12px;font-weight:800;font-size:16px}.approve{background:#15803d;color:#fff}.rework{background:#b45309;color:#fff}.msg{margin-top:12px;padding:12px;border-radius:11px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.muted{color:#64748b;font-size:13px;line-height:1.6}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="hero"><a id="backLink" href="customer-order-progress.html">← 返回订单进度</a><h1>客户阶段验收</h1><p>查看本阶段完成情况，并选择通过或要求整改。</p></header><div id="message" class="card">正在读取阶段成果……</div><section id="content" hidden><div class="card"><h2>阶段成果</h2><div id="summary" class="grid"></div></div><div class="card"><h2>验收意见</h2><p class="muted">请根据现场实际情况填写。要求整改时必须说明问题。</p><textarea id="note" class="textarea" maxlength="2000" placeholder="填写验收意见或整改要求"></textarea><div class="actions"><button id="approve" class="btn approve">通过本阶段</button><button id="rework" class="btn rework">要求整改</button></div><div id="result"></div></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'未填写').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));const no=(q.get('request_no')||'').trim().toUpperCase();const incoming=(h.get('token')||q.get('token')||'').trim();if(incoming&&no)sessionStorage.setItem(`echocity-customer-token:${no}`,incoming);const token=incoming||sessionStorage.getItem(`echocity-customer-token:${no}`)||'';$('backLink').href=`customer-order-progress.html?request_no=${encodeURIComponent(no)}#token=${encodeURIComponent(token)}`;async function load(){try{if(!/^REQ-[A-Z0-9-]{4,80}$/.test(no)||token.length!==64)throw new Error('CUSTOMER_LINK_REQUIRED');const {data,error}=await window.echoCitySupabase.rpc('get_customer_milestone_with_token',{p_request_no:no,p_token:token});if(error)throw error;if(data.status!=='milestone_submitted')throw new Error('MILESTONE_NOT_READY');$('summary').innerHTML=[['订单号',data.request_no],['阶段',`第 ${data.sequence_no||'-'} 阶段`],['服务类型',data.service_type],['阶段状态',data.inspection_status],['完成情况',data.latest_work_progress],['遗留问题',data.latest_issues_found],['证据文件',`${data.evidence_count||0} 个`],['提交时间',data.submitted_at?new Date(data.submitted_at).toLocaleString('zh-CN'):'未填写']].map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('');$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').textContent=String(e?.message||e).includes('MILESTONE_NOT_READY')?'当前阶段还没有进入客户验收。':'无法读取阶段成果，请使用平台发送的客户订单专链。';$('message').className='card error'}}async function submit(accept){const note=$('note').value.trim();if(!accept&&!note){$('result').className='msg error';$('result').textContent='要求整改时请填写具体问题。';return}for(const id of ['approve','rework'])$(id).disabled=true;try{const {data,error}=await window.echoCitySupabase.rpc('review_milestone_with_token',{p_request_no:no,p_token:token,p_accept:accept,p_note:note});if(error)throw error;$('result').className='msg ok';$('result').textContent=accept?'阶段验收已通过，订单将进入平台复核。':'整改要求已提交，订单已退回服务人员整改。';setTimeout(()=>location.href=`customer-order-progress.html?request_no=${encodeURIComponent(no)}#token=${encodeURIComponent(token)}`,700)}catch(e){$('result').className='msg error';$('result').textContent='提交失败：'+(e?.message||'请稍后重试')}finally{for(const id of ['approve','rework'])$(id).disabled=false}}$('approve').onclick=()=>submit(true);$('rework').onclick=()=>submit(false);load();</script></body></html>
