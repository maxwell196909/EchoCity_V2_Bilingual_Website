<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>服务人员入驻 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 42px}.hero,.card{background:#fff;border:1px solid #bbf7d0;border-radius:20px}.hero{padding:22px;background:linear-gradient(135deg,#064e3b,#059669);color:#fff}.hero h1{margin:7px 0 8px}.card{padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #a7f3d0;border-radius:12px;font-size:15px}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.skill{display:flex;gap:8px;align-items:center;padding:11px;border:1px solid #d1fae5;border-radius:12px;background:#f8fffb}.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:#059669;color:#fff;font-weight:900;font-size:15px}.muted{color:#64748b;line-height:1.6;font-size:13px}.status{padding:12px;border-radius:12px;background:#f8fafc;margin-top:12px;line-height:1.6}.ok{background:#ecfdf5;color:#047857}.warn{background:#fff7ed;color:#9a3412}.login{display:none}.toolbar{display:flex;gap:10px;margin-top:12px}.toolbar button{flex:1;min-height:44px;border:1px solid #a7f3d0;border-radius:12px;background:#fff;font-weight:800}@media(max-width:620px){.grid,.skills{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div>EchoCity · 服务人员</div><h1>申请成为服务人员</h1><p>填写城市、技能和服务半径。提交后由平台审核；审核通过后才会进入可派单供给池。</p></section><section id="loginCard" class="card login"><h2>先登录 EchoCity</h2><p class="muted">服务人员档案与本人账号绑定。输入邮箱获取登录链接。</p><div class="field"><label>邮箱</label><input id="email" type="email" placeholder="name@example.com"></div><button class="btn" id="sendLink">发送登录链接</button><div id="loginStatus" class="status" style="display:none"></div></section><section id="formCard" class="card" style="display:none"><h2>我的服务人员资料</h2><div id="currentStatus" class="status">读取中…</div><div class="grid" style="margin-top:14px"><div class="field"><label>姓名</label><input id="fullName" maxlength="80" placeholder="请输入姓名"></div><div class="field"><label>手机</label><input id="phone" maxlength="30" placeholder="请输入手机号码"></div><div class="field"><label>所在城市</label><input id="city" maxlength="80" placeholder="例如：广州"></div><div class="field"><label>服务半径（公里）</label><input id="radius" type="number" min="1" max="300" value="20"></div></div><div class="field"><label>可提供的服务</label><div class="skills"><label class="skill"><input type="checkbox" value="repair">维修 / 清洁</label><label class="skill"><input type="checkbox" value="general_service">综合服务</label><label class="skill"><input type="checkbox" value="workers">临时人手</label><label class="skill"><input type="checkbox" value="support">生活帮助</label><label class="skill"><input type="checkbox" value="installation">安装调试</label><label class="skill"><input type="checkbox" value="engineering_service">工程服务</label></div></div><p class="muted">平台会核验身份、电话、安全要求和技能。未经审核的技能不会进入自动派单池。</p><button class="btn" id="save">提交 / 更新申请</button><div class="toolbar"><button id="refresh">刷新状态</button><button id="signOut">退出登录</button></div><div id="saveStatus" class="status" style="display:none"></div></section></main><script>const db=window.echoCitySupabase;let me=null;const $=id=>document.getElementById(id);function show(el,msg,cls=''){el.style.display='block';el.className='status '+cls;el.textContent=msg}async function init(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){$('loginCard').style.display='block';$('formCard').style.display='none';return}$('loginCard').style.display='none';$('formCard').style.display='block';await load()}async function load(){const {data,error}=await db.rpc('get_my_worker_onboarding_v1');if(error){show($('currentStatus'),'读取失败：'+error.message,'warn');return}const p=data?.profile||{},w=data?.worker||{},s=data?.supply_profile||{};$('fullName').value=w.full_name||p.display_name||'';$('phone').value=w.phone||p.phone||'';$('city').value=w.city||p.city||'';$('radius').value=s.service_radius_km||20;const set=new Set([...(w.skills||[]),...((data?.skills||[]).map(x=>x.skill_code))]);document.querySelectorAll('.skills input').forEach(x=>x.checked=set.has(x.value));let text='尚未提交申请';let cls='';if(w){if(w.verification_status==='verified') {text='已通过平台审核 · '+(w.availability_status==='available'?'当前可接单':'当前不可接单');cls='ok'} else if(w.verification_status==='rejected'){text='审核未通过，可修改资料后重新提交';cls='warn'} else{text='已提交平台审核，当前不会进入自动派单池';cls='warn'}}show($('currentStatus'),text,cls)}$('sendLink').onclick=async()=>{const email=$('email').value.trim();if(!email)return show($('loginStatus'),'请输入邮箱','warn');const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)return show($('loginStatus'),'发送失败：'+error.message,'warn');show($('loginStatus'),'登录链接已发送，请打开邮箱完成登录。','ok')};$('save').onclick=async()=>{const skills=[...document.querySelectorAll('.skills input:checked')].map(x=>x.value);$('save').disabled=true;const {data,error}=await db.rpc('save_my_worker_onboarding_v1',{p_full_name:$('fullName').value.trim(),p_phone:$('phone').value.trim(),p_city:$('city').value.trim(),p_skills:skills,p_service_radius_km:Number($('radius').value||20)});$('save').disabled=false;if(error)return show($('saveStatus'),'提交失败：'+error.message,'warn');show($('saveStatus'),data?.message||'申请已提交平台审核','ok');await load()};$('refresh').onclick=load;$('signOut').onclick=async()=>{await db.auth.signOut();location.reload()};init();</script></body></html>
