<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>视频审核状态 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js?v=76"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900}.light{background:#fff;color:#172033}.primary{background:#2563eb;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px #0f172a10}.media{width:100%;aspect-ratio:16/9;background:#111;border-radius:14px;overflow:hidden;margin-bottom:14px}.media video{width:100%;height:100%;object-fit:contain;background:#000}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:20px;font-weight:900}.meta{color:#64748b;font-size:13px;margin-top:5px;line-height:1.5}.badge{display:inline-block;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}.reviewing{background:#fff7ed;color:#c2410c}.published{background:#ecfdf5;color:#047857}.rejected{background:#fff1f2;color:#be123c}.hidden{background:#f1f5f9;color:#475569}.draft{background:#eff6ff;color:#1d4ed8}.desc{margin-top:12px;line-height:1.6;color:#334155}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.empty{text-align:center;color:#94a3b8;padding:55px 20px}.section{font-weight:900;margin:20px 2px 10px}.mini{padding:13px 14px}.mini .title{font-size:16px}@media(max-width:520px){.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="btn light" onclick="goHome()">← 首页</button><strong>审核状态</strong><button class="btn primary" onclick="location.href='video-publish-v3.html'">＋ 发布</button></div><section id="focus"></section><div class="section">我的最近视频</div><section id="list"><div class="empty">正在读取审核状态……</div></section></main><script>const db=window.echoCitySupabase,focus=document.getElementById('focus'),list=document.getElementById('list'),targetId=new URLSearchParams(location.search).get('video_id');let me=null;function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function statusText(s){return ({reviewing:'审核中',published:'审核通过 · 已发布',rejected:'审核未通过',hidden:'已隐藏',draft:'草稿'})[s]||s}function statusClass(s){return ['reviewing','published','rejected','hidden','draft'].includes(s)?s:'hidden'}function card(v,large=false){return `<article class="card ${large?'focus-card':'mini'}">${large?`<div class="media"><video controls playsinline preload="metadata" src="${esc(v.video_url)}"></video></div>`:''}<div class="row"><div><div class="title">${esc(v.title||'未命名视频')}</div><div class="meta">${v.city?'📍 '+esc(v.city)+' · ':''}${new Date(v.created_at).toLocaleString()}</div></div><span class="badge ${statusClass(v.status)}">${esc(statusText(v.status))}</span></div>${large&&v.description?`<div class="desc">${esc(v.description)}</div>`:''}${large?`<div class="actions"><button class="btn light" onclick="location.reload()">刷新状态</button>${v.status==='published'?`<button class="btn primary" onclick="openVideo('${v.id}')">查看视频</button>`:`<button class="btn primary" onclick="location.href='video-publish-v3.html'">继续发布</button>`}</div>`:''}</article>`}async function init(){const {data:u}=await db.auth.getUser();me=u?.user||null;if(!me){location.href='video-auth.html?return='+encodeURIComponent('video-review-status.html'+(targetId?'?video_id='+targetId:''));return}await load()}async function load(){const {data:rows,error}=await db.from('videos').select('id,title,description,video_url,city,status,created_at,published_at').eq('author_id',me.id).order('created_at',{ascending:false}).limit(30);if(error){list.innerHTML='<div class="empty">审核状态读取失败</div>';return}const all=rows||[];const hit=targetId?all.find(x=>x.id===targetId):all[0];focus.innerHTML=hit?card(hit,true):'';list.innerHTML=all.length?all.map(x=>card(x,false)).join(''):'<div class="empty">还没有发布过视频。</div>'}function goHome(){try{if(window.top&&window.top!==window.self){window.top.location.href='../app.html?v=76';return}}catch(e){}location.href='../app.html?v=76'}function openVideo(id){try{if(window.top&&window.top!==window.self){window.top.location.href='../app.html?v=76#video='+id;return}}catch(e){}location.href='video-feed-v4.html?video='+id}init();setInterval(()=>{if(document.visibilityState==='visible'&&me)load()},10000);</script></body></html>
