<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台阶段审核 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef4fb;font-family:Arial,"Microsoft YaHei",sans-serif;color:#17263b}.page{width:min(760px,calc(100% - 24px));margin:auto;padding:22px 0}.card{background:#fff;border:1px solid #d8e1ec;border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 12px 28px #24364d12}.row{padding:12px;background:#f5f8fc;border-radius:11px;margin-top:10px}.label{font-size:12px;color:#64748b}.value{margin-top:5px;white-space:pre-wrap}.note{width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:11px;padding:12px;font:inherit}.actions{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:11px;padding:13px;font-weight:800;background:#126b4b;color:#fff}.finish{background:#1556a3}.rework{background:#a52a2a}.message{margin-top:12px;line-height:1.6}.back{color:#1556a3;text-decoration:none;font-weight:700}</style></head><body><main class="page"><a class="back" href="admin-service-requests.html">← 返回订单管理</a><section class="card"><h1>平台阶段审核</h1><p>核对客户验收结果和施工记录，选择下一步。</p><div class="row"><div class="label">订单号</div><div id="requestNo" class="value">读取中……</div></div><div class="row"><div class="label">施工进度</div><div id="progress" class="value">—</div></div><div class="row"><div class="label">发现问题</div><div id="issues" class="value">—</div></div><div class="row"><div class="label">客户意见</div><div id="customerNote" class="value">—</div></div><div class="row"><div class="label">阶段证据数量</div><div id="evidence" class="value">—</div></div></section><section class="card"><label><strong>平台审核意见</strong></label><textarea id="note" class="note" placeholder="填写审核意见；退回整改时必填"></textarea><div class="actions"><button onclick="submitReview('continue')">审核通过，继续施工</button><button class="finish" onclick="submitReview('finish')">审核通过，进入最终验收</button><button class="rework" onclick="submitReview('rework')">退回工人整改</button></div><div id="message" class="message"></div></section></main><script>let requestNo="",token="";const $=id=>document.getElementById(id);async function load(){const p=new URLSearchParams(location.search);requestNo=p.get("request_no")||"";const incoming=p.get("platform_token");if(incoming){sessionStorage.setItem("echocity-platform-token",incoming);p.delete("platform_token");history.replaceState(null,"",`${location.pathname}?${p}`)}token=incoming||sessionStorage.getItem("echocity-platform-token")||"";const {data,error}=await window.echoCitySupabase.rpc("get_platform_milestone_with_token",{p_request_no:requestNo,p_token:token});if(error){$("message").textContent="读取失败，请重新从平台订单列表进入。";return}$("requestNo").textContent=data.request_no;$("progress").textContent=data.latest_work_progress||"未填写";$("issues").textContent=data.latest_issues_found||"无";$("customerNote").textContent=data.customer_note||"客户未填写意见";$("evidence").textContent=String(data.evidence_count||0)}async function submitReview(decision){const note=$("note").value.trim();if(decision==="rework"&&!note){$("message").textContent="退回整改时必须填写原因。";return}document.querySelectorAll("button").forEach(b=>b.disabled=true);const {data,error}=await window.echoCitySupabase.rpc("review_platform_milestone_with_token",{p_request_no:requestNo,p_token:token,p_decision:decision,p_note:note});if(error){$("message").textContent="审核提交失败，请刷新后重试。";document.querySelectorAll("button").forEach(b=>b.disabled=false);return}$("message").textContent=data.status==="awaiting_final_acceptance"?"审核完成：订单已进入客户最终验收。":data.status==="in_progress"?"审核完成：工人可以继续施工。":"已退回工人整改。"}load();</script></body></html>
