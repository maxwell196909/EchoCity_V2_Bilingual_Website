<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>创作者中心 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}.wrap{max-width:860px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 36px}.top{display:flex;justify-content:space-between;align-items:center}.back,.publish{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.back{background:#fff}.publish{background:#111827;color:#fff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.card{background:#fff;border-radius:16px;padding:16px}.card b{font-size:24px;display:block}.card span{color:#64748b;font-size:12px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{background:#fff;border-radius:14px;padding:16px;font-weight:800}.section{margin-top:22px}.section h2{font-size:18px}.empty{background:#fff;border-radius:14px;padding:30px;text-align:center;color:#94a3b8}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">← 返回</button><button class="publish" onclick="location.href='video-publish.html'">＋ 发布作品</button></div><h1>创作者中心</h1><div class="cards"><div class="card"><b id="works">0</b><span>作品</span></div><div class="card"><b id="followers">0</b><span>粉丝</span></div><div class="card"><b id="likes">0</b><span>累计获赞</span></div><div class="card"><b id="conversions">0</b><span>服务转化</span></div></div><div class="tools"><div class="tool" onclick="location.href='video-publish.html'">内容发布</div><div class="tool" onclick="location.href='video-library.html'">收藏/历史</div><div class="tool" onclick="location.href='admin-video-review.html'">内容审核</div><div class="tool" onclick="location.href='my-home.html'">账号与业务</div></div><section class="section"><h2>近期数据</h2><div id="daily" class="empty">暂无数据汇总</div></section></main><script>const db=window.echoCitySupabase;async function load(){const {data:u}=await db.auth.getUser();const me=u?.user;if(!me){daily.textContent='登录后查看创作者数据';return}const [{data:s},{data:c},{data:m}]=await Promise.all([db.rpc('get_creator_social_stats',{p_creator_id:me.id}),db.from('video_conversions').select('id',{count:'exact',head:true}).in('conversion_type',['service_click','request_created']).in('video_id',(await db.from('videos').select('id').eq('author_id',me.id)).data?.map(x=>x.id)||[]),db.from('creator_daily_metrics').select('*').eq('creator_id',me.id).order('metric_date',{ascending:false}).limit(7)]);const st=Array.isArray(s)?s[0]:s;if(st){works.textContent=st.video_count||0;followers.textContent=st.follower_count||0;likes.textContent=st.total_likes||0}conversions.textContent=c||0;if(m?.length){daily.innerHTML=m.map(x=>`<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px"><b>${x.metric_date}</b><div style="color:#64748b;font-size:13px;margin-top:6px">曝光 ${x.impressions} · 完播 ${x.completed_views} · 点赞 ${x.likes} · 评论 ${x.comments} · 服务点击 ${x.service_clicks} · 需求 ${x.requests_created}</div></div>`).join('')}}load();</script></body></html>
