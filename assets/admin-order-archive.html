<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单归档 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(900px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.top,.card{border:1px solid #dbe3ee;border-radius:18px;background:#fff}.top{padding:20px;background:linear-gradient(135deg,#0f2747,#2563eb);color:#fff}.top a{color:#fff}.card{margin-top:13px;padding:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:11px;border-radius:11px;background:#f8fafc}.label,small{font-size:12px;color:#64748b}.timeline{border-left:3px solid #bfdbfe;margin-left:8px;padding-left:18px}.event{padding:0 0 18px}.error{color:#991b1b;background:#fee2e2}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="top"><a href="admin-service-requests.html">← 返回订单管理</a><h1>订单归档详情</h1><div>只读查看订单全过程记录</div></header><div id="message" class="card">正在读取归档……</div><section id="content" hidden><div id="summary" class="card grid"></div><div class="card"><h2>完整时间轴</h2><div id="timeline" class="timeline"></div></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'未填写').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=v=>v?new Date(v).toLocaleString('zh-CN'):'未填写';function token(){const p=new URLSearchParams(location.search),x=p.get('platform_token');if(x)sessionStorage.setItem('echocity-platform-token',x);return x||sessionStorage.getItem('echocity-platform-token')||''}async function load(){try{const no=new URLSearchParams(location.search).get('request_no'),r=await window.echoCitySupabase.rpc('get_platform_archive_timeline_with_token',{p_request_no:no,p_token:token()});if(r.error)throw r.error;const d=r.data,q=d.request||{};$('summary').innerHTML=[['订单号',q.request_no],['状态',q.status],['客户',q.customer_name],['服务人员',q.assigned_worker],['报价',q.quote_amount],['服务日期',q.service_date],['地址',q.address],['需求说明',q.description],['结算金额',d.settlement?.final_amount],['客户评分',d.rating?.rating]].map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div>${esc(x[1])}</div></div>`).join('');const ev=[...(d.events||[]),...(d.inspections||[]).map(i=>({action:`${i.type} 验收`,to_status:i.result,note:i.review_note,created_at:i.created_at}))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));$('timeline').innerHTML=ev.map(e=>`<div class="event"><strong>${esc(e.action||e.event_type)} · ${esc(e.to_status)}</strong><br><small>${esc(dt(e.created_at))}</small><div>${esc(e.note||'')}</div></div>`).join('');$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').textContent='归档读取失败或平台链接已失效。';$('message').className='card error'}}load();</script></body></html>
