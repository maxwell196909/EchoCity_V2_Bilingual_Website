<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直播间 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#05070a;color:#fff}.wrap{max-width:760px;margin:auto;min-height:100vh}.player{aspect-ratio:9/16;max-height:68vh;background:radial-gradient(circle at 50% 35%,#1e293b,#05070a);display:grid;place-items:center;position:relative}.player video{width:100%;height:100%;object-fit:contain;background:#000}.back{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;border:0;background:#0008;color:#fff;border-radius:999px;padding:9px 12px}.live{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:#ef4444;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.viewers{position:absolute;top:calc(52px + env(safe-area-inset-top));right:12px;background:#0009;padding:6px 9px;border-radius:999px;font-size:11px}.info{padding:14px}.hostline{display:flex;align-items:center;justify-content:space-between;gap:10px}.host{color:#cbd5e1;font-size:13px}.follow{border:0;border-radius:999px;background:#ef4444;color:#fff;padding:8px 13px;font-weight:900}.follow.on{background:#334155}.title{font-size:21px;font-weight:900;margin:7px 0}.service{display:flex;gap:8px;margin:10px 0}.service button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}.ai{background:#2563eb;color:#fff}.order{background:#fff;color:#111}.room-actions,.hosttools{display:flex;gap:8px;margin:10px 0}.room-actions button,.hosttools button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800}.room-actions button{background:#1f2937;color:#fff}.hosttools button{background:#e5e7eb;color:#111}.comments{background:#0b0d12;border-top:1px solid #1f2937;padding:12px;max-height:300px;overflow:auto}.comment{padding:8px 0;border-bottom:1px solid #1f2937;font-size:14px;display:flex;gap:8px;align-items:flex-start}.comment-main{flex:1}.comment b{color:#93c5fd}.comment-tools{display:flex;gap:5px}.mini{border:0;border-radius:999px;background:#1f2937;color:#fff;padding:4px 8px;font-size:11px}.danger{background:#7f1d1d}.send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#05070a}.send input{flex:1;border:1px solid #334155;background:#111827;color:#fff;border-radius:999px;padding:12px 14px}.send button{border:0;border-radius:999px;background:#ef4444;color:#fff;padding:0 18px;font-weight:900}.muted{color:#94a3b8}</style></head><body><main class="wrap"><section id="player" class="player"><button class="back" onclick="history.back()">←</button><span id="liveBadge" class="live">LIVE</span><span id="viewerBadge" class="viewers">👁 0 · 峰值 0</span><div id="screen" class="muted">直播画面接入区</div></section><section class="info"><div class="hostline"><div id="host" class="host">主播</div><button id="followBtn" class="follow">关注</button></div><div id="title" class="title">直播间</div><div id="desc" class="muted"></div><div id="service" class="service" hidden><button class="ai" id="aiBtn">问 AI</button><button class="order" id="orderBtn">我要同类服务</button></div><div class="room-actions"><button id="profileBtn">主播主页</button><button id="reportBtn">举报直播</button></div><div id="hosttools" class="hosttools" hidden><button id="startBtn">开始直播</button><button id="endBtn">结束直播</button></div></section><section id="comments" class="comments"><div class="muted">读取评论中……</div></section><div class="send"><input id="commentInput" maxlength="500" placeholder="说点什么…"><button id="sendBtn">发送</button></div></main><script>const db=window.echoCitySupabase,roomId=new URLSearchParams(location.search).get('id');let me=null,room=null,serviceLink=null,profile=null,channel=null,presenceTimer=null;let sid=sessionStorage.getItem('live-session');if(!sid){sid=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random();sessionStorage.setItem('live-session',sid)}function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderViewer(c,p){viewerBadge.textContent=`👁 ${c||0} · 峰值 ${p||0}`}async function presence(action='heartbeat'){if(!roomId||room?.status!=='live')return;try{const {data}=await db.rpc('record_live_presence_v1',{p_room_id:roomId,p_session_id:sid,p_action:action});const x=Array.isArray(data)?data[0]:data;if(x)renderViewer(x.viewer_count,x.peak_viewers)}catch(e){}}async function loadRoom(){if(!roomId)return;const {data:u}=await db.auth.getUser();me=u?.user||null;const {data:r,error}=await db.from('live_rooms').select('*').eq('id',roomId).maybeSingle();if(error||!r){screen.textContent='直播间不存在或不可访问';return}room=r;title.textContent=r.title;desc.textContent=[r.city,r.location_text,r.description].filter(Boolean).join(' · ');liveBadge.textContent=r.status==='live'?'LIVE':r.status==='ended'?'已结束':'待开播';renderViewer(r.viewer_count,r.peak_viewers);if(r.playback_url){screen.innerHTML=`<video src="${esc(r.playback_url)}" controls autoplay playsinline></video>`}else{screen.textContent=r.status==='live'?'直播已开始，等待接入视频流':'直播尚未开始'}const {data:p}=await db.rpc('get_public_profile_v1',{p_user_id:r.host_id});profile=Array.isArray(p)?p[0]:p;if(profile?.can_view){host.innerHTML='主播：'+esc(profile.display_name||'EchoCity 用户')+(profile.verification_badge?' · <span style="color:#60a5fa">✓ '+esc(profile.verification_badge)+'</span>':'')}profileBtn.onclick=()=>location.href='creator-profile.html?id='+r.host_id;reportBtn.onclick=()=>location.href='report-content.html?target_type=live_room&target_id='+roomId;const {data:s}=await db.from('live_service_links').select('*').eq('room_id',roomId).eq('is_active',true).limit(1).maybeSingle();serviceLink=s||null;if(serviceLink)service.hidden=false;if(me?.id===r.host_id){hosttools.hidden=false;followBtn.hidden=true}else await refreshFollow();await loadComments();subscribeRealtime();if(r.status==='live'){await presence('enter');startPresence()}else stopPresence()}async function refreshFollow(){if(!me){followBtn.textContent='登录后关注';return}const {data:f}=await db.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',room.host_id).maybeSingle();followBtn.dataset.on=f?'1':'0';followBtn.textContent=f?'已关注':'关注';followBtn.classList.toggle('on',!!f)}followBtn.onclick=async()=>{if(!me)return alert('请先登录');const on=followBtn.dataset.on==='1';if(on)await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',room.host_id);else{const {error}=await db.from('follows').insert({follower_id:me.id,following_id:room.host_id});if(error)return alert(error.message)}refreshFollow()};async function loadComments(){const {data:c}=await db.from('live_comments').select('id,user_id,content,created_at').eq('room_id',roomId).eq('status','published').order('created_at',{ascending:true}).limit(200);const ids=[...new Set((c||[]).map(x=>x.user_id))],names={};for(const id of ids){const {data:p}=await db.rpc('get_public_profile_v1',{p_user_id:id});const pr=Array.isArray(p)?p[0]:p;if(pr?.can_view)names[id]=pr.display_name||'用户'}comments.innerHTML=(c||[]).length?(c||[]).map(x=>`<div class="comment"><div class="comment-main"><b>${esc(names[x.user_id]||'用户')}</b> ${esc(x.content)}</div><div class="comment-tools">${me&&x.user_id!==me.id?`<button class="mini" onclick="reportComment('${x.id}')">举报</button>`:''}${me?.id===room?.host_id&&x.user_id!==me.id?`<button class="mini danger" onclick="muteUser('${x.user_id}')">禁言</button><button class="mini danger" onclick="removeComment('${x.id}')">删除</button>`:''}</div></div>`).join(''):'<div class="muted">还没有评论</div>';comments.scrollTop=comments.scrollHeight}async function reportComment(id){if(!me)return alert('请先登录');location.href='report-content.html?target_type=live_comment&target_id='+encodeURIComponent(id)+'&room_id='+encodeURIComponent(roomId)}async function removeComment(id){if(!confirm('确认删除这条直播评论？'))return;const {error}=await db.rpc('moderate_live_comment_v1',{p_room_id:roomId,p_comment_id:id,p_action:'remove'});if(error)return alert('删除失败：'+error.message);loadComments()}async function muteUser(uid){if(!confirm('禁言该用户 60 分钟？'))return;const {error}=await db.rpc('set_live_mute_v1',{p_room_id:roomId,p_user_id:uid,p_muted:true,p_reason:'host_moderation',p_minutes:60});if(error)return alert('禁言失败：'+error.message);alert('已禁言 60 分钟')}function subscribeRealtime(){if(channel)return;channel=db.channel('live-room-'+roomId).on('postgres_changes',{event:'*',schema:'public',table:'live_comments',filter:'room_id=eq.'+roomId},()=>loadComments()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_rooms',filter:'id=eq.'+roomId},payload=>{if(payload?.new){room={...room,...payload.new};liveBadge.textContent=room.status==='live'?'LIVE':room.status==='ended'?'已结束':'待开播';renderViewer(room.viewer_count,room.peak_viewers);if(room.status!=='live')stopPresence()}}).subscribe()}function startPresence(){if(presenceTimer)return;presenceTimer=setInterval(()=>presence('heartbeat'),15000)}function stopPresence(){if(presenceTimer){clearInterval(presenceTimer);presenceTimer=null}}async function record(type){try{await db.from('live_view_events').insert({room_id:roomId,user_id:me?.id||null,session_id:sid,event_type:type})}catch(e){}}sendBtn.onclick=async()=>{if(!me)return alert('请先登录');const text=commentInput.value.trim();if(!text)return;const {error}=await db.rpc('post_live_comment_v1',{p_room_id:roomId,p_content:text});if(error)return alert((error.message||'').includes('LIVE_MUTED')?'你已被本直播间禁言。':error.message);commentInput.value=''};startBtn.onclick=async()=>{const providers=await db.from('live_provider_configs').select('provider_code,display_name').eq('enabled',true);const label=(providers.data||[]).map(x=>x.display_name).join(' / ')||'手工播放地址';const url=prompt('当前可用：'+label+'。填写直播播放地址；正式接云直播后由服务端自动生成。')||null;const {error}=await db.rpc('set_live_room_status_v1',{p_room_id:roomId,p_action:'start',p_playback_url:url,p_stream_provider:url?'manual':'pending'});if(error)return alert(error.message);await loadRoom();record('start')};endBtn.onclick=async()=>{if(!confirm('确认结束直播？'))return;await presence('leave');const {error}=await db.rpc('set_live_room_status_v1',{p_room_id:roomId,p_action:'end',p_playback_url:null,p_stream_provider:null});if(error)return alert(error.message);await loadRoom();record('end')};aiBtn.onclick=()=>{record('ai_consult');location.href='customer-role-home.html?source=live&live_room_id='+roomId+'&intent=ai_consult'};orderBtn.onclick=()=>{record('service_click');const st=serviceLink?.service_type||'';location.href='customer-role-home.html?source=live&live_room_id='+roomId+'&service_type='+encodeURIComponent(st)};loadRoom();window.addEventListener('pagehide',()=>{stopPresence();try{db.rpc('record_live_presence_v1',{p_room_id:roomId,p_session_id:sid,p_action:'leave'})}catch(e){}if(channel)db.removeChannel(channel)});</script></body></html>
