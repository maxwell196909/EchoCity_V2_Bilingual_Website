<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案审批与版本中心 | EchoCity</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(1120px,calc(100% - 22px));margin:auto;padding:14px 0 40px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#1e293b,#4f46e5)}.hero a{color:#fff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.metric,.plan{padding:16px;background:#fff;border:1px solid #dbe3ee;border-radius:16px}.number{font-size:28px;font-weight:900;color:#4f46e5}.label,.muted{color:#64748b}.list{display:grid;gap:12px}.plan{display:grid;grid-template-columns:1fr 2fr auto;gap:15px;align-items:start}.order{font-weight:900;color:#1d4ed8}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.tag{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.approved,.customer_confirmed,.ready{background:#dcfce7;color:#166534}.pending,.blocked{background:#fef3c7;color:#92400e}.content{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:9px;border-radius:10px;background:#f8fafc}.item strong{display:block;margin-bottom:4px}.btn{display:inline-block;padding:10px 12px;border-radius:10px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:900}.message{padding:15px;margin-top:14px;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.error{background:#fee2e2;color:#991b1b}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.plan{grid-template-columns:1fr}.content{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="hero"><a href="admin-operations-overview.html">← 返回运营驾驶舱</a><h1>方案审批与版本中心</h1><p>只对当前有效版本进行审批，历史版本保留但不得重新执行</p></header><div id="message" class="message">正在读取方案版本……</div><section id="content" hidden><div id="metrics" class="metrics"></div><div id="plans" class="list"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://dpljvspwcfglxfesxdmf.supabase.co',SUPABASE_KEY='sb_publishable_CngX8tJBl6eGAJUWTSt9HA_KtxTvM1-';
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.message||p?.hint||`API ${r.status}`);return p}
function token(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),x=q.get('platform_token')||h.get('platform_token');if(x){localStorage.setItem('echocity-platform-token',x);sessionStorage.setItem('echocity-platform-token',x)}return x||localStorage.getItem('echocity-platform-token')||sessionStorage.getItem('echocity-platform-token')||''}
const statusText={draft:'草稿',submitted:'待审核',under_review:'审核中',approved:'平台已批准',customer_confirmed:'客户已确认',returned:'已退回',superseded:'历史版本'};
function field(c,...keys){for(const k of keys)if(c?.[k])return c[k];return '未填写'}
async function load(){try{const platformToken=token();if(!platformToken)throw new Error('链接缺少平台访问凭证');const d=await rpc('get_platform_plan_center_with_token',{p_token:platformToken}),s=d.summary||{};$('metrics').innerHTML=[['当前方案',s.current_plans],['真正待审核',s.pending_review],['平台已批准',s.approved],['开工条件齐备',s.prestart_ready],['批准后仍待条件',s.prestart_blocked],['历史版本',s.historical_versions]].map(x=>`<div class="metric"><div class="number">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const rows=d.plans||[];$('plans').innerHTML=rows.length?rows.map(p=>{const c=p.content||{};return `<article class="plan"><div><a class="order" href="admin-order-360.html?request_no=${encodeURIComponent(p.request_no)}">${esc(p.request_no)}</a><div>当前版本 V${esc(p.version)}</div><div class="tags"><span class="tag ${esc(p.status)}">${esc(statusText[p.status]||p.status)}</span><span class="tag ${p.prestart_ready?'ready':'blocked'}">${p.prestart_ready?'可进入开工检查':'开工条件未齐'}</span><span class="tag">历史 ${esc(p.history_count)} 版</span></div></div><div class="content"><div class="item"><strong>工作范围</strong>${esc(field(c,'scope','task_scope'))}</div><div class="item"><strong>方法/计划</strong>${esc(field(c,'method','planned_start'))}</div><div class="item"><strong>人机料资源</strong>${esc(field(c,'resources','assigned_worker'))}</div><div class="item"><strong>安全措施</strong>${esc(field(c,'safety'))}</div><div class="item"><strong>质量标准</strong>${esc(field(c,'quality_requirements'))}</div><div class="item"><strong>审核意见</strong>${esc(p.approval_note||p.review_note||'无')}</div></div><div><a class="btn" href="implementation-plan-workflow.html?request_no=${encodeURIComponent(p.request_no)}">查看方案工作流</a></div></article>`}).join(''):'<div class="message">暂无实施方案。</div>';$('message').hidden=true;$('content').hidden=false}catch(e){console.error(e);$('message').hidden=false;$('message').textContent=`方案数据读取失败：${e.message}`;$('message').className='message error'}}load();
</script></body></html>
