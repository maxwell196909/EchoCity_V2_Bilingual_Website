<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布动态 | EchoCity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/echocity-supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.back{border:0;border-radius:999px;background:#fff;padding:10px 14px;font-weight:800}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px #0f172a12}.card h1{margin:0 0 8px}.muted{color:#64748b;line-height:1.55}.field{margin-top:16px}.field label{display:block;font-weight:900;margin-bottom:7px}.field textarea,.field input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:13px;font:inherit}.field textarea{min-height:180px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;min-height:50px;border:0;border-radius:13px;font-weight:900}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.status{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#eff6ff;color:#1d4ed8}.status.show{display:block}.error{background:#fff1f2;color:#be123c}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='publish-center.html'">← 返回</button><strong>EchoCity 动态</strong></div><section class="card"><h1>发布动态</h1><p class="muted">可发布现场记录、城市观察、问题线索或观点。公开动态会出现在“动态广场”。</p><div class="field"><label>内容</label><textarea id="content" maxlength="2000" placeholder="说说你看到了什么、发生了什么，或者你希望大家关注什么……"></textarea></div><div class="field"><label>城市（可选）</label><input id="city" maxlength="50" placeholder="例如：广州"></div><div class="actions"><button id="draft" class="btn secondary">保存草稿</button><button id="publish" class="btn primary">发布</button></div><div id="status" class="status"></div></section></main><script>const db=window.echoCitySupabase,$=id=>document.getElementById(id);let me=null;function show(t,e=false){$('status').textContent=t;$('status').className='status show'+(e?' error':'')}async function ensureUser(){const {data}=await db.auth.getUser();me=data?.user||null;if(!me){location.href='video-auth.html?return='+encodeURIComponent('post-publish.html');return false}return true}async function submit(status){if(!me&&!(await ensureUser()))return;const content=$('content').value.trim();if(!content)return show('请先填写内容。',true);$('draft').disabled=$('publish').disabled=true;try{const {error}=await db.from('social_posts').insert({author_id:me.id,content,city:$('city').value.trim()||null,status,visibility:'public'});if(error)throw error;show(status==='published'?'发布成功。':'草稿已保存。');setTimeout(()=>location.href=status==='published'?'social-feed.html':'me.html',650)}catch(e){show('提交失败：'+(e?.message||'请稍后重试'),true)}finally{$('draft').disabled=$('publish').disabled=false}}$('draft').onclick=()=>submit('draft');$('publish').onclick=()=>submit('published');ensureUser();</script></body></html>
