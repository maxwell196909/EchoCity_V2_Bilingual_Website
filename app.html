<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2747">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./images/echocity-app-icon-192.png">
  <title>EchoCity 客户端</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#eaf1fb;color:#172033}
    button{font:inherit}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
    .topbar{min-height:62px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;background:linear-gradient(135deg,#0f2747,#2563eb);box-shadow:0 7px 22px #0f172a24;z-index:3}
    .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}
    .mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff66;border-radius:12px;background:#2563eb}
    .top-actions{display:flex;align-items:center;gap:8px}
    .top-button{min-height:38px;padding:0 13px;border:1px solid #ffffff66;border-radius:999px;color:#fff;background:#ffffff14;font-weight:800;cursor:pointer}
    .stage{position:relative;min-height:0;background:#f4f7fb}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:#475569;background:#f4f7fb;z-index:1}
    .loading.hidden{display:none}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2}
    .nav{padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;border-top:1px solid #dbe3ee;background:#fff;box-shadow:0 -8px 24px #0f172a12;z-index:3}
    .nav-button{min-height:54px;padding:6px 4px;border:0;border-radius:13px;color:#64748b;background:transparent;font-weight:800;cursor:pointer}
    .nav-button span{display:block;margin-bottom:3px;font-size:20px}
    .nav-button.active{color:#1d4ed8;background:#eff6ff}
    @media(min-width:900px){
      .app{grid-template-columns:184px 1fr;grid-template-rows:auto 1fr}
      .topbar{grid-column:1/-1}
      .nav{grid-column:1;grid-row:2;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid #dbe3ee;box-shadow:5px 0 18px #0f172a0d}
      .nav-button{min-height:58px;padding:8px 12px;text-align:left}
      .nav-button span{display:inline-block;width:30px;margin:0 8px 0 0;text-align:center}
      .stage{grid-column:2;grid-row:2}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="mark">E</span><span>EchoCity</span></div>
      <div class="top-actions">
        <button id="reloadButton" class="top-button" type="button">刷新</button>
        <button id="languageButton" class="top-button" type="button">EN</button>
      </div>
    </header>

    <section class="stage">
      <div id="loading" class="loading">正在打开……</div>
      <iframe id="contentFrame" title="EchoCity"></iframe>
    </section>

    <nav class="nav" aria-label="EchoCity 主导航">
      <button class="nav-button active" type="button" data-page="home" data-src="index.html"><span>🏠</span><b data-zh="首页" data-en="Home">首页</b></button>
      <button class="nav-button" type="button" data-page="customer" data-src="assets/customer-dashboard.html"><span>🙋</span><b data-zh="客户" data-en="Customer">客户</b></button>
      <button class="nav-button" type="button" data-page="worker" data-src="assets/worker-dashboard.html"><span>🧰</span><b data-zh="服务人员" data-en="Worker">服务人员</b></button>
      <button class="nav-button" type="button" data-page="admin" data-src="assets/admin-dashboard.html"><span>📋</span><b data-zh="平台" data-en="Platform">平台</b></button>
    </nav>
  </main>

  <script>
    const frame=document.getElementById("contentFrame");
    const loading=document.getElementById("loading");
    const buttons=Array.from(document.querySelectorAll(".nav-button"));
    let language=localStorage.getItem("echocity-language")||"zh";

    function capturePlatformToken(){
      const query=new URLSearchParams(location.search);
      const hash=new URLSearchParams(location.hash.replace(/^#/,""));
      const token=query.get("platform_token")||hash.get("platform_token");
      if(token){
        localStorage.setItem("echocity-platform-token",token);
        sessionStorage.setItem("echocity-platform-token",token);
      }
    }

    function openPage(button,remember=true){
      buttons.forEach(item=>item.classList.toggle("active",item===button));
      loading.classList.remove("hidden");
      const target=new URL(button.dataset.src,location.href);
      target.searchParams.set("app_v","43");
      if(button.dataset.page==="admin"){
        const token=localStorage.getItem("echocity-platform-token")||sessionStorage.getItem("echocity-platform-token");
        if(token)target.hash="platform_token="+encodeURIComponent(token);
      }
      frame.src=target.href;
      if(remember)localStorage.setItem("echocity-client-page",button.dataset.page);
    }

    function applyLanguage(){
      document.documentElement.lang=language==="zh"?"zh-CN":"en";
      document.getElementById("languageButton").textContent=language==="zh"?"EN":"中文";
      document.getElementById("reloadButton").textContent=language==="zh"?"刷新":"Refresh";
      loading.textContent=language==="zh"?"正在打开……":"Opening...";
      document.querySelectorAll("[data-zh]").forEach(item=>{item.textContent=language==="zh"?item.dataset.zh:item.dataset.en;});
      document.title=language==="zh"?"EchoCity 客户端":"EchoCity Client";
    }

    buttons.forEach(button=>button.addEventListener("click",()=>openPage(button)));
    frame.addEventListener("load",()=>loading.classList.add("hidden"));
    document.getElementById("reloadButton").addEventListener("click",()=>{loading.classList.remove("hidden");frame.contentWindow.location.reload();});
    document.getElementById("languageButton").addEventListener("click",()=>{language=language==="zh"?"en":"zh";localStorage.setItem("echocity-language",language);applyLanguage();frame.contentWindow.location.reload();});

    capturePlatformToken();
    applyLanguage();
    const savedPage=localStorage.getItem("echocity-client-page")||"home";
    openPage(buttons.find(item=>item.dataset.page===savedPage)||buttons[0],false);

    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}
  </script>
</body>
</html>
