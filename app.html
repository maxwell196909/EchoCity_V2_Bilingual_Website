<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><link rel="manifest" href="./manifest.json?v=77"><link rel="apple-touch-icon" href="./images/echocity-app-icon-192.png"><title>EchoCity</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#05070a;color:#fff}.app{height:100%;display:grid;grid-template-rows:1fr auto}.stage{position:relative;min-height:0;background:#05070a}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;background:#05070a;z-index:1;text-align:center;line-height:1.7}.loading.hidden{display:none}.build{display:block;font-size:12px;opacity:.65}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2}.nav{padding:6px 8px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid #1f2937;background:#090b10;color:#94a3b8;z-index:3}.nav-button{min-height:54px;padding:5px 2px;border:0;border-radius:12px;color:inherit;background:transparent;font:inherit;font-size:11px;font-weight:800}.nav-button span{display:block;font-size:20px;margin-bottom:2px}.nav-button.active{color:#fff}.publish span{width:42px;height:30px;margin:0 auto 2px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(90deg,#22d3ee 0 18%,#fff 18% 82%,#fb7185 82%);color:#05070a;font-size:23px;font-weight:900}@media(min-width:900px){.app{grid-template-columns:92px 1fr;grid-template-rows:1fr}.nav{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid #1f2937}.stage{grid-column:2;grid-row:1}.nav-button{min-height:62px}}</style></head><body><main class="app"><section class="stage"><div id="loading" class="loading"><div>正在打开 EchoCity……<span class="build">Social Video v77</span></div></div><iframe id="contentFrame" title="EchoCity"></iframe></section><nav class="nav" aria-label="EchoCity 主导航"><button class="nav-button active" data-page="home" data-src="assets/video-feed-v4.html"><span>⌂</span><b>首页</b></button><button class="nav-button" data-page="discover" data-src="assets/discover.html"><span>⌕</span><b>发现</b></button><button class="nav-button publish" data-page="publish" data-src="assets/publish-center.html"><span>＋</span><b>发布</b></button><button class="nav-button" data-page="messages" data-src="assets/messages-home.html"><span>✉</span><b>消息</b></button><button class="nav-button" data-page="me" data-src="assets/me.html"><span>◎</span><b>我的</b></button></nav></main><script>const APP_BUILD='77',frame=document.getElementById('contentFrame'),loading=document.getElementById('loading'),buttons=[...document.querySelectorAll('.nav-button')];function capturePlatformToken(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),t=q.get('platform_token')||h.get('platform_token');if(t){localStorage.setItem('echocity-platform-token',t);sessionStorage.setItem('echocity-platform-token',t)}}function openPage(button,remember=true){buttons.forEach(x=>x.classList.toggle('active',x===button));loading.classList.remove('hidden');const target=new URL(button.dataset.src,location.href);target.searchParams.set('app_v',APP_BUILD);target.searchParams.set('_fresh',Date.now().toString());frame.src=target.href;if(remember)localStorage.setItem('echocity-client-page',button.dataset.page)}buttons.forEach(b=>b.onclick=()=>openPage(b));frame.addEventListener('load',()=>loading.classList.add('hidden'));capturePlatformToken();const saved=localStorage.getItem('echocity-client-page')||'home';openPage(buttons.find(x=>x.dataset.page===saved)||buttons[0],false);let swRegistration=null;async function refreshServiceWorker(){if(!('serviceWorker'in navigator))return;try{if(!swRegistration)swRegistration=await navigator.serviceWorker.register('./sw.js?v='+APP_BUILD,{updateViaCache:'none'});await swRegistration.update()}catch(e){console.warn('Service worker update failed',e)}}if('serviceWorker'in navigator){window.addEventListener('load',refreshServiceWorker);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshServiceWorker()});setInterval(refreshServiceWorker,300000);navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('echocity-sw-reloaded-'+APP_BUILD)){sessionStorage.setItem('echocity-sw-reloaded-'+APP_BUILD,'1');location.reload()}})}</script></body></html>
